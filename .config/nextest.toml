# `#[ignore]` attribute — like `dev_serve_e2e`/`embedded_host_request_time_e2e`
# above, the binary self-skips via `locate_esbuild()` when esbuild isn't
# staged, so it runs on T1 whenever esbuild is present rather than being
# relegated to the weekly quarantine lane. Membership in the locked lane is for
# CPU/memory serialization only. `plugin_watch_hook_confirm_2170_e2e`
# (issue #2170, Plugin Watch Hook epic #2166 — the confirm pass over
# #2167/#2168/#2169) is the newest flock-adopting member, bringing the
# bucket to 22. Its one test spawns a real `zfb dev` session over a
# fixture whose preset registers `addVirtualModule("virtual:note", loader,
