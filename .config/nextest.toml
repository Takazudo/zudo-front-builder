# cargo-nextest configuration — https://nexte.st/docs/configuration/
#
# zfb adopts cargo-nextest for CI Rust test execution (issue #1340). Two
# profiles matter:
#   • `ci`      — health.yml runs `cargo nextest run --workspace --profile ci`
#   • `default` — local runs (b4push's B4PUSH_FULL path) use the default profile
#
# IMPORTANT: nextest does NOT run doctests. health.yml keeps a SEPARATE
# `cargo test --workspace --doc` step; this config governs everything EXCEPT
# doctests. Do not assume a green nextest run covers doctest examples.

# ── Cross-binary serialization of the heavy V8/esbuild e2e binaries ──────────
# These 34 integration-test binaries (all in package `zfb`) each spawn a real
# `zfb dev` / `zfb build` / `zfb preview` process that embeds a V8 host and/or
# shells out to esbuild. Booting two at once starves CPU/memory and turns
# their generous boot-deadline watchdogs flaky. `cargo test` serialized these
# implicitly by running one binary at a time, but nextest schedules test
# binaries concurrently by default — so without this group these heavy
# processes race each other for CPU/memory. The group makes the serialization
# explicit at the runner level: at most ONE test from this group runs at a
# time across all 34 binaries.
#
# The set is two sub-groups sharing one test-group:
#   • 24 flock-adopting binaries (client_bundling_cross_pipeline,
#     build_terminates, preview_cross_mode_e2e, the dev_*_e2e set,
#     wasm_ssr_dev_smoke_e2e, page_extension_full_matrix_e2e,
#     mirror_css_scan_mdx_e2e, cold_rewrite_prewarm_e2e,
#     ssr_reload_self_heal_e2e, embedded_host_request_time_e2e,
#     workerd_parity_e2e, dev_content_reload_2063_e2e,
#     dev_supervision_e2e, plugin_watch_hook_confirm_2170_e2e, and
#     ssr_contract_dev_warning_e2e) — spawn
#     `zfb dev` and/or `zfb build` and/or `zfb preview`. These ALSO hold
#     #1339's OS advisory flock (crates/zfb-test-utils/src/cross_binary_lock.rs),
#     so for them the test-group is defense in depth (runner-level) on top of
#     the flock's OS-level guarantee. `preview_cross_mode_e2e` (issue #1547)
#     runs a real `zfb build` THEN spawns both a real `zfb dev` and a real
#     `zfb preview` (static) against the same build output, so it needs the
#     same serialization as its dev/build siblings. `dev_out_of_root_collection_e2e`
#     (issue #1552, epic #1548) covers an out-of-root collection's live
#     edit→serve loop. `dev_content_aggregate_cold_boot_e2e` (issue #1598)
#     starts a fresh content fixture and proves an edit reaches its entry,
#     index, tag, and paginated aggregate routes. `wasm_ssr_dev_smoke_e2e`
#     (issue #1511) serves a `prerender=false` Wasm-importing route through a
#     real `zfb dev` session. `page_extension_full_matrix_e2e` (issue #1994,
#     Page Extension Contract epic #1990 Wave 4 — the central confirm pass)
#     runs a real `zfb build` THEN spawns a real
#     `zfb dev` session over a single fixture covering all seven routable
#     page-extension shapes (`.tsx`/`.ts`/`.jsx`/`.js`/`.mdx`/`.md`/`.html`)
#     plus a dynamic `.ts` page, proving both the production route table and
#     the dev server agree with Wave 3's build-only proof.
#     `mirror_css_scan_mdx_e2e` (Mirror Root CSS Scan epic #1995; written
#     RED in Wave 1 / #1996, assertion inverted in Wave 2 / #1997) spawns a
#     real `zfb dev` session and proves a sibling-mirror-root `.mdx` edit both
#     reaches the orchestrator AND reruns the Tailwind content scan, so the
#     new utility class lands in the served stylesheet restart-free (issue
#     #1819). `cold_rewrite_prewarm_e2e` (issues #2001/#2004, Dev Self Heal
#     epic #1999) spawns a real `zfb dev` session over a fresh Cold boot and
#     proves a `_redirects` 200-rewrite target is pre-warmed and resolves
#     instead of 404ing forever. `ssr_reload_self_heal_e2e` (issues
#     #2000/#2002/#2005, same epic) is the newest member: two tests spawning
#     a real `zfb dev` session over an SSR-only project, proving an
#     already-open tab reloads after the deferred publish on both the healthy
#     Cold-lazy boot path and the cold-bootstrap recovery path.
#     `embedded_host_request_time_e2e` (issue #2019, V8 Request Time Parity
#     epic #2012 Wave 7 — the confirm pass over Waves 2-6) is the newest
#     member: one test spawns a real `zfb dev` session and drives a
#     `prerender=false` route that performs a real outbound loopback fetch
#     AND uses Web Crypto in one dispatch, plus explicit resource-exhaustion
#     (the 50-subrequest cap), host-side transport-failure (connection
#     refused), and unsupported-capability (`crypto.subtle.encrypt`)
#     scenarios; a second test spawns a real `zfb build` over a separate,
#     SSR-route-free fixture proving the build-time SSG network denial
#     (guardrail 4) is unchanged. `workerd_parity_e2e` (issue #2020, same
#     epic, Wave 8 — the central confirm pass) is the newest member: it
#     spawns a real `zfb build` (Cloudflare adapter), a real `zfb dev`, AND
#     a real `wrangler dev` (real workerd, local mode), driving the SAME
#     page sources through both runtimes and diffing the responses —
#     byte-identical for supported contract rows, and exactly the
#     documented D7/D8 divergences (legacy MD5 digest; key-bearing
#     SubtleCrypto) where they are expected to differ.
#   • 13 build-command binaries (build_cleans_outdir, build_package_routes,
#     build_package_routes_consumer, client_router_autoinclude_build,
#     content_snapshot_no_deferred, css_modules_components_build,
#     end_to_end_basic_blog_build, gfm_footnotes_tasklists_confirm_build,
#     html_minify_build,
#     page_extension_route_table_build, wasm_ssr_adapter_e2e,
#     sibling_css_module_command_layer_build, strict_broken_links_e2e) —
#     each runs `zfb build`,
#     which likewise boots the embedded V8 host and shells out to esbuild.
#     These are NOT
#     part of #1339's dev-server flock, so the nextest test-group is their
#     ONLY serialization guard. Omitting them (as the original 7-binary
#     filter did) let them run concurrently with the dev-server group and
#     reintroduced the exact CPU/memory contention the group exists to
#     prevent. `sibling_css_module_command_layer_build` (issue #1698,
#     sibling-mirror epic #1691) joined the set earlier; `page_extension_route_table_build`
#     (issue #1993, Page Extension Contract epic #1990 Wave 3) joined next:
#     it drives a real `zfb build` proving `.ts`/`.js`/`.jsx` pages reach the
#     production route table and render end-to-end, not just the router's
#     own scanner unit tests. `gfm_footnotes_tasklists_confirm_build` (issue
#     #2029, GFM Footnotes And Task Lists epic #2021 Wave 6 — the central
#     confirm pass) joined next: a real `zfb build` over a `.md`/`.mdx`
#     content collection proving task-list checkboxes and footnotes
#     (including a repeated reference) render identically regardless of
#     file extension, plus a `.mdx`-only fixture proving footnote/task-list
#     nested inside a custom JSX component's children resolves through the
#     same document-level footnote model. `strict_broken_links_e2e` (issue
#     #2118, Link Gating epic #2112 — the integration proof for sub #2117's
#     `--strict-broken`/`--no-strict-broken` wiring) joined next: five real
#     `zfb build` invocations per test run, each proving one cell of the
#     CLI-flag/config-field precedence matrix (main case, control, force-enable
#     with no linkValidation config at all, config-only `strictBrokenLinks`,
#     and `--no-strict-broken` never downgrading an independently-configured
#     nested `failOnBroken`) exits with the correct status and names the
#     broken hrefs. This bucket is now 13 — Wave 4's
#     new binary ALSO spawns `zfb dev`, so it joins the flock-adopting
#     bucket above instead.
#
# Completeness was re-verified by grepping crates/zfb/tests/*.rs for the real
# `zfb` binary spawn + a `build`/`dev`/`preview` subcommand (zfb_binary! +
# .arg("build")/.arg("dev")/.arg("preview")) plus esbuild/embed_v8 usage. Two
# binaries that match a pattern but do NOT spawn a heavy `zfb build`/`zfb dev`
# are deliberately excluded: `check_command` (runs only `zfb check
# --skip-tsc`; no V8, no esbuild) and `framework_packages_no_pnpm` (calls
# `zfb_build::bundle` in-process — shells to esbuild but never spawns the
# `zfb` binary and never boots V8).
[test-groups.e2e-heavy]
max-threads = 1

# The override that assigns the 37 heavy binaries to the e2e-heavy group AND
# grants them a long per-test timeout lives in the `default` profile so BOTH
# local (default profile) and CI (`ci` profile, which inherits default's
# overrides) get identical serialization + timeout treatment. Exact binary
# matches (`=name`) keep the set explicit; it is a SUPERSET of #1339's
# 12-binary flock adoption set (8 original + `preview_cross_mode_e2e` +
# `dev_out_of_root_collection_e2e` + `dev_content_aggregate_cold_boot_e2e` +
# `wasm_ssr_dev_smoke_e2e`, issues #1547 / #1552 / #1598 / #1511), further
# extended by `page_extension_full_matrix_e2e` (issue #1994),
# `cold_rewrite_prewarm_e2e` (issues #2001/#2004, Dev Self Heal epic #1999 —
# a real `zfb dev` E2E, `#[ignore]`d `heavy`; written RED in Wave 1 and
# inverted green in Wave 4), `ssr_reload_self_heal_e2e` (issues
# #2000/#2002/#2005, same epic — two real `zfb dev` E2E tests, `#[ignore]`d
# `env-gate: esbuild`; written RED in Wave 1, inverted green in Wave 2, and
# registered here in Wave 6 — it was previously missing from this filter
# despite spawning `zfb dev`), and `dev_content_reload_2063_e2e` (issue
# #2098, MDX Reload Fix epic #2092 Wave 5 — six real `zfb dev` E2E tests,
# covering the healthy baseline, the injected-dynamic-route regression #2097
# fixed, and an out-of-root control, each in both boot modes; like
# `wasm_ssr_dev_smoke_e2e`/`embedded_host_request_time_e2e` above, NOT
# `#[ignore]`d — self-skips via `locate_esbuild()`, and its measured runtime
# (92.53s/7 cells) is well under this crate's un-ignored e2e budgets, so
# neither the `env-gate:` nor `heavy:` rule fires per zudo-test-wisdom's
# classification rules; membership here is for CPU/memory serialization
# only) — the 12 build-command binaries have no flock and rely on this
# group alone. `dev_supervision_e2e` (Dev Supervision epic #2099) is the
# newest flock-adopting member, bringing the flock-adopting bucket to 21
# (33 total heavy binaries here). It carries THREE real `zfb dev` E2E
# tests: the two #2101 wrote RED and #2102 (the supervision-link sub)
# flipped green — `orch_panic_on_tick_takes_the_whole_process_down` and
# `orch_stop_ms_takes_the_whole_process_down`, neither `#[ignore]`d
# anymore — plus a third, `graceful_sigint_exits_zero_and_persists_the_graph`
# (issue #2105, the epic's closing confirm sub), proving a real SIGINT
# exits 0 and persists `.zfb/graph.bin`. None of the three carry an
# `#[ignore]` attribute — like `dev_serve_e2e`/`embedded_host_request_time_e2e`
# above, the binary self-skips via `locate_esbuild()` when esbuild isn't
# staged, so it runs on T1 whenever esbuild is present rather than being
# relegated to the weekly quarantine lane. Membership in this group is for
# CPU/memory serialization only. `plugin_watch_hook_confirm_2170_e2e`
# (issue #2170, Plugin Watch Hook epic #2166 — the confirm pass over
# #2167/#2168/#2169) is the newest flock-adopting member, bringing the
# bucket to 22. Its one test spawns a real `zfb dev` session over a
# fixture whose preset registers `addVirtualModule("virtual:note", loader,
# { watchFiles })` for a project-root child path (`plugin-watched/`)
# outside every default watch root, proving an edit to that file both
# broadcasts an SSE `page` event and — the central assertion — reaches the
# served page's rendered content, not just triggers a re-render. Not
# `#[ignore]`d — self-skips via `locate_esbuild()` like its siblings.
#
# **Authoritative recount (issue #2105, 2026-07)**: this sub re-measured
# the whole group from scratch — `cargo nextest show-config test-groups -p
# zfb --lib` plus a manual `binary(=...)` count against the filter below —
# and found the surrounding prose in this file (which said "32
# heavy binaries" / "20 flock-adopting binaries" in several places) had
# drifted stale by one even before this epic touched it (missing
# `workerd_parity_e2e`, registered by issue #2020 but never counted in the
# header prose). The true count at HEAD, with `dev_supervision_e2e`
# folded in, is **33 total** (21 flock-adopting, 12 build-only). Every
# "32"/"20" figure in this file's comments above has been corrected to
# "33"/"21" to match.
#
# Issue #2118 (2026-07, Link Gating epic #2112 Wave 2b) added
# `strict_broken_links_e2e` to the build-only bucket, bringing the total to
# **34** (21 flock-adopting, 13 build-only). Re-measured with the same
# `binary(=...)` count against the filter below — do not trust either figure
# without re-running that count; it has drifted stale before.
#
# Issue #2170 (2026-07, Plugin Watch Hook epic #2166) added
# `plugin_watch_hook_confirm_2170_e2e` to the flock-adopting bucket,
# bringing the total to **35** (22 flock-adopting, 13 build-only).
#
# Issue #2175 (2026-07, Watch Poll Fallback epic #2172, sub-issue #2175 —
# the poll-backend e2e confirm leg) added `dev_poll_backend_e2e` to the
# flock-adopting bucket, bringing the total to **36** (23 flock-adopting, 13
# build-only). One `#[ignore]`d, `heavy`-tagged test: spawns a real
# `zfb dev --port 0` session with `watchPollFallback: true` /
# `watchPollIntervalMs: 250` set in `zfb.config.json` (over the
# `dev-loop-basic` fixture, otherwise shared with `dev_serve_e2e`/
# `dev_dep_invalidation_1284_e2e`'s native-backend sessions), proving an
# in-place content edit and a brand-new collection entry are both observed
# through the `notify::PollWatcher` re-scan path rather than the native
# FSEvents/inotify backend.
#
# Issue #2357 (2026-08, SSR Route Contract Guard epic #2351, Wave 3 — the
# real `zfb dev` confirm pass over #2354's wiring) added
# `ssr_contract_dev_warning_e2e` to the flock-adopting bucket, bringing the
# total to **37** (24 flock-adopting, 13 build-only). Two real
# `zfb dev --port 0` E2E tests, neither `#[ignore]`d (self-skips via
# `locate_esbuild()` like its siblings): the positive fixture proves the
# Strong-tier SSR-contract warning (`render_ssr_request_param_finding`,
# `crates/zfb/src/render_pipeline.rs`) reaches captured stderr during boot
# for a `prerender = false` route whose default export is `(request:
# Request)`, naming the route and file, while the dev server keeps
# serving a healthy sibling route normally; the negative fixture (a
# zero-parameter API handler plus a dynamic route destructuring `{
# params }`) proves the SAME boot emits no such warning at all — the
# precision control. Also corrected the "the **33** heavy binaries"
# figure just above `[test-groups.e2e-heavy]`'s override, stale since
# before #2118/#2170/#2175 kept the running total current in the
# paragraphs below it but never touched that one line — it now reads
# "37" directly rather than propagating through the intermediate stale
# states.
#
# ADDITIONALLY (issue #1363), one `test(=...)` predicate joins the same OR:
# `eval_deferred_paths_via_worker_embedded_v8_non_literal_paths` boots a real
# esbuild subprocess + embedded V8 isolate (see crates/CLAUDE.md's `#[ignore]`
# manifest, tagged `heavy`) but is NOT its own binary — it lives inside the
# `zfb` crate's shared lib-test target (`render_pipeline::tests`) alongside
# hundreds of ordinary, non-heavy unit tests, so `binary(=...)` cannot target
# it alone. `test(=...)` matches by qualified test name regardless of binary,
# and composes into the same `package(zfb) & (...)` OR as the binary matches.
# Without this, exam.yml's weekly quarantine-heavy job (the only place this
# `#[ignore]`d test runs) could schedule it concurrently with the other
# V8/esbuild-heavy entries in that job's filterset, reintroducing the exact
# CPU/memory contention this group exists to prevent.
#
# A SECOND `test(=...)` predicate (issue #1394) joins the same OR:
# `version_stamp_from_env` (crates/zfb/tests/version_stamp.rs, tagged `heavy`
# in crates/CLAUDE.md's manifest) shells out to a fresh `cargo run` recompile and was
# clocked at 134s in exam.yml's quarantine-heavy job — well within this
# group's watchdog budget, and exactly the kind of CPU/memory-heavy process
# this group exists to keep off the CPU at the same time as the rest of the
# group. Unlike the render_pipeline case above it IS its own binary
# (`binary(=version_stamp)` would also have worked), but `test(=...)` is used
# for consistency with the render_pipeline entry and to stay exact-name-scoped
# if the file ever grows a second test.
#
# A THIRD test-name predicate (epic #2008 review) joins the same OR, and is the
# one entry that is a PREFIX regex rather than an exact name:
# `test(/^v8_host_adapter::tests::/)`. Sub-issue #2009 added ~14 tests to
# `crates/zfb/src/v8_host_adapter.rs`'s test module, and all but the one pure
# string-formatting test boot a REAL V8 isolate on a dedicated thread — inside
# the same shared `zfb` lib-test target as hundreds of ordinary unit tests, so
# `binary(=...)` cannot target them. They are the same class of work as the
# `render_pipeline` entry above, just a whole module of it. One of them
# (`drop_closes_channel_and_joins_thread_promptly_on_both_constructors`) asserts
# a 5s WALL-CLOCK bound on `Drop`'s thread join, which is exactly the
# contention-sensitive shape this group exists to protect: the bound is the
# only thing that test pins, so it is serialized rather than loosened. The
# module prefix (not 15 exact names) is used deliberately — every test in this
# module is V8-heavy by construction, and a prefix keeps a future addition
# covered instead of silently unserialized. The lone non-booting test
# (`inner_bundle_specifier_percent_encodes_unsafe_bytes`) is swept in too; it
# is microseconds long, so serializing it costs nothing.
[[profile.default.overrides]]
filter = 'package(zfb) & (binary(=build_cleans_outdir) | binary(=build_package_routes) | binary(=build_package_routes_consumer) | binary(=build_terminates) | binary(=client_bundling_cross_pipeline) | binary(=client_router_autoinclude_build) | binary(=cold_rewrite_prewarm_e2e) | binary(=content_snapshot_no_deferred) | binary(=css_modules_components_build) | binary(=dev_bind_before_walk_e2e) | binary(=dev_build_static_parity) | binary(=dev_content_aggregate_cold_boot_e2e) | binary(=dev_content_reload_2063_e2e) | binary(=dev_dep_invalidation_1284_e2e) | binary(=dev_out_of_root_collection_e2e) | binary(=dev_poll_backend_e2e) | binary(=dev_public_large_tree_smoke_e2e) | binary(=dev_serve_e2e) | binary(=dev_serve_injected_routes_e2e) | binary(=dev_sibling_watch_1678_e2e) | binary(=dev_supervision_e2e) | binary(=embedded_host_request_time_e2e) | binary(=end_to_end_basic_blog_build) | binary(=gfm_footnotes_tasklists_confirm_build) | binary(=html_minify_build) | binary(=mirror_css_scan_mdx_e2e) | binary(=page_extension_full_matrix_e2e) | binary(=page_extension_route_table_build) | binary(=plugin_watch_hook_confirm_2170_e2e) | binary(=preview_cross_mode_e2e) | binary(=sibling_css_module_command_layer_build) | binary(=ssr_contract_dev_warning_e2e) | binary(=ssr_reload_self_heal_e2e) | binary(=strict_broken_links_e2e) | binary(=wasm_ssr_adapter_e2e) | binary(=wasm_ssr_dev_smoke_e2e) | binary(=workerd_parity_e2e) | test(=render_pipeline::tests::eval_deferred_paths_via_worker_embedded_v8_non_literal_paths) | test(=version_stamp_from_env) | test(/^v8_host_adapter::tests::/))'
test-group = 'e2e-heavy'
# The longest LEGITIMATE e2e watchdog is 280s (dev_serve_e2e's lazy scenario
# and dev_serve_injected_routes_e2e), 300s for the #[ignore]d heavy
# dev_dep_invalidation_1284_e2e tests (preview_cross_mode_e2e's own watchdog
# is 240s — see that file's OVERALL_DEADLINE). Warn at 120s but do NOT kill
# until 600s (5 × 120s) so a healthy-but-slow e2e is never reaped —
# comfortably above the ≥400s headroom the issue asks for, and above the
# flock's own 360s acquire deadline.
slow-timeout = { period = "120s", terminate-after = 5 }

# ── CI profile: the authoritative T1 gate (health.yml) ───────────────────────
[profile.ci]
# One retry. A pass-on-retry is a TRIAGE SIGNAL, not a success: nextest records
# it (terminal "FLAKY" line + JUnit `<flakyFailure>` / retry count) rather than
# hiding it, so a future sub-task (#1341) can consume that telemetry. Retries
# are deliberately NOT suppressed. Local runs keep retries = 0 (default profile).
retries = 1
# Non-e2e tests: warn at 60s, terminate after 5 × 60s = 300s. A unit or
# ordinary integration test still running after 5 minutes is wedged, not slow.
# The e2e override above supersedes this for the heavy group.
slow-timeout = { period = "60s", terminate-after = 5 }
# Show failures inline as they happen AND re-print them in the final summary.
failure-output = "immediate-final"

[profile.ci.junit]
# Emitted to target/nextest/ci/junit.xml. health.yml uploads it as an artifact
# (if: always()) so retry/flaky telemetry survives even a failed run — this is
# the machine-readable feed #1341 will consume.
path = "junit.xml"
report-name = "zfb-nextest-ci"
