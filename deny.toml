# cargo-deny config — Rust supply-chain audit (issue #1334).
#
# Companion to the npm audit in .github/workflows/security-audit.yml
# (pnpm audit --prod). The workspace embeds V8/SWC/syntect and ships a
# product binary (`zfb`), so its Rust dependency tree is a real
# supply-chain surface, not just an internal build concern.
#
# Policy: [advisories] is the only section that DENIES — a known
# vulnerability fails the check. [licenses], [bans], and [sources] start
# lenient (warn, not deny) so adoption doesn't require an upfront cleanup
# pass; tighten them later once the weekly job has run clean for a while.
#
# Run locally: `cargo deny check` (or `cargo deny check advisories` for
# just the mandatory section). Config reference:
# https://embarkstudios.github.io/cargo-deny/

[graph]
# ubuntu-latest (the only CI target for this check) plus the release
# matrix's other host triples, so `cargo deny` sees the same graph the
# release workflow actually builds (crates/zfb ships prebuilt binaries
# for linux/macOS/windows, x86_64/aarch64 — see release.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[output]
feature-depth = 1

# MANDATORY: known-vulnerable / yanked crates fail the check. This is the
# section issue #1334 exists for.
[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Accepted exceptions (decided by Takazudo on 2026-10-21, issue #1373): each
# entry below has no safe upgrade path we control and is an accepted,
# documented exception rather than pending work. Re-verified on 2026-10-22
# after the Deno exit (#4395) with `cargo tree --locked --target all -i <crate@version>`. The rationale
# and the upstream release that would lift each entry are recorded in
# SECURITY-DEPS.md ("Accepted cargo-deny exceptions"). Remove an entry once
# its upstream trigger fires and `cargo deny check advisories` stops
# flagging it; cargo-deny warns `advisory-not-detected` when one goes stale.
# This cargo-deny release's ignore-entry schema only accepts `id` and
# `reason` (no separate `url` key), so links are folded into each reason.
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "Accepted exception (#1373): bincode 1.3.3 (unmaintained) reaches the graph only via syntect 5.3.0's dump-load feature (default-syntaxes/default-themes) since the deno_core host was removed (#4395); syntect's newest release still requires bincode 1. Lift when syntect releases without bincode 1: https://github.com/trishume/syntect" },
    { id = "RUSTSEC-2024-0436", reason = "Accepted exception (#1373): paste 1.0.15 (unmaintained, compile-time proc-macro only) is a non-optional dependency of every released v8 crate (147.4.0 through 152.2.0), reached directly via zfb-js-host (the deno_core/serde_v8 path was removed in #4395). Lift when rusty_v8 releases without paste: https://github.com/denoland/rusty_v8" },
    { id = "RUSTSEC-2026-0235", reason = "Accepted exception (#1373): rkyv 0.7.46 (OOB read when deserializing a forged archive) via parcel_sourcemap 2.1.1 (only release, hard-pins rkyv ^0.7.38) <- lightningcss 1.0.0-alpha.71 sourcemap feature, required both by zfb-css's own lightningcss Bundler use and by minify-html 0.18.1's default features; no identified zfb code path deserializes attacker-supplied rkyv archives through parcel_sourcemap. Lift when parcel_sourcemap moves to rkyv >=0.8.17 or lightningcss drops it: https://github.com/parcel-bundler/source-map" },
]

# Lenient to start: an explicit allow-list keeps `cargo deny check`
# informative, but nothing here should fail the weekly job yet. Revisit
# once the workspace's actual license surface has been reviewed.
[licenses]
# Exact list observed via `cargo deny list` across the full dependency graph
# (release matrix targets included, see [graph.targets] above). GPL-2.0-only
# shows up once (self_cell, dual-licensed "Apache-2.0 OR GPL-2.0-only") but
# is satisfied by the Apache-2.0 branch, so it needs no entry here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    # CDLA-Permissive-2.0 is a permissive *data* license (webpki-roots ships
    # Mozilla's CA root bundle under it) — not a software copyleft concern.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# Warn-only: flags duplicate dependency versions without failing the job.
multiple-versions = "warn"
wildcards = "warn"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
# Warn-only: flags crates from outside crates.io / unlisted git sources
# without failing the job.
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
