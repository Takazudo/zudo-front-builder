# cargo-deny config — Rust supply-chain audit (issue #1334).
#
# Companion to the npm audit in .github/workflows/security-audit.yml
# (pnpm audit --prod). The workspace embeds V8/SWC/syntect and ships a
# product binary (`zfb`), so its Rust dependency tree is a real
# supply-chain surface, not just an internal build concern.
#
# Policy: [advisories] is the only section that DENIES — a known
# vulnerability fails the check. [licenses], [bans], and [sources] start
# lenient (warn, not deny) so adoption doesn't require an upfront cleanup
# pass; tighten them later once the weekly job has run clean for a while.
#
# Run locally: `cargo deny check` (or `cargo deny check advisories` for
# just the mandatory section). Config reference:
# https://embarkstudios.github.io/cargo-deny/

[graph]
# ubuntu-latest (the only CI target for this check) plus the release
# matrix's other host triples, so `cargo deny` sees the same graph the
# release workflow actually builds (crates/zfb ships prebuilt binaries
# for linux/macOS/windows, x86_64/aarch64 — see release.yml).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[output]
feature-depth = 1

# MANDATORY: known-vulnerable / yanked crates fail the check. This is the
# section issue #1334 exists for.
[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Adoption history: these entries were first recorded on the FIRST `cargo
# deny check advisories` run when this config was added (issue #1334).
# The 5 entries that have since cleared (anyhow, remove_dir_all, tempdir,
# number_prefix, yaml-rust — see epic #1365) were removed from this list.
# The entries below are still blocked; the live tracker for all of them is
# issue #1373: https://github.com/Takazudo/zudo-front-builder/issues/1373
# (supersedes the original per-entry #1351 links, now closed).
# Remove an entry once its underlying dependency is upgraded/replaced and the
# advisory no longer appears.
# Note: this cargo-deny release's ignore-entry schema only accepts `id` and
# `reason` (no separate `url` key), so the tracking-issue link is folded into
# each `reason` string instead.
ignore = [
    # Transitive "unmaintained" findings with no safe upgrade path today —
    # each pinned by an upstream crate we don't control directly.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained, pulled in transitively via deno_core and syntect's dump features; no safe upgrade available until deno_core moves off bincode 1.x (a deno_core bump is V8-scale and tracked separately). zfb-graph itself was migrated to bincode 2 (#1370) — this only covers the remaining transitive deno_core/syntect usage. Tracked: https://github.com/Takazudo/zudo-front-builder/issues/1373" },
    { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 unmaintained, pulled in transitively via v8/deno_core; no safe upgrade available until deno_core/v8 moves (same V8-scale bump as the bincode entry above). Tracked: https://github.com/Takazudo/zudo-front-builder/issues/1373" },
    { id = "RUSTSEC-2026-0249", reason = "smartstring 1.0.1 unmaintained (all versions affected per the advisory; its GitHub repo was archived by the owner 2026-05-03), pulled in transitively via swc_ecma_parser 39.0.2 <- swc_core 64.0.0 <- zfb-build/zfb-content/zfb-islands/zfb-render (and dev-deps zfb-css/zfb-md-extras). No safe upgrade path exists today: confirmed via `cargo update -p swc_ecma_parser --dry-run` that the newest version compatible with swc_core's `^64` requirement (39.1.0) still depends on smartstring, and no compatible update exists for swc_core or smartstring itself; dropping smartstring needs either an upstream swc_ecma_parser release that removes it, or a swc_core major bump past 64.x (a workspace-wide bump, out of scope for this config-only fix). Tracked: https://github.com/Takazudo/zudo-front-builder/issues/2349" },
    # Vulnerability with no safe upgrade path: the fixed crate line is
    # unreachable through every dependency currently pinning it.
    { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7.46, out-of-bounds read via forged Rc/Arc slice length on archive deserialization, pulled in transitively via parcel_sourcemap 2.1.1 (rkyv 0.7.46 <- parcel_sourcemap 2.1.1 <- lightningcss 1.0.0-alpha.71's default `sourcemap` feature <- both zfb-css's direct lightningcss pin and minify-html 0.18.1, which requests lightningcss default features unconditionally). No safe upgrade path exists: parcel_sourcemap 2.1.1 is its only/latest release (2022-09-17, effectively abandoned) and hard-pins `rkyv ^0.7.38`, so the fixed rkyv line (>=0.8.17) is unreachable; lightningcss 1.0.0-alpha.72 (newest) still requires `parcel_sourcemap ^2.1.1`; and disabling zfb-css's lightningcss `sourcemap` feature cannot clear the graph because minify-html forces default features and Cargo unifies features workspace-wide. No identified code path deserializes attacker-supplied rkyv archives through parcel_sourcemap. Tracked: https://github.com/Takazudo/zudo-front-builder/issues/1373" },
]

# Lenient to start: an explicit allow-list keeps `cargo deny check`
# informative, but nothing here should fail the weekly job yet. Revisit
# once the workspace's actual license surface has been reviewed.
[licenses]
# Exact list observed via `cargo deny list` across the full dependency graph
# (release matrix targets included, see [graph.targets] above). GPL-2.0-only
# shows up once (self_cell, dual-licensed "Apache-2.0 OR GPL-2.0-only") but
# is satisfied by the Apache-2.0 branch, so it needs no entry here.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    # CDLA-Permissive-2.0 is a permissive *data* license (webpki-roots ships
    # Mozilla's CA root bundle under it) — not a software copyleft concern.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# Warn-only: flags duplicate dependency versions without failing the job.
multiple-versions = "warn"
wildcards = "warn"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
# Warn-only: flags crates from outside crates.io / unlisted git sources
# without failing the job.
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
