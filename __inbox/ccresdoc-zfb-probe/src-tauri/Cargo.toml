[package]
name = "ccresdoc-zfb-probe"
version = "0.0.0"
edition = "2021"
publish = false
description = "Mode B sidecar probe for issue #349 — zfb dev server + Tauri WebView"

# Probe is NOT part of the zfb workspace. Kept fully standalone under
# __inbox/ to satisfy the issue #349 file-scope guardrail (`git add -f`
# expected; no edits to root Cargo.toml / pnpm-workspace.yaml).
[workspace]

[[bin]]
name = "ccresdoc-zfb-probe"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[build-dependencies]
tauri-build = "2"
