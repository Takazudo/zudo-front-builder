packages:
  - "docs"
  # packages/* — first-party JS/TS packages that ship as part of the zfb
  # public surface (e.g. the "zfb" SDK with the <Island> wrapper).
  - "packages/*"
  # crates/*/npm — for future per-crate npm tooling exports (e.g., a Rust crate that
  # also publishes a tiny npm package for JS-side helpers). None exist today; the
  # glob is reserved so adding one later requires no workspace-config change.
  - "crates/*/npm"
  # examples/* — runnable examples must install published registry
  # @takazudo/* packages, not link to local workspace packages.
  - "examples/*"

linkWorkspacePackages: false

# pnpm 11 only reads auth/registry from .npmrc and ignores pnpm.* in package.json.
# Everything else (peer-deps policy, engine strictness, supply-chain delays,
# overrides, build-script allowlist) lives here. See https://pnpm.io/settings.
autoInstallPeers: true
engineStrict: true

# After a workspace version bump pnpm wants to purge + relink node_modules.
# Under a non-interactive shell (agent/CI-like local run) pnpm aborts with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY. The relink is not
# security-sensitive, so auto-confirming is safe. CI is unaffected because it
# already passes CI=true, which skips the prompt independently.
confirmModulesPurge: false

# pnpm 11 defaults minimumReleaseAge to 1440 (24h), which would block CI
# `pnpm install --frozen-lockfile` on any dep published in the last day. CI must be
# deterministic, so disable the delay here.
minimumReleaseAge: 0

overrides:
  devalue: "^5.8.1"
  # Defensive floor for GHSA-88fw-hqm2-52qc (hono CORS advisory, vulnerable
  # <4.12.25), kept so `pnpm audit --prod --audit-level=high` stays green.
  #
  # No path in the tree requests an older hono today: the published
  # @takazudo/zfb-runtime has declared `hono: ^4.12.25` since 0.1.0-next.51,
  # and first-party packages/zfb-runtime declares the same. So this override
  # is currently a no-op, retained only to fail closed if a transitive
  # consumer ever regresses below the patched version. Safe to delete once
  # that risk is accepted — but note it is also cited as the `>=`-vs-`^`
  # counter-example in the js-yaml comment below, which would need updating.
  #
  # (This comment was accurate when written — zfb-runtime shipped ^4.12.23 at
  # the time — and decayed when next.51 published the patched range hours
  # later. Keep it in sync with reality per SECURITY-DEPS.md.)
  hono: ">=4.12.25"
  # Same shape as the hono override above (issue #1827). js-yaml arrives only
  # transitively — gray-matter@4.0.3 <- @takazudo/zudo-doc + docs — and carries
  # GHSA-5p4m-2wfm-xmqj (quadratic CPU in !!omap resolution, high,
  # vulnerable >=3.0.0 <3.15.1), which fails the required
  # `pnpm audit --prod --audit-level=high` gate.
  #
  # No forked dependency is needed: gray-matter declares `js-yaml: ^3.13.1`,
  # which already admits 3.15.1, so this only pins the resolution up to a
  # version the parent always allowed. Drop this override once
  # @takazudo/zudo-doc ships a gray-matter that resolves >=3.15.1 on its own.
  #
  # `^3.15.1`, NOT `>=3.15.1`: js-yaml has published 4.x and 5.x majors, and an
  # open-ended `>=` resolved to 5.2.1 here — two majors past gray-matter's
  # `^3.13.1` contract, whose load()/safeLoad() API 4.x already broke. The
  # caret keeps the patch inside the 3.x line the consumer actually supports.
  # (The hono override above can safely use `>=` because hono has no major
  # beyond 4.)
  js-yaml: "^3.15.1"

# pnpm 11 replaces the legacy `onlyBuiltDependencies` list with `allowBuilds`,
# a per-package true/false map. Each entry is a deliberate decision to allow
# (or refuse) the dependency's install/postinstall script. All four below are
# legitimate native-binary builds — esbuild ships a Go binary, sharp builds
# libvips bindings, lefthook + workerd ship native binaries — so all approved.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  workerd: true
