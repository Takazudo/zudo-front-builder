# Shared definition of a "docs-only" pull request (#4372; see CLAUDE.md
# "Docs-only pull requests"). The changed-files detectors in health.yml,
# node-free-smoke.yml and docs-checks.yml read this file from the PR's BASE
# commit, so a PR cannot widen the list for itself, with
# `predicate-quantifier: every`: a changed file is `code` unless one of the
# negated prose paths below matches it. `all` counts the listed files.
#
# Keep this list to prose that nothing in the skipped heavy jobs reads.
# Markdown that IS a test or build input stays `code`: crate fixtures,
# crates/zfb/templates/** (embedded into the binary), research/**
# (research/3242-zudo-wind-v1-spec.md is an include_str! test input), and
# docs/ outside src/content (scripts, components, wind-examples). Single
# prose files that a heavy job reads go in docs-test-inputs.yml instead.
# Docs-only PRs still run health's JS/format subset in docs-checks.yml.
code:
  - "**"
  - "!docs/src/content/**"
  - "!docs/*.md"
  - "!*.md"
  - "!crates/*.md"
  - "!crates/*/README.md"
  - "!packages/*/README.md"
  - "!prototypes/**/*.md"
  - "!.claude/**/*.md"
all:
  - "**"
