# drift-net.yml
#
# Weekly registry-integration drift net (issue #1342, zudo-test-wisdom T3
# scheduled exam). release.yml's smoke-clean-room job is a strong
# registry-integration guard, but it only fires per-release — between
# releases, registry-side drift (e.g. a platform tarball that silently
# stopped propagating) is invisible. This workflow runs the exact same
# clean-room smoke (scripts/smoke-clean-room.sh via
# reusable-smoke-clean-room.yml) against the LIVE dist-tags on a schedule,
# independent of any release.
#
# Channel coverage — the registry smokes cover `latest` only; see the `next`
# note below. The two preset-installed-carrier legs (#4533) are different: they
# smoke the published-preset fixture's PINNED published tuple (its frozen
# lockfile), not a dist-tag.
# Until v1.0.0 (2026-07-31) this workflow smoked ONLY `next`, which was correct
# then: `latest` was empty, so release.yml's dual-tag gate pushed every
# prerelease to BOTH tags and smoking `next` incidentally covered the stable
# channel too. Cutting v1.0.0 self-disabled that gate and the two channels
# diverged permanently, leaving `latest` — the tag a bare `npm i @takazudo/zfb`,
# `brew install`, and `curl | sh` all resolve — completely unwatched between
# releases, which is precisely the gap this workflow exists to close.
#
# `latest` also needs this MORE than `next` does, in both directions: while a
# prerelease line is dormant `next` is frozen and re-smoking it proves nothing,
# and while one is active release.yml smokes `next` on every publish anyway.
# Stable releases are rarer, so `latest` sits untouched for the longest stretches.
#
# The `next` leg was REMOVED, following the same logic to its conclusion.
# `next` is no longer a standing channel: it exists only while a prerelease is
# genuinely ahead of `latest`, and scripts/retire-next-dist-tag.mjs (run from
# release.yml on every publish) deletes it at graduation. So between prerelease
# lines `next` does not resolve at all, and a scheduled leg smoking it would go
# red every week over a channel that is *correctly* absent — manufacturing a
# tracking issue and an IFTTT alert out of a non-event. While a soak IS active,
# release.yml smokes `next` on every publish, which is the tighter loop anyway.
#
# Five legs (three registry legs, then the two fixture legs described last):
#   - latest / ubuntu-latest — matches what release.yml runs every release.
#   - latest / macos-15 (PINNED, not macos-latest — that label drifts
#     unpredictably across major OS versions without notice) — darwin-arm64 is
#     what users actually install on and nothing else exercises it between
#     releases.
#   - provenance-latest — registry-side supply-chain drift rather than install
#     drift (issue #2623). The smoke legs above prove the packages INSTALL; they
#     say nothing about whether they still carry an npm provenance attestation.
#     v2.12.0 published with none (the main-based recovery path cannot attach
#     one), which permanently blocks every consumer running pnpm's
#     `trustPolicy: no-downgrade` — and no CI leg noticed, because the packages
#     install fine and the release went green. It surfaced only when a consumer
#     reported it. This leg closes that gap on the same weekly cadence.
#
#   - preset-installed-carrier-ubuntu / -windows (#4533) — run the
#     published-preset identity fixture against the npm-installed native carrier
#     (ZFB_PRESET_BINARY=installed). Windows is confirmed on a windows-latest
#     runner; there is deliberately no macOS leg (Mac is confirmed by hand).
#
# workflow_dispatch `legs`: `all` (default) or `preset-carrier`. preset-carrier
# skips the three registry legs and BOTH the tracking-issue and IFTTT jobs, so a
# partial evidence run can neither file nor close the issue. Schedules are
# always `all`. The issue closes only when all five jobs succeed
# (scripts/drift-net-verdict.mjs); skipped means not run and never closes.
#
# The provenance leg fails on regressions and on every package that has never
# carried an attestation. All eleven published packages are subject to the
# all-published policy from #2627; the temporary legacy exception expired when
# the attested `2.13.0` release advanced `latest`.
#
# On failure, files/comments on a single deduped tracking issue per workflow
# (scripts/file-exam-issue.sh) and sends an IFTTT notification, reusing the
# exact pattern from release.yml's `notify` job (issue #1335).
#
# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Drift net

on:
  schedule:
    # Weekly, Wednesday 03:43 UTC — an off-minute quiet hour, deliberately not
    # a round number (":00"/":30") to avoid the load spike every workflow
    # scheduled on the hour collides into on GitHub's shared cron fleet.
    - cron: "43 3 * * 3"
  workflow_dispatch:
    inputs:
      legs:
        description: "Which legs to run (preset-carrier skips the tracking issue and alert)"
        type: choice
        options:
          - all
          - preset-carrier
        default: all

concurrency:
  group: drift-net-${{ github.ref }}-${{ github.event.inputs.legs || 'all' }}
  cancel-in-progress: true

# Default to least privilege; the file-or-close-issue job opts into
# issues: write below.
permissions:
  contents: read

jobs:
  smoke-latest-ubuntu:
    if: ${{ github.event.inputs.legs != 'preset-carrier' }}
    name: Smoke latest (ubuntu-latest)
    uses: ./.github/workflows/reusable-smoke-clean-room.yml
    with:
      dist_tag: latest
      runner: ubuntu-latest

  smoke-latest-macos:
    if: ${{ github.event.inputs.legs != 'preset-carrier' }}
    name: Smoke latest (macos-15, darwin-arm64)
    uses: ./.github/workflows/reusable-smoke-clean-room.yml
    with:
      dist_tag: latest
      runner: macos-15

  provenance-latest:
    # Registry-side supply-chain drift: does every published package at the
    # `latest` dist-tag still carry the npm provenance attestation its
    # predecessors had? Needs no pnpm install — the script and its one import
    # are dependency-free ESM over node builtins + fetch.
    name: Provenance drift (latest)
    if: ${{ github.event.inputs.legs != 'preset-carrier' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
          # No pnpm in this job (only `node scripts/check-provenance-drift.mjs`).
          # setup-node@v5 defaults package-manager-cache to true, reads the root
          # package.json `packageManager: pnpm@…` field, then fails with "Unable
          # to locate executable file: pnpm" because pnpm/action-setup never ran
          # here (issue #2829). Disable it — pnpm is not needed for this leg.
          package-manager-cache: false

      - name: Check npm provenance for regressions
        run: node scripts/check-provenance-drift.mjs

  preset-installed-carrier-ubuntu:
    # #4533: published-preset fixture against the npm-installed carrier, pinned
    # published tuple (not a dist-tag). Hard failure.
    name: Preset installed carrier (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ZFB_PRESET_BINARY: installed
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Published-preset fixture (installed carrier)
        # ZFB_PRESET_BINARY=installed comes from the job env (also valid in PowerShell).
        # `runner` is not an allowed context in job-level env, so the dir is set here.
        env:
          ZFB_PRESET_EVIDENCE_DIR: ${{ runner.temp }}/published-preset-identity
        run: node tests/published-preset-identity/run.mjs

      - name: Upload published-preset identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preset-installed-carrier-ubuntu
          path: ${{ runner.temp }}/published-preset-identity/
          if-no-files-found: warn
          retention-days: 14

  preset-installed-carrier-windows:
    # #4533: published-preset fixture against the npm-installed carrier, pinned
    # published tuple (not a dist-tag). Hard failure.
    name: Preset installed carrier (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ZFB_PRESET_BINARY: installed
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Published-preset fixture (installed carrier)
        # ZFB_PRESET_BINARY=installed comes from the job env (also valid in PowerShell).
        # `runner` is not an allowed context in job-level env, so the dir is set here.
        env:
          ZFB_PRESET_EVIDENCE_DIR: ${{ runner.temp }}/published-preset-identity
        run: node tests/published-preset-identity/run.mjs

      - name: Upload published-preset identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preset-installed-carrier-windows
          path: ${{ runner.temp }}/published-preset-identity/
          if-no-files-found: warn
          retention-days: 14

  file-or-close-issue:
    # Single deduped tracking issue per workflow (not per run): stays open
    # while the workflow is red, gets a comment on each subsequent red run,
    # and is closed automatically on the next green run. See
    # scripts/file-exam-issue.sh and the zudo-test-wisdom T3 exam pattern.
    # Skipped entirely on a `legs=preset-carrier` dispatch. The decision lives in
    # scripts/drift-net-verdict.mjs: close only when all five jobs succeeded.
    name: File/close exam tracking issue
    needs:
      - smoke-latest-ubuntu
      - smoke-latest-macos
      - provenance-latest
      - preset-installed-carrier-ubuntu
      - preset-installed-carrier-windows
    if: ${{ !cancelled() && github.event.inputs.legs != 'preset-carrier' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Decide file/close/none
        id: verdict
        env:
          LEGS: ${{ github.event.inputs.legs }}
          R_SMOKE_UBUNTU: ${{ needs.smoke-latest-ubuntu.result }}
          R_SMOKE_MACOS: ${{ needs.smoke-latest-macos.result }}
          R_PROVENANCE: ${{ needs.provenance-latest.result }}
          R_PRESET_UBUNTU: ${{ needs.preset-installed-carrier-ubuntu.result }}
          R_PRESET_WINDOWS: ${{ needs.preset-installed-carrier-windows.result }}
        run: |
          node scripts/drift-net-verdict.mjs --legs "$LEGS" \
            --result "smoke-latest-ubuntu=$R_SMOKE_UBUNTU" \
            --result "smoke-latest-macos=$R_SMOKE_MACOS" \
            --result "provenance-latest=$R_PROVENANCE" \
            --result "preset-installed-carrier-ubuntu=$R_PRESET_UBUNTU" \
            --result "preset-installed-carrier-windows=$R_PRESET_WINDOWS" \
            --github-output "$GITHUB_OUTPUT"

      - name: File or comment on tracking issue (failure)
        if: ${{ steps.verdict.outputs.action == 'file' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LEG: ${{ steps.verdict.outputs.failed }}
        run: bash scripts/file-exam-issue.sh "Drift net"

      - name: Close tracking issue (all five jobs green)
        if: ${{ steps.verdict.outputs.action == 'close' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-exam-issue.sh "Drift net" --green

  notify:
    # Alerting guard: a red leg otherwise sits unseen in the Actions
    # tab between releases (nobody is watching a scheduled run the way a
    # release is watched live). Same IFTTT pattern as release.yml's notify
    # job (status-computed via needs.*.result, reuses IFTTT_PROD_NOTIFY) —
    # established in issue #1335. Skipped on a `legs=preset-carrier` dispatch.
    name: Notify via IFTTT on failure
    needs:
      - smoke-latest-ubuntu
      - smoke-latest-macos
      - provenance-latest
      - preset-installed-carrier-ubuntu
      - preset-installed-carrier-windows
    if: ${{ !cancelled() && github.event.inputs.legs != 'preset-carrier' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IFTTT_PROD_NOTIFY: ${{ secrets.IFTTT_PROD_NOTIFY }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Decide failed legs
        id: verdict
        env:
          LEGS: ${{ github.event.inputs.legs }}
          R_SMOKE_UBUNTU: ${{ needs.smoke-latest-ubuntu.result }}
          R_SMOKE_MACOS: ${{ needs.smoke-latest-macos.result }}
          R_PROVENANCE: ${{ needs.provenance-latest.result }}
          R_PRESET_UBUNTU: ${{ needs.preset-installed-carrier-ubuntu.result }}
          R_PRESET_WINDOWS: ${{ needs.preset-installed-carrier-windows.result }}
        run: |
          node scripts/drift-net-verdict.mjs --legs "$LEGS" \
            --result "smoke-latest-ubuntu=$R_SMOKE_UBUNTU" \
            --result "smoke-latest-macos=$R_SMOKE_MACOS" \
            --result "provenance-latest=$R_PROVENANCE" \
            --result "preset-installed-carrier-ubuntu=$R_PRESET_UBUNTU" \
            --result "preset-installed-carrier-windows=$R_PRESET_WINDOWS" \
            --github-output "$GITHUB_OUTPUT"

      - name: Notify via IFTTT on failure
        if: ${{ env.IFTTT_PROD_NOTIFY != '' && steps.verdict.outputs.failed != '' }}
        env:
          FAILED_JOB: ${{ steps.verdict.outputs.failed }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          curl -sSf --max-time 10 -X POST "$IFTTT_PROD_NOTIFY" \
            -H 'Content-Type: application/json' \
            -d "{
              \"value1\": \"Drift net failed (${FAILED_JOB})\",
              \"value2\": \"registry: latest (ubuntu+macos+provenance); fixture: pinned preset tuple (ubuntu+windows)\",
              \"value3\": \"${RUN_URL}\"
            }" || echo "::warning::IFTTT notification failed"
