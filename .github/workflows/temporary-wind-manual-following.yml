# Preparation only. Replace 6ae4aed60b363e8594a7b342f5944fa796a52069 and revalidate final integrated CLI before use. Expanded matrix recipe after cec6bba4; no execution evidence by itself.
name: Temporary manual Wind reference following
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: wind-manual-following-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      WIND_PINNED_SOURCE_ARCHIVE: /tmp/zfb-wind-reference-cache/response-1d73680e19488b19e97ea3c96722e363cc0c4fd118af546857d8703e8f0f9be3
      WIND_NPM_TARBALL: /tmp/zfb-wind-reference-cache/response-3673da9004404d12d4672bb5d002945319c2b3dea8c13ea022fdd33a3e260e62
      WIND_COMPILER_MODULE: /tmp/zfb-wind-reference-cache/tailwindcss-4.3.2-3673da9004404d12d4672bb5d002945319c2b3dea8c13ea022fdd33a3e260e62/dist/lib.mjs
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: 6ae4aed60b363e8594a7b342f5944fa796a52069
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: v2-zfb
          shared-key: workspace-all-targets
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Record exact source and environment
        run: |
          set -euo pipefail
          mkdir -p /tmp/wind-harness-evidence
          test "$(git rev-parse HEAD)" = 6ae4aed60b363e8594a7b342f5944fa796a52069
          test -z "$(git status --porcelain)"
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            rustc -Vv
            cargo -V
            cat /etc/os-release
            uname -a
          } > /tmp/wind-harness-evidence/environment.txt
      - name: Acquire exact accepted and candidate references and assess complete interval
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wind-manual-following"
          cache="/tmp/zfb-wind-reference-cache"
          mkdir -p "$evidence" "$cache"
          node scripts/wind-compatibility/reference-cli.mjs acquire --cache "$cache" > "$evidence/accepted-acquisition.json"
          node scripts/wind-compatibility/reference-cli.mjs probe --cache "$cache" --candidates block,hidden,p-0,mx-auto,contents > "$evidence/accepted-probe.json"
          node scripts/wind-compatibility/reference-cli.mjs plan --candidate 4.3.3 --channel stable --live yes > "$evidence/plan.json"
          node scripts/wind-compatibility/reference-cli.mjs acquire --candidate 4.3.3 --channel stable --live yes --cache "$cache" > "$evidence/acquisition.json"
          node scripts/wind-compatibility/reference-cli.mjs probe --candidate 4.3.3 --channel stable --live yes --cache "$cache" --candidates block,hidden,p-0,mx-auto,contents > "$evidence/candidate-probe.json"
          node scripts/wind-compatibility/reference-cli.mjs assess --plan "$evidence/plan.json" --cache "$cache" > "$evidence/assessment.json"
          node --input-type=module -e 'import fs from "node:fs"; const a=JSON.parse(fs.readFileSync(process.argv[1])); if(a.status!=="ready-for-comparison") throw Error("Incomplete assessment: "+JSON.stringify(a.findings))' "$evidence/assessment.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateFrozenTarget } from './scripts/wind-compatibility/reference-rehearsal.mjs';
          const evidence = process.env.RUNNER_TEMP + '/wind-manual-following';
          const read = path => JSON.parse(fs.readFileSync(path));
          validateFrozenTarget({
            plan: read(evidence + '/plan.json'),
            assessment: read(evidence + '/assessment.json'),
            acquisition: read(evidence + '/acquisition.json'),
            targetRecord: read('tests/wind-compatibility/reference/manual-following-target.v1.json'),
          });
          NODE
      - name: Verify focused reference contracts with pinned input cases
        run: |
          set -euo pipefail
          test -s "$WIND_PINNED_SOURCE_ARCHIVE"
          test -s "$WIND_NPM_TARBALL"
          test -s "$WIND_COMPILER_MODULE"
          node --test tests/wind-compatibility/*.test.mjs tests/wind-compatibility/reference/*.test.mjs tests/wind-compatibility/empty-token/*.test.mjs tests/wind-compatibility/corpus/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/wind-manual-following/node-contracts.log"
          test -z "$(git status --porcelain)"
      - name: Install exact declared browser engines
        run: node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Compare accepted and candidate with one exact Wind executable
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wind-manual-following"
          cache="/tmp/zfb-wind-reference-cache"
          node scripts/wind-compatibility/differential-runner.mjs build-wind "$evidence/wind-build.json"
          wind_binary=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).binaryPath' "$evidence/wind-build.json")
          node scripts/wind-compatibility/reference-cli.mjs compare --plan "$evidence/plan.json" --assessment "$evidence/assessment.json" --cache "$cache" --wind-binary "$wind_binary" --wind-build-manifest "$evidence/wind-build.json" --output "$evidence/comparison"
          test -z "$(git status --porcelain)"
      - name: Check proposed review-only transition in disposable state
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/wind-manual-following"
          cache="/tmp/zfb-wind-reference-cache"
          node scripts/wind-compatibility/reference-rehearsal.mjs propose --evidence "$evidence"
          # The manager reviewed this conservative deferral policy. Actual rows
          # and state outputs remain non-authoritative until independent review.
          cp "$evidence/classification-proposed.json" "$evidence/classification.json"
          node scripts/wind-compatibility/reference-rehearsal.mjs rehearse --evidence "$evidence" --cache "$cache"
          test -z "$(git status --porcelain)"
      - name: Retain original comparison and disposable transition evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wind-manual-following-evidence
          path: |
            /tmp/wind-harness-evidence/
            /tmp/zfb-wind-reference-cache/
            ${{ runner.temp }}/wind-manual-following/
            test-results/
          if-no-files-found: error
          retention-days: 7
