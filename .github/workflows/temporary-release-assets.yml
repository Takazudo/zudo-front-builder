# Preparation only. Pin reviewed docs source before execution.
name: Temporary 4.0.0 Wind preview generation
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: wind-integration-assets-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: 34e6b99683ae66da49fd11753c57f3c5d6bfcb54
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: wind-preview-no-v8
      - run: cargo build --locked -p zfb --no-default-features
      - name: Generate actual compiler output
        run: |
          set -euo pipefail
          mkdir -p target/wind-integration-evidence
          test "$(git rev-parse HEAD)" = 34e6b99683ae66da49fd11753c57f3c5d6bfcb54
          test -z "$(git status --porcelain)"
          rustc -Vv > target/wind-integration-evidence/toolchain.txt
          cargo -V >> target/wind-integration-evidence/toolchain.txt
          git rev-parse HEAD > target/wind-integration-evidence/source-sha.txt
          sha256sum target/debug/zfb > target/wind-integration-evidence/compiler-sha256.txt
          target/debug/zfb -V > target/wind-integration-evidence/compiler-version.txt
          node docs/scripts/wind-preview-assets.mjs --compiler "$PWD/target/debug/zfb"
          node docs/scripts/wind-preview-assets.mjs --compiler "$PWD/target/debug/zfb" --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: own-product-wind-assets
          path: |
            docs/public/wind-examples/
            target/wind-integration-evidence/
          if-no-files-found: error
          retention-days: 7
