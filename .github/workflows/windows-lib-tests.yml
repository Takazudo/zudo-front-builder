# pin-update: every `uses: <action>@<sha>` line is pinned to the same SHAs as
# health.yml; bump them together.
#
# Native Windows x64 library tests (#4371). health.yml runs the Rust suite on
# Linux only, so Windows-only path behavior (verbatim `\\?\C:\…` canonical
# paths, `\` separators, directory handles) and `cfg(windows)` code went
# untested until a manual run found 25 failures. This lane runs the two
# crates where those surfaced, plus zfb-islands' graph-identity tests, which
# cover the `?url` resource read that Windows rejects as an invalid filename
# (#4413). It is path-filtered, so it is not a required
# check; a red result still needs triage like any other check.

name: windows-lib-tests

on:
  pull_request:
    branches: [main, "base/**"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/windows-lib-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-lib-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-lib-tests:
    name: Windows lib tests (zfb-build, zfb-content, zfb-islands graph identity)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      # No rust-cache, as in direct-v8.yml: a V8-linked Windows target tree
      # would compete with health's caches for the repo's Actions cache budget.

      - run: pnpm install --frozen-lockfile

      # locate_esbuild's pnpm-store lookup picked a non-pinned esbuild on
      # Windows (#4366 row e: graph_identity failed with "esbuild version
      # mismatch"), so stage the version pinned in crates/zfb-toolchain-pins
      # and export ZFB_ESBUILD_BIN, which locate_esbuild honours first.
      - name: Stage pinned esbuild
        run: |
          version=$(sed -n 's/^pub const EXPECTED_ESBUILD_VERSION: &str = "\(.*\)";$/\1/p' crates/zfb-toolchain-pins/src/lib.rs)
          test -n "$version"
          stage="$RUNNER_TEMP/esbuild-$version"
          mkdir -p "$stage"
          cd "$stage"
          tarball=$(npm pack "@esbuild/win32-x64@$version" --silent | tail -n 1)
          tar -xzf "$tarball"
          "$stage/package/esbuild.exe" --version | grep -Fx "$version"
          echo "ZFB_ESBUILD_BIN=$(cygpath -w "$stage/package/esbuild.exe")" >> "$GITHUB_ENV"

      # One test thread, matching the native run that produced #4371's list;
      # the whole zfb-build suite ran in under 10 s that way.
      - name: zfb-content lib tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p zfb-content --lib -- --test-threads=1

      - name: zfb-build lib tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p zfb-build --lib -- --test-threads=1

      - name: zfb-islands graph identity tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p zfb-islands --lib graph_identity::tests -- --test-threads=1

      # Real-esbuild integration binary; locate_esbuild resolves the staged
      # ZFB_ESBUILD_BIN above. The two symlink tests are cfg(unix), so Windows
      # selects the remaining 6.
      - name: zfb-islands graph identity integration tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p zfb-islands --test graph_identity -- --test-threads=1

  # #4366 rows e/f: native Windows process-tree kill + graceful-interrupt guard
  # (crates/zfb/tests/support/process_guard.rs, tested by the
  # process_guard_support binary) and the real-process e2e binaries, including the graceful
  # Ctrl-C stop in scratch_dir_concurrent_e2e. The e2e binaries self-skip when
  # esbuild/node/pnpm are missing; the pnpm install and setup-node above provide
  # all three on PATH, and the log is kept so a skip would be visible.
  windows-e2e:
    name: Windows e2e (process guard, scanner/reproducibility/scratch-dir e2e)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      - run: pnpm install --frozen-lockfile

      # locate_esbuild's pnpm-store lookup picked a non-pinned esbuild on
      # Windows (#4366 row e: graph_identity failed with "esbuild version
      # mismatch"), so stage the version pinned in crates/zfb-toolchain-pins
      # and export ZFB_ESBUILD_BIN, which locate_esbuild honours first.
      - name: Stage pinned esbuild
        run: |
          version=$(sed -n 's/^pub const EXPECTED_ESBUILD_VERSION: &str = "\(.*\)";$/\1/p' crates/zfb-toolchain-pins/src/lib.rs)
          test -n "$version"
          stage="$RUNNER_TEMP/esbuild-$version"
          mkdir -p "$stage"
          cd "$stage"
          tarball=$(npm pack "@esbuild/win32-x64@$version" --silent | tail -n 1)
          tar -xzf "$tarball"
          "$stage/package/esbuild.exe" --version | grep -Fx "$version"
          echo "ZFB_ESBUILD_BIN=$(cygpath -w "$stage/package/esbuild.exe")" >> "$GITHUB_ENV"

      # Only the guard's binary: the other zfb-test-utils tests have known
      # Windows failures tracked in #4498.
      - name: process guard (kill-tree + graceful interrupt)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p e2e-logs
          cargo test --locked -p zfb --test process_guard_support -- --test-threads=1 --nocapture 2>&1 | tee e2e-logs/process-guard.log

      - name: zfb e2e binaries
        if: ${{ !cancelled() }}
        run: |
          mkdir -p e2e-logs
          cargo test --locked -p zfb --test scanner_boundary_acceptance --test build_reproducibility_e2e --test scratch_dir_concurrent_e2e -- --test-threads=1 --nocapture 2>&1 | tee e2e-logs/zfb-e2e.log

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-logs
          path: |
            e2e-logs/
            target/tmp/
          retention-days: 7
          if-no-files-found: ignore
