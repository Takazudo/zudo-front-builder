# node-free-smoke.yml
#
# End-to-end smoke test for the node-free distribution path.
# Validates that the zfb binary can scaffold, build, and serve a node-free
# site inside a Debian container that has no Node, no Rust, and no pnpm.
#
# ── Job topology ──────────────────────────────────────────────────────────
#
# PR + main push (ZFB_SMOKE_MODE=local):
#   build-binary (amd64 on ubuntu-22.04)
#     └─► smoke-amd64 (ubuntu-latest)   — runs container in local mode
#   build-binary (arm64 cross on ubuntu-22.04, mirrors release.yml)
#     └─► smoke-arm64 (ubuntu-24.04-arm) — runs container in local mode
#
# Tag push — after release.yml has published GH Release assets
# (ZFB_SMOKE_MODE=released):
#   smoke-released (ubuntu-latest) — curl-pipes install.sh, validates
#                                    public install path end-to-end.
#
# ── Trigger policy ────────────────────────────────────────────────────────
#
# build-binary + smoke-amd64/arm64: pull_request + push to main.
# smoke-released: workflow_run after release.yml completes (tag only).
#   Using workflow_run rather than "push: tags" ensures the GH Release
#   assets already exist when install.sh tries to download them.

# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Node-free smoke

# Cancel previous runs on the same ref — smoke artifacts are consumed only
# within the same run, so cancellation is safe and prevents artifact churn.
concurrency:
  group: node-free-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main
      - "base/**"
  workflow_run:
    # Trigger the released-mode smoke after release.yml finishes on a tag.
    # release.yml only runs on v* tags, so this job only fires on real releases.
    workflows: ["Release"]
    types: [completed]

jobs:
  # ── Linux binary build (one job per platform) ──────────────────────────────
  build-binary:
    name: Build binary (${{ matrix.platform.runner }})
    # Only run on PR and main push triggers, not on workflow_run.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # ubuntu-22.04 host ensures x86_64 binary links against GLIBC 2.35 — the project's floor.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: smoke-binary-amd64
            use_cross: false
          # arm64 uses cross on ubuntu-22.04 (mirroring release.yml) rather than native
          # ubuntu-24.04-arm. Rationale: native arm ubuntu-24.04 produces a GLIBC 2.39 binary
          # which cannot run inside the bookworm smoke container (GLIBC 2.36), causing the
          # smoke to fail at zfb --version before any assertions. Cross on ubuntu-22.04 with
          # the Cross.toml pin produces ≤ 2.35, matching the released binary.
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: smoke-binary-arm64
            use_cross: true
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # pnpm version is read from package.json's "packageManager" field.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      # build.rs (embed_framework_packages) needs node_modules at build time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          targets: ${{ matrix.platform.target }}

      # Install cross-rs for the arm64 cross-compile target (same as release.yml).
      # cross wraps cargo build inside a Docker container providing the aarch64 sysroot;
      # Cross.toml at repo root pins the image to a GLIBC 2.23 base (≤ 2.35 floor).
      - name: Install cross (arm64 only)
        if: ${{ matrix.platform.use_cross == true }}
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: cross

      - name: Build zfb binary (native)
        if: ${{ matrix.platform.use_cross != true }}
        run: cargo build -p zfb --release --target ${{ matrix.platform.target }}

      - name: Build zfb binary (cross — arm64)
        if: ${{ matrix.platform.use_cross == true }}
        run: cross build -p zfb --release --target ${{ matrix.platform.target }}

      - name: Enforce GLIBC 2.35 floor on the built binary
        shell: bash
        run: |
          BIN="target/${{ matrix.platform.target }}/release/zfb"
          MAX_GLIBC=$(objdump -T "$BIN" \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
            | sort -V \
            | tail -1)
          echo "Highest required GLIBC symbol: $MAX_GLIBC"
          if [[ -z "$MAX_GLIBC" ]]; then
            echo "::error::No GLIBC symbols found via objdump — binary inspection failed."
            exit 1
          fi
          WORST=$(printf '%s\n%s\n' "$MAX_GLIBC" "GLIBC_2.35" | sort -V | tail -1)
          if [[ "$WORST" != "GLIBC_2.35" ]]; then
            echo "::error::Binary requires $MAX_GLIBC, exceeds the GLIBC_2.35 floor."
            exit 1
          fi

      # Stage binary to a fixed path inside the smoke build contexts so that
      # Dockerfile COPY zfb-bin is always resolvable regardless of target triple.
      # One compile, two uploads — JSON variant and TS variant both need the binary.
      - name: Stage binary for smoke containers
        run: |
          cp target/${{ matrix.platform.target }}/release/zfb \
             tests/smoke/node-free/zfb-bin
          cp target/${{ matrix.platform.target }}/release/zfb \
             tests/smoke/node-free-ts/zfb-bin

      - name: Upload binary artifact (JSON smoke)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.artifact }}
          # Upload the full smoke context dir (Dockerfile + run.sh + binary).
          path: tests/smoke/node-free/
          if-no-files-found: error
          retention-days: 1

      - name: Upload binary artifact (TS smoke)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.artifact }}-ts
          # Upload the full TS smoke context dir (Dockerfile + run.sh + binary).
          path: tests/smoke/node-free-ts/
          if-no-files-found: error
          retention-days: 1

  # ── amd64 smoke: runs on ubuntu-latest ─────────────────────────────────────
  smoke-amd64:
    name: Smoke amd64 (local mode)
    needs: build-binary
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download smoke context (amd64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-binary-amd64
          path: smoke-ctx

      - name: Fix permissions on run.sh
        run: chmod +x smoke-ctx/run.sh

      - name: Build smoke image
        run: |
          docker build \
            --build-arg ZFB_SMOKE_MODE=local \
            -t zfb-smoke:amd64 \
            smoke-ctx/

      - name: Run smoke container
        run: docker run --rm zfb-smoke:amd64

  # ── arm64 smoke: runs on ubuntu-24.04-arm (native arm64 runner) ────────────
  smoke-arm64:
    name: Smoke arm64 (local mode)
    needs: build-binary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - name: Download smoke context (arm64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-binary-arm64
          path: smoke-ctx

      - name: Fix permissions on run.sh
        run: chmod +x smoke-ctx/run.sh

      - name: Build smoke image
        run: |
          docker build \
            --build-arg ZFB_SMOKE_MODE=local \
            -t zfb-smoke:arm64 \
            smoke-ctx/

      - name: Run smoke container
        run: docker run --rm zfb-smoke:arm64

  # ── amd64 TS-config smoke: runs on ubuntu-latest ───────────────────────────
  smoke-amd64-ts:
    name: Smoke amd64 TS-config (local mode)
    needs: build-binary
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download smoke context (amd64 TS)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-binary-amd64-ts
          path: smoke-ctx-ts

      - name: Fix permissions on run.sh
        run: chmod +x smoke-ctx-ts/run.sh

      - name: Build smoke image (TS config)
        run: |
          docker build \
            --build-arg ZFB_SMOKE_MODE=local \
            -t zfb-smoke:amd64-ts \
            smoke-ctx-ts/

      - name: Run smoke container (TS config)
        run: docker run --rm zfb-smoke:amd64-ts

  # ── arm64 TS-config smoke: runs on ubuntu-24.04-arm ────────────────────────
  smoke-arm64-ts:
    name: Smoke arm64 TS-config (local mode)
    needs: build-binary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - name: Download smoke context (arm64 TS)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-binary-arm64-ts
          path: smoke-ctx-ts

      - name: Fix permissions on run.sh
        run: chmod +x smoke-ctx-ts/run.sh

      - name: Build smoke image (TS config)
        run: |
          docker build \
            --build-arg ZFB_SMOKE_MODE=local \
            -t zfb-smoke:arm64-ts \
            smoke-ctx-ts/

      - name: Run smoke container (TS config)
        run: docker run --rm zfb-smoke:arm64-ts

  # ── Post-release smoke: validates the public install.sh path ───────────────
  smoke-released:
    name: Smoke released (install.sh)
    # Only runs when triggered by workflow_run (after release.yml on a tag),
    # and only if that run succeeded.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Check out the tag that triggered the release so tests/smoke/node-free/
          # reflects the same revision that was released.
          ref: ${{ github.event.workflow_run.head_sha }}

      # In released mode the Dockerfile overwrites zfb-bin with install.sh,
      # so we provide a placeholder to satisfy the unconditional COPY.
      - name: Create placeholder for released-mode COPY
        run: |
          printf 'placeholder — replaced by install.sh in released mode\n' \
            > tests/smoke/node-free/zfb-bin

      - name: Build smoke image (released mode)
        # head_branch is the tag that triggered the release (e.g. v0.1.0-next.18).
        # Passed via env (not inline ${{ }}) to avoid shell injection, matching the
        # repo's security posture. install.sh pins to this tag so the smoke installs
        # the exact just-released assets — the default /releases/latest path 404s
        # while the project ships only pre-releases.
        env:
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          docker build \
            --build-arg ZFB_SMOKE_MODE=released \
            --build-arg "ZFB_VERSION=${RELEASE_TAG}" \
            -t zfb-smoke:released \
            tests/smoke/node-free/

      - name: Run smoke container (released mode)
        run: docker run --rm zfb-smoke:released
