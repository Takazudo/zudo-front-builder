# node-free-smoke.yml
#
# End-to-end smoke test for the node-free distribution path.
# Validates that the zfb binary can scaffold, build, and serve a node-free
# site inside a Debian container that has no Node, no Rust, and no pnpm.
#
# ── Job topology ──────────────────────────────────────────────────────────
#
# PR + main push (ZFB_SMOKE_MODE=local):
#   build-binary (amd64 on ubuntu-22.04)
#     ├─► smoke-amd64 (ubuntu-latest)   — runs container in local mode
#     ├─► scaffold-e2e (ubuntu-latest)  — pre-publish npm-consumption E2E:
#     │                                   pnpm/npm packs zfb, zfb-runtime,
#     │                                   zfb-adapter-cloudflare, create-zfb,
#     │                                   and zfb-linux-x64-gnu (with this
#     │                                   leg's freshly built binary injected)
#     │                                   into local tarballs, installs
#     │                                   create-zfb from its tarball with
#     │                                   overrides pinning every @takazudo/*
#     │                                   dep to the LOCAL tarballs (never the
#     │                                   registry), scaffolds + builds a
#     │                                   site, and asserts dist/ content.
#     │                                   See scripts/smoke-packed-clean-room.sh.
#     └─► built-site-browser-smoke (ubuntu-latest) — issue #1401: builds
#                                         tests/built-site-smoke/fixture-site/
#                                         (a real interactive Preact island)
#                                         with this leg's binary, serves the
#                                         resulting dist/ statically, and
#                                         loads it in real Chromium via
#                                         Playwright — asserting zero page
#                                         errors and that the island actually
#                                         hydrates (click increments a
#                                         counter). Closes the #1385 bug
#                                         class's blind spot: no other tier
#                                         loads a BUILT zfb site in a real
#                                         browser. NOT a required status
#                                         check (see CLAUDE.md's ruleset
#                                         list) — deliberately excluded so a
#                                         Playwright/Chromium regression here
#                                         never blocks an unrelated PR.
#   build-binary (arm64 cross on ubuntu-22.04, mirrors release.yml)
#     └─► smoke-arm64 (ubuntu-24.04-arm) — runs container in local mode
#
# Tag push — after release.yml has published GH Release assets
# (ZFB_SMOKE_MODE=released):
#   smoke-released (ubuntu-latest) — curl-pipes install.sh, validates
#                                    public install path end-to-end.
#
# ── Trigger policy ────────────────────────────────────────────────────────
#
# build-binary + smoke-amd64/arm64: pull_request + push to main.
# smoke-released: workflow_run after release.yml completes (tag only).
#   Using workflow_run rather than "push: tags" ensures the GH Release
#   assets already exist when install.sh tries to download them.

# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Node-free smoke

# Cancel previous runs on the same ref — smoke artifacts are consumed only
# within the same run, so cancellation is safe and prevents artifact churn.
#
# ...but ONLY on pull_request. Since #2279 this workflow also drives the
# create-zfb showcase PRODUCTION deploy on main pushes, and a workflow-level
# `cancel-in-progress: true` cancels the entire run — every job with it. A
# job-level `concurrency` block does NOT shield a job from that: job-level
# concurrency only governs queuing between jobs in its own group, and
# membership in one group confers nothing in another (the only per-job
# survival mechanism GitHub documents for cancellation is `if: always()`).
# Two quick main pushes would therefore kill run #1 mid-`wrangler deploy`,
# skipping the custom-domain attach, the health check, and the notify — i.e.
# exactly the alerting guard the deploy exists to be.
#
# Accepted cost: main-push runs of this whole suite are no longer
# cancellable. Main pushes are infrequent and should finish anyway.
concurrency:
  group: node-free-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches:
      - main
      - "base/**"
  workflow_run:
    # Trigger the released-mode smoke after release.yml finishes on a tag.
    # release.yml only runs on v* tags, so this job only fires on real releases.
    workflows: ["Release"]
    types: [completed]

jobs:
  # ── Linux binary build (one job per platform) ──────────────────────────────
  build-binary:
    # Named after matrix.platform.target (not .runner) so each leg produces a
    # unique GitHub check context — both legs run on the same runner
    # (ubuntu-22.04, see comments below), so naming after .runner would make
    # both legs report the identical check name and branch-protection
    # rulesets couldn't require them independently.
    name: Build binary (${{ matrix.platform.target }})
    # Only run on PR and main push triggers, not on workflow_run.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          # ubuntu-22.04 host ensures x86_64 binary links against GLIBC 2.35 — the project's floor.
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: smoke-binary-amd64
            use_cross: false
          # arm64 uses cross on ubuntu-22.04 (mirroring release.yml) rather than native
          # ubuntu-24.04-arm. Rationale: native arm ubuntu-24.04 produces a GLIBC 2.39 binary
          # which cannot run inside the bookworm smoke container (GLIBC 2.36), causing the
          # smoke to fail at zfb --version before any assertions. Cross on ubuntu-22.04 with
          # the Cross.toml pin produces ≤ 2.35, matching the released binary.
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            artifact: smoke-binary-arm64
            use_cross: true
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # pnpm version is read from package.json's "packageManager" field.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      # build.rs (embed_framework_packages) needs node_modules at build time.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          targets: ${{ matrix.platform.target }}

      # Cache compiled Rust artifacts across the two build-binary matrix legs
      # (issue #1345 — this job rebuilt from scratch, ~6 min, on every PR).
      # Prefix keyed per target: x86_64 (native) and aarch64 (cross, via a
      # Docker-mounted target/ dir) run on the same ubuntu-22.04 runner label
      # but produce non-interchangeable target/ trees — sharing one key
      # between them risks the same "v8 static lib not found after partial
      # rebuild" class of breakage that motivated health.yml's v1 -> v2
      # rust-cache bump (PR #250).
      #
      # GitHub enforces a 10GB-per-repo actions-cache eviction budget, LRU
      # across every prefix in the repo. Stale count fixed (issue #1394): this
      # comment used to say "four" families total, counting only health.yml's
      # two plus this workflow's two matrix legs — it missed exam.yml, which
      # also calls Swatinem/rust-cache (`grep -rn "Swatinem/rust-cache"
      # .github/workflows/` — 5 call sites today). The real, current count of
      # distinct cache families is FIVE: health.yml's `health` job
      # (V8-enabled) and exam.yml's `quarantine-heavy` job now deliberately
      # SHARE one family via a common `shared-key` (both run the identical
      # `cargo build --workspace --all-targets`, so the target/ tree really is
      # interchangeable — see exam.yml's rust-cache step); health.yml's
      # `build-no-v8` job is its own family ("v2-zfb-no-v8"); exam.yml's
      # `macos-exam` job is its own family ("v2-zfb-macos-exam", different
      # OS/arch); and this workflow's two matrix legs
      # ("v2-zfb-smoke-x86_64-unknown-linux-gnu" /
      # "v2-zfb-smoke-aarch64-unknown-linux-gnu") are each their own family.
      # Five moderately-sized target/ caches should stay well under budget; if
      # repo-wide cache pressure or eviction thrashing appears, this is the
      # first place to look.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: "v2-zfb-smoke-${{ matrix.platform.target }}"

      # Install cross-rs for the arm64 cross-compile target (same as release.yml).
      # cross wraps cargo build inside a Docker container providing the aarch64 sysroot;
      # Cross.toml at repo root pins the image to a GLIBC 2.23 base (≤ 2.35 floor).
      - name: Install cross (arm64 only)
        if: ${{ matrix.platform.use_cross == true }}
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: cross@0.2.5

      - name: Build zfb binary (native)
        if: ${{ matrix.platform.use_cross != true }}
        run: cargo build -p zfb --release --target ${{ matrix.platform.target }}

      - name: Build zfb binary (cross — arm64)
        if: ${{ matrix.platform.use_cross == true }}
        run: cross build -p zfb --release --target ${{ matrix.platform.target }}

      - name: Enforce GLIBC 2.35 floor on the built binary
        shell: bash
        run: |
          BIN="target/${{ matrix.platform.target }}/release/zfb"
          MAX_GLIBC=$(objdump -T "$BIN" \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
            | sort -V \
            | tail -1)
          echo "Highest required GLIBC symbol: $MAX_GLIBC"
          if [[ -z "$MAX_GLIBC" ]]; then
            echo "::error::No GLIBC symbols found via objdump — binary inspection failed."
            exit 1
          fi
          WORST=$(printf '%s\n%s\n' "$MAX_GLIBC" "GLIBC_2.35" | sort -V | tail -1)
          if [[ "$WORST" != "GLIBC_2.35" ]]; then
            echo "::error::Binary requires $MAX_GLIBC, exceeds the GLIBC_2.35 floor."
            exit 1
          fi

      # Stage binary to a fixed path inside the smoke build contexts so that
      # Dockerfile COPY zfb-bin is always resolvable regardless of target triple.
      # One compile, two uploads — JSON variant and TS variant both need the binary.
      - name: Stage binary for smoke containers
        run: |
          cp target/${{ matrix.platform.target }}/release/zfb \
             tests/smoke/node-free/zfb-bin
          cp target/${{ matrix.platform.target }}/release/zfb \
             tests/smoke/node-free-ts/zfb-bin

      - name: Upload binary artifact (JSON smoke)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.artifact }}
          # Upload the full smoke context dir (Dockerfile + run.sh + binary).
          path: tests/smoke/node-free/
          if-no-files-found: error
          retention-days: 1

      - name: Upload binary artifact (TS smoke)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.artifact }}-ts
          # Upload the full TS smoke context dir (Dockerfile + run.sh + binary).
          path: tests/smoke/node-free-ts/
          if-no-files-found: error
          retention-days: 1

  # ── amd64 smoke: runs on ubuntu-latest ─────────────────────────────────────
  smoke-amd64:
    name: Smoke amd64 (local mode)
    needs: build-binary
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download smoke context (amd64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-binary-amd64
          path: smoke-ctx

      - name: Fix permissions on run.sh
        run: chmod +x smoke-ctx/run.sh

      - name: Build smoke image
        run: |
          docker build \
            --build-arg ZFB_SMOKE_MODE=local \
            -t zfb-smoke:amd64 \
            smoke-ctx/

      - name: Run smoke container
        run: docker run --rm zfb-smoke:amd64

  # ── scaffold E2E: pre-publish `npm create zfb` consumption path (issue #1345) ──
  #
  # The full npm consumption path (npm create zfb -> install -> build) was
  # tested ONLY at release time against the live registry
  # (scripts/smoke-clean-room.sh / reusable-smoke-clean-room.yml), so a
  # packaging break only surfaced AFTER publish — one release late for docs'
  # integration signal, and (in the next.27 incident) after real users had
  # already hit ERR_MODULE_NOT_FOUND. This job runs the same shape of test
  # PRE-publish, on every PR, entirely from locally packed tarballs — no
  # registry round-trip for the packages under test. It complements (does not
  # replace) the static `packaging.test.ts` in zfb-adapter-cloudflare, which
  # checks the `files` allowlist / build-copy-step text but cannot prove the
  # packed tarball actually installs and runs.
  scaffold-e2e:
    name: Scaffold E2E (packed tarballs, pre-publish)
    needs: build-binary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Only the packages this job packs need a fresh dist/ — not the whole
      # workspace (e.g. docs), which pnpm -r build would also touch.
      - name: Build packages under test
        run: pnpm --filter @takazudo/zfb --filter @takazudo/zfb-runtime --filter @takazudo/zfb-adapter-cloudflare build

      - name: Download built binary (amd64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-binary-amd64
          path: smoke-ctx

      - name: Pack, override, scaffold, build, and assert (packed clean-room)
        env:
          ZFB_LINUX_X64_BINARY: ${{ github.workspace }}/smoke-ctx/zfb-bin
          ZFB_SMOKE_DIST_OUT: ${{ github.workspace }}/showcase-dist
        run: bash scripts/smoke-packed-clean-room.sh

      # Shares this job's already-built site with the showcase deploy
      # workflow (issue #2280) instead of making it scaffold+build again.
      # continue-on-error + if-no-files-found: error is deliberate, not
      # sloppy: a showcase-side artifact hiccup surfaces as a step
      # annotation but can never flip this job's conclusion to failure, so
      # it can never redden the required "Scaffold E2E" check on an
      # unrelated PR. Downstream, the deploy job fails on its own
      # download-artifact instead — the correct (non-required) blast radius.
      - name: Upload showcase dist
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: create-zfb-showcase-dist
          path: showcase-dist/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  # ── create-zfb showcase: production deploy (issue #2284) ───────────────────
  #
  # `create-zfb` is otherwise invisible — the only way to see what
  # `npm create zfb@latest my-site` produces is to run it. This job deploys
  # the REAL scaffold output (the artifact scaffold-e2e just built, from THIS
  # commit's code) to an assets-only Cloudflare Worker at
  # create-zfb.takazudomodular.com, so the scaffold is visible from the front
  # side. The site is never committed — it is generated by the same
  # scripts/smoke-packed-clean-room.sh run that backs the required check, so
  # it cannot drift from crates/zfb/templates/.
  #
  # NOT a required status check, and deliberately excluded from the `main`
  # ruleset (18452968) — same reasoning as `Build docs site` and
  # `Built-site browser smoke (L4)`. In tier terms this is an ALERTING GUARD,
  # not a gate: it runs post-merge, so it can only detect a bad deploy, never
  # prevent one.
  showcase-deploy:
    name: Showcase deploy (create-zfb, production)
    needs: scaffold-e2e
    # The explicit ref test is load-bearing: this workflow's `push:` also
    # fires on `base/**`, so a bare "is this a push?" condition would deploy
    # every epic base branch to production.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # This job runs only `node`/`npx` (no pnpm). setup-node@v5
          # auto-enables package-manager-cache, detects pnpm-lock.yaml, then
          # fails with "Unable to locate pnpm" because pnpm/action-setup never
          # ran here. Disable it — pnpm is not needed.
          package-manager-cache: false

      - name: Skip when Cloudflare credentials are unavailable
        id: creds
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::Cloudflare credentials unavailable — skipping showcase deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download showcase dist
        if: steps.creds.outputs.ok == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: create-zfb-showcase-dist
          path: create-zfb-showcase/dist/

      # Validate BEFORE injecting the banner, never after: this is the L3
      # build-output signal and it must judge zfb's own emitted HTML, not the
      # markup CI splices in. Reversed, a banner bug would read as a template
      # regression and vice versa.
      #
      # Exact patch pin (not `@10`): this step runs in a job holding
      # CLOUDFLARE_API_TOKEN, and an unpinned `npx` fetch there would
      # contradict the repo's pin-everything discipline. html-validate is
      # `^10.0.0` in docs/package.json; this job has no pnpm, hence npx.
      # pin-update: bump this the same way as the `uses:` SHAs above.
      - name: Validate emitted HTML (html-validate)
        if: steps.creds.outputs.ok == 'true'
        working-directory: create-zfb-showcase
        run: npx --yes html-validate@10.0.0 "dist/**/*.html"

      # not_found_handling = "404-page" in wrangler.toml silently degrades to
      # a plain 404 if the template ever loses pages/404.tsx. Fail loudly here
      # instead of shipping a subtly worse site.
      - name: Assert the scaffold emitted a 404 page
        if: steps.creds.outputs.ok == 'true'
        run: |
          if [ ! -f create-zfb-showcase/dist/404.html ]; then
            echo "::error::create-zfb-showcase/dist/404.html is missing — not_found_handling=\"404-page\" would silently degrade. Did basic-blog lose pages/404.tsx?"
            exit 1
          fi

      - name: Inject the showcase banner
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/showcase-inject-banner.mjs create-zfb-showcase/dist "${{ github.sha }}"

      - name: Deploy worker
        if: steps.creds.outputs.ok == 'true'
        run: |
          WRANGLER_VERSION=$(node -p "require('./docs/package.json').devDependencies.wrangler")
          cd create-zfb-showcase && npx wrangler@"$WRANGLER_VERSION" deploy

      - name: Enable workers.dev subdomain (idempotent)
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        run: |
          RESPONSE=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/zfb-showcase/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true}')
          echo "$RESPONSE"
          # code 10056 = already configured — treat as success
          CODE=$(echo "$RESPONSE" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log((j.errors||[]).map(e=>e.code).join(','))")
          if [ -n "$CODE" ] && [ "$CODE" != "10056" ]; then
            echo "Unexpected error code(s): $CODE" >&2
            exit 1
          fi

      - name: Attach custom domain (idempotent)
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        run: |
          RESPONSE=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"hostname":"create-zfb.takazudomodular.com","service":"zfb-showcase","environment":"production","zone_name":"takazudomodular.com"}')
          echo "$RESPONSE"
          # 100116 = custom domain already attached; 100122 = zone already has this route
          CODE=$(echo "$RESPONSE" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log((j.errors||[]).map(e=>e.code).join(','))")
          if [ -n "$CODE" ] && [ "$CODE" != "100116" ] && [ "$CODE" != "100122" ]; then
            echo "Unexpected error code(s): $CODE" >&2
            exit 1
          fi

      # Post-deploy alerting guard: confirms the live site is actually serving
      # the scaffold, not just that `wrangler deploy` exited 0. "Hello, zfb" is
      # the seed post title from basic-blog's content/blog/hello-zfb.mdx — the
      # same marker scripts/smoke-packed-clean-room.sh already asserts on, so
      # it can only be present if the real content pipeline ran.
      - name: Post-deploy health check
        if: steps.creds.outputs.ok == 'true'
        shell: bash
        run: |
          URL="https://create-zfb.takazudomodular.com"
          MARKER="Hello, zfb"
          BODY_FILE="$RUNNER_TEMP/showcase-health-body.html"
          max_attempts=6
          delay=10
          for attempt in $(seq 1 $max_attempts); do
            HTTP_CODE=$(curl -sS --max-time 15 -o "$BODY_FILE" -w '%{http_code}' "$URL" || echo "000")
            if [ "$HTTP_CODE" = "200" ] && grep -q "$MARKER" "$BODY_FILE"; then
              echo "Health check passed on attempt ${attempt}: HTTP ${HTTP_CODE}, marker '${MARKER}' found."
              exit 0
            fi
            echo "Attempt ${attempt}/${max_attempts}: HTTP ${HTTP_CODE}, marker present: $(grep -q "$MARKER" "$BODY_FILE" 2>/dev/null && echo yes || echo no)"
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "::error::Health check failed after ${max_attempts} attempts — ${URL} did not return HTTP 200 with marker '${MARKER}'."
              exit 1
            fi
            sleep "$delay"
          done

  # ── create-zfb showcase: notify on production-deploy failure ───────────────
  showcase-notify:
    name: Notify on showcase deploy failure
    needs: showcase-deploy
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.showcase-deploy.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IFTTT_PROD_NOTIFY: ${{ secrets.IFTTT_PROD_NOTIFY }}
    steps:
      - name: Notify via IFTTT
        if: env.IFTTT_PROD_NOTIFY != ''
        env:
          GITHUB_SHA_VAL: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA_VAL" | cut -c1-7)
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          curl -sSf --max-time 10 -X POST "$IFTTT_PROD_NOTIFY" \
            -H 'Content-Type: application/json' \
            -d "{
              \"value1\": \"create-zfb showcase deploy failed\",
              \"value2\": \"${SHORT_SHA}\",
              \"value3\": \"${RUN_URL}\"
            }" || echo "::warning::IFTTT notification failed"

  # ── create-zfb showcase: per-PR preview deploy + sticky comment (#2285) ────
  #
  # Same artifact, same validate-then-inject order as the production job, but
  # uploaded as a preview version rather than deployed. NOT a required check.
  showcase-preview:
    name: Showcase preview (create-zfb, PR)
    needs: scaffold-e2e
    # Fork PRs carry neither secrets nor a writable token, so skip cleanly
    # rather than reddening an external contributor's PR. The dependabot
    # clause is separate and not redundant: a dependabot PR is branch-based
    # (it PASSES the fork test) but runs with a read-only GITHUB_TOKEN that
    # `permissions:` cannot elevate, so the comment step would 403. There is
    # no .github/dependabot.yml today — this is latent, and costs one line.
    #
    # Deliberately NOT pull_request_target: under it, PR-authored code would
    # run `npx` and a node script with repository secrets in scope.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-level, so sibling jobs in this workflow keep the default token
    # scope. BOTH keys are required: GitHub sets every unlisted permission to
    # `none`, so `pull-requests: write` alone would leave checkout with
    # `contents: none`.
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download showcase dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: create-zfb-showcase-dist
          path: create-zfb-showcase/dist/

      # Validate before injecting — same reasoning as the production job.
      - name: Validate emitted HTML (html-validate)
        working-directory: create-zfb-showcase
        run: npx --yes html-validate@10.0.0 "dist/**/*.html"

      - name: Inject the showcase banner
        run: node scripts/showcase-inject-banner.mjs create-zfb-showcase/dist "${{ github.event.pull_request.head.sha }}"

      - name: Upload preview version
        id: preview
        # Tolerant by design: `versions upload --preview-alias` requires the
        # `zfb-showcase` worker to already exist (created by the first
        # production deploy on merge to main) and the workers.dev subdomain to
        # be enabled. Before that, the upload legitimately fails — a cold
        # start, not a bug. Treat it as a graceful no-op (the comment step
        # posts a "pending" note) rather than reddening the PR.
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::warning::Cloudflare credentials unavailable — skipping preview upload."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          WRANGLER_VERSION=$(node -p "require('./docs/package.json').devDependencies.wrangler")
          PREVIEW_ALIAS="pr-${PR_NUMBER}"
          set +e
          UPLOAD_OUTPUT=$(cd create-zfb-showcase && npx wrangler@"$WRANGLER_VERSION" versions upload \
            --preview-alias "$PREVIEW_ALIAS" 2>&1)
          STATUS=$?
          set -e
          echo "$UPLOAD_OUTPUT"
          PREVIEW_URL=$(echo "$UPLOAD_OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev[^ ]*' | head -1)
          if [ "$STATUS" -eq 0 ] && [ -n "$PREVIEW_URL" ]; then
            echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Preview upload unavailable (worker not yet created, or workers.dev subdomain disabled). Status=$STATUS"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert sticky PR preview comment
        # github-token passed explicitly — implicit detection has failed with
        # 401 Bad credentials on SHA-pinned action runs in this repo (see the
        # same note in docs-pr-preview.yml).
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_OK: ${{ steps.preview.outputs.ok }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Distinct from docs-pr-preview.yml's `cf-workers-preview-pr`
            // marker — a shared marker would make the two workflows
            // overwrite each other's comment on a PR touching both.
            const marker = '<!-- cf-workers-preview-create-zfb -->';
            const previewUrl = process.env.PREVIEW_URL;
            const ok = process.env.PREVIEW_OK === 'true';
            const prNumber = Number(process.env.PR_NUMBER);
            const shortSha = process.env.COMMIT_SHA.slice(0, 7);
            const intro =
              'This is the built output of `npm create zfb@latest my-site`, generated from this PR by the same clean-room run that backs the `Scaffold E2E` check.';
            const body = ok
              ? `${marker}\n### create-zfb showcase preview\n\n${intro}\n\n- Preview URL: ${previewUrl}\n- Commit: \`${shortSha}\`\n`
              : `${marker}\n### create-zfb showcase preview\n\n${intro}\n\n⏳ Preview not available yet — it activates once the \`zfb-showcase\` worker exists (after the first production deploy on \`main\`) and the workers.dev subdomain is enabled.\n- Commit: \`${shortSha}\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ── Built-site browser smoke: real `zfb build` output in real Chromium ─────
  #
  # Issue #1401. Every other tier is structurally blind to the #1385 bug
  # class (an emitted client bundle that throws at hydration):
  #   - router-chromium.yml drives zfb-runtime fixtures, not `zfb build`
  #     output;
  #   - the Rust dev-server e2es are HTTP/process-level, never a real
  #     browser;
  #   - smoke-amd64/arm64/scaffold-e2e above assert dist/ file CONTENT
  #     (grep / string checks), never execute the emitted JS.
  #
  # This job builds a small fixture site with one working interactive
  # island (tests/built-site-smoke/fixture-site/, a Preact counter) using
  # THIS leg's freshly built binary — no separate compile, no pnpm
  # workspace deps needed for the build itself (the binary embeds
  # @takazudo/zfb / @takazudo/zfb-runtime / preact and extracts them on
  # demand, same as the Rust end_to_end_basic_blog_build test) — then
  # serves the resulting dist/ statically and drives it with Playwright,
  # mirroring router-chromium.yml's Chromium setup.
  #
  # Scope (see issue #1401): no `import.meta.glob` island yet — the #1387
  # stopgap makes that a build-time error; a later wave upgrades this
  # fixture once the full fix lands.
  #
  # NOT a required status check — deliberately excluded from the
  # `main-required-status-checks` ruleset (see CLAUDE.md's list of required
  # checks). A Playwright/Chromium-specific flake here must never block an
  # unrelated PR.
  built-site-browser-smoke:
    name: Built-site browser smoke (L4)
    needs: build-binary
    runs-on: ubuntu-latest
    # Budgeted the same as router-chromium.yml: the suite itself is a single
    # short assertion; the timeout mostly covers the pnpm install + Chromium
    # download. Whole job targets a few minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      # Only @playwright/test (a root devDependency) is needed to run the
      # suite — the fixture site itself is built by the standalone zfb
      # binary below and needs no pnpm-installed deps of its own.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chromium only — no WebKit/Firefox. `--with-deps` pulls the system
      # libraries the browser needs on a bare ubuntu runner.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download built binary (amd64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-binary-amd64
          path: smoke-ctx

      # actions/upload-artifact does not reliably round-trip the execute
      # bit, so chmod defensively — same pattern as smoke-amd64/arm64's
      # `chmod +x smoke-ctx/run.sh` above.
      - name: Fix permissions on downloaded binary
        run: chmod 0755 smoke-ctx/zfb-bin

      # Real `zfb build` against the fixture site — no node_modules, no
      # package.json needed (see crates/zfb/tests/end_to_end_basic_blog_build.rs
      # for the same no-pnpm-install build path).
      - name: Build fixture site
        working-directory: tests/built-site-smoke/fixture-site
        run: ${{ github.workspace }}/smoke-ctx/zfb-bin build

      # Fast, explicit build-output sanity check before paying for a browser:
      # if the islands bundle is missing entirely, fail here with a clear
      # message rather than a confusing Playwright click-timeout later.
      - name: Assert islands bundle was emitted
        working-directory: tests/built-site-smoke/fixture-site
        shell: bash
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }
          shopt -s nullglob
          bundles=(dist/assets/islands-*.js)
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "::error::no dist/assets/islands-*.js bundle emitted"
            exit 1
          fi
          echo "Found islands bundle: ${bundles[*]}"

      - name: Run built-site-smoke Playwright suite
        run: pnpm exec playwright test --config tests/built-site-smoke/playwright.config.mjs

      # Traces live in test-results/ (NOT playwright-report/), matching
      # router-chromium.yml. Uploaded only on failure.
      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: built-site-smoke-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ── arm64 smoke: runs on ubuntu-24.04-arm (native arm64 runner) ────────────
  smoke-arm64:
    name: Smoke arm64 (local mode)
    needs: build-binary
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - name: Download smoke context (arm64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smoke-binary-arm64
          path: smoke-ctx

      - name: Fix permissions on run.sh
        run: chmod +x smoke-ctx/run.sh

      - name: Build smoke image
        run: |
          docker build \
            --build-arg ZFB_SMOKE_MODE=local \
            -t zfb-smoke:arm64 \
            smoke-ctx/

      - name: Run smoke container
        run: docker run --rm zfb-smoke:arm64

  # ── amd64 TS-config smoke: runs on ubuntu-latest ───────────────────────────
  smoke-amd64-ts:
    name: Smoke amd64 TS-config (local mode)
