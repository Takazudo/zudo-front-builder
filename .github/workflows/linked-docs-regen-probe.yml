name: Temporary linked epic docs asset regeneration

on:
  pull_request:
    branches: [base/sweep-261007-2-linked-package-tick-suppression]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: wind-preview-no-v8
      - run: pnpm install --frozen-lockfile
      - run: cargo build -p zfb --no-default-features
      - run: node --test docs/scripts/__tests__/wind-preview-assets.test.mjs
      - name: Generate genuine compiled preview assets
        run: |
          node docs/scripts/wind-preview-assets.mjs --compiler "$PWD/target/debug/zfb"
          git status --short docs/public/wind-examples
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        if: always()
        with:
          name: linked-epic-wind-assets
          path: docs/public/wind-examples/
          if-no-files-found: error
          retention-days: 2
