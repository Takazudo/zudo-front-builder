            echo "unable to determine available disk space before cargo build" >&2
            exit 1
          fi
          free_bytes=$((free_kib * 1024))
          free_gib="$(awk -v bytes="$free_bytes" 'BEGIN { printf "%.1f", bytes / 1073741824 }')"
          {
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'runner=%s %s\n' "$(uname -s)" "$(uname -m)"
            printf 'os_release=%s\n' "$(tr '\n' ';' < /etc/os-release)"
            printf 'rustc=%s\n' "$(rustc --version --verbose | tr '\n' ';')"
            printf 'cargo=%s\n' "$(cargo --version)"
            printf 'node=%s\n' "$(node --version)"
            printf 'zlib=%s\n' "$(node -p 'process.versions.zlib')"
            printf 'pnpm=%s\n' "$(pnpm --version)"
            printf 'disk_free_before_cargo_build_bytes=%s\n' "$free_bytes"
            printf 'disk_free_before_cargo_build_gib=%s\n' "$free_gib"
            printf 'cargo_incremental=%s\n' "$CARGO_INCREMENTAL"
          } | tee "$out/runner-provenance.txt"

          minimum_bytes=$((8 * 1024 * 1024 * 1024))
          debug_reduction_bytes=$((20 * 1024 * 1024 * 1024))
          if (( free_bytes < minimum_bytes )); then
            echo "less than 8 GiB is free; refusing to start the native compile" >&2
            exit 1
          fi
          if (( free_bytes < debug_reduction_bytes )); then
            echo 'CARGO_PROFILE_DEV_DEBUG=0' >> "$GITHUB_ENV"
            printf 'cargo_profile_dev_debug=0 (reduced: pre-build free disk below 20 GiB)\n' | tee -a "$out/runner-provenance.txt"
          else
            printf 'cargo_profile_dev_debug=default\n' | tee -a "$out/runner-provenance.txt"
          fi

      # This CI recipe uses checkout-relative paths and runs directly on native
      # Linux, so it does not use the local procedure's host paths or heavy guard.
      # Rust 1.99.0 is pinned explicitly here because rust-toolchain.toml tracks stable.
      - name: Build the native zfb binary from this source SHA
        run: cargo build --locked -p zfb

      - name: Build and pack SDK and runtime
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/island-size"
          version="$(node -p "require('./packages/zfb/package.json').version")"
          mkdir -p "$out/pack" "$out/packed-package" "$out/packed-runtime" "$out/packed-slugify"
          pnpm -C packages/zfb-slugify build
          pnpm -C packages/zfb build
          pnpm -C packages/zfb-runtime build
          pnpm -C packages/zfb-slugify pack --pack-destination "$out/pack"
          pnpm -C packages/zfb pack --pack-destination "$out/pack"
          pnpm -C packages/zfb-runtime pack --pack-destination "$out/pack"
          tar -xzf "$out/pack/takazudo-zfb-slugify-$version.tgz" -C "$out/packed-slugify"
          tar -xzf "$out/pack/takazudo-zfb-$version.tgz" -C "$out/packed-package"
          tar -xzf "$out/pack/takazudo-zfb-runtime-$version.tgz" -C "$out/packed-runtime"

      - name: Record built binary and package provenance
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/island-size"
          version="$(node -p "require('./packages/zfb/package.json').version")"
          esbuild=crates/zfb/binaries/esbuild/esbuild
          zfb=target/debug/zfb
          test -x "$esbuild"
          test -x "$zfb"
          test "$("$esbuild" --version)" = "0.25.12"
          {
            printf 'zfb_binary='; sha256sum "$zfb"
            printf 'esbuild_version=%s\n' "$("$esbuild" --version)"
            printf 'esbuild_binary='; sha256sum "$esbuild"
            printf 'hono_version=%s\n' "$(node -p "require('./packages/zfb-runtime/node_modules/hono/package.json').version")"
            printf 'hono_package_json='; sha256sum packages/zfb-runtime/node_modules/hono/package.json
            printf 'slugify_tarball='; sha256sum "$out/pack/takazudo-zfb-slugify-$version.tgz"
            printf 'zfb_tarball='; sha256sum "$out/pack/takazudo-zfb-$version.tgz"
            printf 'runtime_tarball='; sha256sum "$out/pack/takazudo-zfb-runtime-$version.tgz"
          } | tee -a "$out/runner-provenance.txt"

      - name: Measure complete workspace and packed matrices
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/target/island-size"
          version="$(node -p "require('./packages/zfb/package.json').version")"
          source_sha="$(git rev-parse HEAD)"
          zfb=target/debug/zfb
          esbuild=crates/zfb/binaries/esbuild/esbuild
          hono=packages/zfb-runtime/node_modules/hono
          # Both calls use the full eight-fixture matrix and two saved passes;
