          node research/v3-island-size/measure-real.mjs \
            --mode workspace \
            --package packages/zfb \
            --runtime-package packages/zfb-runtime \
            --slugify-package packages/zfb-slugify \
            --hono-package "$hono" \
            --zfb-tarball "$out/pack/takazudo-zfb-$version.tgz" \
            --runtime-tarball "$out/pack/takazudo-zfb-runtime-$version.tgz" \
            --zfb "$zfb" \
            --esbuild "$esbuild" \
            --source-sha "$source_sha" \
            --out "$out/real-workspace"
          node research/v3-island-size/measure-real.mjs \
            --mode packed \
            --package "$out/packed-package/package" \
            --runtime-package "$out/packed-runtime/package" \
            --slugify-package "$out/packed-slugify/package" \
            --hono-package "$hono" \
            --zfb-tarball "$out/pack/takazudo-zfb-$version.tgz" \
            --runtime-tarball "$out/pack/takazudo-zfb-runtime-$version.tgz" \
            --zfb "$zfb" \
            --esbuild "$esbuild" \
            --source-sha "$source_sha" \
            --out "$out/real-packed"

      - name: Generate identity-normalized sidecars
        id: normalize
        if: always()
        continue-on-error: ${{ steps.context.outputs.enforce != 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          out="$GITHUB_WORKSPACE/target/island-size"
          mkdir -p "$out"
          : > "$out/normalize-identity.log"
          failed=0
          for mode in workspace packed; do
            printf '== real-%s ==\n' "$mode" | tee -a "$out/normalize-identity.log"
