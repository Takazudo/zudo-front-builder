      - name: Upload complete Linux x64 island-size evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: island-size-linux-x64-${{ steps.context.outputs.source_sha }}
          path: target/island-size/
          if-no-files-found: error
          retention-days: 30

  # Independent evidence lane: measure-darwin and measure-linux still run per `platform`,
  # whether or not the CSS carriers are verified.
  css-carriers:
    if: ${{ inputs.css_carriers }}
    permissions:
      contents: read
    uses: ./.github/workflows/css-carrier-verification.yml
    with:
      source_sha: ${{ inputs.ref }}
      windows_only: ${{ inputs.css_windows_only }}
