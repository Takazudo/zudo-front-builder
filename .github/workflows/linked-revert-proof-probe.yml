name: Temporary linked intake revert proof

on:
  pull_request:
    branches: [base/sweep-261007-2-linked-package-tick-suppression]

permissions:
  contents: read

jobs:
  revert-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
      - uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: nextest@0.9.138
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: v2-zfb
          shared-key: workspace-all-targets
      - run: pnpm install --frozen-lockfile
      - name: Exact ignored-write regression with intake branch removed
        run: |
          set -o pipefail
          cargo nextest run -p zfb --test dev_sibling_watch_1678_e2e --run-ignored all -E 'test(=e2e_3926_ignored_undeclared_sibling_writes_do_not_tick)' 2>&1 | tee revert-proof.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        if: always()
        with:
          name: linked-intake-revert-proof
          path: revert-proof.log
          if-no-files-found: warn
          retention-days: 2
