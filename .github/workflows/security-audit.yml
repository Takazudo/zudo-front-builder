# --audit-level=high — moderate/low findings are tracked in SECURITY-DEPS.md but not gated
# Scope: pnpm audit --prod audits every workspace package's production dependencies,
# including the private docs/ workspace. The docs site is publicly deployed via
# Cloudflare Pages, so a compromised dep in docs/ is a real supply-chain risk for
# site visitors — not just a private-workspace internal concern.

# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Security Audit

# Weekly schedule — only one run at a time needed; cancel the stale one if
# a manual workflow_dispatch overlaps with a scheduled run.
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Monday 07:17 UTC — low-traffic window
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production deps)
        run: |
          for attempt in 1 2; do
            if pnpm audit --prod --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "audit failed, retrying in 30s..."
              sleep 30
            fi
          done
          exit 1
