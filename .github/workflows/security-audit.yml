# --audit-level=high — moderate/low findings are tracked in SECURITY-DEPS.md but not gated
# Scope: pnpm audit --prod audits every workspace package's production dependencies,
# including the private docs/ workspace. The docs site is publicly deployed via
# Cloudflare Pages, so a compromised dep in docs/ is a real supply-chain risk for
# site visitors — not just a private-workspace internal concern.

# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Security Audit

# Weekly schedule — only one run at a time needed; cancel the stale one if
# a manual workflow_dispatch overlaps with a scheduled run.
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Monday 07:17 UTC — low-traffic window
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production deps)
        run: |
          for attempt in 1 2; do
            if pnpm audit --prod --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "audit failed, retrying in 30s..."
              sleep 30
            fi
          done
          exit 1

  cargo-deny:
    name: cargo deny (Rust supply chain)
    runs-on: ubuntu-latest
    # cargo metadata + the advisory-db clone are the only cost here — no
    # compilation happens, so this stays well under budget even cold.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      - name: Install cargo-deny
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: cargo-deny

      # advisories is the only MANDATORY (deny-on-finding) section in
      # deny.toml; licenses/bans/sources are configured warn-only for now
      # (see deny.toml's header comment), so running the full `check` here
      # surfaces them without failing the job on non-advisory findings.
      - name: cargo deny check
        run: cargo deny check

  file-or-close-issue:
    # Paper-trail guard (issue #1394): this was the only scheduled T3 lane
    # (exam.yml, drift-net.yml, this workflow) with no file/close tracking
    # issue — a red weekly audit sat silently in the Actions tab. Single
    # deduped tracking issue per workflow, drop-in from drift-net.yml's
    # `file-or-close-issue` job (issue #1342). Unlike exam.yml's jobs, `audit`
    # and `cargo-deny` fail NORMALLY (no synthetic rc-capture-then-exit-0
    # trick), so this reads `needs.*.result` directly instead of a job output.
    name: File/close security-audit tracking issue
    needs: [audit, cargo-deny]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: File or comment on tracking issue (failure)
        if: ${{ needs.audit.result == 'failure' || needs.cargo-deny.result == 'failure' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LEG: >-
            ${{
              (needs.audit.result == 'failure' && needs.cargo-deny.result == 'failure') && 'pnpm audit (prod) AND cargo deny (both failed)' ||
              (needs.audit.result == 'failure' && 'pnpm audit (prod)') ||
              'cargo deny (Rust supply chain)'
            }}
        run: bash scripts/file-exam-issue.sh "Security Audit"

      - name: Close tracking issue (green)
        if: ${{ needs.audit.result == 'success' && needs.cargo-deny.result == 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-exam-issue.sh "Security Audit" --green

  notify:
    # Alerting guard: a red audit leg otherwise sits unseen between someone
    # actually checking the Actions tab — nobody watches a scheduled run the
    # way a release is watched live. Same IFTTT pattern as release.yml's /
    # drift-net.yml's / exam.yml's `notify` job (issue #1335), keyed on
    # needs.*.result for the same reason as the file-or-close job above.
    name: Notify via IFTTT on failure
    needs: [audit, cargo-deny]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IFTTT_PROD_NOTIFY: ${{ secrets.IFTTT_PROD_NOTIFY }}
    steps:
      - name: Notify via IFTTT on failure
        if: env.IFTTT_PROD_NOTIFY != ''
        env:
          AUDIT_RESULT: ${{ needs.audit.result }}
          CARGO_DENY_RESULT: ${{ needs.cargo-deny.result }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          FAILED_JOB=""
          if [ "$AUDIT_RESULT" = "failure" ]; then
            FAILED_JOB="pnpm audit (prod)"
          fi
          if [ "$CARGO_DENY_RESULT" = "failure" ]; then
            if [ -n "$FAILED_JOB" ]; then
              FAILED_JOB="${FAILED_JOB}, cargo deny"
            else
              FAILED_JOB="cargo deny"
            fi
          fi

          if [ -z "$FAILED_JOB" ]; then
            echo "No failed job among audit/cargo-deny — skipping notification."
            exit 0
          fi

          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          curl -sSf --max-time 10 -X POST "$IFTTT_PROD_NOTIFY" \
            -H 'Content-Type: application/json' \
            -d "{
              \"value1\": \"Security audit failed (${FAILED_JOB})\",
              \"value2\": \"weekly pnpm audit + cargo deny\",
              \"value3\": \"${RUN_URL}\"
            }" || echo "::warning::IFTTT notification failed"
