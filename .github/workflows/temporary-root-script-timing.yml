name: Temporary root script timing evidence

on:
  pull_request:
    paths:
      - scripts/root-script-timing.mjs
      - scripts/__tests__/root-script-timing.test.mjs
      - .github/workflows/temporary-root-script-timing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  timing:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Record isolated runner environment
        run: |
          uname -a
          node --version
          pnpm --version
      - name: Measure five idle runs
        run: node scripts/root-script-timing.mjs --profile idle --runs 5 --output-dir "$RUNNER_TEMP/epic-diagnostics/root-script-timing"
      - name: Measure five bounded CPU-loaded runs
        if: always()
        run: node scripts/root-script-timing.mjs --profile cpu --runs 5 --output-dir "$RUNNER_TEMP/epic-diagnostics/root-script-timing"
      - name: Save complete timing evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: root-script-timing-${{ matrix.os }}
          path: ${{ runner.temp }}/epic-diagnostics/
          if-no-files-found: error
          retention-days: 7
