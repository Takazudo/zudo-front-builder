# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "base/**"]

# Default to least privilege; jobs that need more must opt in.
permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    # Job-level permissions override (issue #1341): the "Detect and report
    # flaky tests" step near the end of this job calls `gh issue create`/
    # `gh issue comment`, which needs issues:write. Scoped to THIS job only —
    # the workflow-level `permissions:` above stays contents:read, and
    # build-no-v8 below is unaffected. A job-level `permissions:` block
    # REPLACES (not merges with) the workflow default, so contents:read must
    # be restated here or this job would lose read access to check out the
    # repo.
    permissions:
      contents: read
      issues: write
    # V8 first compile costs 15-30 min; subsequent runs hit the Swatinem cache
    # and typically complete well within this budget. Headroom bumped 45 -> 60
    # when this job started *running* the test suite (issue #638), not just
    # compiling it — test execution had never been timed in CI before.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Offline shell unit tests (issue #791). tests/unit/install-prerelease.sh
      # pins install.sh's prerelease tag resolution (jq path + awk fallback +
      # brace-injection fail-loud, added by #788) but was never executed by any
      # workflow. Runs in <1s and needs only sh/awk/grep/sed, so it sits here as
      # a fail-fast gate before any toolchain setup. The glob auto-wires future
      # tests/unit/*.sh files — #791's root cause was a test that existed but
      # was never wired. bash -n is a pure parse check (bash parses the POSIX-sh
      # scripts fine) catching syntax errors in the otherwise untested scripts.
      - name: Shell script syntax check + offline shell unit tests
        run: |
          for f in install.sh scripts/*.sh tests/unit/*.sh; do
            bash -n "$f"
          done
          for t in tests/unit/*.sh; do
            echo "+ sh $t"
            sh "$t"
          done

      # Free runner disk BEFORE the rust-cache restore + V8 first-compile (issue
      # #687). rusty_v8 / deno_core produces a multi-GB target/; combined with the
      # restored Swatinem cache it can exhaust the ~14 GB ubuntu-latest disk
      # ("No space left on device", seen on 8a46936 during the #686 merge — infra
      # flake, not a code regression). Reclaim ~15-20 GB by removing preinstalled
      # toolchains this job never uses (Android SDK, .NET, Haskell, CodeQL) plus
      # the Docker image cache. Done with plain `sudo rm -rf` rather than a
      # third-party action to preserve this workflow's SHA-pinned-`uses` /
      # least-privilege posture (see the pin-update header). Scoped to `health`
      # only — the build-no-v8 job has no V8 to compile and stays light. Pure
      # infra hardening: no build/test/lint behavior changes.
      - name: Free disk space for V8 build (issue #687)
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h /

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          components: clippy, rustfmt

      # cargo-nextest (issue #1340) — the CI Rust test runner. Pinned via
      # taiki-e/install-action to match the cargo-deny install in
      # security-audit.yml: a SHA-pinned action that fetches a checksum-verified
      # prebuilt binary (no compile cost). nextest gives the CI retry budget
      # (retries = 1), per-test timeouts, and JUnit output; the profile,
      # e2e test-group serialization, and timeouts live in .config/nextest.toml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: nextest

      # Fmt gate (issue #988): near-free fail-fast check before the expensive
      # rust-cache restore + V8 build. Note: cargo fmt --check on the stable
      # toolchain can change behaviour on a future toolchain bump — accepted
      # cost; same posture as `clippy -D warnings` (a future stable rustfmt
      # can change defaults and turn CI red with zero code changes).
      - run: cargo fmt --all --check

      # Cache compiled Rust artifacts across runs. The cache key encodes the
      # OS, Rust toolchain, and a hash of every Cargo.toml/Cargo.lock in the
      # workspace so the cache is invalidated cleanly when any member's
      # dependency set changes (including when deno_core / V8 is added by
      # Sub 2).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Prefix so future workspace-member additions don't share a stale
          # cache. Bumped v1 → v2 in PR #250 after the cached target/ snapshot
          # started failing to link `v8` (rusty_v8 native static lib not found
          # in OUT_DIR after partial rebuild). The first build on this key
          # will take 15-30 min for V8 first-compile; subsequent runs hit the
          # restored cache and are fast.
          prefix-key: "v2-zfb"
          # shared-key (issue #1394): without it, Swatinem/rust-cache appends
          # github.job to the key, so this job's cache and exam.yml's
          # quarantine-heavy job's cache never actually shared despite both
          # using `prefix-key: "v2-zfb"` — they run the identical `cargo build
          # --workspace --all-targets` on the same toolchain/lockfiles, so the
          # target/ tree is genuinely interchangeable. Must stay identical to
          # the `shared-key` on exam.yml's quarantine-heavy rust-cache step.
          shared-key: "workspace-all-targets"

      - run: pnpm install --frozen-lockfile

      # TypeScript typecheck gate (issue #1332): b4push has run this since its
      # inception, but CI never did — `pnpm -r test` below only runs vitest,
      # which transpiles (via esbuild/swc) without type-checking, so a type
      # error could merge green. `--if-present` mirrors b4push's invocation:
      # packages without a `typecheck` script are skipped rather than failing.
      # @takazudo/zfb-md-wasm is excluded: its src/index.ts type-imports the
      # wasm-bindgen-generated ./wasm/zfb_md_wasm.js glue, which does not
      # exist until the crate has been compiled for wasm32-unknown-unknown —
      # this job never installs that target. The wasm-md job below builds
      # the package (which runs `tsc` as its own final step, catching the
      # same type errors) so coverage isn't lost, just relocated.
      - run: pnpm -r --filter '!./examples/*' --filter '!@takazudo/zfb-md-wasm' --if-present typecheck

      # Run the JS/TS test suites across all packages (@takazudo/zfb and
      # @takazudo/zfb-runtime). Includes the slugify parity tests that
      # consume the shared fixture in crates/zfb-content/tests/fixtures/
      # (issue #973), so any drift between the TS port and the Rust
      # slugifier fails here as well as in cargo test.
      # @takazudo/zfb-md-wasm is excluded for the same reason as the
      # typecheck step above — its tests import the built `dist/index.js`,
      # which needs the wasm32 toolchain this job doesn't have. Covered by
      # the wasm-md job below instead.
      - run: pnpm -r --filter '!@takazudo/zfb-md-wasm' test

      - run: pnpm format:check

      # Compiles every target (incl. benches/examples) AND triggers crates/zfb's
      # build.rs to download + SHA-verify + stage the pinned esbuild 0.25.12 into
      # crates/zfb/binaries/esbuild/esbuild — the slot that
      # zfb_test_utils::locate_esbuild() resolves for the esbuild-gated
      # integration tests run below.
      - run: cargo build --workspace --all-targets

      # Freshness gate (issue #1871): the custom SyntaxSet dump is a tracked
      # generated artifact. Regenerate it from the checked-in grammar sources
      # and fail on any source-versus-generated drift. The generator changes to
      # its crate-root CWD and uses normalized relative paths, keeping the dump
      # bytes independent of the checkout location that ran this step.
      - name: Verify syntect syntax-set.packdump is fresh
        run: |
          cargo run -p zfb-content --bin generate_syntax_dump --features generate-syntax-dump
          git diff --exit-code -- crates/zfb-content/assets/syntax-set.packdump

      # Lint gate (issue #646): runs after the warmed incremental compile so
      # no extra compile cost. Placed before cargo test so a lint failure
      # short-circuits the expensive test run. Note: -D warnings on the stable
      # toolchain can surface new lints on a future toolchain bump — accepted
      # cost; a future maintainer seeing a red gate with no code change should
      # check if a toolchain pin bump introduced new lints.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Guard (issue #638): the esbuild-gated integration tests skip via an early
      # `return` (recorded by cargo as a PASS) when no esbuild binary is found, so
      # a green `cargo test` alone cannot prove they actually executed. Fail loudly
      # here if build.rs did not stage the binary, making "green but silently
      # skipped" impossible. (The binary's version + SHA-256 are already verified
      # upstream by crates/zfb/build.rs before staging; the `--version` run here is
      # just a smoke test that the staged binary actually executes on this runner's
      # architecture — a corrupt or wrong-arch binary fails the step.)
      #
      # Extended (issue #1393) to also assert the tailwindcss-v4 slot, which
      # crates/zfb/build.rs stages as the same side effect of the
      # `cargo build --workspace --all-targets` step above — it was already
      # staged here, just never asserted or exercised by any T1 step. Mirrors
      # exam.yml's combined esbuild+tailwindcss assert step.
      - name: Assert esbuild + tailwindcss binaries were provisioned for the test suite
        run: |
          ESBUILD_SLOT="crates/zfb/binaries/esbuild/esbuild"
          TAILWIND_SLOT="crates/zfb/binaries/tailwindcss-v4"
          for slot in "$ESBUILD_SLOT" "$TAILWIND_SLOT"; do
            if [ ! -x "$slot" ]; then
              echo "::error::$slot not staged — the env-gated tests would silently skip (issue #638). Failing the job instead."
              exit 1
            fi
          done
          "$ESBUILD_SLOT" --version
          "$TAILWIND_SLOT" --version

      # Run the zfb-islands esbuild-gated suite (issue #1337): the package's 20
      # `#[ignore]`d tests (tagged `env-gate:` per CLAUDE.md's taxonomy) were
      # staged by the assert step above but never actually executed by any CI
      # step — `cargo test --workspace` below does not pass `--ignored`, so a
      # green run proved nothing about them. `ZFB_ESBUILD_BIN` must be an
      # ABSOLUTE path: `EsbuildSubprocessConfig`'s default binary_path is the
      # literal relative string `crates/zfb/binaries/esbuild/esbuild`, but
      # `cargo test` runs each test binary with its CWD set to the package
      # directory (`crates/zfb-islands`), not the workspace root, so the
      # relative default never resolves.
      # --tests scopes this to integration-test binaries only (where the 20
      # target tests live, in tests/integration.rs) — the unscoped `-p
      # zfb-islands` form also compiles+runs the crate's doctests, and 3 of
      # those are pre-existing broken/illustrative examples never meant to
      # run (issue found while wiring this step; see #1337 follow-up).
      - name: Run zfb-islands esbuild-gated integration suite
        env:
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        run: cargo test -p zfb-islands --tests -- --ignored

      # Wave-4 client-bundling acceptance gate (#1504): unlike the focused
      # zfb-islands tests above, this drives the real zfb binary through both
      # production build and dev --port 0 over one cross-pipeline fixture.
      # Keep it in its own attributable step because it boots V8, exercises
      # SSR, and verifies both islands and *.client.ts worker namespaces.
      - name: Run zfb client-bundling cross-pipeline acceptance test
        env:
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        run: cargo test -p zfb --test client_bundling_cross_pipeline -- --ignored

      # Real-esbuild stage-escape-audit confirmation for the first-party
      # dot-path staging allowlist (issue #1841, epic #1836): the
      # `bundler_dot_path_staging.rs` mock suite (#1840) drives every fixture
      # through `mock_subprocess_output`, so the stage-escape audit
      # (`workspace_rel.is_some()`, #1706) never actually runs there —
      # `metafile_path` stays `None` on the mock path. This step proves real
      # esbuild resolves both allowlisted dot-path spellings (`.zudo-doc/
      # routes-src/**`, `.zfb/*.json`) out of the shadow and that the audit
      # passes them.
      - name: Run zfb-build dot-path staging esbuild regression test
        env:
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        run: cargo test -p zfb-build --test bundler_dot_path_staging_esbuild_regression -- --ignored

      # Workspace-root alias regression (issue #1885, epic #1883): this is a
      # separate real-esbuild binary because its positive fixture proves the
      # #1884 staging claim composes with root-package TS/TSX/CSS/JSON, a
      # claimed sibling package, and #1840's dot-path allowlist. Issue #1905
      # extends that same env-gate with its 17-residual-input combined
      # topology (six generated routes, nine package exports, two JSON
      # leaves), while the separate negatives retain parent-relative rejection
      # and guard (b)'s fail-closed metafile audit. The provisioning assertion above is
      # deliberately shared, but this named target is not: `--ignored` is the
      # only way these env-gated tests execute, so an explicit step prevents a
      # future edit from silently dropping the binary from CI.
      - name: Run zfb-build workspace-root alias esbuild regression test
        env:
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        run: cargo test -p zfb-build --test bundler_workspace_root_alias_esbuild_regression -- --ignored

      # Consume-from-source workspace idiom (issues #2039/#2040, epic #1982):
      # a first-party sibling package whose `exports` point straight at
      # `./src/*` with no `dist` is imported by bare package name through the
      # workspace symlink, landing on the metafile audit's case-2 shape. These
      # three env-gated tests are the acceptance rule's positive pair plus the
      # dist-shipping negative that stops it becoming a blanket "workspace
      # siblings are always fine" exemption — an unwired binary would let that
      # rule regress in either direction unnoticed. Same ABSOLUTE-path
      # requirement for ZFB_ESBUILD_BIN as the steps above.
      # `--skip` excludes ONE test from this blanket `--ignored` run:
      # `nested_member_consume_from_source_sibling_accepted_via_canonicalized_key_under_copy_mode`
      # (issue #2082, epic #2078) is deliberately `#[ignore = "pending-feature:
      # …"]`, not `env-gate:` — it is a genuine RED test (the canonical-key
      # exemption Sub #2086 will add does not exist yet) sharing this
      # already-CI-wired binary with three green env-gate tests. Without this
      # skip, `--ignored` would sweep it up and turn this step red until
      # #2086 lands. Sub #2086 must DROP this `--skip` in the same commit it
      # replaces that test's `pending-feature:` tag with `env-gate:` (the
      # epic's corrected flip protocol) — leaving it here after the flip
      # would silently stop the flipped test from ever running in CI again.
      - name: Run zfb-build consume-from-source esbuild regression test
        env:
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        run: cargo test -p zfb-build --test bundler_consume_from_source_esbuild_regression -- --ignored --skip nested_member_consume_from_source_sibling_accepted_via_canonicalized_key_under_copy_mode

      # Root-claimed-workspace stage-escape audit, SSR leg (issues
      # #1984/#1988, epic #1982): when `project_root` is itself claimed by
      # `pnpm-workspace.yaml`, guard (b) used to be skipped and SSR has no
      # scan-time guard (a) at all — a completely silent stage escape. This
      # env-gated test is the only proof the audit is ARMED there, so it needs
      # its own step for the same reason as the two above: `--ignored` is the
      # only way it ever executes.
      - name: Run zfb-build root-workspace stage-escape audit armed regression test
        env:
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        run: cargo test -p zfb-build --test bundler_root_workspace_stage_escape_audit_armed_regression -- --ignored

      # Run the tailwindcss-v4 env-gate tests (issue #1393) plus both
      # command-layer preprocessing-shadow esbuild regressions: the binaries are
      # staged by the assert step above but, like the zfb-islands suite before
      # #1337 fixed it, was never actually executed by any T1 step —
      # `cargo nextest run --workspace` below does not pass `--ignored`, so a
      # green run proves nothing about these. Same ABSOLUTE-path requirement
      # as ZFB_ESBUILD_BIN above: `cargo test` runs each test binary with its
      # CWD set to the owning package directory, not the workspace root.
      # Three crate-scoped steps keep failures attributable; the zfb step runs
      # all three command-layer env-gates with both binary paths pinned,
      # mirroring the `#[ignore]` manifest table in CLAUDE.md.
      - name: Run zfb-css tailwindcss-v4 env-gate integration test
        env:
          ZFB_TAILWIND_BIN: ${{ github.workspace }}/crates/zfb/binaries/tailwindcss-v4
        run: cargo test -p zfb-css --test integration -- --ignored

      - name: Run zfb-build tailwindcss-v4 env-gate integration test
        env:
          ZFB_TAILWIND_BIN: ${{ github.workspace }}/crates/zfb/binaries/tailwindcss-v4
        run: cargo test -p zfb-build --test prod_asset_graph_e2e -- --ignored

      - name: Run zfb command-layer env-gate unit tests (commands::build)
        env:
          ZFB_TAILWIND_BIN: ${{ github.workspace }}/crates/zfb/binaries/tailwindcss-v4
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        # Quoted: a bare `commands::build:: -- --ignored` plain scalar trips
        # YAML's colon-space mapping-indicator rule (the trailing `:: ` reads
        # as a key/value separator to a strict parser).
        run: "cargo test -p zfb --lib commands::build:: -- --ignored"

      # Run the workspace test suite under cargo-nextest (issue #1340). CI
      # previously only *compiled* the test code (the cargo build --all-targets
      # step above) then ran it under plain `cargo test`; nextest adds a CI retry
      # budget (retries = 1, pass-on-retry RECORDED not hidden — #1341 consumes
      # it), per-test timeouts, and JUnit output. The `ci` profile
      # (.config/nextest.toml) also serializes all 16 heavy V8/esbuild e2e
      # binaries via a `max-threads = 1` test-group; 8 of those also adopt
      # #1339's cross-binary flock. Per-binary inventory was reconciled against
      # `cargo test --workspace -- --list`: identical apart from doctests, which
      # nextest does not run — hence the separate doc-test step below.
      #
      # Output is teed to a log file (issue #1341) so the "Upload nextest
      # diagnostics" step below can attach it on failure — the raw stdout
      # (per-test TRY/PASS/FAIL lines, panic messages) that the JUnit report
      # alone doesn't carry.
      - name: cargo nextest run --workspace --profile ci
        shell: bash
        run: |
          mkdir -p target/nextest-logs
          cargo nextest run --workspace --profile ci 2>&1 | tee target/nextest-logs/workspace.log

      # nextest writes JUnit to a fixed per-profile path
      # (target/nextest/ci/junit.xml). Stash the workspace report before the
      # zfb-md-extras nextest run (same profile) overwrites it, so BOTH feed the
      # uploaded artifact. `if: always()` + the existence guard capture the
      # report even when the run above failed (nextest still emits JUnit on
      # failure — that is the telemetry #1341 wants most).
      - name: Stash workspace JUnit before the md-extras nextest run overwrites it
        if: always()
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/nextest/ci/junit-workspace.xml
          fi

      # Doctests (issue #1340): nextest does NOT run doctests, so `cargo nextest
      # run` above cannot cover them. This separate step keeps that coverage.
      # Current baseline: 5 doctests execute + pass (zfb-css 2, zfb-islands 3),
      # plus 6 example blocks the harness lists but marks ignored/no_run
      # (zfb-islands 3, zfb-server 2, zfb-test-utils 1) — 11 total across 4
      # crates. Must not regress below this.
      - run: cargo test --workspace --doc

      # Run the zfb-md-extras integration suite gated behind the `test-utils`
      # feature (issue #1091). The `test-utils` feature is not in the default
      # feature set, so `cargo nextest run --workspace` above silently skips every
      # [[test]] target carrying `required-features = ["test-utils"]`. Using the
      # scoped `-p zfb-md-extras` form because `test-utils` exists only on this
      # crate — `--workspace --features test-utils` would error on other members
      # that have no such feature. Migrated to nextest (issue #1340): verified
      # `cargo nextest run -p zfb-md-extras --features test-utils` DOES pick up
      # the required-features-gated targets (all 10 gated integration binaries +
      # the lib unit tests run — 421 tests), so this lane gets the same retry/
      # timeout/JUnit treatment as the workspace run.
      #
      # Output is teed to a log file (issue #1341) for the same reason as the
      # workspace run above.
      - name: cargo nextest run -p zfb-md-extras --features test-utils --profile ci
        shell: bash
        run: |
          cargo nextest run -p zfb-md-extras --features test-utils --profile ci 2>&1 | tee target/nextest-logs/md-extras.log

      # Lint the test-utils-gated targets (they are excluded from the workspace
      # clippy step above for the same reason as cargo test).
      - run: cargo clippy -p zfb-md-extras --features test-utils --all-targets -- -D warnings

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12

      # Upload nextest JUnit reports (issue #1340) so retry/flaky telemetry
      # survives the run — the machine-readable feed issue #1341 consumes
      # below. `if: always()` uploads on EVERY run, not just failures (nextest
      # emits JUnit on failure too) — this is deliberately trend data, not
      # just failure diagnostics: a pass-on-retry only shows up in a run that
      # otherwise went green. junit-workspace.xml is the stashed
      # full-workspace run; junit.xml is the last writer (the zfb-md-extras
      # lane). `if-no-files-found: warn` tolerates an early failure (e.g. a
      # compile error) that produced no report. `retention-days: 7` — short
      # retention is fine since #1341's flaky-detection step below consumes
      # these reports within the same run; the 7 days exists for a human to
      # download and inspect a specific run's report after the fact.
      - name: Upload nextest JUnit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-ci
          path: |
            target/nextest/ci/junit-workspace.xml
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

      # Failure-only diagnostics (issue #1341): the raw nextest stdout (teed
      # by the two nextest run steps above) — per-test TRY/PASS/FAIL lines and
      # panic messages that the JUnit report's structured fields don't fully
      # carry. Only uploaded `if: failure()` — a healthy run has nothing
      # worth attaching beyond the JUnit trend data already uploaded above.
      - name: Upload nextest diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-diagnostics
          path: |
            target/nextest-logs/workspace.log
            target/nextest-logs/md-extras.log
          if-no-files-found: warn
          retention-days: 7

      # Flaky-test telemetry (issue #1341): consumes the JUnit reports above
      # to make CLAUDE.md's "pass-on-retry is a triage signal, not a
      # success — record it and schedule the fix" policy mechanically real.
      # `if: always()` so a flaky test is still reported even when a
      # DIFFERENT, genuine failure elsewhere makes this run red overall.
      # GH_TOKEN is required here: this job's `permissions:` above grants
      # issues:write, but `gh` still needs an explicit token when the
      # workflow's own default (`contents: read`, no write scopes) doesn't
      # cover it. `scripts/report-flaky-tests.sh` treats every `gh issue`
      # call as best-effort — a fork PR's read-only GITHUB_TOKEN degrades to
      # a `::warning::`, never a failed step.
      - name: Detect and report flaky tests
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report-flaky-tests.sh target/nextest/ci/junit-workspace.xml target/nextest/ci/junit.xml

      # The md-wasm browser confirmation consumes this exact V8-enabled
      # production binary. Keeping it an artifact avoids a second expensive
      # native/V8 compilation in the browser-only job below.
      - name: Upload native zfb binary for md-wasm browser smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zfb-debug-linux-x64
          path: target/debug/zfb
          if-no-files-found: error
          # Consumed within this run by the wasm-md-browser job; ~194MB per run
          # piles up fast (7GB live at 7 days — 2026-07 storage audit), so cap
          # at the 1-day floor like release.yml's transfer artifacts.
          retention-days: 1

  # V8-off feature matrix (issue #371, sub-task 4.1a).
  #
  # Without this job the cfg(feature = "embed_v8") gates can rot
  # silently — a missing gate on a new V8 reference would still pass
  # the V8-on health job above, leaving the V8-off path broken until
  # a downstream consumer notices.
  #
  # We build the `zfb` binary with --no-default-features here as the
  # primary V8-off acceptance check. zfb-render --no-default-features
  # is implied by the propagation chain (default-features = false on
  # every consumer), so building zfb alone proves both ends. A curated
  # `cargo test --no-default-features` leg (issue #1337, below) also
  # EXECUTES the no-v8 fallback code paths, not just compiles them.
  build-no-v8:
    name: build (no-v8)
    runs-on: ubuntu-latest
    # No V8 to compile, so this job is fast — but we keep a generous
    # budget while the cache primes on the first run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Separate cache key from the V8-on job — the target/ trees
          # are not interchangeable (different feature set, different
          # rmeta).
          prefix-key: "v2-zfb-no-v8"

      # crates/zfb/build.rs vendors framework npm packages (preact, react,
      # etc.) from node_modules/.pnpm at compile time. Without this, the
      # build script panics with "framework package preact@X.Y.Z not found".
      - run: pnpm install --frozen-lockfile

      - name: cargo build (zfb, --no-default-features)
        run: cargo build --release --no-default-features -p zfb

      - name: cargo check (zfb --no-default-features --tests)
        run: cargo check --no-default-features -p zfb --tests

      # V8-off EXECUTION leg (issue #1337): the two steps above only build/
      # check the no-v8 code paths, they never ran the test bodies, so a
      # `cfg(feature = "embed_v8")` gate could silently rot on the V8-off
      # side without any CI signal. `zfb-render`'s full suite (unit +
      # integration) passes cleanly with V8 off, so it runs unrestricted.
      # `zfb`'s integration tests under `crates/zfb/tests/` all shell out to
      # the `zfb build`/`zfb dev` subcommands, which correctly refuse to run
      # without the embedded V8 host (see the guard in
      # `crates/zfb/src/commands/build.rs`) — that refusal is CORRECT
      # no-v8 behaviour, but it means those integration tests are not
      # written to run in a V8-off environment. `zfb` is therefore scoped to
      # `--lib` here (unit tests only, including the render_pipeline/config
      # coverage that exercises the no-v8 fallback paths); the workspace's
      # full integration coverage for those subcommands still runs under V8
      # in the `health` job above.
      # `--features syntect-onig`: since zfb#1576 the syntect regex backend
      # is independently selectable on zfb-render (its zfb-content edge is
      # default-features = false so wasm consumers can pick syntect-fancy),
      # and syntect does not compile with NO backend. This step tests the
      # V8-off toggle, not the backend choice — pin the native default.
      - name: cargo test (zfb-render --no-default-features)
        run: cargo test --no-default-features -p zfb-render --features syntect-onig

      - name: cargo test (zfb --no-default-features --lib)
        run: cargo test --no-default-features -p zfb --lib

  # @takazudo/zfb-md-wasm CI (epic #1572, issue #1579): checks the crate on
  # its wasm32 target and builds + tests the npm package. Modeled on
  # build-no-v8 above (same shape: checkout, pnpm/node, rust toolchain,
  # scoped rust-cache, install, then a handful of check/build/test steps) —
  # but this crate needs the wasm32-unknown-unknown target, which is NOT in
  # rust-toolchain.toml's `targets` (decision baked in #1575: keep that file
  # native-only so every other job's toolchain setup stays untouched, and
  # install the wasm target only in the one job that needs it).
  #
  # NOT added to the `main` branch ruleset's required-status-checks (see
  # CLAUDE.md "Branch ruleset on main"): this job runs on every PR
  # unconditionally, same as build-no-v8, but promoting it to required is a
  # separate follow-up decision per repo policy — do not add it here.
  wasm-md:
    name: wasm-md
    runs-on: ubuntu-latest
    # Generous headroom over build-no-v8's 20 min: this job compiles the
    # zfb-md-wasm dependency subgraph under `cargo check`/`clippy`'s dev
    # profile in BOTH feature configs (default + `--no-default-features`,
    # zfb#1849), plus BOTH configs again under the size-optimized
    # `wasm-release` profile via `pnpm build`'s two-artifact pass, and
    # additionally compiles wasm-bindgen-cli from source on a cold cache.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          components: clippy

      # Job-local target install (see the job-level comment above for why
      # this isn't in rust-toolchain.toml).
      - name: rustup target add wasm32-unknown-unknown
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Own prefix: the wasm32 target dir isn't interchangeable with the
          # native-target caches the other two jobs above key on.
          prefix-key: "v2-zfb-wasm-md"

      - run: pnpm install --frozen-lockfile

      - name: cargo check (zfb-md-wasm, wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p zfb-md-wasm

      - name: cargo clippy (zfb-md-wasm, wasm32-unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown -p zfb-md-wasm -- -D warnings

      # The highlight-only build knob (zfb#1849, epic zfb#1845): `pipeline`
      # is the crate's default-on feature gating compile/renderHtml (see
      # Cargo.toml) -- npm/scripts/build.mjs's SECOND artifact pass builds
      # exactly this feature config, so it must stay check/clippy clean on
      # its own, same as the default config above.
      - name: cargo check (zfb-md-wasm, wasm32-unknown-unknown, --no-default-features)
        run: cargo check --target wasm32-unknown-unknown -p zfb-md-wasm --no-default-features

      - name: cargo clippy (zfb-md-wasm, wasm32-unknown-unknown, --no-default-features)
        run: cargo clippy --target wasm32-unknown-unknown -p zfb-md-wasm --no-default-features -- -D warnings

      # Defense in depth over the two cargo steps above: onig_sys (C) and
      # deno_core (rusty_v8) already fail to compile for wasm32 so a
      # regression pulling them in would break `cargo check` — but a wasm-safe
      # tokio feature subset (sync/macros/time) DOES compile for wasm32, so a
      # dependency edit that dragged tokio into the graph would pass the checks
      # above and silently bloat the artifact. This named-crate assertion is
      # the only thing that catches that.
      - name: Assert zfb-md-wasm graph is free of onig_sys / deno_core / tokio
        run: bash scripts/assert-zfb-md-wasm-graph.sh

      # wasm-bindgen requires an EXACT version match between this CLI and the
      # `wasm-bindgen` crate resolved in Cargo.lock (pinned in
      # crates/zfb-md-wasm/npm/scripts/build.mjs's
      # EXPECTED_WASM_BINDGEN_VERSION constant — bump both together). No
      # SHA-pinned prebuilt-binary action covers this exact version, so this
      # installs from source like the rest of the toolchain.
      - name: Install wasm-bindgen-cli (pinned to match Cargo.lock)
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      # wasm-opt (binaryen) comes from the package's own devDependency via
      # the `pnpm install` above — nothing extra to install for it here.
      - name: Build @takazudo/zfb-md-wasm npm package
        run: pnpm --filter @takazudo/zfb-md-wasm build

      # Whatever tests exist at merge time — do NOT assert the parity
      # suite's presence. #1578 (a same-wave sibling) adds a test file under
      # this package's test/ dir; once merged this step picks it up
      # automatically, no wiring change needed here.
      - name: Test @takazudo/zfb-md-wasm npm package
        run: pnpm --filter @takazudo/zfb-md-wasm test

      # Produce exactly the archive a consumer receives. The browser job must
      # install this artifact; it may not resolve the source package or copy
      # glue/wasm files out of the working tree.
      - name: Pack and assert @takazudo/zfb-md-wasm published artifact
        shell: bash
        run: |
          ARTIFACT_DIR="$GITHUB_WORKSPACE/wasm-md-artifact"
          mkdir -p "$ARTIFACT_DIR"
          TARBALL="$(cd crates/zfb-md-wasm/npm && pnpm pack --pack-destination "$ARTIFACT_DIR" | tail -1)"
          test -f "$TARBALL" || { echo "::error::packed tarball missing: $TARBALL"; exit 1; }
          mv "$TARBALL" "$ARTIFACT_DIR/zfb-md-wasm.tgz"
          node crates/zfb-md-wasm/npm/scripts/assert-packed.mjs "$ARTIFACT_DIR/zfb-md-wasm.tgz"

      # Informational only (no size budget enforced here). The package
      # README's "Artifact size" section and the docs page (#1580) point
      # back at this job's log as the authoritative, freshly-measured
      # number. Recomputed directly from the built .wasm file rather than
      # grepped out of the build step's stdout, so it stays correct even if
      # build.mjs's log format changes.
      - name: Report gzip'd .wasm size (informational)
        run: |
          report_size() {
            local label="$1" wasm_file="$2"
            if [ ! -f "$wasm_file" ]; then
              echo "::error::$wasm_file not found — the build step above did not produce it."
              exit 1
            fi
            local raw_bytes
            raw_bytes=$(stat -c%s "$wasm_file")
            # Node's zlib (level 9), not the system `gzip` CLI: the two encoders
            # are not byte-identical (different default strategy/window), and
            # this must match build.mjs's own gzipSync(..., { level: 9 })
            # figure exactly, since that is the number this line is meant to
            # corroborate.
            local gzip_bytes
            gzip_bytes=$(node -e "
              const { readFileSync } = require('node:fs');
              const { gzipSync } = require('node:zlib');
              process.stdout.write(String(gzipSync(readFileSync(process.argv[1]), { level: 9 }).length));
            " "$wasm_file")
            echo "zfb-md-wasm $label .wasm size: raw=${raw_bytes} bytes, gzip-9=${gzip_bytes} bytes"
          }
          report_size "default (\`.\` entry)" "crates/zfb-md-wasm/npm/dist/wasm/zfb_md_wasm_bg.wasm"
          # Highlight-only artifact (zfb#1849, epic zfb#1845) -- the size
          # knob this job's build step's SECOND artifact pass produces.
          report_size "highlight-only (\`./highlight\` entry)" "crates/zfb-md-wasm/npm/dist/wasm-highlight/zfb_md_wasm_highlight_bg.wasm"

      - name: Upload asserted @takazudo/zfb-md-wasm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zfb-md-wasm-packed-tarball
          path: wasm-md-artifact/zfb-md-wasm.tgz
          if-no-files-found: error
          retention-days: 7

  # Browser-level confirmation for issue #1642. This is intentionally a
  # separate lane from tests/built-site-smoke: its fixture has one purpose,
  # consuming the packed md-wasm browser entry through a real zfb build.
  wasm-md-browser:
    name: wasm-md browser
    needs: [health, wasm-md]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # @playwright/test is a root devDependency. The fixture's package is
      # installed separately below from the downloaded tarball, never from a
      # workspace/source dependency.
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download native zfb binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zfb-debug-linux-x64
          path: wasm-md-browser-artifacts/zfb

      - name: Download asserted @takazudo/zfb-md-wasm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zfb-md-wasm-packed-tarball
          path: wasm-md-artifact

      # Issue #1912: consume the exact asserted tarball through unmodified
      # Vite 6.4.3 in both dev and production-preview modes. This fixture
      # owns a lockfile/workspace marker so it cannot resolve the repository
      # source package. Chromium was installed above at the same Playwright
      # version pinned by the fixture.
      - name: Run packed md-wasm Vite 6.4.3 browser fixture
        run: |
          pnpm --dir crates/zfb-md-wasm/npm/test/fixtures/vite-6.4.3 install --frozen-lockfile
          ZFB_MD_WASM_TARBALL="$GITHUB_WORKSPACE/wasm-md-artifact/zfb-md-wasm.tgz" \
            pnpm --dir crates/zfb-md-wasm/npm/test/fixtures/vite-6.4.3 test

      # Artifact upload/download does not preserve the executable bit.
      - name: Fix permissions on downloaded zfb binary
        run: chmod 0755 wasm-md-browser-artifacts/zfb/zfb

      # This creates tests/md-wasm-browser-smoke/node_modules, a parent of the
      # fixture site rather than its own node_modules. zfb therefore retains
      # its embedded-client vendor fallback while the emitted island resolves
      # the packaged browser dependency normally from its parent directory.
      - name: Stage asserted packed md-wasm package
        run: |
          # `--dir` isolates this file-tarball fixture from the workspace config,
          # so carry forward its deterministic CI release-age policy explicitly.
          pnpm --dir tests/md-wasm-browser-smoke install --ignore-workspace --lockfile=false --config.minimumReleaseAge=0
          node tests/md-wasm-browser-smoke/stage-fixture-node-modules.mjs
          node tests/md-wasm-browser-smoke/assert-staged-tarball.mjs

      - name: Build md-wasm browser fixture with zfb
        working-directory: tests/md-wasm-browser-smoke/fixture-site
        run: ${{ github.workspace }}/wasm-md-browser-artifacts/zfb/zfb build

      - name: Assert emitted md-wasm browser resources
        run: node tests/md-wasm-browser-smoke/assert-build-output.mjs

      - name: Run md-wasm browser Playwright suite
        run: pnpm exec playwright test --config tests/md-wasm-browser-smoke/playwright.config.mjs

      - name: Upload md-wasm browser Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-md-browser-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
