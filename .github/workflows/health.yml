# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "base/**"]
  workflow_dispatch:
    inputs:
      wind_full:
        description: Run full Wind compatibility and shipping evidence
        type: boolean
        default: true

# Default to least privilege; jobs that need more must opt in.
permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep this workflow unfiltered so the required `health` and
  # `build (no-v8)` contexts always report. This detector feeds only the two
  # optional md-wasm jobs below; a workflow-level `paths:` filter would leave
  # the required contexts pending on an unrelated PR.
  # Historical measurements put these six matrix legs plus browser at ~11.5
  # billed runner-minutes per irrelevant PR; this saves runner cost without
  # changing required-gate latency because `health` remains unfiltered.
  changed-files:
    name: changed-files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      wasm_md: ${{ steps.filter.outputs.wasm_md }}
    steps:
      # The push form of paths-filter compares the current long-lived branch
      # with the previous push, so retain the history it needs. On PRs the
      # action uses the API against the PR base (and needs pull-requests:read).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Detect wasm-md and browser-related changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # For the main push, compare this push with its previous commit;
          # pull_request events ignore this input and use the PR base SHA.
          base: ${{ github.ref }}
          filters: |
            wasm_md:
              # The six-crate cargo metadata closure across all seven matrix
              # feature configurations (zfb-md-wasm plus these five crates).
              - 'crates/zfb-md-wasm/**'
              - 'crates/zfb-content/**'
              - 'crates/zfb-render/**'
              - 'crates/zfb-md-ast/**'
              - 'crates/zfb-md-extras/**'
              - 'crates/zfb-types/**'
              # Conservative dev/optional edges from that closure.
              - 'crates/zfb-router/**'
              - 'crates/zfb-test-utils/**'

              # wasm-md-browser consumes the native zfb artifact uploaded by
              # health. Include the complete workspace crate tree so changes
              # to zfb or any native dependency cannot silently skip the
              # browser check. This is intentionally broader than md-wasm's
              # six-crate closure.
              - 'crates/**'

              # Every script, npm fixture, and browser surface invoked by the
              # two jobs is explicit here, so CI-logic/test-fixture edits are
              # exercised even when product sources are unchanged.
              - 'scripts/assert-md-wasm-size-docs.mjs'
              - 'scripts/install-git-hooks.sh'
              - 'scripts/hooks/**'
              - 'scripts/assert-zfb-md-wasm-graph.sh'
              - 'scripts/run-zfb-md-wasm-build-timed.mjs'
              - 'scripts/assert-zfb-md-wasm-exports.sh'
              - 'scripts/assert-zfb-md-wasm-budgets.mjs'
              - 'scripts/assert-zfb-md-wasm-release.mjs'
              - 'scripts/package-tsc.mjs'
              - 'crates/zfb-md-wasm/npm/scripts/**'
              - 'crates/zfb-md-wasm/npm/test/**'
              - 'tests/md-wasm-browser-smoke/**'
              - 'packages/zfb/**'
              - 'packages/zfb-runtime/**'

              # Root Rust/Node/workspace manifests, locks, toolchain, and
              # config affect compilation, package installation, or browser
              # execution. Keep the workflow itself in the gate as well.
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.npmrc'
              - 'tsconfig.base.json'
              - 'vitest.config.mjs'
              - 'vite.config.mjs'
              - '.editorconfig'
              - '.gitignore'
              - '.gitattributes'
              - '.mdx-formatter.json'
              - 'lefthook.yml'
              - 'deny.toml'
              - 'Cross.toml'
              - '.github/workflows/health.yml'

  health:
    # Profile 1.5 admits the exact Ubuntu 24.04 x64 browser matrix.
    runs-on: ubuntu-24.04
    # Job-level permissions override (issue #1341): the "Detect and report
    # flaky tests" step near the end of this job calls `gh issue create`/
    # `gh issue comment`, which needs issues:write. Scoped to THIS job only —
    # the workflow-level `permissions:` above stays contents:read, and
    # build-no-v8 below is unaffected. A job-level `permissions:` block
    # REPLACES (not merges with) the workflow default, so contents:read must
    # be restated here or this job would lose read access to check out the
    # repo.
    permissions:
      contents: read
      issues: write
    # Existing native suite had a 60-minute ceiling. The integrated probe
    # measured about 4 minutes for comparison, 3 for production build, and
    # 90 seconds for Rust fixture compile/execution. Allow bounded headroom
    # for browser installation and cold-cache variance on the same runner.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      # Syntax-only fail-fast gate (issue #791), kept before any toolchain
      # setup. bash -n is a pure parse check (bash parses the POSIX-sh scripts
      # fine) needing no node/toolchain, catching syntax errors in install.sh,
      # scripts/*.sh, and tests/unit/*.sh before paying for setup.
      - name: Shell script syntax check
        run: |
          for f in install.sh scripts/*.sh tests/unit/*.sh; do
            bash -n "$f"
          done

      # Keep a cleanup fallback before the rust-cache restore + V8 first-compile
      # (issue #687), but do not pay its 1m20s cost on a healthy runner. The
      # ubuntu-latest image is ~145 GB; run 33177844413 observed ~86 GB free
      # before this step, while the V8 build's measured peak is ~17 GB. The
      # dtolnay/rust-toolchain setup also leaves CARGO_INCREMENTAL=0, so
      # target/debug/incremental is never created. A concrete 40 GB threshold
      # leaves more than twice that observed peak as a safety margin; only a
      # runner below it removes preinstalled toolchains (Android SDK, .NET,
      # Haskell, CodeQL) plus the Docker image cache. Cleanup uses plain sudo
      # rm -rf rather than a third-party action to preserve this workflow's
      # SHA-pinned-`uses` / least-privilege posture (see the pin-update header).
      # Scoped to `health` only — the build-no-v8 job has no V8 to compile and
      # stays light. Pure infra hardening: no build/test/lint behavior changes.
      - name: Free disk space for V8 build (issue #687)
        run: |
          set -euo pipefail
          threshold_bytes=$((40 * 1000 * 1000 * 1000))
          available_bytes="$(df --output=avail -B1 / | awk 'NR == 2 { print $1 }')"
          if [[ ! "$available_bytes" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine available disk space (got: $available_bytes)" >&2
            exit 1
          fi
          available_gb="$(awk -v bytes="$available_bytes" 'BEGIN { printf "%.1f", bytes / 1000000000 }')"
          echo "Disk available: ${available_bytes} bytes (${available_gb} GB); cleanup threshold: ${threshold_bytes} bytes (40.0 GB)."

          if (( available_bytes >= threshold_bytes )); then
            echo "Skipping disk cleanup: available space is at or above the 40 GB threshold."
            exit 0
          fi

          echo "Available space is below the 40 GB threshold; running fallback cleanup."
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          available_after_bytes="$(df --output=avail -B1 / | awk 'NR == 2 { print $1 }')"
          if [[ ! "$available_after_bytes" =~ ^[0-9]+$ ]]; then
            echo "Unable to determine available disk space after cleanup (got: $available_after_bytes)" >&2
            exit 1
          fi
          available_after_gb="$(awk -v bytes="$available_after_bytes" 'BEGIN { printf "%.1f", bytes / 1000000000 }')"
          echo "Disk available after fallback cleanup: ${available_after_bytes} bytes (${available_after_gb} GB); threshold: ${threshold_bytes} bytes (40.0 GB)."

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # Offline shell unit tests (issue #791). tests/unit/install-prerelease.sh
      # pins install.sh's prerelease tag resolution (jq path + awk fallback +
      # brace-injection fail-loud, added by #788) but was never executed by any
      # workflow. Runs here, after setup-node, because
      # tests/unit/publish-npm-packages.sh and tests/unit/check-sse-endpoint.sh
      # invoke `node` and must use the pinned node-version above, not whatever
      # node the runner image happens to preinstall (#2929). No `command -v
      # node` guard: if node is missing, the step must fail loudly rather than
      # silently skip. The glob auto-wires future tests/unit/*.sh files —
      # #791's root cause was a test that existed but was never wired.
      - name: Run offline shell unit tests
        run: |
          for t in tests/unit/*.sh; do
            echo "+ sh $t"
            sh "$t"
          done

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          components: clippy, rustfmt

      # cargo-nextest (issue #1340) — the CI Rust test runner. Pinned via
      # taiki-e/install-action to match the cargo-deny install in
      # security-audit.yml: a SHA-pinned action that fetches a checksum-verified
      # prebuilt binary (no compile cost). nextest gives the CI retry budget
      # (retries = 1), per-test timeouts, and JUnit output; the profile,
      # e2e test-group serialization, and timeouts live in .config/nextest.toml.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: nextest@0.9.138

      # cargo-machete (issue #2752) — a fast workspace dependency audit. Keep
      # the exact crates.io release pinned through the same checksum-verified
      # prebuilt-tool action as cargo-nextest; the metadata mode honors the
      # build.rs false-positive allowlist in crates/zfb/Cargo.toml.
      - name: Install cargo-machete (pinned)
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: cargo-machete@0.9.2

      - name: Dead-dependency check (cargo-machete)
        run: cargo machete --with-metadata

      # Fmt gate (issue #988): near-free fail-fast check before the expensive
      # rust-cache restore + V8 build. Note: cargo fmt --check on the stable
      # toolchain can change behaviour on a future toolchain bump — accepted
      # cost; same posture as `clippy -D warnings` (a future stable rustfmt
      # can change defaults and turn CI red with zero code changes).
      - run: cargo fmt --all --check

      # Cache compiled Rust artifacts across runs. The cache key encodes the
      # OS, Rust toolchain, and a hash of every Cargo.toml/Cargo.lock in the
      # workspace so the cache is invalidated cleanly when any member's
      # dependency set changes (including when deno_core / V8 is added by
      # Sub 2).
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Prefix so future workspace-member additions don't share a stale
          # cache. Bumped v1 → v2 in PR #250 after the cached target/ snapshot
          # started failing to link `v8` (rusty_v8 native static lib not found
          # in OUT_DIR after partial rebuild). The first build on this key
          # will take 15-30 min for V8 first-compile; subsequent runs hit the
          # restored cache and are fast.
          prefix-key: "v2-zfb"
          # shared-key (issue #1394): without it, Swatinem/rust-cache appends
          # github.job to the key, so this job's cache and exam.yml's
          # quarantine-heavy job's cache never actually shared despite both
          # using `prefix-key: "v2-zfb"` — they run the identical `cargo build
          # --workspace --all-targets` on the same toolchain/lockfiles, so the
          # target/ tree is genuinely interchangeable. Must stay identical to
          # the `shared-key` on exam.yml's quarantine-heavy rust-cache step.
          shared-key: "workspace-all-targets"

      # Cache the SHA-verified staged esbuild binary so the
      # zfb build script skips its download in the steady state (issue 2385).
      # Keyed on the files holding the version and SHA-256 pins; slot content is target-specific, so the
      # key names the target triple (shared with every other x86_64-linux job
      # carrying this step). Opportunistic by design: continue-on-error keeps
      # a cache-infrastructure failure falling through to the SHA-verified
      # download instead of becoming a new way to fail the job, and there are
      # deliberately no restore-keys — an old pin's binaries would only be
      # hashed and re-downloaded anyway.
      - name: Cache staged esbuild binary (issue 2385)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          # Only the gitignored executable slot — never the whole dir:
          # crates/zfb/binaries/ also holds TRACKED files (.gitkeep, READMEs),
          # and an exact-key restore would untar stale cached copies of those
          # over the checkout whenever a PR edits them without touching the
          # hashed pin files (codex review, zfb#2385 PR).
          path: |
            crates/zfb/binaries/esbuild/esbuild
          key: zfb-staged-binaries-v1-x86_64-unknown-linux-gnu-${{ hashFiles('crates/zfb/build.rs', 'crates/zfb-toolchain-pins/src/lib.rs') }}

      - run: pnpm install --frozen-lockfile

      # TypeScript typecheck gate (issue #1332): b4push has run this since its
      # inception, but CI never did — the `pnpm test:workspace` lane below only runs vitest,
      # which transpiles (via esbuild/swc) without type-checking, so a type
      # error could merge green. `--if-present` mirrors b4push's invocation:
      # packages without a `typecheck` script are skipped rather than failing.
      # @takazudo/zfb-md-wasm is excluded: its src/index.ts type-imports the
      # wasm-bindgen-generated ./wasm/zfb_md_wasm.js glue, which does not
      # exist until the crate has been compiled for wasm32-unknown-unknown —
      # this job never installs that target. The wasm-md job below builds
      # the package (which runs `tsc` as its own final step, catching the
      # same type errors) so coverage isn't lost, just relocated.
      - run: pnpm typecheck:workspace

      # Run the JS/TS test suites across all packages (@takazudo/zfb and
      # @takazudo/zfb-runtime). Includes the slugify parity tests that
      # consume the shared fixture in crates/zfb-content/tests/fixtures/
      # (issue #973), so any drift between the TS port and the Rust
      # slugifier fails here as well as in cargo test.
      # @takazudo/zfb-md-wasm is excluded for the same reason as the
      # typecheck step above — its tests import the built `dist/index.js`,
      # which needs the wasm32 toolchain this job doesn't have. Covered by
      # the wasm-md job below instead.
      # The canonical `pnpm test:workspace` script passes --include-workspace-root;
      # a plain recursive invocation skips the root, so the scripts/** vitest
      # suite (vitest.config.mjs, scoped to scripts/**/__tests__) would silently
      # never run here.
      # ZFB_SUPERVISOR_TIMELINE opts the docs-dev-supervisor suite into emitting
      # [supervisor-timeline] phase lines to stderr (#2889). Nothing else in the
      # repo set this, so the platform this job runs on (ubuntu) had produced
      # zero samples for #2887's R-B/R-C rules (#2904). This is observability
      # only, not aggregation or storage: lines land in this job's own log
      # under GitHub's retention.
      - run: pnpm test:workspace
        env:
          ZFB_SUPERVISOR_TIMELINE: "1"

      - run: pnpm format:check

      - name: Wind policy, inventory, accounting and mutation contracts
        run: |
          node scripts/wind-compatibility/inventory-cli.mjs validate
          node --test tests/wind-compatibility/*.test.mjs tests/wind-compatibility/reference/*.test.mjs tests/wind-compatibility/empty-token/*.test.mjs tests/wind-compatibility/corpus/*.test.mjs

      # Keep the shipped-size documentation synchronized with the manifest
      # (issue #2482). This pure-Node check is cheap and belongs in the health
      # job's fast checks; it does not require the wasm-md package build.
      - name: Assert md-wasm documentation matches shipped sizes
        run: node scripts/assert-md-wasm-size-docs.mjs

      # SSE endpoint literal guard (issue #2644): reqwest's `.timeout()` bounds
      # the whole streaming response while the server keep-alive is 15s, so a
      # hand-written `/__zfb/reload` subscriber can time out. Keep the literal
      # confined to its route/helper source homes and the one bounded Embed
      # probe; tests must use zfb_test_utils::open_sse(). This is an offline
      # source scan and mirrors scripts/run-b4push.sh's cheap guard step.
      - name: Check SSE endpoint literal ownership
        run: node scripts/check-sse-endpoint.mjs

      # Compiles every target (incl. benches/examples) AND triggers crates/zfb's
      # build.rs to download + SHA-verify + stage the pinned esbuild 0.25.12 into
      # crates/zfb/binaries/esbuild/esbuild — the slot that
      # zfb_test_utils::locate_esbuild() resolves for the esbuild-gated
      # integration tests run below.
      - run: cargo build --workspace --all-targets

      # Exercise the built CLI on the reduced Tailwind theme-variable case,
      # and keep the exact ZW016 lines in CI logs for migration review.
      - name: ZW016 built-CLI migration spot check
        run: node scripts/verify-zw016-audit.mjs "$PWD/target/debug/zfb"

      # Freshness gate (issue #1871): the custom SyntaxSet dump is a tracked
      # generated artifact. Regenerate it from the checked-in grammar sources
      # and fail on any source-versus-generated drift. The generator changes to
      # its crate-root CWD and uses normalized relative paths, keeping the dump
      # bytes independent of the checkout location that ran this step.
      - name: Verify syntect syntax-set.packdump is fresh
        run: |
          DUMP=crates/zfb-content/assets/syntax-set.packdump
          # The generator writes unconditionally, and the dump is an include_bytes! input of
          # src/syntect_highlight.rs — a fresh mtime dirties zfb-content and its dependents,
          # costing ~195s of relink in the nextest step that follows.
          touch -r "$DUMP" "$RUNNER_TEMP/packdump.mtime"
          cargo run -p zfb-content --bin generate_syntax_dump --features generate-syntax-dump
          git diff --exit-code -- "$DUMP"
          touch -r "$RUNNER_TEMP/packdump.mtime" "$DUMP"

      # Lint gate (issue #646): runs after the warmed incremental compile so
      # no extra compile cost. Placed before cargo test so a lint failure
      # short-circuits the expensive test run. Note: -D warnings on the stable
      # toolchain can surface new lints on a future toolchain bump — accepted
      # cost; a future maintainer seeing a red gate with no code change should
      # check if a toolchain pin bump introduced new lints.
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # Guard (issue #638): the esbuild-gated integration tests skip via an early
      # `return` (recorded by cargo as a PASS) when no esbuild binary is found, so
      # a green `cargo test` alone cannot prove they actually executed. Fail loudly
      # here if build.rs did not stage the binary, making "green but silently
      # skipped" impossible. (The binary's version + SHA-256 are already verified
      # upstream by crates/zfb/build.rs before staging; the `--version` run here is
      # just a smoke test that the staged binary actually executes on this runner's
      # architecture — a corrupt or wrong-arch binary fails the step.)
      - name: Assert esbuild binary was provisioned for the test suite
        run: |
          ESBUILD_SLOT="crates/zfb/binaries/esbuild/esbuild"
          if [ ! -x "$ESBUILD_SLOT" ]; then
            echo "::error::$ESBUILD_SLOT not staged — the env-gated tests would silently skip (issue #638). Failing the job instead."
            exit 1
          fi
          "$ESBUILD_SLOT" --version

      # Run the zfb-islands esbuild-gated suite (issue #1337): the package's 23
      # `#[ignore]`d tests (tagged `env-gate:` per crates/CLAUDE.md's taxonomy) were
      # staged by the assert step above but never actually executed by any CI
      # step — `cargo test --workspace` below does not pass `--ignored`, so a
      # green run proved nothing about them. `ZFB_ESBUILD_BIN` must be an
      # ABSOLUTE path: `EsbuildSubprocessConfig`'s default binary_path is the
      # literal relative string `crates/zfb/binaries/esbuild/esbuild`, but
      # `cargo test` runs each test binary with its CWD set to the package
      # directory (`crates/zfb-islands`), not the workspace root, so the
      # relative default never resolves.
      # (This count was re-measured, not incremented, during issue #2111 —
      # it had already drifted stale to 21 by the time that issue started,
      # before either of its own 2 additions: `grep -rn '#\[ignore = "'
      # crates/zfb-islands/ | grep -v ':[0-9]*: *//' | wc -l` is the
      # authoritative recount.)
      # --tests scopes this to integration-test binaries only (where the 23
      # target tests live, in tests/integration.rs) — the unscoped `-p
      # zfb-islands` form also compiles+runs the crate's doctests, and 3 of
      # those are pre-existing broken/illustrative examples never meant to
      # run (issue found while wiring this step; see #1337 follow-up).
      # Wave-4 client-bundling acceptance gate (#1504): unlike the focused
      # zfb-islands tests above, this drives the real zfb binary through both
      # production build and dev --port 0 over one cross-pipeline fixture.
      # Keep it as its own attributable exact binary predicate because it boots
      # V8, exercises SSR, and verifies both islands and *.client.ts worker
      # namespaces.
      # Real-esbuild stage-escape-audit confirmation for the first-party
      # dot-path staging allowlist (issue #1841, epic #1836): the
      # `bundler_dot_path_staging.rs` mock suite (#1840) drives every fixture
      # through `mock_subprocess_output`, so the stage-escape audit
      # (`workspace_rel.is_some()`, #1706) never actually runs there —
      # `metafile_path` stays `None` on the mock path. This step proves real
      # esbuild resolves both allowlisted dot-path spellings (`.zudo-doc/
      # routes-src/**`, `.zfb/*.json`) out of the shadow and that the audit
      # passes them. The SAME binary also carries issue #3021's twin
      # (`real_esbuild_resolves_injected_route_entrypoint_staged_spelling_and_passes_stage_escape_audit`,
      # epic #3019): identical fixture shape, but the hidden dir is OUTSIDE
      # `KNOWN_FIRST_PARTY_STAGING_DIRS` and the staged spelling instead comes
      # from `BundlerInput::injected_route_entrypoints` (#3004) — no new
      # binary predicate needed below, since `binary(=...)` already selects
      # every test in this target.
      # Workspace-root alias regression (issue #1885, epic #1883): this is a
      # separate real-esbuild binary because its positive fixture proves the
      # #1884 staging claim composes with root-package TS/TSX/CSS/JSON, a
      # claimed sibling package, and #1840's dot-path allowlist. Issue #1905
      # extends that same env-gate with its 17-residual-input combined
      # topology (six generated routes, nine package exports, two JSON
      # leaves), while the separate negatives retain parent-relative rejection
      # and guard (b)'s fail-closed metafile audit. The provisioning assertion above is
      # deliberately shared, but this named target is not: `--ignored` is the
      # only way these env-gated tests execute, so an explicit exact predicate
      # prevents a future edit from silently dropping the binary from CI.
      # Consume-from-source workspace idiom (issues #2039/#2040, epic #1982):
      # a first-party sibling package whose `exports` point straight at
      # `./src/*` with no `dist` is imported by bare package name through the
      # workspace symlink, landing on the metafile audit's case-2 shape. These
      # four env-gated tests are the acceptance rule's positive pair, the
      # dist-shipping negative that stops it becoming a blanket "workspace
      # siblings are always fine" exemption, and the copy-mode canonicalized-
      # key twin (issue #2047, landed by sub #2086 of epic #2078) — an
      # unwired binary would let any of these regress unnoticed. Same
      # ABSOLUTE-path requirement for ZFB_ESBUILD_BIN as the steps above.
      # Root-claimed-workspace stage-escape audit, SSR leg (issues
      # #1984/#1988, epic #1982): when `project_root` is itself claimed by
      # `pnpm-workspace.yaml`, guard (b) used to be skipped and SSR has no
      # scan-time guard (a) at all — a completely silent stage escape. This
      # env-gated test is the only proof the audit is ARMED there, so it needs
      # its own exact predicate for the same reason as the two above: `--ignored`
      # is the only way it ever executes.
      # Root-claimed-workspace stage-escape audit DISARM pin (issues
      # #2050/#2081, epic #2078): the sibling armed-regression step above
      # proves guard (b) rejects an escape when the live node_modules
      # symlink survives. This step covers the shape where it does NOT
      # survive — active `bundle.exclude` forces REAL copies into
      # `<shadow>/node_modules` instead. Closing that took two fixes: sub
      # #2087 armed ELIGIBILITY (stage_escape_audit_eligibility recognises
      # the staged real copy via declared identity — package.json name +
      # workspace claim), and issue #2127 then fixed the CLASSIFICATION gap
      # that arming eligibility alone left open (metafile_deps.rs used to
      # admit any real-copy-staged package as an ordinary case-3 dependency,
      # purely because its canonical path trivially keeps a node_modules
      # segment). All FOUR of this binary's tests now run under this gate —
      # #2127 deleted the `--skip` that used to exclude the RED twin, which
      # has since flipped GREEN with its assertions untouched and its
      # `pending-feature:` tag swapped for the ordinary `env-gate: esbuild`
      # one, per epic #2078's corrected flip protocol. The other three: a
      # preconditions test, proving the staging really is a real copy and
      # eligibility really is armed; #2127's POSITIVE control, proving the
      # identical topology with a DECLARED sibling still builds (the
      # case-2/case-3 boundary governs all third-party classification, so an
      # over-broad fix would break ordinary builds — and this crate's other
      # consume-from-source acceptance tests all run with an EMPTY
      # `bundle.exclude`, so they never reach the real-copy path); and a
      # negative control proving the SECOND trigger shape #2050's own text
      # named — a workspace package staged as an exact target with an empty
      # `bundle.exclude` — is not actually reachable at a root-claimed
      # workspace. See the file's own header for the investigation.
      # Root-claimed-workspace LOOSE-FILE staging regression (issue #2208,
      # epic #2205): the ACCEPT complement of the armed-regression step
      # above. Arming guard (b) at root-claimed workspaces (#1988) exposed
      # that repo-root loose files reached via a broad `@/*` alias were only
      # staged under active exclusions — under an empty `bundle.exclude` the
      # dual-target tsconfig's live-real fallback resolved them to LIVE
      # source, which the now-armed audit rejects as case 4 (the next.96 →
      # next.97 regression). The fix widens the staging gate (declared-data
      # `workspace_root_claims_path` predicate); this binary proves real
      # esbuild's shadow-first resolution now records the STAGED spelling,
      # and its negative control proves the widened staging did not loosen
      # the audit (an undeclared bare-package-name escape stays rejected).
      # Folded into a shared workspace resolution (issue #2690): the exact
      # binary predicates preserve the esbuild-only package scopes. The four
      # command-layer tests formerly in the mixed lane now run here with only
      # ZFB_ESBUILD_BIN set.
      - name: Run ignored env gates (esbuild-only, workspace resolution)
        shell: bash
        env:
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        run: |
          mkdir -p target/nextest-logs
          cargo nextest run --workspace --profile ci --run-ignored ignored-only -E '
            (package(zfb-islands) & binary(=integration))
              | (package(zfb) & binary(=client_bundling_cross_pipeline))
              | (package(zfb-build) & binary(=bundler_dot_path_staging_esbuild_regression))
              | (package(zfb-build) & binary(=bundler_workspace_root_alias_esbuild_regression))
              | (package(zfb-build) & binary(=bundler_consume_from_source_esbuild_regression))
              | (package(zfb-build) & binary(=bundler_root_workspace_stage_escape_audit_armed_regression))
              | (package(zfb-build) & binary(=bundler_root_workspace_stage_escape_audit_disarm_pin))
              | (package(zfb-build) & binary(=bundler_root_workspace_loose_file_alias_esbuild_regression))
              | (package(zfb) & (
                  test(=commands::build::tests::bare_package_consume_from_source_sibling_glob_macro_reaches_islands_bundle_unexpanded)
                    | test(=commands::build::tests::plugin_alias_only_client_preprocessing_triggers_shadow_with_real_esbuild)
                    | test(=commands::build::tests::preprocessing_shadows_bundle_nested_alias_raw_and_workers_with_real_esbuild)
                    | test(=commands::build::tests::root_workspace_islands_stage_escape_audit_is_now_armed_and_undeclared_child_escape_is_rejected)
                ))
          ' 2>&1 | tee target/nextest-logs/env-esbuild-only.log

      - name: Stash esbuild-only env-gate JUnit
        if: always()
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/nextest/ci/junit-env-esbuild-only.xml
          fi

      # The SDK-alias confirm must exercise jsx_pragma without zfb-build's
      # default V8 feature; the normal workspace nextest lane below uses the
      # default feature set and does not cover this compile configuration.
      - name: Test jsx_pragma without default features (#3939)
        run: cargo test -p zfb-build --no-default-features --lib jsx_pragma

      # Run the workspace test suite under cargo-nextest (issue #1340). CI
      # previously only *compiled* the test code (the cargo build --all-targets
      # step above) then ran it under plain `cargo test`; nextest adds a CI retry
      # budget (retries = 1, pass-on-retry RECORDED not hidden — #1341 consumes
      # it), per-test timeouts, and JUnit output. The `ci` profile
      # (.config/nextest.toml) splits the 41 heavy V8/esbuild e2e binaries into
      # locked (24) and unlocked (17) `max-threads = 1` groups; the locked lane
      # also adopts #1339's cross-binary flock. Per-binary inventory was
      # reconciled against
      # `cargo test --workspace -- --list`: identical apart from doctests, which
      # nextest does not run — hence the separate doc-test step below.
      #
      # Output is teed to a log file (issue #1341) so the "Upload nextest
      # diagnostics" step below can attach it on failure — the raw stdout
      # (per-test TRY/PASS/FAIL lines, panic messages) that the JUnit report
      # alone doesn't carry.
      - name: cargo nextest run --workspace --profile ci
        shell: bash
        run: |
          mkdir -p target/nextest-logs
          cargo nextest run --workspace --profile ci 2>&1 | tee target/nextest-logs/workspace.log

      # nextest writes JUnit to a fixed per-profile path
      # (target/nextest/ci/junit.xml). Stash the workspace report before the
      # zfb-md-extras nextest run (same profile) overwrites it, so BOTH feed the
      # uploaded artifact. `if: always()` + the existence guard capture the
      # report even when the run above failed (nextest still emits JUnit on
      # failure — that is the telemetry #1341 wants most).
      - name: Stash workspace JUnit before the md-extras nextest run overwrites it
        if: always()
        run: |
          if [ -f target/nextest/ci/junit.xml ]; then
            mv target/nextest/ci/junit.xml target/nextest/ci/junit-workspace.xml
          fi

      # scanner_boundary_acceptance preserves its production dist for this
      # browser companion. Keep hydration and host-override assertions in the
      # same job so they exercise the exact artifacts built by nextest.
      - name: Install Chromium for scanner boundary acceptance
        if: always()
        run: pnpm exec playwright install --with-deps chromium

      - name: Scanner boundary acceptance (Chromium)
        run: pnpm exec playwright test --config tests/scanner-boundary-acceptance/playwright.config.mjs

      # #3939 runs the documented MDX recipe as a packed external consumer.
      # Its JS packages are packed from this checkout, and the Rust binary
      # built above must match the exact checked-out source SHA.
      - name: SDK alias packed consumer and dev rebundle (#3939)
        run: |
          ZFB_BINARY="$PWD/target/debug/zfb" \
          ZFB_BINARY_SOURCE_SHA="$(git rev-parse HEAD)" \
          node tests/sdk-alias-consumer/run.mjs

      # #3931 reproduces the linked-package identity issue from a scratch
      # workspace while reusing this job's branch-built zfb binary and the
      # Chromium installation above. The script preserves fixture and
      # phase/browser evidence under RUNNER_TEMP, including on failure.
      - name: Linked-package token identity probe and hydration (#3931)
        if: always()
        env:
          ZFB_PROBE_EVIDENCE_DIR: ${{ runner.temp }}/linked-package-token-probe
        run: node scripts/linked-package-token-probe.mjs

      - name: Upload linked-package token probe evidence (#3931)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linked-package-token-probe
          path: ${{ runner.temp }}/linked-package-token-probe/
          if-no-files-found: warn
          retention-days: 7

      - name: Declared linked dist dev watch row (#3931)
        if: always()
        run: |
          cargo test -p zfb --test dev_sibling_watch_1678_e2e e2e_3163_nested_site_compiled_dist_sibling_edit_is_served -- --include-ignored
          cargo test -p zfb --test dev_sibling_watch_1678_e2e e2e_3926_ignored_undeclared_sibling_writes_do_not_tick -- --include-ignored

      # Doctests (issue #1340): nextest does NOT run doctests, so `cargo nextest
      # run` above cannot cover them. This separate step keeps that coverage.
      # Current baseline: 3 doctests execute + pass (zfb-css 1, zfb-islands 2),
      # plus 8 ignored/no_run examples across zfb-islands, zfb-server,
      # zfb-test-utils, and zfb-render — 11 entries across 5 crates.
      - run: cargo test --workspace --doc

      # Run the zfb-md-extras integration suite gated behind the `test-utils`
      # feature (issue #1091). The `test-utils` feature is not in the default
      # feature set, so `cargo nextest run --workspace` above silently skips every
      # [[test]] target carrying `required-features = ["test-utils"]`. Using the
      # scoped `-p zfb-md-extras` form because `test-utils` exists only on this
      # crate — `--workspace --features test-utils` would error on other members
      # that have no such feature. Migrated to nextest (issue #1340): verified
      # `cargo nextest run -p zfb-md-extras --features test-utils` DOES pick up
      # the required-features-gated targets (all 10 gated integration binaries +
      # the lib unit tests run — 421 tests), so this lane gets the same retry/
      # timeout/JUnit treatment as the workspace run.
      #
      # Output is teed to a log file (issue #1341) for the same reason as the
      # workspace run above.
      - name: cargo nextest run -p zfb-md-extras --features test-utils --profile ci
        shell: bash
        run: |
          cargo nextest run -p zfb-md-extras --features test-utils --profile ci 2>&1 | tee target/nextest-logs/md-extras.log

      # Lint the test-utils-gated targets (they are excluded from the workspace
      # clippy step above for the same reason as cargo test).
      - run: cargo clippy -p zfb-md-extras --features test-utils --all-targets -- -D warnings

      # Upload nextest JUnit reports (issue #1340) so retry/flaky telemetry
      # survives the run — the machine-readable feed issue #1341 consumes
      # below. `if: always()` uploads on EVERY run, not just failures (nextest
      # emits JUnit on failure too) — this is deliberately trend data, not
      # just failure diagnostics: a pass-on-retry only shows up in a run that
      # otherwise went green. junit-workspace.xml is the stashed
      # full-workspace run; junit-env-esbuild-only.xml is the immediately
      # stashed env-gate lane; junit.xml is the last writer (the zfb-md-extras
      # lane). `if-no-files-found: warn` tolerates an early failure (e.g. a
      # compile error) that produced no report. `retention-days: 7` — short
      # retention is fine since #1341's flaky-detection step below consumes
      # these reports within the same run; the 7 days exists for a human to
      # download and inspect a specific run's report after the fact.
      - name: Upload nextest JUnit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-ci
          path: |
            target/nextest/ci/junit-env-esbuild-only.xml
            target/nextest/ci/junit-workspace.xml
            target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

      # Failure-only diagnostics (issue #1341): the raw nextest stdout (teed
      # by the remaining nextest run steps above) — per-test TRY/PASS/FAIL lines and
      # panic messages that the JUnit report's structured fields don't fully
      # carry. Only uploaded `if: failure()` — a healthy run has nothing
      # worth attaching beyond the JUnit trend data already uploaded above.
      - name: Upload nextest diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-diagnostics
          path: |
            target/nextest-logs/env-esbuild-only.log
            target/nextest-logs/workspace.log
            target/nextest-logs/md-extras.log
          if-no-files-found: warn
          retention-days: 7

      # Flaky-test telemetry (issue #1341): consumes the JUnit reports above
      # to make CLAUDE.md's "pass-on-retry is a triage signal, not a
      # success — record it and schedule the fix" policy mechanically real.
      # `if: always()` so a flaky test is still reported even when a
      # DIFFERENT, genuine failure elsewhere makes this run red overall.
      # GH_TOKEN is required here: this job's `permissions:` above grants
      # issues:write, but `gh` still needs an explicit token when the
      # workflow's own default (`contents: read`, no write scopes) doesn't
      # cover it. `scripts/report-flaky-tests.sh` treats every `gh issue`
      # call as best-effort — a fork PR's read-only GITHUB_TOKEN degrades to
      # a `::warning::`, never a failed step.
      - name: Detect and report flaky tests
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          scripts/report-flaky-tests.sh
          target/nextest/ci/junit-env-esbuild-only.xml
          target/nextest/ci/junit-workspace.xml
          target/nextest/ci/junit.xml

      # The md-wasm browser confirmation consumes this exact V8-enabled
      # production binary. Keeping it an artifact avoids a second expensive
      # native/V8 compilation in the browser-only job below.
      - name: Upload native zfb binary for md-wasm browser smoke
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zfb-debug-linux-x64
          path: target/debug/zfb
          if-no-files-found: error
          # Consumed within this run by the wasm-md-browser job; ~194MB per run
          # piles up fast (7GB live at 7 days — 2026-07 storage audit), so cap
          # at the 1-day floor like release.yml's transfer artifacts.
          retention-days: 1

      # Keep the test suite on Node 22 above. The size contract pins Node and
      # zlib separately because gzip-9 is part of the measured byte oracle.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Assert island-size toolchain
        run: |
          node --input-type=module -e '
            if (process.version !== "v24.14.0") {
              throw new Error("expected Node v24.14.0, got " + process.version);
            }
            if (process.versions.zlib !== "1.3.1-e00f703") {
              throw new Error("expected zlib 1.3.1-e00f703, got " + process.versions.zlib);
            }
            if (process.platform !== "linux" || process.arch !== "x64") {
              throw new Error("expected Linux x64, got " + process.platform + " " + process.arch);
            }
            console.log("Node " + process.version + "; zlib " + process.versions.zlib + "; " + process.platform + " " + process.arch);
          '

      # This is part of the existing required health job. It shares the
      # already-built native Cargo target and cannot be silently skipped by a
      # path-filtered optional workflow or by a failed upstream job.
      - name: Route required Wind compatibility evidence
        id: wind_route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WIND_FULL: ${{ inputs.wind_full }}
        run: |
          test -z "$(git status --porcelain)" || { echo 'Dirty source before Wind routing' >&2; exit 1; }
          node scripts/wind-compatibility/ci-route.mjs --github-output "$GITHUB_OUTPUT"

      - name: Install profile browser engines
        if: ${{ steps.wind_route.outputs.relevant == 'true' }}
        run: |
          if [[ '${{ steps.wind_route.outputs.mode }}' == full ]]; then
            node_modules/.bin/playwright install --with-deps chromium firefox webkit
          else
            node_modules/.bin/playwright install --with-deps chromium
          fi

      - name: Required Wind comparison and shipping evidence
        if: ${{ steps.wind_route.outputs.relevant == 'true' }}
        run: bash scripts/wind-compatibility/ci-run.sh '${{ steps.wind_route.outputs.mode }}'

      - name: Assert explicit irrelevant Wind no-op
        if: ${{ steps.wind_route.outputs.relevant == 'false' }}
        env:
          DETECTOR_RESULT: success
          WIND_RELEVANT: "false"
          WIND_MODE: chromium
          WIND_RESULT: skipped
          NATIVE_RESULT: success
        run: node scripts/wind-compatibility/ci-gate.mjs aggregate

      - name: Retain Wind evidence and exact runner inputs
        if: ${{ always() && steps.wind_route.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wind-required-health-evidence
          path: |
            ${{ runner.temp }}/wind-gate/
            ${{ runner.temp }}/wind-reference-cache/
            test-results/
          if-no-files-found: error
          retention-days: 7

      # Rebuild and pack both packages from this checkout so workspace and
      # published-consumer resolution are measured from the same source SHA.
      - name: Build and pack packages for island-size measurement
        run: |
          ZFB_SIZE_OUT="$GITHUB_WORKSPACE/target/island-size"
          ZFB_SIZE_VERSION="$(node -p "require('./packages/zfb/package.json').version")"
          mkdir -p "$ZFB_SIZE_OUT/pack" "$ZFB_SIZE_OUT/packed-package" "$ZFB_SIZE_OUT/packed-runtime"
          pnpm -C packages/zfb build
          pnpm -C packages/zfb-runtime build
          pnpm -C packages/zfb pack --pack-destination "$ZFB_SIZE_OUT/pack"
          pnpm -C packages/zfb-runtime pack --pack-destination "$ZFB_SIZE_OUT/pack"
          tar -xzf "$ZFB_SIZE_OUT/pack/takazudo-zfb-$ZFB_SIZE_VERSION.tgz" -C "$ZFB_SIZE_OUT/packed-package"
          tar -xzf "$ZFB_SIZE_OUT/pack/takazudo-zfb-runtime-$ZFB_SIZE_VERSION.tgz" -C "$ZFB_SIZE_OUT/packed-runtime"

      # Exact Linux x64 contract selected after the reviewed Linux replay.
      # Keep the complete workspace and packed real CLI matrices together so
      # the guard checks fresh saved dist bytes from this checkout.
      - name: Measure and enforce Linux x64 island-size budgets
        shell: bash
        run: |
          set -euo pipefail
          ZFB_SIZE_SHA="$(git rev-parse HEAD)"
          ZFB_SIZE_BIN="$GITHUB_WORKSPACE/target/debug/zfb"
          ZFB_SIZE_ESBUILD="$GITHUB_WORKSPACE/crates/zfb/binaries/esbuild/esbuild"
          ZFB_SIZE_HONO="$GITHUB_WORKSPACE/packages/zfb-runtime/node_modules/hono"
          ZFB_SIZE_OUT="$GITHUB_WORKSPACE/target/island-size"
          ZFB_SIZE_VERSION="$(node -p "require('./packages/zfb/package.json').version")"
          node research/v3-island-size/measure-real.mjs \
            --mode workspace \
            --package "$GITHUB_WORKSPACE/packages/zfb" \
            --runtime-package "$GITHUB_WORKSPACE/packages/zfb-runtime" \
            --hono-package "$ZFB_SIZE_HONO" \
            --zfb-tarball "$ZFB_SIZE_OUT/pack/takazudo-zfb-$ZFB_SIZE_VERSION.tgz" \
            --runtime-tarball "$ZFB_SIZE_OUT/pack/takazudo-zfb-runtime-$ZFB_SIZE_VERSION.tgz" \
            --zfb "$ZFB_SIZE_BIN" \
            --esbuild "$ZFB_SIZE_ESBUILD" \
            --source-sha "$ZFB_SIZE_SHA" \
            --out "$ZFB_SIZE_OUT/real-workspace"
          node research/v3-island-size/measure-real.mjs \
            --mode packed \
            --package "$ZFB_SIZE_OUT/packed-package/package" \
            --runtime-package "$ZFB_SIZE_OUT/packed-runtime/package" \
            --hono-package "$ZFB_SIZE_HONO" \
            --zfb-tarball "$ZFB_SIZE_OUT/pack/takazudo-zfb-$ZFB_SIZE_VERSION.tgz" \
            --runtime-tarball "$ZFB_SIZE_OUT/pack/takazudo-zfb-runtime-$ZFB_SIZE_VERSION.tgz" \
            --zfb "$ZFB_SIZE_BIN" \
            --esbuild "$ZFB_SIZE_ESBUILD" \
            --source-sha "$ZFB_SIZE_SHA" \
            --out "$ZFB_SIZE_OUT/real-packed"
          node research/v3-island-size/check-budget.mjs \
            --workspace "$ZFB_SIZE_OUT/real-workspace/measurement.json" \
            --packed "$ZFB_SIZE_OUT/real-packed/measurement.json" \
            --contract research/v3-island-size/decision-linux-x64.json

      # Keep the emitted JS and both-pass dist inventories for byte-level
      # comparison when an exact gzip ceiling fails (issue #3767). These two
      # measurement trees are small; omit the packed tarballs and native binary.
      - name: Upload island-size measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: island-size-linux-x64
          path: |
            target/island-size/real-workspace/
            target/island-size/real-packed/
          if-no-files-found: warn
          retention-days: 7

  # V8-off feature matrix (issue #371, sub-task 4.1a).
  #
  # Without this job the cfg(feature = "embed_v8") gates can rot
  # silently — a missing gate on a new V8 reference would still pass
  # the V8-on health job above, leaving the V8-off path broken until
  # a downstream consumer notices.
  #
  # We build the `zfb` binary with --no-default-features here as the
  # primary V8-off acceptance check. zfb-render --no-default-features
  # is implied by the propagation chain (default-features = false on
  # every consumer), so building zfb alone proves both ends. A curated
  # `cargo test --no-default-features` leg (issue #1337, below) also
  # EXECUTES the no-v8 fallback code paths, not just compiles them.
  build-no-v8:
    name: build (no-v8)
    runs-on: ubuntu-latest
    # No V8 to compile, so this job is fast — but we keep a generous
    # budget while the cache primes on the first run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          # Separate cache key from the V8-on job — the target/ trees
          # are not interchangeable (different feature set, different
          # rmeta).
          prefix-key: "v2-zfb-no-v8"

      # Staged-binaries cache (issue 2385) — same step as the health job
      # above (the build script runs feature-independently, so this job
      # downloads too); see that step's comment for the full rationale.
      # The key is deliberately identical: slot content depends only on the
      # target platform, so both jobs share one cache entry.
      - name: Cache staged esbuild binary (issue 2385)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          # Only the gitignored executable slot — never the whole dir:
          # crates/zfb/binaries/ also holds TRACKED files (.gitkeep, READMEs),
          # and an exact-key restore would untar stale cached copies of those
          # over the checkout whenever a PR edits them without touching the
          # hashed pin files (codex review, zfb#2385 PR).
          path: |
            crates/zfb/binaries/esbuild/esbuild
          key: zfb-staged-binaries-v1-x86_64-unknown-linux-gnu-${{ hashFiles('crates/zfb/build.rs', 'crates/zfb-toolchain-pins/src/lib.rs') }}

      # crates/zfb/build.rs embeds Hono from node_modules/.pnpm at compile
      # time. Without this install, the build script cannot find the Hono tree.
      - run: pnpm install --frozen-lockfile

      - name: cargo build (zfb, --no-default-features)
        run: cargo build --release --no-default-features -p zfb

      - name: cargo check (zfb --no-default-features --tests)
        run: cargo check --no-default-features -p zfb --tests

      # V8-off EXECUTION leg (issue #1337): the two steps above only build/
      # check the no-v8 code paths, they never ran the test bodies, so a
      # `cfg(feature = "embed_v8")` gate could silently rot on the V8-off
      # side without any CI signal. `zfb-render`'s full suite (unit +
      # integration) passes cleanly with V8 off, so it runs unrestricted.
      # `zfb`'s integration tests under `crates/zfb/tests/` all shell out to
      # the `zfb build`/`zfb dev` subcommands, which correctly refuse to run
      # without the embedded V8 host (see the guard in
      # `crates/zfb/src/commands/build.rs`) — that refusal is CORRECT
      # no-v8 behaviour, but it means those integration tests are not
      # written to run in a V8-off environment. `zfb` is therefore scoped to
      # `--lib` here (unit tests only, including the render_pipeline/config
      # coverage that exercises the no-v8 fallback paths); the workspace's
      # full integration coverage for those subcommands still runs under V8
      # in the `health` job above.
      # `--features syntect-onig`: since zfb#1576 the syntect regex backend
      # is independently selectable on zfb-render (its zfb-content edge is
      # default-features = false so wasm consumers can pick syntect-fancy),
      # and syntect does not compile with NO backend. This step tests the
      # V8-off toggle, not the backend choice — pin the native default.
      - name: cargo test (zfb-render --no-default-features)
        run: cargo test --no-default-features -p zfb-render --features syntect-onig

      - name: cargo test (zfb --no-default-features --lib)
        run: cargo test --no-default-features -p zfb --lib

  # @takazudo/zfb-md-wasm CI (epic #2446, issue #2454): every supported
  # capability surface is checked on wasm32 and natively where applicable,
  # then the exact four-artifact production build is packed and inspected.
  # This crate needs wasm32-unknown-unknown, which is NOT in
  # rust-toolchain.toml's `targets`; install it only in this job.
  #
  # NOT added to the `main` branch ruleset's required-status-checks (see
  # CLAUDE.md "Branch ruleset on main"): the changed-files detector above
  # gates this optional job at job level. Keep the gate here, never on the
  # workflow trigger, so required contexts continue to report on every PR.
  wasm-md:
    name: wasm-md
    needs: changed-files
    if: ${{ needs.changed-files.outputs.wasm_md == 'true' }}
    runs-on: ubuntu-latest
    # Keep this exact timeout: the four clean production passes plus setup,
    # package tests, and pack have ample headroom under the locked 35 minutes.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: default
            cargo_args: ""
            graph_config: default
          - label: no-features
            cargo_args: "--no-default-features"
            graph_config: none
          - label: compile
            cargo_args: "--no-default-features --features compile"
            graph_config: compile
          - label: highlight
            cargo_args: "--no-default-features --features highlight"
            graph_config: highlight
          - label: render
            cargo_args: "--no-default-features --features render"
            graph_config: render
          - label: parse
            cargo_args: "--no-default-features --features parse"
            graph_config: parse
          - label: pipeline
            cargo_args: "--no-default-features --features pipeline"
            graph_config: pipeline
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          components: clippy

      # Job-local target install (see the job-level comment above for why
      # this isn't in rust-toolchain.toml).
      - name: rustup target add wasm32-unknown-unknown
        run: rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        if: ${{ matrix.label == 'default' }}
        with:
          # Own prefix: the wasm32 target dir isn't interchangeable with the
          # native-target caches the other two jobs above key on. Only the
          # expensive default leg restores/saves this key: the other five
          # feature checks are short and would otherwise race to save the
          # same cache before default can persist its useful build artifacts.
          prefix-key: "v2-zfb-wasm-md"

      - run: pnpm install --frozen-lockfile

      - name: cargo check (${{ matrix.label }}, wasm32-unknown-unknown)
        run: cargo check --target wasm32-unknown-unknown -p zfb-md-wasm ${{ matrix.cargo_args }}

      - name: cargo clippy (${{ matrix.label }}, wasm32-unknown-unknown)
        run: cargo clippy --target wasm32-unknown-unknown -p zfb-md-wasm ${{ matrix.cargo_args }} -- -D warnings

      - name: cargo test (${{ matrix.label }}, native scoped)
        run: cargo test -p zfb-md-wasm ${{ matrix.cargo_args }}

      - name: Assert isolated zfb-md-wasm graph (${{ matrix.label }})
        run: bash scripts/assert-zfb-md-wasm-graph.sh ${{ matrix.graph_config }}

      # wasm-bindgen requires an EXACT version match between this CLI and the
      # `wasm-bindgen` crate resolved in Cargo.lock (pinned in
      # crates/zfb-md-wasm/npm/scripts/build.mjs's
      # EXPECTED_WASM_BINDGEN_VERSION constant — bump both together). The
      # taiki-e/install-action manifest contains this version and verifies its
      # prebuilt download with a platform-specific SHA-256 checksum.
      - name: Install wasm-bindgen-cli (pinned to match Cargo.lock)
        if: ${{ matrix.label == 'default' }}
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: wasm-bindgen@0.2.121

      # wasm-opt (binaryen) comes from the package's own devDependency via
      # the `pnpm install` above — nothing extra to install for it here.
      # A distinct initially nonexistent target directory makes the production
      # timing comparable to the locked clean-run measurement. Hosted-runner
      # timing is informational; the Apple-M4 210-second reference is printed
      # by the wrapper without becoming a cross-machine flaky gate.
      - name: Build four @takazudo/zfb-md-wasm artifacts (timed)
        if: ${{ matrix.label == 'default' }}
        shell: bash
        run: |
          TARGET_DIR="$RUNNER_TEMP/zfb-md-wasm-production-target-$GITHUB_RUN_ID"
          test ! -e "$TARGET_DIR" || {
            echo "::error::production target directory already exists: $TARGET_DIR"
            exit 1
          }
          BUILD_LOG="$RUNNER_TEMP/zfb-md-wasm-build-$GITHUB_RUN_ID.log"
          ZFB_RELEASE_VERSION="$(node -p "require('./crates/zfb-md-wasm/npm/package.json').version")" \
          CARGO_TARGET_DIR="$TARGET_DIR" \
            node scripts/run-zfb-md-wasm-build-timed.mjs 2>&1 | tee "$BUILD_LOG"
          echo "ZFB_MD_WASM_BUILD_LOG=$BUILD_LOG" >> "$GITHUB_ENV"

      # Whatever tests exist at merge time — do NOT assert the parity
      # suite's presence. #1578 (a same-wave sibling) adds a test file under
      # this package's test/ dir; once merged this step picks it up
      # automatically, no wiring change needed here.
      - name: Test @takazudo/zfb-md-wasm npm package
        if: ${{ matrix.label == 'default' }}
        run: pnpm --filter @takazudo/zfb-md-wasm test

      - name: Assert generated wasm exports and exact resource sets
        if: ${{ matrix.label == 'default' }}
        shell: bash
        run: bash scripts/assert-zfb-md-wasm-exports.sh crates/zfb-md-wasm/npm/dist

      - name: Enforce four-artifact gzip budgets and report metrics
        if: ${{ matrix.label == 'default' }}
        run: |
          node scripts/assert-zfb-md-wasm-budgets.mjs \
            --build-log "$ZFB_MD_WASM_BUILD_LOG" \
            --dist crates/zfb-md-wasm/npm/dist

      # Produce exactly the archive a consumer receives. The browser job must
      # install this artifact; it may not resolve the source package or copy
      # glue/wasm files out of the working tree.
      - name: Pack and assert @takazudo/zfb-md-wasm published artifact
        if: ${{ matrix.label == 'default' }}
        shell: bash
        run: |
          ARTIFACT_DIR="$GITHUB_WORKSPACE/wasm-md-artifact"
          mkdir -p "$ARTIFACT_DIR"
          TARBALL="$(cd crates/zfb-md-wasm/npm && pnpm pack --pack-destination "$ARTIFACT_DIR" | tail -1)"
          test -f "$TARBALL" || { echo "::error::packed tarball missing: $TARBALL"; exit 1; }
          mv "$TARBALL" "$ARTIFACT_DIR/zfb-md-wasm.tgz"
          node crates/zfb-md-wasm/npm/scripts/assert-packed.mjs "$ARTIFACT_DIR/zfb-md-wasm.tgz"
          node scripts/assert-zfb-md-wasm-release.mjs \
            --dist crates/zfb-md-wasm/npm/dist \
            --package crates/zfb-md-wasm/npm/package.json \
            --tarball "$ARTIFACT_DIR/zfb-md-wasm.tgz"
          node scripts/assert-zfb-md-wasm-budgets.mjs \
            --build-log "$ZFB_MD_WASM_BUILD_LOG" \
            --dist crates/zfb-md-wasm/npm/dist \
            --tarball "$ARTIFACT_DIR/zfb-md-wasm.tgz"

      # The budget step above is authoritative. Keep this compact file-based
      # report for log readers, covering all four artifacts with the exact
      # Node gzipSync(level 9) definition.
      - name: Report four gzip'd .wasm sizes
        if: ${{ matrix.label == 'default' }}
        run: |
          report_size() {
            local label="$1" wasm_file="$2"
            if [ ! -f "$wasm_file" ]; then
              echo "::error::$wasm_file not found — the build step above did not produce it."
              exit 1
            fi
            local raw_bytes
            raw_bytes=$(stat -c%s "$wasm_file")
            # Node's zlib (level 9), not the system `gzip` CLI: the two encoders
            # are not byte-identical (different default strategy/window), and
            # this must match build.mjs's own gzipSync(..., { level: 9 })
            # figure exactly, since that is the number this line is meant to
            # corroborate.
            local gzip_bytes
            gzip_bytes=$(node -e "
              const { readFileSync } = require('node:fs');
              const { gzipSync } = require('node:zlib');
              process.stdout.write(String(gzipSync(readFileSync(process.argv[1]), { level: 9 }).length));
            " "$wasm_file")
            echo "zfb-md-wasm $label .wasm size: raw=${raw_bytes} bytes, gzip-9=${gzip_bytes} bytes"
          }
          report_size "default (\`.\` entry)" "crates/zfb-md-wasm/npm/dist/wasm/zfb_md_wasm_bg.wasm"
          report_size "highlight-only (\`./highlight\` entry)" "crates/zfb-md-wasm/npm/dist/wasm-highlight/zfb_md_wasm_highlight_bg.wasm"
          report_size "render-only (\`./render\` entry)" "crates/zfb-md-wasm/npm/dist/wasm-render/zfb_md_wasm_render_bg.wasm"
          report_size "parse-only (\`./parse\` entry)" "crates/zfb-md-wasm/npm/dist/wasm-parse/zfb_md_wasm_parse_bg.wasm"

      - name: Upload asserted @takazudo/zfb-md-wasm tarball
        if: ${{ matrix.label == 'default' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zfb-md-wasm-packed-tarball
          path: wasm-md-artifact/zfb-md-wasm.tgz
          if-no-files-found: error
          retention-days: 7

  # Browser-level confirmation for issue #1642. This is intentionally a
  # separate lane from tests/built-site-smoke: its fixture has one purpose,
  # consuming the packed md-wasm browser entry through a real zfb build.
  wasm-md-browser:
    name: wasm-md browser
    # Retain both artifact-producing dependencies. The detector is also a
    # direct need so this job uses the same job-level path gate; when the
    # matrix is skipped, its normal needs semantics skip this job before any
    # artifact download, rather than waiting for or failing on a missing
    # zfb-md-wasm tarball.
    needs: [health, wasm-md, changed-files]
    if: ${{ needs.changed-files.outputs.wasm_md == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      # @playwright/test is a root devDependency. The fixture's package is
      # installed separately below from the downloaded tarball, never from a
      # workspace/source dependency.
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Download native zfb binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zfb-debug-linux-x64
          path: wasm-md-browser-artifacts/zfb

      - name: Download asserted @takazudo/zfb-md-wasm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zfb-md-wasm-packed-tarball
          path: wasm-md-artifact

      # Issue #1912: consume the exact asserted tarball through unmodified
      # Vite 6.4.3 in both dev and production-preview modes. This fixture
      # owns a lockfile/workspace marker so it cannot resolve the repository
      # source package. Chromium was installed above at the same Playwright
      # version pinned by the fixture.
      - name: Run packed md-wasm Vite 6.4.3 browser fixture
        run: |
          pnpm --dir crates/zfb-md-wasm/npm/test/fixtures/vite-6.4.3 install --frozen-lockfile
          ZFB_MD_WASM_TARBALL="$GITHUB_WORKSPACE/wasm-md-artifact/zfb-md-wasm.tgz" \
            pnpm --dir crates/zfb-md-wasm/npm/test/fixtures/vite-6.4.3 test

      # Artifact upload/download does not preserve the executable bit.
      - name: Fix permissions on downloaded zfb binary
        run: chmod 0755 wasm-md-browser-artifacts/zfb/zfb

      # This creates tests/md-wasm-browser-smoke/node_modules, a parent of the
      # fixture site rather than its own node_modules. zfb therefore retains
      # its embedded-client vendor fallback while the emitted island resolves
      # the packaged browser dependency normally from its parent directory.
      - name: Stage asserted packed md-wasm package
        run: |
          # `--dir` isolates this file-tarball fixture from the workspace config,
          # so carry forward its deterministic CI release-age policy explicitly.
          pnpm --dir tests/md-wasm-browser-smoke install --ignore-workspace --lockfile=false --config.minimumReleaseAge=0
          node tests/md-wasm-browser-smoke/stage-fixture-node-modules.mjs
          node tests/md-wasm-browser-smoke/assert-staged-tarball.mjs

      - name: Build md-wasm browser fixture with zfb
        working-directory: tests/md-wasm-browser-smoke/fixture-site
        run: ${{ github.workspace }}/wasm-md-browser-artifacts/zfb/zfb build

      - name: Assert emitted md-wasm browser resources
        run: node tests/md-wasm-browser-smoke/assert-build-output.mjs

      - name: Run md-wasm browser Playwright suite
        run: pnpm exec playwright test --config tests/md-wasm-browser-smoke/playwright.config.mjs

      - name: Upload md-wasm browser Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-md-browser-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
