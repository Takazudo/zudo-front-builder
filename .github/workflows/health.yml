name: health

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to least privilege; jobs that need more must opt in.
permissions:
  contents: read

concurrency:
  group: health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    # V8 first compile costs 15-30 min; subsequent runs hit the Swatinem cache
    # and typically complete well within this budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Cache compiled Rust artifacts across runs. The cache key encodes the
      # OS, Rust toolchain, and a hash of every Cargo.toml/Cargo.lock in the
      # workspace so the cache is invalidated cleanly when any member's
      # dependency set changes (including when deno_core / V8 is added by
      # Sub 2).
      - uses: Swatinem/rust-cache@v2
        with:
          # Prefix so future workspace-member additions don't share a stale
          # cache. Bumped v1 → v2 in PR #250 after the cached target/ snapshot
          # started failing to link `v8` (rusty_v8 native static lib not found
          # in OUT_DIR after partial rebuild). The first build on this key
          # will take 15-30 min for V8 first-compile; subsequent runs hit the
          # restored cache and are fast.
          prefix-key: "v2-zfb"

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: cargo build --workspace --all-targets

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12

  # V8-off feature matrix (issue #371, sub-task 4.1a).
  #
  # Without this job the cfg(feature = "embed_v8") gates can rot
  # silently — a missing gate on a new V8 reference would still pass
  # the V8-on health job above, leaving the V8-off path broken until
  # a downstream consumer notices.
  #
  # We build the `zfb` binary with --no-default-features here as the
  # primary V8-off acceptance check. zfb-render --no-default-features
  # is implied by the propagation chain (default-features = false on
  # every consumer), so building zfb alone proves both ends.
  build-no-v8:
    name: build (no-v8)
    runs-on: ubuntu-latest
    # No V8 to compile, so this job is fast — but we keep a generous
    # budget while the cache primes on the first run.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache key from the V8-on job — the target/ trees
          # are not interchangeable (different feature set, different
          # rmeta).
          prefix-key: "v2-zfb-no-v8"

      - name: cargo build (zfb, --no-default-features)
        run: cargo build --release --no-default-features -p zfb

      - name: cargo check (zfb --no-default-features --tests)
        run: cargo check --no-default-features -p zfb --tests
