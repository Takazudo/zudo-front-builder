# Preparation only. Pin reviewed docs source before execution.
name: Temporary Wind product integration assets
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: wind-integration-assets-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: a33a30c734dcfcaa2b2d1637a2a50e40fe249705
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: wind-preview-no-v8
      - run: cargo build --locked -p zfb --no-default-features
      - name: Generate actual compiler output
        run: |
          set -euo pipefail
          mkdir -p target/wind-integration-evidence
          test "$(git rev-parse HEAD)" = a33a30c734dcfcaa2b2d1637a2a50e40fe249705
          test -z "$(git status --porcelain)"
          rustc -Vv > target/wind-integration-evidence/toolchain.txt
          cargo -V >> target/wind-integration-evidence/toolchain.txt
          git rev-parse HEAD > target/wind-integration-evidence/source-sha.txt
          sha256sum target/debug/zfb > target/wind-integration-evidence/compiler-sha256.txt
          target/debug/zfb -V > target/wind-integration-evidence/compiler-version.txt
          node docs/scripts/wind-preview-assets.mjs --compiler "$PWD/target/debug/zfb"
          node docs/scripts/wind-preview-assets.mjs --compiler "$PWD/target/debug/zfb" --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: own-product-wind-assets
          path: |
            docs/public/wind-examples/
            target/wind-integration-evidence/
          if-no-files-found: error
          retention-days: 7

  verify-docs:
    name: Verify pinned bilingual Wind docs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: a33a30c734dcfcaa2b2d1637a2a50e40fe249705

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated guide preview sources
        run: node docs/scripts/generate-wind-guide-previews.mjs --check

      - name: Check generated English utility references
        run: node docs/scripts/generate-wind-reference.mjs --locale en --check

      - name: Check generated Japanese utility references
        run: node docs/scripts/generate-wind-reference.mjs --locale ja --check

      - name: Audit exact wind docs and source coverage
        run: node --test docs/scripts/__tests__/audit-wind-docs-coverage.test.mjs

      - name: Test utility reference generator contract
        run: pnpm exec vp test run scripts/__tests__/generate-wind-reference.test.mjs

      - name: Build docs
        run: pnpm --filter docs build

      - name: Type-check docs
        run: pnpm --filter docs check

      - name: Validate emitted HTML
        run: pnpm --filter docs check:html

      - name: Assert emitted island markers
        run: pnpm --filter docs check:islands

      - name: Check wrangler pin
        run: pnpm --filter docs check:wrangler-pin

      - name: Test built docs verification contracts
        run: node --test docs/scripts/__tests__/audit-wind-built-anchors.test.mjs docs/scripts/__tests__/build-wind-docs-base.test.mjs docs/scripts/__tests__/assert-island-markers.test.mjs docs/scripts/__tests__/wind-pilot-assets.test.mjs docs/scripts/__tests__/generate-wind-guide-previews.test.mjs docs/scripts/__tests__/audit-wind-built-links.test.mjs

      - name: Audit preserved built routes and anchors
        run: node docs/scripts/audit-wind-built-anchors.mjs docs/dist

      - name: Audit built Markdown links and fragments
        run: node docs/scripts/audit-wind-built-links.mjs docs/dist

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Confirm root docs previews in Chromium
        env:
          WIND_DOCS_SCREENSHOT_DIR: ${{ runner.temp }}/wind-docs-screenshots/root
        run: pnpm exec playwright test --config tests/docs-wind-preview/playwright.config.mjs

      - name: Build genuine subpath docs
        run: node docs/scripts/build-wind-docs-base.mjs /wind-docs-preview/

      - name: Audit subpath built routes and anchors
        run: node docs/scripts/audit-wind-built-anchors.mjs docs/dist

      - name: Audit subpath Markdown links and fragments
        run: node docs/scripts/audit-wind-built-links.mjs docs/dist --base /wind-docs-preview/

      - name: Confirm subpath docs previews in Chromium
        env:
          WIND_DOCS_BASE: /wind-docs-preview/
          WIND_DOCS_SCREENSHOT_DIR: ${{ runner.temp }}/wind-docs-screenshots/subpath
        run: pnpm exec playwright test --config tests/docs-wind-preview/playwright.config.mjs

      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wind-docs-browser-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/wind-docs-screenshots
            /tmp/zfb-wind-doc-preview-results
          if-no-files-found: ignore
