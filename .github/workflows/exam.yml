# Native coverage contract and qualification procedure: scripts/native-exam.md
name: exam

on:
  schedule:
    # Weekly, Saturday 04:17 UTC — an off-minute quiet hour, deliberately not
    # a round number, and a DIFFERENT day than drift-net.yml's Wednesday
    # 03:43 UTC cron so the two weekly exam lanes don't collide on the same
    # day's shared-runner load.
    - cron: "17 4 * * 6"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full lowercase source commit SHA (must contain native exam scripts)
        required: true
        type: string

concurrency:
  group: exam-v2-${{ github.ref }}-${{ inputs.source_sha || github.sha }}
  cancel-in-progress: false

# Default to least privilege; jobs that file/close tracking issues opt into
# issues: write below.
permissions:
  contents: read

jobs:
  source:
    name: Validate exact exam source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
    steps:
      - name: Validate SHA syntax
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: '[[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - id: validate
        env:
          REQUESTED_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test -f scripts/native-exam.py
          test -f .github/actions/native-exam-setup/action.yml
          echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

  quarantine-heavy:
    needs: source
    name: Quarantine/heavy manifest (ubuntu-latest)
    runs-on: ubuntu-latest
    # Job-level permissions override: this job calls scripts/file-exam-issue.sh
    # directly on its own failure (see header). A job-level `permissions:`
    # block REPLACES the workflow default, so contents:read must be restated.
    permissions:
      contents: read
      issues: write
    # cargo build --workspace --all-targets pays the same V8 first-compile
    # cost as health.yml (15-30 min cold, cache-hit fast) plus the manifest's
    # own runtime (3 heavy dev-server e2e tests + version_stamp's own full
    # `cargo run` recompile). Generous headroom for a weekly, non-gating job.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      rc: ${{ steps.run_manifest.outputs.rc }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          toolchain: 1.99.1

      # Same install mechanism as health.yml (issue #1340): SHA-pinned action,
      # checksum-verified prebuilt binary, no compile cost.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: nextest@0.9.148

      # Swatinem/rust-cache derives its actual cache key from prefix-key PLUS
      # github.job by default (verified via run 28696339118's key
      # `v2-zfb-quarantine-heavy-...`) — a same-looking `prefix-key: "v2-zfb"`
      # here does NOT reuse health.yml's `health`-job cache; it silently forms
      # a separate ~733MB family (issue #1394 caught this stale claim). Both
      # jobs run the IDENTICAL `cargo build --workspace --all-targets` on the
      # same toolchain against the same lockfiles, so the compiled target/
      # tree really is interchangeable between them — a shared-key is a net
      # win here (one of the two jobs pays the cold V8 compile, the other
      # restores it), unlike exam's macos-exam leg below which never overlaps
      # with anything on Linux. `shared-key` replaces the job-derived
      # component of the key outright, so both this step and health.yml's
      # `health` job's rust-cache step must use the exact same value.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: "v2-zfb"
          shared-key: "workspace-all-targets"

      # Staged-binaries cache (issue 2385) — see health.yml's identically
      # named step for the full rationale. Same key as health.yml's x86_64
      # jobs.
      - name: Cache staged esbuild binary (issue 2385)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          # Only the gitignored executable slot — never the whole dir:
          # crates/zfb/binaries/ also holds TRACKED files (.gitkeep, READMEs),
          # and an exact-key restore would untar stale cached copies of those
          # over the checkout whenever a PR edits them without touching the
          # hashed pin files (codex review, zfb#2385 PR).
          path: |
            crates/zfb/binaries/esbuild/esbuild
          key: zfb-staged-binaries-v1-x86_64-unknown-linux-gnu-${{ hashFiles('crates/zfb/build.rs', 'crates/zfb-toolchain-pins/src/lib.rs') }}

      - run: pnpm install --frozen-lockfile

      # Compiles every target AND triggers crates/zfb's build.rs to download +
      # SHA-verify + stage the pinned esbuild binary into
      # its crates/zfb/binaries/ slot — the same side effect health.yml's
      # esbuild staging step relies on.
      - run: cargo build --workspace --all-targets

      # Guard mirroring health.yml's "Assert esbuild was provisioned" step
      # (issue #638): if the binary failed to stage, the env-gate tests
      # below would either error clearly (good) or, worse, be silently
      # skipped by --run-ignored not matching anything real. Fail loudly here
      # instead of discovering a silent gap in the manifest run's log.
      - name: Assert esbuild binary was provisioned
        run: |
          ESBUILD_SLOT="crates/zfb/binaries/esbuild/esbuild"
          if [ ! -x "$ESBUILD_SLOT" ]; then
            echo "::error::$ESBUILD_SLOT not staged — the env-gated manifest tests would not run for real. Failing the job instead."
            exit 1
          fi
          "$ESBUILD_SLOT" --version

      # The reconciled manifest, env-gate + heavy tags only (55 exact-name
      # entries after issue #3412 — see crates/CLAUDE.md's manifest table for
      # the authoritative list; this filterset's own count has drifted from
      # that table's total before, so re-measure both rather than trusting
      # either — scripts/check-exam-ignore-parity.sh (issue #2072) now does
      # that re-measurement mechanically instead of by manual audit). No
      # pending-feature-tagged tests exist as of #1504's
      # reconciliation, so there is nothing left to deliberately exclude here
      # — a future pending-feature #[ignore] would still be left out of this
      # filterset (it would just fail every run with no new information)
      # until its blocking issue resolves.
      # ZFB_ESBUILD_BIN must be an absolute path: nextest
      # (like plain `cargo test`) runs each test binary with its CWD set to
      # the owning package directory, not the workspace root, so the crates'
      # relative default binary_path (`crates/zfb/binaries/...`) would not
      # resolve — same reasoning as health.yml's ZFB_ESBUILD_BIN wiring.
      #
      # rc is captured explicitly (not via continue-on-error) and the step
      # always exits 0 — see the header comment for why.
      # Quoted (issue #1394): an unquoted `#` preceded by whitespace starts a
      # YAML comment, so this step's name silently rendered as just "Run the"
      # in the Actions UI — verified via `yaml.safe_load` before the fix.
      - name: "Run the #1337 quarantine/heavy manifest (env-gate + heavy tags)"
        id: run_manifest
        shell: bash
        env:
          ZFB_ESBUILD_BIN: ${{ github.workspace }}/crates/zfb/binaries/esbuild/esbuild
        run: |
          mkdir -p target/nextest-logs
          set +e
          cargo nextest run --workspace --profile ci --run-ignored ignored-only -E '
            test(=subprocess_bundler_against_real_binary)
              | test(=shared_bundle_keeps_islands_with_no_top_level_side_effect)
              | test(=splitting_emits_chunk_for_dynamic_import)
              | test(=no_dynamic_import_yields_single_file)
              | test(=client_script_real_esbuild_bundles_discovered_entry)
              | test(=client_script_shadow_jobs_resolve_project_tsconfig_aliases)
              | test(=islands_shadow_raw_import_bundles_text)
              | test(=client_script_raw_import_bundles_text)
              | test(=island_module_worker_emits_contract_companion_and_dev_layout)
              | test(=module_worker_define_only_change_updates_query_and_emitted_bytes)
              | test(=module_worker_package_config_switch_updates_query_and_emitted_bytes)
              | test(=module_worker_plugin_inputs_update_query_closure_and_emitted_bytes)
              | test(=island_css_import_bundles_without_error)
              | test(=island_module_css_import_bundles_without_error)
              | test(=islands_shadow_expands_glob_and_executes)
              | test(=islands_shadow_preserve_symlinks_is_load_bearing)
              | test(=real_binary_build_and_dev_cover_client_bundling_contract)
              | test(=wrangler_dry_run_attaches_runtime_wasm_as_compiled_module)
              | test(=commands::build::tests::preprocessing_shadows_bundle_nested_alias_raw_and_workers_with_real_esbuild)
              | test(=commands::build::tests::plugin_alias_only_client_preprocessing_triggers_shadow_with_real_esbuild)
              | test(=render_pipeline::tests::eval_deferred_paths_via_worker_embedded_v8_non_literal_paths)
              | test(=version_stamp_from_env)
              | test(=e2e_src_component_edit_rerenders_route)
              | test(=e2e_transitive_css_import_refreshes_stylesheet)
              | test(=e2e_package_css_export_remap_refreshes_stylesheet)
              | test(=e2e_new_utility_class_in_component_is_emitted)
              | test(=e2e_dev_watches_workspace_sibling_raw_and_worker_sources)
              | test(=e2e_dev_sibling_wind_utility_class_refreshes_served_css)
              | test(=e2e_3163_root_site_ssr_workspace_json_edit_is_served)
              | test(=e2e_3163_nested_site_ssr_workspace_deps_including_post_boot_import_are_served)
              | test(=e2e_3163_nested_site_compiled_dist_sibling_edit_is_served)
              | test(=e2e_3926_ignored_undeclared_sibling_writes_do_not_tick)
              | test(=e2e_3163_restart_serves_ssr_workspace_edit_made_before_the_stop)
              | test(=e2e_3163_deferred_cold_boot_ssr_workspace_json_edit_is_served)
              | test(=e2e_3239_root_claimed_workspace_json_first_edit)
              | test(=e2e_3190_root_site_ssr_workspace_json_edit_right_after_ready_is_served)
              | test(=e2e_3190_edit_before_the_watcher_is_armed_is_served)
              | test(=e2e_3202_page_entry_edit_before_the_watcher_is_armed_is_served)
              | test(=e2e_3202_content_entry_edit_before_the_watcher_is_armed_is_served)
              | test(=e2e_3202_client_raw_target_edit_before_the_watcher_is_armed_is_served)
              | test(=e2e_3210_static_html_page_edit_before_the_watcher_is_armed_is_served)
              | test(=e2e_3210_injected_route_entrypoint_edit_before_the_watcher_is_armed_is_served)
              | test(=sibling_only_utility_class_reaches_wind_source_scan_and_is_emitted)
              | test(=sibling_generated_dir_utility_class_is_excluded_from_wind_source_scan)
              | test(=islands_shadow_alias_raw_import_bundles_text)
              | test(=shared_bundle_discovers_marked_glue_and_wasm_resources)
              | test(=stage_escape_audit_rejects_workspace_package_symlink_escape)
              | test(=stage_escape_audit_accepts_staged_symlink_through_symlink_aliased_working_dir)
              | test(=real_binary_build_and_dev_cover_pnpm_workspace_raw_hardening_contract)
              | test(=real_binary_build_and_dev_cover_workspace_reroot_host_contract)
              | test(=sibling_mdx_utility_class_reaches_dev_css_scan)
              | test(=cold_redirects_rewrite_target_is_prewarmed_and_resolves)
              | test(=ssr_only_healthy_deferred_publish_reloads_open_tab)
              | test(=ssr_only_cold_bootstrap_recovery_reloads_open_tab)
              | test(=embedded_host_matches_real_workerd_for_supported_rows_and_documented_divergences)
              | test(=e2e_poll_backend_content_edit_and_new_entry_discovery)
          ' 2>&1 | tee target/nextest-logs/exam-quarantine.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # Flaky telemetry (issue #1394): this job runs under `--profile ci`
      # (retries = 1, same as health.yml) but until now discarded
      # target/nextest/ci/junit.xml entirely — a pass-on-retry here left zero
      # trace, violating CLAUDE.md's "pass-on-retry is a triage signal, not a
      # success" policy on the lane most likely to actually flake (heavy e2e +
      # a full recompile). Mirrors health.yml's "Upload nextest JUnit reports"
      # step (~:281-290): `if: always()` uploads on every run, not just
      # failures, since a pass-on-retry only shows up in an otherwise-green run.
      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-junit-exam-quarantine
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

      # Consumes the JUnit report just uploaded to make the flaky-test policy
      # mechanically real on this leg too — same script + `if: always()` as
      # health.yml's "Detect and report flaky tests" step (~:319-324).
      - name: Detect and report flaky tests
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report-flaky-tests.sh target/nextest/ci/junit.xml

      - name: Upload exam log (on failure)
        if: steps.run_manifest.outputs.rc != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exam-quarantine-log
          path: target/nextest-logs/exam-quarantine.log
          if-no-files-found: warn
          retention-days: 14

      # Fail-closed gate (issues #1394, #2928). A bare
      # `steps.run_manifest.outputs.rc != '0'` implicitly ANDs in `success()`
      # (GitHub Actions' default for any `if:` referencing none of always()/
      # failure()/cancelled()), so a job that failed BEFORE this step — the
      # esbuild staging assert above, or a compile error in
      # `cargo build --workspace --all-targets` — filed nothing at all.
      # `always()` did not rescue that, though this comment used to claim it
      # did. The old claim was that an unset `outputs.rc` makes `'' != '0'`
      # true. It does not. GitHub never carries an unwritten output as an
      # empty string: it omits the key, so the reference is null, the
      # comparison coerces null to 0, and `!= '0'` is FALSE — measured in run
      # 34105846729 case A (this exact condition observed skipping) and again
      # by inspecting the raw outputs object, which comes back `{}`. The
      # fallback was skipped in precisely the case it was written for.
      # `failure()` covers the never-ran case outright and does not touch the
      # comparison at all. The rule being enforced: a result that cannot tell
      # "never ran" apart from "passed" is not a proof, so absence has to read
      # as red and file. `!cancelled()` is the other half — a cancelled run (a
      # workflow_dispatch landing on a scheduled one, a manual cancel, a
      # `timeout-minutes` expiry) has no result behind it and must not file.
      - name: File or comment on tracking issue (failure)
        if: ${{ !cancelled() && (failure() || steps.run_manifest.outputs.rc != '0') }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LEG: "quarantine/heavy manifest (ubuntu-latest)"
        run: bash scripts/file-exam-issue.sh "exam"

  macos-shards:
    name: macOS native shard ${{ matrix.shard }}/4
    needs: source
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-exam-setup
      - name: Run native partition (capture actual exit)
        env:
          SHARD: ${{ matrix.shard }}
        run: bash scripts/run-native-exam.sh "shard-$SHARD"
      - name: Upload native shard evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-exam-shard-${{ matrix.shard }}
          path: target/native-exam/
          if-no-files-found: error
          retention-days: 3

  macos-doctests:
    name: macOS native doctests
    needs: source
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/native-exam-setup
      - run: bash scripts/run-native-exam.sh doctests
      - name: Upload native doctest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-exam-doctests
          path: target/native-exam/
          if-no-files-found: error
          retention-days: 3

  macos-exam:
    name: Reconcile full native macOS evidence
    needs: [source, macos-shards, macos-doctests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      rc: ${{ steps.aggregate.outputs.rc }}
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.source.outputs.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: native-exam-*
          path: native-evidence
      - name: Fail-closed coverage reconciliation
        id: aggregate
        if: always()
        env:
          SHARDS_RESULT: ${{ needs.macos-shards.result }}
          DOCTESTS_RESULT: ${{ needs.macos-doctests.result }}
        run: |
          set +e
          python3 scripts/native-exam.py aggregate native-evidence > native-summary.json 2> native-errors.txt
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat native-summary.json native-errors.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Preserve reporter diagnostics
        if: always()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/report-flaky-tests.sh native-evidence/native-exam-shard-*/junit.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: native-summary
          path: |
            native-summary.json
            native-errors.txt
          retention-days: 3
      - name: File or comment on tracking issue (failure)
        if: ${{ !cancelled() && failure() }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LEG: macOS full workspace evidence reconciliation (four shards + doctests)
        run: bash scripts/file-exam-issue.sh exam

  close-tracking-issue-if-green:
    # Both Linux's actual rc and the fail-closed Mac aggregate must pass.
    # Missing outputs are not evidence (#2928): retain the job-result gates.
    # Manual qualification (including older SHAs) never closes a recovery issue.
    name: Close exam tracking issue if both legs are green
    needs: [source, quarantine-heavy, macos-exam]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Close tracking issue (both legs green)
        if: ${{ github.event_name == 'schedule' && needs.source.outputs.sha == github.sha && needs.quarantine-heavy.result == 'success' && needs.macos-exam.result == 'success' && needs.quarantine-heavy.outputs.rc == '0' && needs.macos-exam.outputs.rc == '0' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/file-exam-issue.sh "exam" --green

  notify:
    # Alerting guard: a red leg otherwise sits unseen in the Actions tab
    # between someone actually looking — nobody watches a scheduled run the
    # way a release is watched live. Same IFTTT pattern as release.yml's /
    # drift-net.yml's `notify` job (issue #1335), keyed on the two test jobs'
    # `outputs.rc` for the same reason as the close job above.
    #
    # The rc comparison below is SHELL, not a workflow expression, and that
    # is what makes it safe without the close job's `.result` conjunct: an
    # absent output reaches `env:` as the EMPTY STRING, and `[ "" != "0" ]`
    # is true, so a leg that died before writing rc still notifies. The same
    # `rc != '0'` written as an `if:` expression would be FALSE (the null
    # coerces to 0 — see the close job's comment and #2928), silencing the
    # alert. Do not "align" this job with the close job by hoisting the
    # comparison into an `if:`.
    name: Notify via IFTTT on failure
    needs: [source, quarantine-heavy, macos-exam]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IFTTT_PROD_NOTIFY: ${{ secrets.IFTTT_PROD_NOTIFY }}
    steps:
      - name: Notify via IFTTT on failure
        if: env.IFTTT_PROD_NOTIFY != ''
        env:
          QUARANTINE_RC: ${{ needs.quarantine-heavy.outputs.rc }}
          MACOS_RC: ${{ needs.macos-exam.outputs.rc }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          FAILED_LEG=""
          if [ "$QUARANTINE_RC" != "0" ]; then
            FAILED_LEG="quarantine/heavy manifest"
          fi
          if [ "$MACOS_RC" != "0" ]; then
            if [ -n "$FAILED_LEG" ]; then
              FAILED_LEG="${FAILED_LEG}, macOS full workspace"
            else
              FAILED_LEG="macOS full workspace"
            fi
          fi

          if [ -z "$FAILED_LEG" ]; then
            echo "Both legs green — skipping notification."
            exit 0
          fi

          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          curl -sSf --max-time 10 -X POST "$IFTTT_PROD_NOTIFY" \
            -H 'Content-Type: application/json' \
            -d "{
              \"value1\": \"exam failed (${FAILED_LEG})\",
              \"value2\": \"weekly quarantine/heavy + macOS re-exam\",
