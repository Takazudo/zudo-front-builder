name: Temporary 4.0.0 remaining docs release checks
'on':
  pull_request: null
permissions:
  contents: read
concurrency:
  group: release-focused-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    name: Candidate docs host, strict build and HTML
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EVIDENCE_DIR: /tmp/zfb-release-focused-${{ github.run_id }}
    steps:
    - name: Initialize retained evidence
      shell: bash
      run: 'set -euo pipefail

        mkdir -p "$EVIDENCE_DIR/logs"

        printf ''requested_source=882e98eabe7c8d5425e73bdc1a34cea7e3f55f43\nrequested_version=4.0.0\n'' > "$EVIDENCE_DIR/identity.txt"

        '
    - name: Checkout exact candidate
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      with:
        ref: 882e98eabe7c8d5425e73bdc1a34cea7e3f55f43
        persist-credentials: false
    - name: Guard source, version, and disk
      shell: bash
      run: "set -euo pipefail\nexec > >(tee \"$EVIDENCE_DIR/logs/source-and-disk.log\") 2>&1\ntest \"$(git rev-parse HEAD)\"\
        \ = '882e98eabe7c8d5425e73bdc1a34cea7e3f55f43'\nnode --input-type=module -e '\n  import { readFileSync } from \"node:fs\"\
        ;\n  const expected = process.argv[1];\n  const path = \"packages/zfb/package.json\";\n  const actual = JSON.parse(readFileSync(path,\
        \ \"utf8\")).version;\n  if (actual !== expected) throw new Error(`${path}: expected ${expected}, got ${actual}`);\n\
        ' '4.0.0'\navailable_kib=\"$(df -Pk \"$GITHUB_WORKSPACE\" | awk 'NR == 2 {print $4}')\"\n[[ \"$available_kib\" =~\
        \ ^[0-9]+$ ]]\navailable_bytes=$((available_kib * 1024))\nprintf 'source=%s\\nrunner=%s %s\\ndisk_available_bytes=%s\\\
        n' \\\n  \"$(git rev-parse HEAD)\" \"$(uname -s)\" \"$(uname -m)\" \"$available_bytes\" | tee -a \"$EVIDENCE_DIR/identity.txt\"\
        \nif (( available_bytes < 8 * 1024 * 1024 * 1024 )); then\n  echo 'Less than 8 GiB free before native compile' >&2\n\
        \  exit 1\nfi\nif (( available_bytes < 20 * 1024 * 1024 * 1024 )); then\n  echo 'CARGO_PROFILE_DEV_DEBUG=0' >> \"\
        $GITHUB_ENV\"\n  echo 'Reduced Rust debug info because available disk is below 20 GiB' | tee -a \"$EVIDENCE_DIR/identity.txt\"\
        \nfi\n"
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
    - name: Set up Node 24.14.0 and pnpm cache
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 24.14.0
        cache: pnpm
    - name: Record pinned toolchain and install dependencies
      shell: bash
      run: 'set -euo pipefail

        exec > >(tee "$EVIDENCE_DIR/logs/install.log") 2>&1

        test "$(node --version)" = v24.14.0

        test "$(pnpm --version)" = 12.8.2

        node --version

        pnpm --version

        pnpm install --frozen-lockfile

        '
    - name: Check docs with the supported pinned docs host
      shell: bash
      run: 'set -euo pipefail

        node -p "require(''./docs/package.json'').dependencies[''@takazudo/zfb'']"

        pnpm --filter docs check 2>&1 | tee "$EVIDENCE_DIR/logs/docs-check.log"

        '
    - name: Build docs strictly with the supported pinned docs host
      shell: bash
      run: 'set -euo pipefail

        pnpm --filter docs build 2>&1 | tee "$EVIDENCE_DIR/logs/docs-build.log"

        '
    - name: Validate built HTML
      shell: bash
      run: 'set -euo pipefail

        pnpm --filter docs check:html 2>&1 | tee "$EVIDENCE_DIR/logs/docs-html.log"

        '
    - name: Check Markdown WASM size documentation
      shell: bash
      run: 'set -euo pipefail

        node scripts/assert-md-wasm-size-docs.mjs 2>&1 | tee "$EVIDENCE_DIR/logs/md-wasm-size-docs.log"

        '
    - name: Record final source, CLI, and disk identity
      if: always()
      shell: bash
      run: "set -euo pipefail\n{\n  git rev-parse HEAD\n  git status --short\n  if test -x \"$GITHUB_WORKSPACE/target/debug/zfb\"\
        ; then\n    sha256sum \"$GITHUB_WORKSPACE/target/debug/zfb\"\n  fi\n  df -h \"$GITHUB_WORKSPACE\"\n} 2>&1 | tee \"\
        $EVIDENCE_DIR/logs/final-identity.log\"\n"
    - name: Upload focused check evidence, including failures
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-focused-${{ github.run_id }}
        path: ${{ env.EVIDENCE_DIR }}/
        if-no-files-found: error
        retention-days: 7
