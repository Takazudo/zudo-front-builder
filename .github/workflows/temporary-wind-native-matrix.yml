# Preparation only. Replace c4ded4b1fdd56cf0ff27afd98923c707f5ae2f37 and revalidate final integrated CLI before use. Expanded matrix recipe after cec6bba4; no execution evidence by itself.
name: Temporary checked Wind baseline admission
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: wind-harness-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      WIND_PINNED_SOURCE_ARCHIVE: /tmp/zfb-wind-reference-cache/response-1d73680e19488b19e97ea3c96722e363cc0c4fd118af546857d8703e8f0f9be3
      WIND_NPM_TARBALL: /tmp/zfb-wind-reference-cache/response-3673da9004404d12d4672bb5d002945319c2b3dea8c13ea022fdd33a3e260e62
      WIND_COMPILER_MODULE: /tmp/zfb-wind-reference-cache/tailwindcss-4.3.2-3673da9004404d12d4672bb5d002945319c2b3dea8c13ea022fdd33a3e260e62/dist/lib.mjs
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: c4ded4b1fdd56cf0ff27afd98923c707f5ae2f37
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.14.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: v2-zfb
          shared-key: workspace-all-targets
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Record exact source and environment
        run: |
          set -euo pipefail
          mkdir -p /tmp/wind-harness-evidence
          test "$(git rev-parse HEAD)" = c4ded4b1fdd56cf0ff27afd98923c707f5ae2f37
          test -z "$(git status --porcelain)"
          {
            git rev-parse HEAD
            node --version
            pnpm --version
            rustc -Vv
            cargo -V
            cat /etc/os-release
            uname -a
          } > /tmp/wind-harness-evidence/environment.txt
      - name: Acquire independently pinned reference inputs
        run: |
          set -euo pipefail
          node scripts/wind-compatibility/reference-cli.mjs plan > /tmp/wind-harness-evidence/plan.json
          node scripts/wind-compatibility/reference-cli.mjs acquire --cache /tmp/zfb-wind-reference-cache > /tmp/wind-harness-evidence/acquire.json
          node scripts/wind-compatibility/reference-cli.mjs probe --cache /tmp/zfb-wind-reference-cache --candidates block,hidden,p-0,mx-auto,contents > /tmp/wind-harness-evidence/reference-probe.json
          node scripts/wind-compatibility/reference-cli.mjs assess --plan /tmp/wind-harness-evidence/plan.json --cache /tmp/zfb-wind-reference-cache > /tmp/wind-harness-evidence/assessment.json
          node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("/tmp/wind-harness-evidence/assessment.json")); if(r.status!=="ready-for-comparison") throw Error("Incomplete upstream capture")'
          test -s "$WIND_PINNED_SOURCE_ARCHIVE"
          test -s "$WIND_NPM_TARBALL"
          test -s "$WIND_COMPILER_MODULE"
      - name: Contract tests with all pinned-input cases enabled
        run: |
          set -euo pipefail
          node --test tests/wind-compatibility/*.test.mjs tests/wind-compatibility/reference/*.test.mjs tests/wind-compatibility/empty-token/*.test.mjs tests/wind-compatibility/corpus/*.test.mjs 2>&1 | tee /tmp/wind-harness-evidence/node-contracts.log
          cargo fmt --all -- --check
          cargo test --locked -p zudo-wind --test empty_token_contracts 2>&1 | tee /tmp/wind-harness-evidence/rust-empty-token.log
      - name: Install declared browser matrix
        run: node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Run complete required Wind verification
        run: bash scripts/wind-compatibility/ci-run.sh full
      - name: Verify generated EN and JA data and actual preview freshness
        run: |
          set -euo pipefail
          node docs/scripts/generate-wind-reference.mjs --locale en --check
          node docs/scripts/generate-wind-reference.mjs --locale ja --check
          production_binary=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).binaryPath' "$RUNNER_TEMP/wind-gate/production/production-build.json")
          node docs/scripts/wind-preview-assets.mjs --compiler "$production_binary" --check
          test -z "$(git status --porcelain)"
      # Explicit one-time bootstrap operation in this disposable workflow only.
      # The manager must review all original evidence before committing the pair.
      - name: Propose checked ephemeral bootstrap admission
        run: |
          set -euo pipefail
          node scripts/wind-compatibility/bootstrap-admission.mjs bootstrap --evidence "$RUNNER_TEMP/wind-gate" --cache "$RUNNER_TEMP/wind-reference-cache"
          test -z "$(git status --porcelain)"
      - name: Preserve original evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wind-checked-admission-evidence
          path: |
            /tmp/wind-harness-evidence/
            /tmp/zfb-wind-reference-cache/
            ${{ runner.temp }}/wind-gate/
            ${{ runner.temp }}/wind-reference-cache/
            test-results/
          if-no-files-found: error
          retention-days: 7
