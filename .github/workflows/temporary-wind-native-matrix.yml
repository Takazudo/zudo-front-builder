name: Temporary independent native margin diagnosis
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: wind-harness-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-margin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: dfa68c588f8e2c43313aac5489dc4c88b9e646d0
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: dfa68c588f8e2c43313aac5489dc4c88b9e646d0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Observe independent authored native CSS
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = dfa68c588f8e2c43313aac5489dc4c88b9e646d0
          test -z "$(git status --porcelain)"
          mkdir -p /tmp/native-margin-evidence
          cat > /tmp/native-margin-evidence/probe.mjs <<'NATIVE_SCRIPT'
          import { chromium, firefox, webkit } from '@playwright/test';
          import { readFile, writeFile, mkdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          import { browserIdentity } from './scripts/wind-compatibility/browser-adapter.mjs';
          const output = '/tmp/native-margin-evidence';
          await mkdir(output, { recursive: true });
          const hash = value => createHash('sha256').update(value).digest('hex');
          const source = await readFile('tests/wind-compatibility/pilot/mx-auto/index.html', 'utf8');
          const styles = {
            'physical-auto': '.mx-auto{margin-left:auto;margin-right:auto}',
            'logical-auto': '.mx-auto{margin-inline:auto}',
            'physical-zero': '.mx-auto{margin-left:0;margin-right:0;margin-top:0;margin-bottom:0}',
          };
          const report = { kind: 'independent-native-margin-diagnosis', source: process.env.SOURCE_SHA, node: process.version, interpretation: 'observations only; no compatibility admission or expected-value update', browsers: {}, results: [] };
          for (const [engine, type] of Object.entries({ chromium, firefox, webkit })) {
            const executable = type.executablePath();
            const browser = await type.launch({ executablePath: executable });
            report.browsers[engine] = await browserIdentity(browser, executable);
            try {
              for (const writingMode of ['horizontal-tb', 'vertical-rl', 'vertical-lr']) {
                for (const direction of ['ltr', 'rtl']) {
                  for (const [kind, css] of Object.entries(styles)) {
                    const id = `${engine}-${writingMode}-${direction}-${kind}`;
                    const html = source.replace('</head>', `<link rel="stylesheet" href="https://native-margin.invalid/style.css"><style>#box{width:300px;height:300px;writing-mode:${writingMode};direction:${direction}}</style></head>`);
                    const context = await browser.newContext({ viewport: { width: 800, height: 700 }, deviceScaleFactor: 1, reducedMotion: 'no-preference', colorScheme: 'light' });
                    try {
                      await context.route('https://native-margin.invalid/style.css', route => route.fulfill({ status: 200, contentType: 'text/css; charset=utf-8', body: css }));
                      await context.route('https://native-margin.invalid/fixture', route => route.fulfill({ status: 200, contentType: 'text/html; charset=utf-8', body: html }));
                      const page = await context.newPage();
                      const responsePromise = page.waitForResponse('https://native-margin.invalid/style.css');
                      await page.goto('https://native-margin.invalid/fixture', { waitUntil: 'load' });
                      const response = await responsePromise;
                      const served = await response.body();
                      const observed = await page.evaluate(async () => {
                        await document.fonts.ready;
                        const target = document.querySelector('#target'), parent = document.querySelector('#box');
                        const style = getComputedStyle(target), box = target.getBoundingClientRect(), parentBox = parent.getBoundingClientRect();
                        return { margins: Object.fromEntries(['margin-left','margin-right','margin-top','margin-bottom'].map(name => [name, style.getPropertyValue(name)])), writingMode: style.writingMode, direction: style.direction, specifiedStyle: target.getAttribute('style'), box: { x: box.x-parentBox.x, y: box.y-parentBox.y, width: box.width, height: box.height, parentWidth: parentBox.width, parentHeight: parentBox.height }, cssRules: [...document.styleSheets].flatMap(sheet => [...sheet.cssRules].map(rule => rule.cssText)) };
                      });
                      if (response.status() !== 200 || hash(served) !== hash(css)) throw Error(`Native CSS delivery failed: ${id}`);
                      await writeFile(`${output}/${id}.html`, html);
                      await writeFile(`${output}/${id}.css`, css);
                      report.results.push({ id, engine, kind, writingMode, direction, stylesheetSha256: hash(css), servedSha256: hash(served), documentSha256: hash(html), cssStatus: response.status(), observed });
                    } finally { await context.close(); }
                  }
                }
              }
            } finally { await browser.close(); }
          }
          await writeFile(`${output}/report.json`, JSON.stringify(report, null, 2)+'\n');
          console.log(`Recorded ${report.results.length} independent native CSS observations`);
          NATIVE_SCRIPT
          node --input-type=module < /tmp/native-margin-evidence/probe.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: independent-native-margin-evidence
          path: /tmp/native-margin-evidence/
          if-no-files-found: error
          retention-days: 7
