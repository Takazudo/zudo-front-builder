# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Docs Checks

# Split out of pr-checks.yml (issue #1336) so pure-Rust PRs stop paying for the
# docs build. Until #2827 the whole workflow was path-filtered at the trigger,
# which is why it could never be a required check: a path-skipped workflow's
# checks sit "Pending" forever on unrelated PRs, so GitHub happily merged a
# docs PR while this build was still running.
#
# #2827 keeps the cost saving but moves the path gate to JOB level, the same
# detector pattern health.yml uses for its optional wasm-md jobs:
#
#   changed-files  — always runs (~5s, API only, no checkout); decides whether
#                    the docs closure changed.
#   build          — the strict docs build; runs only when it did.
#   docs-gate      — ALWAYS reports. This is the ONE context from this
#                    workflow that the `main` ruleset requires
#                    (scripts/apply-main-ruleset.sh, CLAUDE.md "Branch ruleset
#                    on main"). Green when `build` passed or was legitimately
#                    skipped; red when the detector or the build failed or
#                    was cancelled.
#
# Three invariants, each backed by GitHub's "Troubleshooting required status
# checks" table — break one and the gate silently stops gating:
#
#   1. NEVER re-add a workflow-level `paths:` filter. A workflow skipped by
#      path filtering leaves its checks "Pending" and blocks every unrelated
#      PR from merging.
#   2. `docs-gate` MUST keep `if: always()` and its explicit verdict. A job
#      skipped by a conditional reports "Success" to required-status-checks,
#      and a job that depends on a failed job is skipped by default — so with
#      the implicit `success()` a failed docs build would SKIP the gate and
#      the PR would be mergeable. `always()` is the only form that runs and
#      emits an explicit verdict in every terminal state, including a
#      cancelled run (issue #2827: failed OR cancelled docs checks must fail
#      the gate).
#   3. Require `Docs gate`, never `build`'s own context. `build` is job-level
#      gated (skipped on non-docs PRs) and its name collides with the
#      `Build docs site` jobs in docs-pr-preview.yml and docs-deploy.yml, so
#      a name-matched requirement could be satisfied by the wrong workflow.
on:
  pull_request:
    branches:
      - main
      - "base/**"
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: docs-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Mirrors the former workflow-level `paths:` list (plus .npmrc, which pnpm
  # reads at install time) — keep it in sync with the docs build's real input
  # closure (docs/**, the root manifests and rc that resolve docs/'s
  # dependencies, and this workflow file itself).
  changed-files:
    name: changed-files (docs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level `permissions:` REPLACES the workflow default, so contents:read
    # is restated. pull-requests:read is what paths-filter needs to list the
    # PR's changed files through the REST API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      wind_previews: ${{ steps.filter.outputs.wind_previews }}
    steps:
      # pull_request-only workflow: paths-filter compares against the PR base
      # through the API, so no checkout is needed (its README: "For pull
      # requests it's not necessary to checkout the code"). health.yml's copy
      # checks out with fetch-depth 0 only because it also runs on push.
      - name: Detect docs-affecting changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'scripts/__tests__/generate-wind-reference.test.mjs'
              - 'tests/docs-wind-preview/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - '.github/workflows/docs-checks.yml'
            wind_previews:
              - 'docs/wind-examples/**'
              - 'docs/public/wind-examples/**'
              - 'docs/scripts/**'
              - 'tests/docs-wind-preview/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - '.github/workflows/docs-checks.yml'

  build:
    # Named after this workflow file on purpose: docs-pr-preview.yml and
    # docs-deploy.yml also carry a job called "Build docs site", and #2823's
    # manual merge gate had to resolve the run by workflow to avoid matching
    # the wrong one. This job is NOT in the ruleset — `docs-gate` below is.
    name: Build docs site (docs-checks.yml)
    needs: changed-files
    if: ${{ needs.changed-files.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated guide preview sources
        run: node docs/scripts/generate-wind-guide-previews.mjs --check

      - name: Check generated English utility references
        run: node docs/scripts/generate-wind-reference.mjs --locale en --check

      - name: Check generated Japanese utility references
        run: node docs/scripts/generate-wind-reference.mjs --locale ja --check

      - name: Audit exact wind docs and source coverage
        run: node --test docs/scripts/__tests__/audit-wind-docs-coverage.test.mjs

      - name: Test utility reference generator contract
        run: pnpm exec vp test run scripts/__tests__/generate-wind-reference.test.mjs

      - name: Build docs
        run: pnpm --filter docs build

      - name: Type-check docs
        run: pnpm --filter docs check

      - name: Validate emitted HTML
        run: pnpm --filter docs check:html

      - name: Assert emitted island markers
        run: pnpm --filter docs check:islands

      - name: Check wrangler pin
        run: pnpm --filter docs check:wrangler-pin

      - name: Test built docs verification contracts
        run: node --test docs/scripts/__tests__/audit-wind-built-anchors.test.mjs docs/scripts/__tests__/build-wind-docs-base.test.mjs docs/scripts/__tests__/assert-island-markers.test.mjs docs/scripts/__tests__/wind-pilot-assets.test.mjs docs/scripts/__tests__/generate-wind-guide-previews.test.mjs docs/scripts/__tests__/audit-wind-built-links.test.mjs

      - name: Audit preserved built routes and anchors
        run: node docs/scripts/audit-wind-built-anchors.mjs docs/dist

      - name: Audit built Markdown links and fragments
        run: node docs/scripts/audit-wind-built-links.mjs docs/dist

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Confirm root docs previews in Chromium
        env:
          WIND_DOCS_SCREENSHOT_DIR: ${{ runner.temp }}/wind-docs-screenshots/root
        run: pnpm exec playwright test --config tests/docs-wind-preview/playwright.config.mjs

      - name: Build genuine subpath docs
        run: node docs/scripts/build-wind-docs-base.mjs /wind-docs-preview/

      - name: Audit subpath built routes and anchors
        run: node docs/scripts/audit-wind-built-anchors.mjs docs/dist

      - name: Audit subpath Markdown links and fragments
        run: node docs/scripts/audit-wind-built-links.mjs docs/dist

      - name: Confirm subpath docs previews in Chromium
        env:
          WIND_DOCS_BASE: /wind-docs-preview/
          WIND_DOCS_SCREENSHOT_DIR: ${{ runner.temp }}/wind-docs-screenshots/subpath
        run: pnpm exec playwright test --config tests/docs-wind-preview/playwright.config.mjs

      - name: Upload browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wind-docs-browser-${{ github.event.pull_request.number }}
          path: |
            ${{ runner.temp }}/wind-docs-screenshots
            /tmp/zfb-wind-doc-preview-results
          if-no-files-found: ignore

  # Dedicated workspace compiler lane. Deploy/build scripts keep consuming the
  # committed assets and never acquire a Rust prerequisite.
  wind-previews:
    name: Check workspace wind preview assets
    needs: changed-files
    if: ${{ needs.changed-files.outputs.wind_previews == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      # The workspace build script embeds Hono from node_modules/.pnpm.
      - name: Install compiler build dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          toolchain: stable
      - name: Cache workspace compiler
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: wind-preview-no-v8
      - name: Build workspace compiler without V8
        run: cargo build -p zfb --no-default-features
      - name: Test preview pipeline contracts
        run: node --test docs/scripts/__tests__/wind-preview-assets.test.mjs
      - name: Check genuine compiled preview freshness
        run: node docs/scripts/wind-preview-assets.mjs --compiler "$PWD/target/debug/zfb" --check

  # The required context. `if: always()` and the explicit fail-closed verdict
  # below are load-bearing — see invariant 2 in the header.
  docs-gate:
    name: Docs gate
    needs: [changed-files, build, wind-previews]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report gate verdict
        env:
          DETECTOR_RESULT: ${{ needs.changed-files.result }}
          DOCS_CHANGED: ${{ needs.changed-files.outputs.docs }}
          BUILD_RESULT: ${{ needs.build.result }}
          WIND_CHANGED: ${{ needs.changed-files.outputs.wind_previews }}
          WIND_RESULT: ${{ needs.wind-previews.result }}
        run: |
          set -euo pipefail
          echo "changed-files (docs): result=${DETECTOR_RESULT} docs_changed=${DOCS_CHANGED:-<unset>}"
          echo "Build docs site (docs-checks.yml): result=${BUILD_RESULT}"

          if [ "${DETECTOR_RESULT}" != "success" ]; then
            echo "::error::Docs gate: the changed-files detector ended '${DETECTOR_RESULT}', so the docs closure cannot be proven untouched."
            exit 1
          fi

          case "${BUILD_RESULT}" in
            success)
              echo "Docs gate: PASS — the strict docs build succeeded."
              ;;
            skipped)
              # Fail closed unless the detector explicitly said "false": an
              # unset/renamed output must never read as "nothing changed".
              if [ "${DOCS_CHANGED}" = "false" ]; then
                echo "Docs gate: PASS — the docs closure is untouched, build legitimately skipped."
              else
                echo "::error::Docs gate: the build was skipped but the detector reported docs_changed='${DOCS_CHANGED:-<unset>}' (expected 'false'); failing closed."
                exit 1
              fi
              ;;
            *)
              echo "::error::Docs gate: the strict docs build ended '${BUILD_RESULT}'."
              exit 1
              ;;
          esac

          case "${WIND_RESULT}" in
            success) echo "Docs gate: wind previews passed." ;;
            skipped)
              if [ "${WIND_CHANGED}" != "false" ]; then
                echo "::error::Docs gate: wind preview check skipped without an explicit untouched closure."
                exit 1
              fi
              ;;
            *)
              echo "::error::Docs gate: wind preview check ended '${WIND_RESULT}'."
              exit 1
              ;;
          esac
