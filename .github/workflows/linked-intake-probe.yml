name: Temporary linked intake verification

on:
  pull_request:
    branches: [base/sweep-261007-2-linked-package-tick-suppression]

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: nextest@0.9.138
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: v2-zfb
          shared-key: workspace-all-targets
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - run: scripts/check-exam-ignore-parity.sh
      - name: Intake unit and rule-order tests
        run: |
          set -o pipefail
          cargo test -p zfb-build linked_intake 2>&1 | tee intake-unit.log
          cargo test -p zfb-build linked_rule_change_refreshes_before_same_batch_is_filtered 2>&1 | tee -a intake-unit.log
      - name: Scoped clippy
        run: |
          set -o pipefail
          cargo clippy -p zfb-build -p zfb --tests -- -D warnings 2>&1 | tee intake-clippy.log
      - name: Exact ignored-write and declared-dist e2e
        run: |
          set -o pipefail
          cargo nextest run -p zfb --test dev_sibling_watch_1678_e2e --run-ignored all -E 'test(e2e_3926_) | test(e2e_3163_nested_site_compiled_dist_sibling_edit_is_served)' 2>&1 | tee intake-e2e.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        if: always()
        with:
          name: linked-intake-verification
          path: |
            intake-unit.log
            intake-clippy.log
            intake-e2e.log
          if-no-files-found: warn
          retention-days: 2
