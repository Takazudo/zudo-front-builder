# Finite verification collector for draft #4120; retire after evidence review.
name: Rolldown plugin alias verification (#4120)

on:
  push:
    branches: [prototype/318-rolldown-native]
    paths: [.github/workflows/rolldown-plugin-alias-verification.yml]

permissions:
  contents: read

concurrency:
  group: rolldown-4120-plugin-alias
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'Takazudo/zudo-front-builder'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # Only the final object-export step receives the token.
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      ZFB_PROBE_SOURCE: d0492c1edbb4e1c3415d5c2b7df3bcd417d5d080
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: d0492c1edbb4e1c3415d5c2b7df3bcd417d5d080
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24.14.0"
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          toolchain: "1.99.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          shared-key: rolldown-4120-debug-no-debuginfo
          cache-on-failure: true

      - name: Prepare exact lock edge and tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/plugin-alias-evidence
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import tomllib
          path = Path('Cargo.lock')
          old = path.read_bytes()
          assert sha256(old).hexdigest() == '63aa8f330710941b8dfc4e5ccad81b0f42e2baf7c6e740ad42802223bc574c43'
          before = 'name = "zfb-rolldown-prototype"\nversion = "0.0.0"\ndependencies = [\n "anyhow",\n "rolldown",\n "rolldown_common",\n "serde_json",\n "tokio",\n]'
          after = before.replace(' "rolldown_common",', ' "rolldown_common",\n "rolldown_resolver",')
          assert old.decode().count(before) == 1
          new = old.decode().replace(before, after).encode()
          assert sha256(new).hexdigest() == '13956cf2b75baea8b68442c750174714b9591d6ab7ba9f923a800c5653e1ac37'
          a, b = tomllib.loads(old.decode()), tomllib.loads(new.decode())
          changed = [(x, y) for x, y in zip(a['package'], b['package'], strict=True) if x != y]
          assert len(changed) == 1 and changed[0][0]['name'] == 'zfb-rolldown-prototype'
          path.write_bytes(new)
          PY
          pnpm install --frozen-lockfile
          npm install --prefix "$PWD/target/rolldown-plugin-tools" --no-audit --no-fund @esbuild/linux-x64@0.25.12
          echo "ZFB_ESBUILD_BIN=$PWD/target/rolldown-plugin-tools/node_modules/@esbuild/linux-x64/bin/esbuild" >> "$GITHUB_ENV"
          cargo fmt --all
          cargo fmt --all --check
          pnpm exec vp fmt --write prototypes/rolldown/plugin-prebundle.mjs
          node --check prototypes/rolldown/plugin-prebundle.mjs
          { git rev-parse HEAD; rustc -vV; node -v; pnpm -v; uname -a; sha256sum Cargo.lock pnpm-lock.yaml; } > target/plugin-alias-evidence/identity.txt

      - name: Build and test the native probe
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p zfb-rolldown-prototype --features native --example plugin_prebundle 2>&1 | tee target/plugin-alias-evidence/native-build.log
          cargo test --locked -p zfb-rolldown-prototype --features native --example plugin_prebundle 2>&1 | tee target/plugin-alias-evidence/native-tests.log
          cargo test --locked -p zfb-rolldown-prototype --features native --lib 2>&1 | tee target/plugin-alias-evidence/native-library-tests.log
          cargo check --locked -p zfb-rolldown-prototype --no-default-features --all-targets
          cargo tree --locked -p zfb-rolldown-prototype --features native > target/plugin-alias-evidence/native-dependencies.txt
          sha256sum target/debug/examples/plugin_prebundle "$ZFB_ESBUILD_BIN" > target/plugin-alias-evidence/binaries.txt

      - name: Execute original and expanded Node semantic oracles
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          node prototypes/rolldown/plugin-prebundle.mjs 2>&1 | tee target/plugin-alias-evidence/probe.log

      - name: Regenerate genuine Wind previews after source changes
        id: wind
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          unset ZFB_ESBUILD_BIN
          cargo build --locked -p zfb --no-default-features 2>&1 | tee target/plugin-alias-evidence/no-v8-build.log
          cargo tree --locked -p zfb --no-default-features > target/plugin-alias-evidence/default-dependencies.txt
          if grep -q rolldown target/plugin-alias-evidence/default-dependencies.txt; then exit 1; fi
          node --test docs/scripts/__tests__/wind-preview-assets.test.mjs 2>&1 | tee target/plugin-alias-evidence/wind-tests.log
          node docs/scripts/wind-preview-assets.mjs --compiler "$PWD/target/debug/zfb" 2>&1 | tee target/plugin-alias-evidence/wind-generation.log
          node docs/scripts/wind-preview-assets.mjs --compiler "$PWD/target/debug/zfb" --check
          node docs/scripts/generate-wind-reference.mjs --locale en --check
          node docs/scripts/generate-wind-reference.mjs --locale ja --check
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          path = 'docs/public/wind-examples/manifest.json'
          before = json.loads(subprocess.check_output(['git', 'show', f'HEAD:{path}']))
          after = json.loads(Path(path).read_text())
          before['compiler']['sourceSha256'] = after['compiler']['sourceSha256']
          assert before == after, 'Unexpected preview behavior change'
          changed = subprocess.check_output(['git', 'diff', '--name-only', '--', 'docs/public/wind-examples']).decode().splitlines()
          assert changed == [path], changed
          PY

      - name: Export exact candidate objects without updating any ref
        if: ${{ !cancelled() && steps.wind.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          allowed = {'Cargo.lock', 'crates/zfb-rolldown-prototype/examples/plugin_prebundle.rs', 'crates/zfb-rolldown-prototype/examples/plugin_prebundle/packages.rs', 'prototypes/rolldown/plugin-prebundle.mjs', 'docs/public/wind-examples/manifest.json'}
          paths = subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines()
          assert set(paths) <= allowed, paths
          assert {'Cargo.lock', 'docs/public/wind-examples/manifest.json'} <= set(paths)
          def post(endpoint, data):
              req = urllib.request.Request('https://api.github.com/repos/Takazudo/zudo-front-builder/git/' + endpoint, data=json.dumps(data).encode(), headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          entries, files = [], []
          for path in paths:
              data = Path(path).read_bytes()
              blob = post('blobs', {'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert blob['sha'] == expected
              entries.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': expected})
              files.append({'path': path, 'sha': expected, 'sha256': hashlib.sha256(data).hexdigest()})
          tree = post('trees', {'base_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}']).decode().strip(), 'tree': entries})
          result = {'source': os.environ['ZFB_PROBE_SOURCE'], 'probeOutcome': os.environ['PROBE_OUTCOME'], 'tree': tree['sha'], 'files': files, 'refUpdated': False}
          Path('target/plugin-alias-evidence/objects.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Retain source delta and outcomes
        if: always()
        shell: bash
        run: |
          mkdir -p target/plugin-alias-evidence
          git diff --binary > target/plugin-alias-evidence/candidate.patch
          git status --short > target/plugin-alias-evidence/status.txt
          cp Cargo.lock target/plugin-alias-evidence/Cargo.lock
          cp crates/zfb-rolldown-prototype/examples/plugin_prebundle.rs target/plugin-alias-evidence/
          cp crates/zfb-rolldown-prototype/examples/plugin_prebundle/packages.rs target/plugin-alias-evidence/
          cp prototypes/rolldown/plugin-prebundle.mjs target/plugin-alias-evidence/
          cp docs/public/wind-examples/manifest.json target/plugin-alias-evidence/wind-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        if: always()
        with:
          name: rolldown-plugin-alias-${{ github.run_id }}
          path: |
            target/plugin-alias-evidence/
            target/rolldown-plugin-probe/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
