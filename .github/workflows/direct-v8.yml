# pin-update: every `uses: <action>@<sha>` line is pinned to the same SHAs as
# health.yml; bump them together.
#
# Opt-in direct-V8 lane (#4302, #4303 blocker "no direct-v8 CI lane"). It runs
# only when a PR carries the `direct-v8` label (explicit direct-v8 selection),
# `native-default` (the default build, no feature flags) or `direct-v8-rolldown`
# (the Rolldown variant), or on manual dispatch, so it is never a required
# check. On other PRs only the small `plan` job runs and the row jobs are
# skipped. It records native rows with the harness in
# prototypes/direct-v8/PLATFORMS.md on standard GitHub-hosted runners (free for
# this public repo): Linux x86_64, Linux arm64 and Windows x64. Darwin rows are
# NOT run on Actions (macOS runner cost); the owner qualifies them locally on a
# Mac, see PLATFORMS.md. The `harness-macos` job runs only the offline Python
# harness on macos-latest.

name: direct-v8 (opt-in)

on:
  pull_request:
    branches: [main, "base/**"]
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      selection:
        description: "Build to qualify: direct-v8 (--no-default-features --features direct-v8) or default (no feature flags)"
        type: choice
        options: [direct-v8, default]
        default: direct-v8
      rolldown:
        description: Also qualify direct-v8,rolldown-prototype
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Decide which rows were asked for, so an unrequested row is skipped rather
  # than reported as a green no-op.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rows: ${{ steps.plan.outputs.rows }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          INPUT_SELECTION: ${{ inputs.selection }}
          INPUT_ROLLDOWN: ${{ inputs.rolldown }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          event, action, label = os.environ["EVENT"], os.environ["ACTION"], os.environ["LABEL"]
          labels = set(json.loads(os.environ["LABELS"] or "[]") or [])
          # selection is what qualify-target.py/record-graph.py take; cargo_args is the exact
          # feature selection the shipping-recipe builds repeat.
          rows = {
              "direct-v8": {"selection": "direct-v8", "rolldown": False, "artifact": "direct",
                            "cargo_args": "--no-default-features --features direct-v8"},
              "direct-v8-rolldown": {"selection": "direct-v8", "rolldown": True, "artifact": "rolldown",
                                     "cargo_args": "--no-default-features --features direct-v8,rolldown-prototype"},
              "native-default": {"selection": "default", "rolldown": False, "artifact": "default", "cargo_args": ""},
          }
          if event == "workflow_dispatch":
              wanted = ["native-default" if os.environ["INPUT_SELECTION"] == "default" else "direct-v8"]
              wanted += ["direct-v8-rolldown"] if os.environ["INPUT_ROLLDOWN"] == "true" else []
          elif action == "labeled":
              # Only the label just added starts work; an unrelated label never does.
              wanted = [label] if label in rows else []
          else:
              wanted = sorted(labels & set(rows))
          print("rows=" + json.dumps([{"label": name, **rows[name]} for name in wanted]))
          PY
          cat "$GITHUB_OUTPUT"

  linux-x64:
    name: direct-v8 (${{ matrix.row.label }}, linux-x64)
    needs: plan
    if: needs.plan.outputs.rows != '[]'
    # Job-level, per row: a newer push or label run replaces an older
    # run of the same row, and an unrelated label (empty plan) cancels nothing.
    concurrency:
      group: direct-v8-${{ github.event.pull_request.number || github.ref }}-${{ matrix.row.label }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # Measured at f217f4d: 12 min end to end with no Rust cache (the v8 crate
    # links a prebuilt archive). 45 leaves room for the ~7 min observer budget.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.plan.outputs.rows) }}
    env:
      # The PR head, not the merge ref: the harness ties the row to this commit.
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ROW_LABEL: ${{ matrix.row.label }}
      SELECTION: ${{ matrix.row.selection }}
      ROLLDOWN: ${{ matrix.row.rolldown }}
      CARGO_ARGS: ${{ matrix.row.cargo_args }}
      ROW_DIR: ${{ github.workspace }}/target/direct-v8-ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      # No rust-cache on purpose: a cold build takes about 3 min here, and a
      # V8-linked target tree would compete with health's caches for the repo's
      # 10 GB Actions cache budget.

      - name: Cache staged esbuild binary (issue 2385)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            crates/zfb/binaries/esbuild/esbuild
          key: zfb-staged-binaries-v1-x86_64-unknown-linux-gnu-${{ hashFiles('crates/zfb/build.rs', 'crates/zfb-toolchain-pins/src/lib.rs') }}

      # crates/zfb/build.rs embeds Hono from node_modules/.pnpm at compile time.
      - run: pnpm install --frozen-lockfile

      - name: Offline harness controls
        run: python3 -m unittest discover -s prototypes/direct-v8 -p 'test_*.py'

      - name: Verify vendored ICU data
        run: python3 prototypes/direct-v8/prepare-icu.py --verify

      # Every target is resolved and recorded; any failing target fails the step
      # at the end. The default selection resolves the Deno-backed default until
      # the default flips, so there it reports FAIL on purpose.
      - name: Dependency resolution rows (all shipping targets; no build)
        id: graph
        run: |
          extra=()
          [ "$ROLLDOWN" = true ] && extra=(--extra-feature rolldown-prototype)
          mkdir -p "$ROW_DIR/graph"
          status=0
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin \
                        x86_64-apple-darwin x86_64-pc-windows-msvc; do
            python3 prototypes/direct-v8/record-graph.py --cli --selection "$SELECTION" --target "$target" "${extra[@]}" \
              --output "$ROW_DIR/graph/$target.json" || status=1
          done
          exit "$status"

      - name: Native row (Linux x86_64, harness build)
        if: ${{ !cancelled() && steps.graph.outcome != 'skipped' }}
        run: |
          df -h / | tee "$ROW_DIR/disk-before.txt"
          extra=()
          [ "$ROLLDOWN" = true ] && extra=(--rolldown)
          status=0
          python3 prototypes/direct-v8/qualify-target.py --target x86_64-unknown-linux-gnu --build \
            --selection "$SELECTION" --source-sha "$SOURCE_SHA" --output "$ROW_DIR/qualify" "${extra[@]}" || status=$?
          df -h / | tee "$ROW_DIR/disk-after.txt"
          if [ -f "$ROW_DIR/qualify/row.json" ]; then
            python3 -c 'import json,sys; path = json.load(open(sys.argv[1])).get("checks", {}).get("binary", {}).get("path"); print("ROW_BINARY=" + path) if path else None' \
              "$ROW_DIR/qualify/row.json" >> "$GITHUB_ENV"
          fi
          exit "$status"

      # Packaging steps run after the row so their package-dir edits cannot
      # dirty its source check. They also run after a failed row once it has
      # built a binary (the Rolldown row fails on the known lifecycle case).
      # cross provides the shipping GLIBC 2.34 image for both the binary and
      # the CSS addon (as in node-free-smoke.yml).
      - name: Install cross
        if: ${{ !cancelled() && env.ROW_BINARY != '' }}
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: cross@0.2.5

      # The harness builds natively on the runner, not with the shipping cross
      # recipe, so this is recorded, not gated: the binary's GLIBC floor is not
      # qualified by this lane.
      - name: Record the native binary's GLIBC requirement
        if: ${{ !cancelled() && env.ROW_BINARY != '' }}
        run: |
          objdump -T "$ROW_BINARY" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1 | tee "$ROW_DIR/binary-max-glibc.txt"

      # The shipping recipe: release.yml builds the Linux x86_64 binary with
      # cross in the repo's Amazon Linux 2023 image to hold the GLIBC 2.34
      # floor (Cross.toml, #3623). Same command with the direct-v8 features;
      # the floor is gated exactly as in release.yml. The default selection builds
      # with no feature flags, as release.yml does today.
      - name: Shipping-recipe binary (cross, GLIBC 2.34 floor)
        if: ${{ !cancelled() && env.ROW_BINARY != '' }}
        run: |
          set -o pipefail
          # shellcheck disable=SC2086 # CARGO_ARGS is a word list ("" for the default selection)
          cross build --locked -p zfb --release $CARGO_ARGS \
            --target x86_64-unknown-linux-gnu 2>&1 | tee "$ROW_DIR/cross-build.log"
          bin="$PWD/target/x86_64-unknown-linux-gnu/release/zfb"
          sha256sum "$bin" | tee "$ROW_DIR/cross-binary.sha256"
          "$bin" -V | tee "$ROW_DIR/cross-binary-version.txt"
          maximum=$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "$maximum" | tee "$ROW_DIR/cross-binary-max-glibc.txt"
          [ -n "$maximum" ] || { echo "::error::cannot inspect the binary's GLIBC symbols"; exit 1; }
          if [ "$(printf '%s\n' "$maximum" GLIBC_2.34 | sort -V | tail -1)" != GLIBC_2.34 ]; then
            echo "::error::direct-v8 shipping-recipe binary requires $maximum, above the GLIBC_2.34 floor"
            exit 1
          fi
          echo "CROSS_BINARY=$bin" >> "$GITHUB_ENV"

      # Uses the shipping-recipe binary, so the carrier matches what release
      # would pack (cross binary + cross addon).
      - name: Packed clean-room consumer (Linux x86_64)
        if: ${{ !cancelled() && env.CROSS_BINARY != '' }}
        run: |
          bash scripts/build-css-node.sh x86_64-unknown-linux-gnu cross
          pnpm --filter @takazudo/zfb-slugify --filter @takazudo/zfb --filter @takazudo/zfb-runtime --filter @takazudo/zfb-adapter-cloudflare build
          addon="$RUNNER_TEMP/zfb-css.node"
          cp packages/zfb-linux-x64-gnu/zfb-css.node "$addon"
          ZFB_LINUX_X64_BINARY="$CROSS_BINARY" ZFB_LINUX_X64_CSS_ADDON="$addon" \
            bash scripts/smoke-packed-clean-room.sh 2>&1 | tee "$ROW_DIR/packed-clean-room.log"

      # The same carrier, consumed with the Rolldown prototype switched on for the
      # site build; the clean-room smoke above keeps the default bundler.
      - name: Packed consumer with Rolldown (Linux x86_64)
        if: ${{ !cancelled() && env.ROLLDOWN == 'true' && env.CROSS_BINARY != '' }}
        run: |
          python3 prototypes/direct-v8/packed-consumer.py --carrier linux-x64-gnu --binary "$CROSS_BINARY" \
            --css-addon "$RUNNER_TEMP/zfb-css.node" --output "$ROW_DIR/packed-rolldown" --rolldown

      # Only for the browser rows; a failed install leaves them NOT RUN, never passed.
      # Runs after a failed row too, as the cases do.
      - name: Install Chromium for the browser cases
        if: ${{ !cancelled() && env.ROW_BINARY != '' }}
        continue-on-error: true
        run: |
          pnpm exec playwright install --with-deps chromium
          echo "CASE_CHROMIUM=$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"

      # After the packaging steps so a failing case never hides them. Every case
      # runs and is recorded; any failing row turns the step red, on the Rolldown
      # leg too, where a red row is that case's recorded compatibility result.
      - name: CLI interoperability cases (actual binary)
        if: ${{ !cancelled() && env.ROW_BINARY != '' }}
        run: |
          extra=()
          [ "$ROLLDOWN" = true ] && extra=(--rolldown)
          [ -n "${CASE_CHROMIUM:-}" ] && extra+=(--chromium "$CASE_CHROMIUM")
          python3 prototypes/direct-v8/check-cli-cases.py --binary "$ROW_BINARY" --output "$ROW_DIR/cases" "${extra[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### direct-v8 ($ROW_LABEL, selection $SELECTION, linux-x64) at \`$SOURCE_SHA\`"
            if [ -f "$ROW_DIR/qualify/row.json" ]; then
              python3 - "$ROW_DIR/qualify/row.json" <<'PY'
          import json, sys
          row = json.load(open(sys.argv[1]))
          print("status:", row["status"])
          for name, check in row["checks"].items():
              print(f"- {name}: {check.get('passed')}")
          PY
            else
              echo "No native row recorded."
            fi
            if [ -f "$ROW_DIR/packed-rolldown/report.json" ]; then
              python3 - "$ROW_DIR/packed-rolldown/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print("packed consumer (Rolldown):", "PASS" if report["passed"] else "FAIL", report.get("error") or "")
          for row in report["rows"]:
              print(f"- {row['name']}: {row['passed']}")
          PY
            fi
            if [ -f "$ROW_DIR/cases/report.json" ]; then
              python3 prototypes/direct-v8/check-cli-cases.py --summary "$ROW_DIR/cases/report.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload row evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direct-v8-linux-x64-${{ matrix.row.artifact }}
          path: ${{ env.ROW_DIR }}
          if-no-files-found: warn
          retention-days: 14

  # Native rows on the other standard runners. Windows also builds the release
  # binary and CSS addon natively (as release.yml does) and runs the packed
  # clean-room consumer; Linux arm64 has no packaging row (its shipping recipe is
  # cross under QEMU).
  other-hosts:
    name: direct-v8 (${{ matrix.row.label }}, ${{ matrix.host.name }})
    needs: plan
    if: needs.plan.outputs.rows != '[]'
    concurrency:
      group: direct-v8-${{ github.event.pull_request.number || github.ref }}-${{ matrix.host.name }}-${{ matrix.row.label }}
      cancel-in-progress: true
    runs-on: ${{ matrix.host.runner }}
    # Measured at 349b112: the Windows leg took 30 min (12.5 min of it the
    # release build for the packed consumer); about twice that.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        row: ${{ fromJSON(needs.plan.outputs.rows) }}
        host:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          # The lifecycle observer stops `zfb dev` with a console Ctrl-C here.
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            python: python
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ROW_LABEL: ${{ matrix.row.label }}
      SELECTION: ${{ matrix.row.selection }}
      ROLLDOWN: ${{ matrix.row.rolldown }}
      CARGO_ARGS: ${{ matrix.row.cargo_args }}
      ROW_DIR: ${{ github.workspace }}/target/direct-v8-ci
      PYTHONDONTWRITEBYTECODE: "1"
      PY: ${{ matrix.host.python }}
      TARGET: ${{ matrix.host.target }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      - run: pnpm install --frozen-lockfile

      - name: Verify vendored ICU data
        id: icu
        run: '"$PY" prototypes/direct-v8/prepare-icu.py --verify'

      # The default selection resolves the Deno-backed default until the default
      # flips, so it reports FAIL here (also recorded inside the native row).
      - name: Dependency resolution row (this target; no build)
        id: graph
        if: ${{ !cancelled() && steps.icu.outcome == 'success' }}
        run: |
          extra=()
          [ "$ROLLDOWN" = true ] && extra=(--extra-feature rolldown-prototype)
          mkdir -p "$ROW_DIR/graph"
          "$PY" prototypes/direct-v8/record-graph.py --cli --selection "$SELECTION" --target "$TARGET" "${extra[@]}" \
            --output "$ROW_DIR/graph/$TARGET.json"

      - name: Native row (harness build)
        if: ${{ !cancelled() && steps.icu.outcome == 'success' }}
        run: |
          extra=()
          [ "$ROLLDOWN" = true ] && extra=(--rolldown)
          status=0
          "$PY" prototypes/direct-v8/qualify-target.py --target "$TARGET" --build --selection "$SELECTION" \
            --source-sha "$SOURCE_SHA" --output "$ROW_DIR/qualify" "${extra[@]}" || status=$?
          echo "qualify-target exit $status"
          if [ -f "$ROW_DIR/qualify/row.json" ]; then
            "$PY" -c 'import json,sys; path = json.load(open(sys.argv[1])).get("checks", {}).get("binary", {}).get("path"); print("ROW_BINARY=" + path) if path else None' \
              "$ROW_DIR/qualify/row.json" >> "$GITHUB_ENV"
          fi
          "$PY" - "$ROW_DIR/qualify/row.json" <<'PY'
          import json, sys
          row = json.load(open(sys.argv[1]))
          open_checks = [name for name, check in row["checks"].items() if check.get("passed") is not True]
          print("status:", row["status"], "not passing:", open_checks)
          sys.exit(0 if row["status"] == "PASS" else 1)
          PY

      # The prototype's own tests are the only ones that see Windows verbatim
      # canonical paths (tsconfig paths, rewritten imports, out-of-cwd inputs).
      # A red result names the spellings still reaching Rolldown verbatim.
      - name: Rolldown prototype library tests (Windows x64)
        id: prototype_tests
        if: ${{ !cancelled() && steps.icu.outcome == 'success' && matrix.host.name == 'windows-x64' && matrix.row.rolldown }}
        run: |
          set -o pipefail
          mkdir -p "$ROW_DIR"
          cargo test --locked -p zfb-rolldown-prototype --features native --lib 2>&1 \
            | tee "$ROW_DIR/rolldown-prototype-lib-tests.log"

      # release.yml's native cargo build of the Windows carrier, here with the
      # row's selection (no feature flags for the default selection, as
      # release.yml builds today; the opt-in direct-v8 features otherwise).
      # Runs even when the native row fails, but only once setup has succeeded.
      # Not run on the Rolldown row (its carrier smoke is Linux x64).
      - name: Packed clean-room consumer (Windows x64, release recipe)
        id: packed
        if: ${{ !cancelled() && steps.icu.outcome == 'success' && matrix.host.name == 'windows-x64' && !matrix.row.rolldown }}
        run: |
          set -o pipefail
          mkdir -p "$ROW_DIR"
          # shellcheck disable=SC2086 # CARGO_ARGS is a word list ("" for the default selection)
          cargo build --locked -p zfb --release $CARGO_ARGS \
            --target "$TARGET" 2>&1 | tee "$ROW_DIR/release-build.log"
          bash scripts/build-css-node.sh "$TARGET" cargo 2>&1 | tee "$ROW_DIR/css-addon-build.log"
          pnpm --filter @takazudo/zfb-slugify --filter @takazudo/zfb --filter @takazudo/zfb-runtime --filter @takazudo/zfb-adapter-cloudflare build
          "$PY" prototypes/direct-v8/packed-consumer.py --carrier win32-x64-msvc \
            --binary "target/$TARGET/release/zfb.exe" --css-addon packages/zfb-win32-x64-msvc/zfb-css.node \
            --output "$ROW_DIR/packed"

      # #4343 regression: a plugin virtual module through the shipping-recipe
      # binary built above, where the shadow directory is a \\?\ verbatim path.
      - name: Plugin virtual module build (Windows x64, release recipe)
        if: ${{ !cancelled() && matrix.host.name == 'windows-x64' && !matrix.row.rolldown && hashFiles(format('target/{0}/release/zfb.exe', matrix.host.target)) != '' }}
        run: |
          "$PY" prototypes/direct-v8/check-plugin-virtual-module.py \
            --binary "target/$TARGET/release/zfb.exe" --output "$ROW_DIR/plugin-virtual-module"

      # #4347 regression: plugin addAlias (#3002) from a node_modules importer
      # through the same binary. Before #4360 esbuild could not resolve the alias here.
      - name: Plugin alias from node_modules (Windows x64, release recipe)
        if: ${{ !cancelled() && matrix.host.name == 'windows-x64' && !matrix.row.rolldown && hashFiles(format('target/{0}/release/zfb.exe', matrix.host.target)) != '' }}
        run: |
          "$PY" prototypes/direct-v8/check-plugin-alias-node-modules.py \
            --binary "target/$TARGET/release/zfb.exe" --output "$ROW_DIR/plugin-alias"

      # Only for the browser rows; a failed install leaves them NOT RUN, never passed.
      # Runs after a failed row too, as the cases do.
      - name: Install Chromium for the browser cases
        if: ${{ !cancelled() && env.ROW_BINARY != '' }}
        continue-on-error: true
        run: |
          deps=()
          [ "$RUNNER_OS" = Linux ] && deps=(--with-deps)
          pnpm exec playwright install "${deps[@]}" chromium
          echo "CASE_CHROMIUM=$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')" >> "$GITHUB_ENV"

      # Every case runs and is recorded; any failing row turns the step red, on
      # the Rolldown leg too, where a red row is that case's compatibility result.
      - name: CLI interoperability cases (actual binary)
        if: ${{ !cancelled() && env.ROW_BINARY != '' }}
        run: |
          extra=()
          [ "$ROLLDOWN" = true ] && extra=(--rolldown)
          [ -n "${CASE_CHROMIUM:-}" ] && extra+=(--chromium "$CASE_CHROMIUM")
          "$PY" prototypes/direct-v8/check-cli-cases.py --binary "$ROW_BINARY" --output "$ROW_DIR/cases" "${extra[@]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "### direct-v8 ($ROW_LABEL, selection $SELECTION, $TARGET) at \`$SOURCE_SHA\`"
            if [ -f "$ROW_DIR/qualify/row.json" ]; then
              "$PY" - "$ROW_DIR/qualify/row.json" <<'PY'
          import json, sys
          row = json.load(open(sys.argv[1]))
          print("status:", row["status"])
          for name, check in row["checks"].items():
              print(f"- {name}: {check.get('passed')} {check.get('status') or ''}".rstrip())
          PY
            else
              echo "No native row recorded."
            fi
            if [ -f "$ROW_DIR/packed/report.json" ]; then
              "$PY" - "$ROW_DIR/packed/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print("packed consumer:", "PASS" if report["passed"] else "FAIL", report.get("error") or "")
          for row in report["rows"]:
              print(f"- {row['name']}: {row['passed']}")
          PY
            elif [ "$PACKED_OUTCOME" != skipped ]; then
              echo "packed consumer: no report ($PACKED_OUTCOME)"
            fi
            if [ -f "$ROW_DIR/plugin-virtual-module/report.json" ]; then
              "$PY" - "$ROW_DIR/plugin-virtual-module/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print("plugin virtual module (#4343):", "PASS" if report["passed"] else "FAIL", report.get("error") or "")
          PY
            fi
            if [ -f "$ROW_DIR/plugin-alias/report.json" ]; then
              "$PY" - "$ROW_DIR/plugin-alias/report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print("plugin alias from node_modules (#4347):", "PASS" if report["passed"] else "FAIL", report.get("error") or "")
          PY
            fi
            if [ -f "$ROW_DIR/cases/report.json" ]; then
              "$PY" prototypes/direct-v8/check-cli-cases.py --summary "$ROW_DIR/cases/report.json"
            fi
            if [ "$PROTOTYPE_TESTS_OUTCOME" != skipped ]; then
              echo "rolldown prototype library tests: $PROTOTYPE_TESTS_OUTCOME"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PACKED_OUTCOME: ${{ steps.packed.outcome }}
          PROTOTYPE_TESTS_OUTCOME: ${{ steps.prototype_tests.outcome }}

      - name: Upload row evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: direct-v8-${{ matrix.host.name }}-${{ matrix.row.artifact }}
          path: ${{ env.ROW_DIR }}
          if-no-files-found: warn
          retention-days: 14

  # Offline Python harness only: no Rust build and no native row. It covers the
  # macOS watchdog and TMPDIR alias behavior (#4289, #4290) that Linux cannot show.
  harness-macos:
    name: direct-v8 offline harness (macos)
    needs: plan
    if: needs.plan.outputs.rows != '[]'
    concurrency:
      group: direct-v8-${{ github.event.pull_request.number || github.ref }}-harness-macos
      cancel-in-progress: true
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      # hashlib.file_digest needs 3.11+; the system /usr/bin/python3 is older.
      - name: Python version
        run: |
          python3 -c 'import platform, sys; print(sys.executable, platform.python_version(), platform.machine()); assert sys.version_info >= (3, 11)'
          sw_vers

      - name: Offline harness, default TMPDIR (/var symlink)
        run: python3 -I -B -W error::ResourceWarning -m unittest discover -s prototypes/direct-v8 -p 'test_*.py'

      - name: Offline harness, canonical TMPDIR
        run: |
          TMPDIR="$(cd "${TMPDIR:-/tmp}" && pwd -P)" \
            python3 -I -B -W error::ResourceWarning -m unittest discover -s prototypes/direct-v8 -p 'test_*.py'
