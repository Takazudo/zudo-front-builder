name: Local Darwin security evidence

on:
  pull_request:
    branches: ["base/4314-security-darwin-evidence"]
    paths:
      - .github/workflows/local-darwin-security-evidence.yml
      - scripts/island-size-local-evidence.mjs
      - scripts/rebaseline-island-size-*.mjs
      - scripts/rustls-security-transition.mjs
      - scripts/__tests__/**
      - research/v3-island-size/**

permissions:
  contents: read

concurrency:
  group: local-darwin-security-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthetic-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.14.0
      - run: pnpm install --frozen-lockfile
      - name: Receipt and staging regressions (synthetic, no native measurement)
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vp test run \
            scripts/__tests__/island-size-local-evidence.test.mjs \
            scripts/__tests__/rustls-security-transition.test.mjs \
            scripts/__tests__/rebaseline-island-size-darwin.test.mjs \
            scripts/__tests__/rebaseline-island-size-linux.test.mjs \
            2>&1 | tee "$RUNNER_TEMP/local-evidence-tests.log"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: local-evidence-tests-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/local-evidence-tests.log
          if-no-files-found: warn
          retention-days: 7
