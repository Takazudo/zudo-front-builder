# release.yml
#
# Builds the three hosted-runner zfb binaries (Linux x64/arm64, Windows x64),
# admits the two owner-Mac Darwin binaries from the GitHub Release, packages
# and checksums the hosted ones, reconciles all Release assets, and publishes
# every workspace npm package in topological order.
#
# Darwin (#4690): hosted macOS runners are NOT used. Both Darwin targets are
# built and qualified on the owner's Apple Silicon Mac with
# scripts/build-darwin-local.sh and uploaded to the DRAFT Release (ten inputs:
# archive, .sha256, CSS addon, .sha256 and qualification receipt per target).
# The admit-darwin job downloads exactly those ten into a fresh directory and
# runs scripts/admit-darwin-artifacts.mjs against the release source commit;
# anything missing or rejected fails before any irreversible step, naming the
# Mac command. The Darwin carriers are published with --provenance=false (an
# Actions attestation would falsely claim they were built here); every other
# package keeps OIDC provenance. Contract: scripts/darwin-artifact-contract.md.
#
# Source vs control: the SOURCE commit (the release tag's commit) is what is
# built and published; the CONTROL commit (github.sha) is whose workflow and
# helper scripts run. release-context records both, plus the source tree and
# the workflow ref, in its outputs and job summary. A main-based recovery runs
# new control scripts against an older source tree.
#
# npm auth: GitHub OIDC trusted publishing ONLY — no npm token secret exists
# or is read. Every published package has a trusted publisher on npmjs.com for
# owner Takazudo, repository zudo-front-builder, workflow file release.yml (no
# environment), with "Allow npm dist-tag" enabled so the dist-tag helpers can
# authenticate too. The publish/finalize jobs pin npm 12.2.1 (OIDC for publish
# AND dist-tag add/rm) and every write path runs scripts/npm-oidc-preflight.mjs,
# which refuses when OIDC is unavailable or any stored npm credential is
# visible — npm/pnpm would otherwise fall back to it silently.
#
# Actions route (#4701, zfb-release-coordinator: tag-dispatch-v1): for callers
# that cannot push tags, release-coordinator.yml creates the tag, publishes the
# draft without Latest and dispatches THIS workflow at ref v<version>. A tag-ref
# dispatch is a normal (non-recovery) run: control SHA = source SHA, mac-local
# provenance. Its owner acknowledgement is read from the published Release body
# (the same marker line as on `release: published`) or the owner-only input.
# scripts/release/coordinate-release.mjs refuses a candidate whose release.yml
# lacks the marker above.
#
# Follow-ups never rely on events created by GITHUB_TOKEN (they do not trigger
# workflows): recovery and finalization are explicit dispatches from main, e.g.
#   gh workflow run release.yml --ref main -f release_tag=vX.Y.Z
#   gh workflow run release.yml --ref main -f release_tag=vX.Y.Z -f finalize_only=true
#
# ── Release-channel policy (LOCKED — consumed by S4/S5/S6 installers) ──────
#
# GitHub Release "latest" (prerelease: false) is the stable channel.
# GitHub automatically excludes prerelease Releases from the "latest" query.
#
# Prerelease tagging rule:
#   Tag matching *-next.*, *-beta.*, or *-rc.* → GH Release is created with
#   prerelease: true.  Same tags get npm dist-tag "next".
#   All other v* tags → prerelease: false, npm dist-tag "latest".
#
# Installer opt-in to a prerelease:
#   ZFB_VERSION=v0.X.Y-next.N       — install that exact version
#   ZFB_VERSION=latest-prerelease   — install the latest prerelease release
#
# ── Archive / checksum contract (LOCKED — S4/S5/S6 parse these exactly) ────
#
# Archive name:  zfb-{semver}-{target-triple}.{ext}
#   {semver}        = version from packages/zfb/package.json, no leading "v"
#   {target-triple} = exact Rust target triple (e.g. aarch64-unknown-linux-gnu)
#   {ext}           = tar.gz  for Unix (darwin-*, linux-*)
#                     zip     for Windows (x86_64-pc-windows-msvc)
#
# Archive contents: exactly one file at the archive root — "zfb" (Unix) or
#   "zfb.exe" (Windows).  No nested directory.  Produced by:
#     Unix:    tar -C <bindir> -czf <archive> zfb
#     Windows: cd <bindir>; Compress-Archive zfb.exe <archive>
#   (Darwin archives are produced by scripts/build-darwin-local.sh to the
#   same contract and checked by the admission verifier.)
#
# Checksum file: {archive-name}.sha256
#   One line: "<64-hex-lowercase>  <archive-basename>"  (two spaces, GNU coreutils
#   sha256sum default).  Produced on each platform and verified by:
#     Linux/macOS: sha256sum <archive> | sed 's|.*/||'   (basename only)
#     Windows:     (Get-FileHash).Hash.ToLower() + "  " + basename
#   Installers parse the first whitespace-delimited field as the hash.
#
# Release assets are never clobbered: scripts/release/reconcile-release-assets.mjs
# uploads a missing asset, skips an identical one and fails on a different one.

# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Release

# The effective tag is in the run name so scripts/release/release-status.mjs can
# find main-based recovery/finalize dispatches for a tag.
run-name: >-
  Release ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}${{ inputs.finalize_only && ' (finalize only)' || '' }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Queue releases for the same effective tag; never cancel — a mid-publish run
# would leave a partial npm publish that is worse than the storage cost. Manual
# recovery runs execute the fixed workflow from main while building an existing
# published tag, so github.ref alone is not sufficient for this key.
# The key is the normalized tag (never a ref path), and dry runs queue in their
# own group, so a dry run can never displace or cancel a pending real run.
concurrency:
  group: release-${{ inputs.dry_run && 'dry-run-' || '' }}${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

on:
  # X9: trigger on GitHub Release publish, not on tag push.
  # `/l-make-release` creates a DRAFT Release; publishing that draft (or
  # creating a non-draft Release directly) fires this event. Draft Releases
  # do NOT fire `release: published` — only the publish action does.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No npm publish, no dist-tag change, no Release asset upload (build + tarball + sha256 + read-only checks only)"
        type: boolean
        default: false
      release_tag:
        # Recovery mode runs this workflow definition from main, but checks out
        # and publishes the immutable commit behind an existing published
        # Release tag. Real manual publishes from a branch remain forbidden.
        description: "Recovery only: existing published v* tag to build/publish (run workflow from main)"
        type: string
        required: false
        default: ""
      allow_provenance_downgrade:
        # A2 (#3140): acknowledges that this run omits npm provenance for at
        # least one package that an earlier version attested — a permanent
        # trust downgrade for consumers with pnpm's trustPolicy=no-downgrade.
        # Default-deny: the preflight blocks the run unless this is explicitly
        # set true. On a `release: published` trigger the equivalent
        # acknowledgement is a release-body marker instead (see
        # release-context's "Resolve provenance-downgrade acknowledgement"
        # step). Nothing in this workflow ever sets it on the owner's behalf.
        description: "Owner only: acknowledge an npm provenance trust downgrade for this publish (consumers with pnpm trustPolicy=no-downgrade will fail to install)"
        type: boolean
        default: false
      finalize_only:
        # Finalization-only recovery (#4690): with release_tag, from main. No
        # build and no package publish. Requires every package present-verified
        # and every build asset on the Release (scripts/release/finalize-gate.mjs),
        # then reconciles dist-tags, the MD/WASM digest asset, provenance
        # expectations and runs the smoke. Idempotent.
        description: "Recovery only (with release_tag): skip build/publish; finalize dist-tags, digest asset, provenance check and smoke"
        type: boolean
        default: false

# Least privilege: no job gets a token scope it does not declare below.
permissions: {}

jobs:
  # Resolve every trigger to one immutable source commit before any build starts.
  # Normal release:published runs resolve the event tag. Manual recovery runs
  # must execute the reviewed workflow from main and provide release_tag; this
  # avoids the GitHub Actions behavior where dispatching a tag would load that
  # tag's older (possibly broken) workflow definition. Branch dry-runs remain
  # supported without a tag.
  release-context:
    name: Resolve and verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # checkout + `gh release view` of the tag's Release.
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_version: ${{ steps.verify.outputs.release_version }}
      checkout_sha: ${{ steps.verify.outputs.checkout_sha }}
      source_commit: ${{ steps.verify.outputs.source_commit }}
      source_tree: ${{ steps.verify.outputs.source_tree }}
      control_sha: ${{ steps.verify.outputs.control_sha }}
      workflow_ref: ${{ steps.verify.outputs.workflow_ref }}
      is_recovery: ${{ steps.resolve.outputs.is_recovery }}
      is_finalize: ${{ steps.resolve.outputs.is_finalize }}
      publish_mode: ${{ steps.mode.outputs.publish_mode }}
      allow_downgrade: ${{ steps.ack.outputs.allow_downgrade }}
    steps:
      # The control checkout (this workflow's own commit) provides the helper
      # scripts; a recovery tag's tree predates them.
      - name: Checkout release control scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          persist-credentials: false

      - name: Resolve requested release context
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          FINALIZE_ONLY: ${{ inputs.finalize_only }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: bash .release-control/scripts/release/resolve-release-context.sh

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ steps.resolve.outputs.checkout_ref }}
          path: source
          # The tag ref and its peeled commit must both be available for the
          # immutable-source assertion below.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable source and published Release
        id: verify
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          CONTROL_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # fetch-depth: 0 already brings refs/remotes/origin/main; refresh it
          # explicitly so the ancestry check reads main as of this run.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash ../.release-control/scripts/release/verify-release-source.sh

      # npm publish mode. A main-based recovery normally runs control scripts
      # newer than the source, so GitHub's OIDC identity (the control commit)
      # does not describe the artifacts: recovery-no-provenance. When the
      # dispatch's control commit IS the source commit, that identity is
      # truthful, so the normal mac-local mode keeps honest provenance.
      - name: Resolve npm publish mode
        id: mode
        shell: bash
        env:
          IS_RECOVERY: ${{ steps.resolve.outputs.is_recovery }}
          SOURCE_COMMIT: ${{ steps.verify.outputs.source_commit }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          MODE=mac-local
          if [[ "$IS_RECOVERY" == "true" && "$SOURCE_COMMIT" != "$CONTROL_SHA" ]]; then
            MODE=recovery-no-provenance
          fi
          echo "publish_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "publish mode: $MODE (recovery=$IS_RECOVERY, source=$SOURCE_COMMIT, control=$CONTROL_SHA)"

      # A2 (#3140): resolve whether an npm provenance trust downgrade has been
      # explicitly acknowledged for this run. Default-deny — anything other
      # than an exact marker/input match leaves allow_downgrade=false, and the
      # provenance-preflight job then blocks the run on any detected downgrade.
      - name: Resolve provenance-downgrade acknowledgement
        id: ack
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # Read via env, never interpolated into the script body below —
          # github.event.release.body is release-author-controlled text and
          # must not be spliced into a shell command (script injection).
          RELEASE_BODY: ${{ github.event.release.body }}
          DISPATCH_ALLOW: ${{ inputs.allow_provenance_downgrade }}
          IS_RECOVERY: ${{ steps.resolve.outputs.is_recovery }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          TRIGGER_REF: ${{ github.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ALLOW=false
          MARKER='<!-- zfb-release: allow-provenance-downgrade -->'
          if [[ "$EVENT_NAME" == "release" ]]; then
            # Web-UI release bodies are CRLF; strip \r before an exact-line
            # match so the marker matches regardless of line-ending style.
            # This reads the event payload snapshot, not a live `gh release
            # view` — the body is fixed at the moment the event fired, so a
            # post-publish edit cannot race the check.
            if printf '%s' "$RELEASE_BODY" | tr -d '\r' | grep -Fxq "$MARKER"; then
              ALLOW=true
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$DISPATCH_ALLOW" == "true" ]]; then
              ALLOW=true
            elif [[ "$IS_RECOVERY" != "true" && -n "$RELEASE_TAG" && "$TRIGGER_REF" == "refs/tags/${RELEASE_TAG}" ]]; then
              # #4701: a tag-ref dispatch (release-coordinator.yml) is the
              # normal path started without a `release: published` event, so
              # it honours the same owner-authored marker in the published
              # Release body, read once here. Recovery dispatches from main
              # never do: they need the owner-only input.
              if ! BODY=$(gh release view "$RELEASE_TAG" --json isDraft,body --jq 'select(.isDraft == false) | .body'); then
                echo "::error::Could not read the ${RELEASE_TAG} Release body; failing closed (acknowledgement unknown)."
                exit 1
              fi
              # Same digest the coordinator logs for the body it gated
              # (CR-stripped, no trailing newline): compare the two when
              # auditing who acknowledged what.
              echo "Release body sha256 (CR-stripped): $(printf '%s' "$BODY" | tr -d '\r' | sha256sum | cut -d' ' -f1)"
              if printf '%s' "$BODY" | tr -d '\r' | grep -Fxq "$MARKER"; then
                ALLOW=true
              fi
            fi
          fi
          echo "allow_downgrade=$ALLOW" >> "$GITHUB_OUTPUT"
          echo "Provenance-downgrade acknowledgement: $ALLOW"

  # Required CI of the SOURCE commit (the main ruleset's contexts, on exactly
  # that SHA). Gates every non-dry-run publication and finalization; a dry run
  # reports it without failing.
  source-ci:
    name: Verify source commit required CI
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout of the control scripts
      checks: read # check runs on the source commit
      statuses: read # commit statuses on the source commit
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify required CI on the source commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          node scripts/release/verify-source-ci.mjs --sha "$SOURCE_COMMIT" | tee "$RUNNER_TEMP/source-ci.txt"
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "### Source commit required CI"
            echo
            echo '```'
            cat "$RUNNER_TEMP/source-ci.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STATUS" -eq 0 ]]; then exit 0; fi
          if [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::Source commit ${SOURCE_COMMIT} required CI is not passed (exit ${STATUS}); dry run continues, a real release would stop here."
            exit 0
          fi
          echo "::error::Source commit ${SOURCE_COMMIT} required CI is not passed (exit ${STATUS}). Pending, cancelled, skipped-by-failure, failed and missing are not passed. Wait for or fix CI on that exact SHA; nothing was published."
          exit 1

  # A2 (#3140) / #4690: before any build, block a publish that would be an npm
  # provenance trust downgrade unless explicitly acknowledged. Normal releases
  # publish both Darwin carriers without provenance (mac-local); main-based
  # recovery publishes every package without provenance. Skipped for dry runs
  # and finalization (nothing is published).
  provenance-preflight:
    name: Provenance downgrade preflight
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout of the control scripts
    outputs:
      cleared: ${{ steps.preflight.outputs.cleared }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Provenance downgrade preflight
        id: preflight
        if: ${{ inputs.dry_run != true && needs.release-context.outputs.is_finalize != 'true' }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.release_version }}
          ALLOW_DOWNGRADE: ${{ needs.release-context.outputs.allow_downgrade }}
          PUBLISH_MODE: ${{ needs.release-context.outputs.publish_mode }}
        run: |
          if [[ "$PUBLISH_MODE" == "recovery-no-provenance" ]]; then
            MODE_ARGS=(--mode recovery-no-provenance)
            SCOPE="every package (main-based recovery)"
          else
            MODE_ARGS=(--mode mac-local --package @takazudo/zfb-darwin-arm64 --package @takazudo/zfb-darwin-x64)
            SCOPE="@takazudo/zfb-darwin-arm64 and @takazudo/zfb-darwin-x64 (owner-Mac carriers)"
          fi
          # The owner's provenance policy is read from main's git object only
          # (release/provenance-policy.json at origin/main), never from this
          # checkout's working tree or the release commit.
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          set +e
          node scripts/check-provenance-preflight.mjs --version "$RELEASE_VERSION" "${MODE_ARGS[@]}"
          STATUS=$?
          set -e
          if [[ "$STATUS" -eq 0 ]]; then
            echo "cleared=true" >> "$GITHUB_OUTPUT"
          elif [[ "$STATUS" -eq 1 ]]; then
            if [[ "$ALLOW_DOWNGRADE" == "true" ]]; then
              echo "::warning::Publishing ${SCOPE} without provenance is an npm provenance trust downgrade (an earlier version carries an attestation). Acknowledged for this run — proceeding. Consumers with pnpm's trustPolicy=no-downgrade will fail to install it."
              {
                echo "### :warning: npm provenance trust downgrade acknowledged"
                echo
                echo "${SCOPE} is published without provenance in this run, and an earlier version already carries an attestation — a provenance trust downgrade. This was explicitly acknowledged by the owner."
                echo
                echo "**Consumers with npm/pnpm \`trust-policy=no-downgrade\` will fail to install it.**"
              } >> "$GITHUB_STEP_SUMMARY"
              echo "cleared=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::Provenance trust downgrade detected for ${SCOPE} and not acknowledged. Only the owner may proceed: add '<!-- zfb-release: allow-provenance-downgrade -->' as its own line in the Release body before publishing it, or dispatch from main with allow_provenance_downgrade=true. Nothing was built or published."
              exit 1
            fi
          else
            echo "::error::Provenance preflight failed with a registry error (exit ${STATUS}) — failing closed. Retry the release."
            exit 1
          fi

  # #4690: admit the ten owner-Mac Darwin inputs from the Release. Tag-less
  # branch dry runs have no Release and skip admission (their publish/assembly
  # path never needs Darwin bytes).
  admit-darwin:
    name: Admit owner-Mac Darwin artifacts
    needs: release-context
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkouts + `gh release view/download` of the Release assets
    outputs:
      admitted: ${{ steps.admit.outputs.admitted }}
    steps:
      - name: Tag-less dry run — Darwin admission not applicable
        if: ${{ needs.release-context.outputs.release_tag == '' }}
        shell: bash
        run: echo "No release tag in this context (branch dry run); no Darwin inputs exist to admit."

      # Control scripts at the workspace root (recovery tags predate them).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: ${{ needs.release-context.outputs.release_tag != '' }}
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # The source commit's git objects decide the admitted input digests.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: ${{ needs.release-context.outputs.release_tag != '' }}
        with:
          ref: ${{ needs.release-context.outputs.source_commit }}
          path: .release-source
          persist-credentials: false

      - name: Download and admit the ten Darwin inputs
        id: admit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.release_version }}
          SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
          SOURCE_TREE: ${{ needs.release-context.outputs.source_tree }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "admitted=not-applicable" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/release/admit-release-darwin.sh \
            --tag "$RELEASE_TAG" --version "$RELEASE_VERSION" \
            --source-commit "$SOURCE_COMMIT" --source-tree "$SOURCE_TREE" \
            --repo-root .release-source --out "$RUNNER_TEMP/darwin-admission" \
            --control-dir scripts
          echo "admitted=true" >> "$GITHUB_OUTPUT"
          {
            echo "### Darwin admission: admitted"
            echo
            jq -r '.targets | to_entries[] | "- `\(.key)` \(.value.arch_label): binary `\(.value.binary.sha256)`, addon `\(.value.addon.sha256)`"' \
              "$RUNNER_TEMP/darwin-admission/verdict.json"
          } >> "$GITHUB_STEP_SUMMARY"

      # The admitted bytes travel to release-assets/publish/finalize through
      # this artifact; they re-verify every digest against verdict.json before
      # use. Uploaded on rejection too, as evidence.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && needs.release-context.outputs.release_tag != '' }}
        with:
          name: darwin-admission
          path: ${{ runner.temp }}/darwin-admission
          if-no-files-found: ignore
          retention-days: 3

  build:
    needs: [release-context, provenance-preflight, admit-darwin]
    if: ${{ needs.release-context.outputs.is_finalize != 'true' }}
    name: Build ${{ matrix.settings.target }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Hosted legs only. Both Darwin targets come from the owner's Mac and
        # are admitted by the admit-darwin job (#4690); no macOS runner is used.
        # Both Linux legs build inside cross containers pinned in Cross.toml so
        # the binaries never require more than GLIBC_2.34 (#3623: Amazon Linux
        # 2023 / RHEL 9-class distros). `qemu` marks the leg whose binary cannot
        # execute on the host and is verified under QEMU instead.
        settings:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            binary: zfb
            archive_ext: tar.gz
            use_cross: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            binary: zfb
            archive_ext: tar.gz
            use_cross: true
            qemu: true
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            binary: zfb.exe
            archive_ext: zip
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.release-context.outputs.checkout_sha }}
          persist-credentials: false

      # pnpm version is read from package.json's "packageManager" field
      # (pnpm@12.8.2). action-setup@v4 errors out if BOTH "version:" here
      # and "packageManager:" in package.json are set — pick one. We pick
      # package.json so the version is single-source-of-truth.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
          cache: "pnpm"

      # Install node_modules before cargo build so that build.rs can read
      # Hono from node_modules/.pnpm/.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          targets: ${{ matrix.settings.target }}

      # Install cross-rs for both Linux legs.
      # cross wraps `cargo build` inside a Docker container pinned in Cross.toml:
      # the aarch64 image provides the cross linker, and the x86_64 image (Amazon
      # Linux 2023) fixes the GLIBC ceiling at 2.34. The host workspace (including
      # node_modules) is mounted as a volume so build.rs can embed Hono.
      - name: Install cross (Linux only)
        if: ${{ matrix.settings.use_cross == true }}
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: cross@0.2.5

      - name: Sync platform package versions (lockstep check)
        shell: bash
        run: node scripts/sync-platform-versions.mjs

      - name: Resolve version
        shell: bash
        run: |
          # Derive semver from packages/zfb/package.json (no leading "v").
          # For release/recovery contexts this matches the verified tag; for a
          # tag-less dry-run it is the selected branch commit's dev version.
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          echo "ZFB_SEMVER=$ZFB_SEMVER" >> "$GITHUB_ENV"
          echo "Resolved semver: $ZFB_SEMVER"

      - name: Build zfb binary (native)
        if: ${{ matrix.settings.use_cross != true }}
        shell: bash
        # ZFB_RELEASE_VERSION stamps the release version into the binary at compile time
        # via option_env! in cli.rs. Without this the binary would report 0.0.0 (Cargo.toml
        # placeholder). The variable is already in GITHUB_ENV from the "Resolve version" step.
        env:
          ZFB_RELEASE_VERSION: ${{ env.ZFB_SEMVER }}
        run: cargo build -p zfb --release --target ${{ matrix.settings.target }}

      # Pull the digest-pinned cross image first so a transient registry error
      # is retried without retrying the build (scripts/pull-cross-image.sh).
      - name: Pre-pull pinned cross image (Linux only)
        if: ${{ matrix.settings.use_cross == true }}
        shell: bash
        run: bash scripts/pull-cross-image.sh ${{ matrix.settings.target }}

      - name: Build zfb binary (cross — Linux)
        if: ${{ matrix.settings.use_cross == true }}
        shell: bash
        # ZFB_RELEASE_VERSION is passed into the cross Docker container via Cross.toml
        # [build.env] passthrough — without that entry, cross drops host env vars at the
        # container boundary. The x86_64 leg builds its container image from
        # docker/x86_64-unknown-linux-gnu.Dockerfile on the fly (cross does this itself).
        env:
          ZFB_RELEASE_VERSION: ${{ env.ZFB_SEMVER }}
        run: cross build -p zfb --release --target ${{ matrix.settings.target }}

      - name: Build native CSS addon
        if: ${{ hashFiles('crates/zfb-css-node/Cargo.toml') != '' }}
        shell: bash
        env:
          CSS_BUILDER: ${{ matrix.settings.use_cross && 'cross' || 'cargo' }}
        run: bash scripts/build-css-node.sh ${{ matrix.settings.target }} "$CSS_BUILDER"

      - name: Load and compile with native CSS addon
        if: ${{ matrix.settings.use_cross != true && hashFiles('crates/zfb-css-node/Cargo.toml') != '' }}
        shell: bash
        run: node scripts/smoke-css-node.mjs packages/zfb-${{ matrix.settings.platform }}/zfb-css.node

      # Verify the arm64 binary runs correctly under QEMU emulation.
      # Satisfies acceptance criterion: "linux-arm64 binary runs ./zfb --version correctly
      # under QEMU verification step in workflow logs."
      - name: Set up QEMU (linux-arm64 only)
        if: ${{ matrix.settings.qemu == true }}
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64

      - name: QEMU smoke test — run arm64 binary
        if: ${{ matrix.settings.qemu == true }}
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/w" -w /w \
            debian:stable-slim \
            ./target/aarch64-unknown-linux-gnu/release/zfb --version

      - name: Load Linux CSS addon on Node 24.0.0 (native or QEMU)
        if: ${{ matrix.settings.use_cross == true && hashFiles('crates/zfb-css-node/Cargo.toml') != '' }}
        shell: bash
        env:
          NODE_PLATFORM: ${{ matrix.settings.qemu && 'linux/arm64' || 'linux/amd64' }}
        run: |
          docker run --rm --platform "$NODE_PLATFORM" -v "$PWD:/w:ro" -w /w \
            node:24.0.0-bookworm-slim node scripts/smoke-css-node.mjs \
            packages/zfb-${{ matrix.settings.platform }}/zfb-css.node

      # Per-platform short-version guard (Unix — all non-Windows platforms).
      # `--version` intentionally includes embedded dependency versions; `-V`
      # is the stable one-line CLI version contract used for exact comparison.
      # This catches a missed ZFB_RELEASE_VERSION injection on any platform.
      - name: Assert -V equals release semver (Unix)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' && matrix.settings.qemu != true }}
        shell: bash
        run: |
          BINARY="target/${{ matrix.settings.target }}/release/zfb"
          ACTUAL=$("$BINARY" -V)
          EXPECTED="zfb $ZFB_SEMVER"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::-V mismatch on ${{ matrix.settings.platform }}: got '$ACTUAL', want '$EXPECTED'"
            exit 1
          fi

      # Per-platform version guard for linux-arm64 (QEMU): runs the arm64
      # binary inside the same QEMU-enabled container used for the smoke test.
      - name: Assert -V equals release semver (linux-arm64 QEMU)
        if: ${{ matrix.settings.qemu == true }}
        shell: bash
        run: |
          ACTUAL=$(docker run --rm --platform linux/arm64 \
            -v "$PWD:/w" -w /w \
            debian:stable-slim \
            ./target/aarch64-unknown-linux-gnu/release/zfb -V)
          EXPECTED="zfb $ZFB_SEMVER"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::-V mismatch on linux-arm64: got '$ACTUAL', want '$EXPECTED'"
            exit 1
          fi

      # Per-platform version guard (Windows).
      - name: Assert -V equals release semver (Windows)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Binary = "target/${{ matrix.settings.target }}/release/zfb.exe"
          $Actual = & $Binary -V
          $Expected = "zfb $env:ZFB_SEMVER"
          Write-Host "Expected: $Expected"
          Write-Host "Actual:   $Actual"
          if ($Actual -ne $Expected) {
            Write-Host "::error::-V mismatch on ${{ matrix.settings.platform }}: got '$Actual', want '$Expected'"
            exit 1
          }

      # GLIBC 2.34 = Amazon Linux 2023 / RHEL 9-class (#3623). The x86_64 leg
      # links inside an AL2023 container, so 2.34 is its ceiling by construction;
      # the aarch64 leg measures 2.30. Lower this value only with a measured
      # objdump result; never raise it without an issue.
      - name: Enforce GLIBC 2.34 floor on the built binary
        if: ${{ contains(matrix.settings.target, 'linux-gnu') }}
        shell: bash
        run: |
          BIN="target/${{ matrix.settings.target }}/release/zfb"
          MAX_GLIBC=$(objdump -T "$BIN" \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
            | sort -V \
            | tail -1)
          echo "Highest required GLIBC symbol: $MAX_GLIBC"
          if [[ -z "$MAX_GLIBC" ]]; then
            echo "::error::No GLIBC symbols found via objdump — binary inspection failed."
            exit 1
          fi
          WORST=$(printf '%s\n%s\n' "$MAX_GLIBC" "GLIBC_2.34" | sort -V | tail -1)
          if [[ "$WORST" != "GLIBC_2.34" ]]; then
            echo "::error::Binary requires $MAX_GLIBC, exceeds the GLIBC_2.34 floor."
            exit 1
          fi

      - name: Copy binary to platform package
        shell: bash
        run: cp target/${{ matrix.settings.target }}/release/${{ matrix.settings.binary }} packages/zfb-${{ matrix.settings.platform }}/

      # ── Archive and checksum (contract-locked format) ──────────────────────
      # Archive name: zfb-{semver}-{target-triple}.{ext}
      # Archive contains exactly one file at the root (no nested directory).
      # sha256 file: one line "<64-hex>  <archive-basename>" (two spaces, GNU format).

      - name: Create archive (Unix tar.gz)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' }}
        shell: bash
        run: |
          ARCHIVE="zfb-${ZFB_SEMVER}-${{ matrix.settings.target }}.tar.gz"
          # -C ensures no nested directory leaks into the archive root
          tar -C "packages/zfb-${{ matrix.settings.platform }}" -czf "$ARCHIVE" "${{ matrix.settings.binary }}"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create archive (Windows zip)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Archive = "zfb-${env:ZFB_SEMVER}-${{ matrix.settings.target }}.zip"
          Push-Location "packages/zfb-${{ matrix.settings.platform }}"
          Compress-Archive -Path "${{ matrix.settings.binary }}" -DestinationPath "../../$Archive"
          Pop-Location
          echo "ARCHIVE=$Archive" >> $env:GITHUB_ENV

      - name: Generate sha256 checksum (Unix)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' }}
        shell: bash
        run: |
          # sha256sum outputs "<hash>  <path>"; sed strips the directory prefix so
          # the checksum file contains only the basename (S4/S5/S6 rely on this).
          sha256sum "$ARCHIVE" | sed 's|.*/||' > "${ARCHIVE}.sha256"
          echo "--- checksum file contents ---"
          cat "${ARCHIVE}.sha256"

      - name: Generate sha256 checksum (Windows)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Hash = (Get-FileHash "$env:ARCHIVE" -Algorithm SHA256).Hash.ToLower()
          $Basename = Split-Path "$env:ARCHIVE" -Leaf
          # Two spaces between hash and filename — GNU sha256sum format (S4/S5/S6 rely on this)
          "${Hash}  ${Basename}" | Out-File -FilePath "${env:ARCHIVE}.sha256" -Encoding ascii -NoNewline
          Write-Host "--- checksum file contents ---"
          Get-Content "${env:ARCHIVE}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.settings.target }}
          path: |
            packages/zfb-${{ matrix.settings.platform }}/${{ matrix.settings.binary }}
            packages/zfb-${{ matrix.settings.platform }}/zfb-css.node
          if-no-files-found: error
          # Consumed within this run by the npm-publish job; the real binaries
          # ship as GitHub Release assets, so cap Actions storage at the 1-day floor.
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.settings.target }}
          path: |
            zfb-*-${{ matrix.settings.target }}.${{ matrix.settings.archive_ext }}
            zfb-*-${{ matrix.settings.target }}.${{ matrix.settings.archive_ext }}.sha256
          if-no-files-found: error
          # Consumed within this run by the release-assets job; the archives are
          # promoted to GitHub Release assets, so cap Actions storage at the 1-day floor.
          retention-days: 1

  # @takazudo/zfb-md-wasm build leg (epic #2446, issue #2454). Unlike the
  # zfb Rust binary matrix above, this produces the complete four-artifact npm
  # dist/ (not a GH Release asset). It is downloaded and placed into the
  # package by publish below, which publishes it with --ignore-scripts.
  build-wasm-md:
    name: Build @takazudo/zfb-md-wasm npm package
    needs: release-context
    if: ${{ needs.release-context.outputs.is_finalize != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Keep this exact timeout to match health.yml: four wasm-release passes,
    # package tests, pack, and the checksum-verified prebuilt wasm-bindgen
    # install fit here.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.release-context.outputs.checkout_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.14.0
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)

      # Exact rustc from the source's crates/zfb-md-wasm/rust-toolchain-pin,
      # the same pin health.yml's wasm-md job measured shipped-sizes.json
      # with, plus the job-local wasm32 target (no `targets` key in
      # rust-toolchain.toml, #1575).
      # A recovery of a tag cut before the pin existed keeps the old
      # floating-stable behavior, loudly.
      - name: Select pinned md-wasm Rust toolchain
        shell: bash
        run: |
          if [ -f scripts/select-md-wasm-rust-toolchain.sh ]; then
            bash scripts/select-md-wasm-rust-toolchain.sh
          else
            echo "::warning::source has no md-wasm Rust toolchain pin; building with floating stable"
            rustup target add wasm32-unknown-unknown
          fi

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: "v2-zfb-wasm-md"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve version
        shell: bash
        run: |
          # Derive semver from packages/zfb/package.json (no leading "v").
          # For release/recovery contexts this matches the verified tag; for a
          # tag-less dry-run it is the selected branch commit's dev version.
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          echo "ZFB_SEMVER=$ZFB_SEMVER" >> "$GITHUB_ENV"
          echo "Resolved semver: $ZFB_SEMVER"

      # Must exactly match the wasm-bindgen crate version resolved in
      # Cargo.lock (pinned in crates/zfb-md-wasm/npm/scripts/build.mjs's
      # EXPECTED_WASM_BINDGEN_VERSION constant) — same pin as health.yml. The
      # taiki-e/install-action manifest verifies the prebuilt download with a
      # platform-specific SHA-256 checksum.
      - name: Install wasm-bindgen-cli (pinned to match Cargo.lock)
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: wasm-bindgen@0.2.121

      - name: Build four @takazudo/zfb-md-wasm artifacts (timed)
        shell: bash
        env:
          ZFB_RELEASE_VERSION: ${{ env.ZFB_SEMVER }}
        run: |
          TARGET_DIR="$RUNNER_TEMP/zfb-md-wasm-production-target-$GITHUB_RUN_ID"
          test ! -e "$TARGET_DIR" || {
            echo "::error::production target directory already exists: $TARGET_DIR"
            exit 1
          }
          BUILD_LOG="$RUNNER_TEMP/zfb-md-wasm-build-$GITHUB_RUN_ID.log"
          CARGO_TARGET_DIR="$TARGET_DIR" \
            node scripts/run-zfb-md-wasm-build-timed.mjs 2>&1 | tee "$BUILD_LOG"
          echo "ZFB_MD_WASM_BUILD_LOG=$BUILD_LOG" >> "$GITHUB_ENV"

      - name: Assert root/highlight @takazudo/zfb-md-wasm version stamps
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          // Keep the fixed root/highlight compatibility checks explicit. The
          // release contract step below imports all four entries and repeats
          // the version check after validating their exact exports/resources.
          const expected = process.env.ZFB_SEMVER;

          async function assertVersion(label, modulePath) {
            const { init, version } = await import(modulePath);
            await init();
            const actual = await version();
            console.log(`${label} expected: ${expected}`);
            console.log(`${label} actual:   ${actual}`);
            if (actual !== expected) {
              console.error(
                `::error::@takazudo/zfb-md-wasm ${label} version() mismatch: got '${actual}', want '${expected}'`,
              );
              process.exit(1);
            }
          }

          await assertVersion("default (`.`) entry", "./crates/zfb-md-wasm/npm/dist/index.js");
          await assertVersion(
            "highlight-only (`./highlight`) entry",
            "./crates/zfb-md-wasm/npm/dist/highlight.js",
          );
          EOF

      - name: Pack and assert complete four-artifact release dist
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/zfb-md-wasm-release-artifact"
          mkdir -p "$ARTIFACT_DIR"
          TARBALL="$(cd crates/zfb-md-wasm/npm && pnpm pack --pack-destination "$ARTIFACT_DIR" | tail -1)"
          test -f "$TARBALL" || { echo "::error::packed tarball missing: $TARBALL"; exit 1; }
          node crates/zfb-md-wasm/npm/scripts/assert-packed.mjs "$TARBALL"
          bash scripts/assert-zfb-md-wasm-exports.sh \
            crates/zfb-md-wasm/npm/dist
          node scripts/assert-zfb-md-wasm-release.mjs \
            --dist crates/zfb-md-wasm/npm/dist \
            --package crates/zfb-md-wasm/npm/package.json \
            --tarball "$TARBALL"
          node scripts/assert-zfb-md-wasm-budgets.mjs \
            --build-log "$ZFB_MD_WASM_BUILD_LOG" \
            --dist crates/zfb-md-wasm/npm/dist \
            --tarball "$TARBALL"

      - name: Test @takazudo/zfb-md-wasm package
        run: pnpm --filter @takazudo/zfb-md-wasm test

      # Package tests run after the first pack. Re-pack and compare against
      # dist immediately before upload so a test cannot mutate shipped bytes.
      - name: Re-assert final @takazudo/zfb-md-wasm dist
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/zfb-md-wasm-final-artifact"
          mkdir -p "$ARTIFACT_DIR"
          TARBALL="$(cd crates/zfb-md-wasm/npm && pnpm pack --pack-destination "$ARTIFACT_DIR" | tail -1)"
          test -f "$TARBALL" || { echo "::error::final packed tarball missing: $TARBALL"; exit 1; }
          node scripts/assert-zfb-md-wasm-release.mjs \
            --dist crates/zfb-md-wasm/npm/dist \
            --package crates/zfb-md-wasm/npm/package.json \
            --tarball "$TARBALL"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-md-dist
          path: crates/zfb-md-wasm/npm/dist
          if-no-files-found: error
          # Consumed within this run by the publish job; cap Actions storage
          # at the 1-day floor like the other build artifacts above.
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ hashFiles('crates/zfb-md-wasm/npm/dist/shipped-artifacts.json') != '' }}
        with:
          name: wasm-md-shipped-artifacts
          path: crates/zfb-md-wasm/npm/dist/shipped-artifacts.json
          if-no-files-found: error
          retention-days: 1

  release-assets:
    # Reconciles the 3 hosted archives + their sha256 files onto the Release
    # (missing → upload, identical → skip, different → fail; never --clobber),
    # and verifies the 10 owner-Mac Darwin inputs are still exactly the
    # admitted bytes (they are uploaded by the owner, never by this job).
    # Runs after all hosted builds to avoid first-vs-append races.
    name: Upload GitHub Release assets
    needs: [build, release-context, admit-darwin, source-ci]
    if: ${{ needs.release-context.outputs.is_finalize != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Release asset upload
    steps:
      # Control scripts (recovery tags predate the reconcile helper).
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download all archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: release-assets
          merge-multiple: true

      - name: List collected assets
        shell: bash
        run: ls -lh release-assets/

      - name: DRY RUN — skip GH Release upload
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo "DRY RUN — would have reconciled the following assets onto the GH Release:"
          ls release-assets/
          echo "Set dry_run=false with a verified release context to upload these assets."

      # Defense in depth: release-context already verifies the tag and published
      # Release, but keep upload fail-closed if its output is ever disconnected.
      - name: Guard — verified release tag required for real release upload
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v ]]; then
            echo "::error::GH Release upload requires a verified v* release tag."
            exit 1
          fi

      - name: Upload archives and checksums to GitHub Release
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          # Direct asset uploads only — never a Release metadata PATCH, which a
          # main-based recovery would evaluate against refs/heads/main.
          node scripts/release/reconcile-release-assets.mjs --tag "$RELEASE_TAG" --dir release-assets

      - name: Download admitted Darwin inputs
        if: ${{ needs.release-context.outputs.release_tag != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-admission
          path: ${{ runner.temp }}/darwin-admission

      # Read-only: owner-uploaded Darwin assets must still be the admitted bytes.
      - name: Verify owner-uploaded Darwin assets are unchanged since admission
        if: ${{ needs.release-context.outputs.release_tag != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          node scripts/release/reconcile-release-assets.mjs --tag "$RELEASE_TAG" \
            --dir "$RUNNER_TEMP/darwin-admission/inputs" --verify-only

  # Assembles and packs every npm tarball WITHOUT the npm OIDC credential
  # (#4690): dependency install, package build/test (each workspace package's
  # prepublishOnly) and packing run here; the publish job only verifies and
  # uploads these exact bytes. Darwin carrier bytes come only from the admitted
  # owner-Mac inputs. Tag-less branch dry runs build but do not pack (they have
  # no Darwin bytes).
  pack:
    name: Pack npm tarballs
    needs: [build, build-wasm-md, release-context, source-ci, provenance-preflight, admit-darwin]
    if: ${{ needs.release-context.outputs.is_finalize != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkouts only; no id-token here on purpose
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ needs.release-context.outputs.checkout_sha }}
          persist-credentials: false

      # Pack/placement helpers come from the control commit (recovery tags
      # predate them), checked out beside the source tree.
      - name: Checkout release control scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          path: .release-control
          persist-credentials: false

      # pnpm version is read from package.json's "packageManager" field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          # setup-node v5 otherwise caches the packageManager (pnpm) by default and
          # fails because this job never installs pnpm.
          package-manager-cache: false
          cache: "pnpm"

      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: false

      - name: Download admitted Darwin inputs
        if: ${{ needs.release-context.outputs.release_tag != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-admission
          path: ${{ runner.temp }}/darwin-admission

      # The ONLY source of Darwin carrier bytes: the admitted owner-Mac inputs,
      # re-verified against verdict.json right before they are placed.
      - name: Place admitted Darwin binaries in platform packages
        if: ${{ needs.release-context.outputs.release_tag != '' }}
        shell: bash
        run: |
          node .release-control/scripts/release/place-darwin-carriers.mjs \
            --verdict "$RUNNER_TEMP/darwin-admission/verdict.json" \
            --inputs "$RUNNER_TEMP/darwin-admission/inputs" \
            --packages-root .

      - name: Place CI-built binaries in platform packages
        shell: bash
        run: |
          cp artifacts/binary-aarch64-unknown-linux-gnu/zfb packages/zfb-linux-arm64-gnu/zfb
          if node -e 'process.exit(require("./packages/zfb/package.json").publishConfig?.exports?.["./css"] ? 0 : 1)'; then
            cp artifacts/binary-aarch64-unknown-linux-gnu/zfb-css.node packages/zfb-linux-arm64-gnu/zfb-css.node
          fi
          cp artifacts/binary-x86_64-unknown-linux-gnu/zfb packages/zfb-linux-x64-gnu/zfb
          if node -e 'process.exit(require("./packages/zfb/package.json").publishConfig?.exports?.["./css"] ? 0 : 1)'; then
            cp artifacts/binary-x86_64-unknown-linux-gnu/zfb-css.node packages/zfb-linux-x64-gnu/zfb-css.node
          fi
          cp artifacts/binary-x86_64-pc-windows-msvc/zfb.exe packages/zfb-win32-x64-msvc/zfb.exe
          if node -e 'process.exit(require("./packages/zfb/package.json").publishConfig?.exports?.["./css"] ? 0 : 1)'; then
            cp artifacts/binary-x86_64-pc-windows-msvc/zfb-css.node packages/zfb-win32-x64-msvc/zfb-css.node
          fi
          chmod +x packages/zfb-linux-arm64-gnu/zfb
          chmod +x packages/zfb-linux-x64-gnu/zfb

      # Built by the build-wasm-md job (needs the Rust wasm32 toolchain +
      # pinned wasm-bindgen-cli — this job installs neither). Downloaded
      # straight into the package's dist/ so it is packed without a rebuild.
      - name: Download @takazudo/zfb-md-wasm dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-md-dist
          path: crates/zfb-md-wasm/npm/dist

      - name: Download @takazudo/zfb-md-wasm manifest artifact
        if: ${{ needs.release-context.outputs.is_recovery != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-md-shipped-artifacts
          path: ${{ runner.temp }}/wasm-md-shipped-artifacts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @takazudo/zfb-md-wasm is excluded: its dist/ was already built by the
      # build-wasm-md job and downloaded above.
      - name: Build TypeScript packages
        run: pnpm -r --filter '!./examples/*' --filter '!@takazudo/zfb-md-wasm' build

      - name: Sync platform package versions (lockstep verification — should be no-op)
        shell: bash
        run: node scripts/sync-platform-versions.mjs

      # npm pack for carriers (0755 binary checked in the packed tgz), pnpm pack
      # for workspace packages (workspace:* rewritten; prepublishOnly build+test
      # runs first), MD/WASM from its prebuilt dist with its digest manifest
      # verified. Writes manifest.json {name, version, file, integrity, provenance}.
      - name: Pack npm tarballs
        if: ${{ needs.release-context.outputs.release_tag != '' }}
        shell: bash
        env:
          PUBLISH_MODE: ${{ needs.release-context.outputs.publish_mode }}
          IS_RECOVERY: ${{ needs.release-context.outputs.is_recovery }}
        run: |
          ARGS=(--mode "$PUBLISH_MODE" --out "$RUNNER_TEMP/npm-tarballs" --root .
            --admission "$RUNNER_TEMP/darwin-admission/verdict.json")
          if [[ "$PUBLISH_MODE" == "mac-local" ]]; then
            ARGS+=(--local-built "packages/zfb-darwin-arm64 packages/zfb-darwin-x64")
          fi
          if [[ "$IS_RECOVERY" != "true" ]]; then
            ARGS+=(--md-wasm-manifest "$RUNNER_TEMP/wasm-md-shipped-artifacts/shipped-artifacts.json")
          fi
          node .release-control/scripts/release/pack-release-tarballs.mjs "${ARGS[@]}"
          {
            echo "### npm tarballs (mode \`$PUBLISH_MODE\`)"
            echo
            jq -r '.packages[] | "- `\(.name)@\(.version)` \(.provenance) `\(.integrity)`"' "$RUNNER_TEMP/npm-tarballs/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ needs.release-context.outputs.release_tag != '' }}
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs
          if-no-files-found: error
          retention-days: 3

  publish:
    # Publishes the pack job's tarballs. This job holds the npm OIDC credential
    # (id-token: write), so it never checks out the release source, installs
    # dependencies or runs package code: only the control scripts, node and the
    # pinned npm. Each tarball's sha512 is verified against the pack manifest
    # before anything is published, and every tarball's CONTENT is re-inspected
    # here with control scripts (scripts/release/verify-release-tarballs.mjs via
    # scripts/publish-npm-packages.sh) rather than trusting pack. Dry runs skip
    # the whole job.
    needs: [pack, release-context, source-ci, provenance-preflight, admit-darwin, release-assets]
    if: ${{ needs.release-context.outputs.is_finalize != 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    # ~3 min of publishing plus the verifier's ~21 min visibility wait below (#4711).
    timeout-minutes: 40
    permissions:
      # Control-script checkout only; the MD/WASM digest asset upload lives in
      # md-wasm-asset, a separate job without id-token.
      contents: read
      # The npm credential: npm exchanges the job's GitHub ID token for a
      # short-lived publish token (trusted publishing) and signs the provenance
      # of every package published with --provenance. Also used by the
      # dist-tag helpers (advance-latest, retire-next).
      id-token: write
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.dist_tag }}
      npm_processing: ${{ steps.verify-provenance.outputs.npm_processing }}
      npm_processing_packages: ${{ steps.verify-provenance.outputs.npm_processing_packages }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No `registry-url:` on purpose: with it, setup-node writes an .npmrc
      # holding `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and exports
      # a placeholder NODE_AUTH_TOKEN — a token slot npm would use instead of
      # failing loudly when the OIDC exchange fails. Node >= 24.15 is required by
      # npm 12.2.1. No cache: nothing is installed here.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          # setup-node v5 otherwise caches the packageManager (pnpm) by default and
          # fails because this job never installs pnpm.
          package-manager-cache: false

      # npm 12.2.0 is the first npm whose OIDC exchange also covers
      # `npm dist-tag add/rm`; pin the exact reviewed release.
      - name: Install and assert pinned npm
        shell: bash
        run: |
          npm install -g npm@12.2.1
          NPM_VERSION="$(npm --version)"
          echo "node $(node --version), npm ${NPM_VERSION}"
          if [[ "$NPM_VERSION" != "12.2.1" ]]; then
            echo "::error::expected npm 12.2.1 (OIDC for publish and dist-tag), got ${NPM_VERSION}"
            exit 1
          fi

      - name: Download npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      - name: Download admitted Darwin inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-admission
          path: ${{ runner.temp }}/darwin-admission

      # build-wasm-md's own manifest: the publish job compares the packed
      # MD/WASM manifest against it instead of trusting the pack job.
      - name: Download @takazudo/zfb-md-wasm manifest artifact
        if: ${{ needs.release-context.outputs.is_recovery != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-md-shipped-artifacts
          path: ${{ runner.temp }}/wasm-md-shipped-artifacts

      - name: Determine dist-tag
        id: dist-tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          if [[ "$RELEASE_TAG" =~ -(next|beta|rc)\. ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved dist-tag: $DIST_TAG (from tag: $RELEASE_TAG)"

      # Prerelease dual-tag gate (#481): while @takazudo/zfb has no `latest` or
      # its `latest` is a prerelease, a `next` publish also advances `latest`.
      # Only a definitive 404 counts as "no latest"; any other registry error
      # fails closed (scripts/release/resolve-also-latest.mjs).
      - name: Check if latest should also advance (prerelease dual-tag)
        shell: bash
        run: |
          ALSO_LATEST="$(node scripts/release/resolve-also-latest.mjs --dist-tag "$DIST_TAG")"
          echo "ALSO_LATEST=${ALSO_LATEST}" >> "$GITHUB_ENV"

      # Defense in depth: release-context already verifies the exact tag commit,
      # published Release, and package version before any build starts.
      - name: Verify publish context (verified release tag required)
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v ]]; then
            echo "::error::Publish requires a verified v* release tag."
            exit 1
          fi

      # Normal path (#4690): both Darwin carriers hold admitted owner-Mac bytes
      # and are published with --provenance=false; every other package with
      # OIDC --provenance. Also used by a recovery whose control commit is the
      # source commit (release-context's publish_mode).
      - name: Publish to npm
        if: ${{ inputs.dry_run != true && needs.release-context.outputs.publish_mode == 'mac-local' }}
        shell: bash
        run: bash scripts/publish-npm-packages.sh mac-local
        env:
          ZFB_PUBLISH_TARBALLS_DIR: ${{ runner.temp }}/npm-tarballs
          ZFB_PROVENANCE_EXPECTATIONS_FILE: ${{ runner.temp }}/npm-provenance-expectations.tsv
          ZFB_LOCAL_BUILT_PACKAGES: packages/zfb-darwin-arm64 packages/zfb-darwin-x64
          ZFB_RELEASE_SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
          ZFB_DARWIN_ADMISSION_VERDICT: ${{ runner.temp }}/darwin-admission/verdict.json
          ZFB_RELEASE_VERSION: ${{ needs.release-context.outputs.release_version }}
          ZFB_MD_WASM_BUILD_MANIFEST: ${{ needs.release-context.outputs.is_recovery != 'true' && format('{0}/wasm-md-shipped-artifacts/shipped-artifacts.json', runner.temp) || '' }}
          ZFB_MD_WASM_ALLOW_MISSING_BUILD_MANIFEST: ${{ needs.release-context.outputs.is_recovery == 'true' && '1' || '' }}
          # Defense in depth (A2, #3140): publish-npm-packages.sh refuses mac-local
          # without this. The provenance-preflight job set `cleared` only when no
          # downgrade exists or the owner acknowledged it.
          ZFB_ALLOW_PROVENANCE_DOWNGRADE: ${{ needs.provenance-preflight.outputs.cleared == 'true' && '1' || '' }}

      # Main-based recovery whose control commit differs from the source:
      # GitHub's OIDC subject identifies github.sha, not the source commit, so
      # attesting the artifacts would be misleading. Every package that is not
      # already present-verified is published with --provenance=false.
      - name: Publish to npm (recovery — no provenance)
        if: ${{ inputs.dry_run != true && needs.release-context.outputs.publish_mode == 'recovery-no-provenance' }}
        shell: bash
        run: bash scripts/publish-npm-packages.sh recovery-no-provenance
        env:
          ZFB_PUBLISH_TARBALLS_DIR: ${{ runner.temp }}/npm-tarballs
          ZFB_PROVENANCE_EXPECTATIONS_FILE: ${{ runner.temp }}/npm-provenance-expectations.tsv
          ZFB_RELEASE_SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
          ZFB_DARWIN_ADMISSION_VERDICT: ${{ runner.temp }}/darwin-admission/verdict.json
          ZFB_RELEASE_VERSION: ${{ needs.release-context.outputs.release_version }}
          ZFB_MD_WASM_BUILD_MANIFEST: ${{ needs.release-context.outputs.is_recovery != 'true' && format('{0}/wasm-md-shipped-artifacts/shipped-artifacts.json', runner.temp) || '' }}
          ZFB_MD_WASM_ALLOW_MISSING_BUILD_MANIFEST: ${{ needs.release-context.outputs.is_recovery == 'true' && '1' || '' }}
          ZFB_ALLOW_PROVENANCE_DOWNGRADE: ${{ needs.provenance-preflight.outputs.cleared == 'true' && '1' || '' }}

      # Every package must carry exactly the provenance recorded for it:
      # the explicit flag for a fresh publish, or the observed source-bound
      # provenance for an already-present one. Reads only.
      # Large binary carriers took ~6.5-12.5 min to become visible after publish
      # (#4711); 9 attempts doubling from 5 s wait up to ~21 min.
      # Exit 3 = every unresolved package was accepted by npm and is still in
      # pre-publication processing (#4716). The step stays failed: pending is
      # not passed.
      - name: Verify npm provenance expectations
        id: verify-provenance
        shell: bash
        env:
          EXPECTATIONS: ${{ runner.temp }}/npm-provenance-expectations.tsv
          NPM_PROVENANCE_VERIFY_ATTEMPTS: "9"
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          set +e
          node scripts/verify-npm-provenance-expectations.mjs --expectations "$EXPECTATIONS" | tee "$RUNNER_TEMP/verify-provenance.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -eq 3 ]]; then
            packages="$(sed -n 's/^PROCESSING_PACKAGES=//p' "$RUNNER_TEMP/verify-provenance.log" | tail -n1)"
            {
              echo "npm_processing=true"
              echo "npm_processing_packages=${packages}"
            } >> "$GITHUB_OUTPUT"
            next_steps="Wait, then check the status API locally (GET /-/package/{name}/version/{version}/status, authenticated; \"validating\" means still processing). Contact npm support if it is still processing after 24 h. Once the versions are visible, dispatch: gh workflow run release.yml --ref main -f release_tag=${RELEASE_TAG} -f finalize_only=true"
            {
              echo "### :hourglass: npm accepted the publish but is still processing"
              echo
              echo "Packages accepted by npm and not yet visible (not dropped, not republished):"
              echo
              echo '```'
              tr ',' '\n' <<<"$packages"
              echo '```'
              echo
              echo "1. Wait."
              echo "2. Check the status API locally: \`GET /-/package/{name}/version/{version}/status\` (authenticated)."
              echo "3. Contact npm support if still processing after 24 h."
              echo "4. Then run: \`gh workflow run release.yml --ref main -f release_tag=${RELEASE_TAG} -f finalize_only=true\`"
              echo
              echo "This job stays failed: pending is not passed."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=npm still processing::${packages} accepted by npm but not yet visible. ${next_steps}"
          fi
          exit "$rc"

      # Receipts feed the release-status/finalize tooling (#4715); keep them even
      # when the verifier failed.
      - name: Upload npm publish receipts
        if: ${{ always() && inputs.dry_run != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publish-receipts
          path: ${{ runner.temp }}/npm-provenance-expectations.tsv
          retention-days: 30
          if-no-files-found: ignore

      # ── Prerelease graduation cleanup (the reverse of the dual-tag gate) ───
      # Removes `next` wherever it is no longer strictly ahead of `latest`, so a
      # graduated prerelease tag never freezes. Always exits 0; an auth failure
      # (trusted publisher or its "Allow npm dist-tag" option) is raised to
      # ::error:: plus a job-summary section.
      - name: Retire stale 'next' dist-tag
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: node scripts/retire-next-dist-tag.mjs

  # The MD/WASM digest manifest becomes a Release asset only after the published
  # tarball's four WASM digests are re-verified. Needs contents: write, so it
  # runs apart from the id-token job.
  md-wasm-asset:
    name: Upload MD/WASM digest asset
    needs: [publish, release-context]
    if: ${{ needs.release-context.outputs.is_finalize != 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Release asset reconcile (never clobber)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          # setup-node v5 otherwise caches the packageManager (pnpm) by default and
          # fails because this job never installs pnpm.
          package-manager-cache: false

      - name: Download npm tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs

      - name: Verify published @takazudo/zfb-md-wasm and upload digest asset
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.release_version }}
          IS_RECOVERY: ${{ needs.release-context.outputs.is_recovery }}
        run: |
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "::error::Verified release tag/version mismatch: $RELEASE_TAG / $RELEASE_VERSION"
            exit 1
          fi
          EXTRA_ARGS=()
          if [[ "$IS_RECOVERY" == "true" ]]; then
            EXTRA_ARGS=(--allow-missing-manifest)
          fi
          node scripts/verify-zfb-md-wasm-published-digests.mjs \
            --version "$RELEASE_VERSION" \
            --manifest "$RUNNER_TEMP/npm-tarballs/zfb-md-wasm-shipped-artifacts.json" \
            --tag "$RELEASE_TAG" --upload "${EXTRA_ARGS[@]}"

  # Finalization-only recovery (#4690): no build, no install, no package
  # publish. scripts/release/finalize-gate.mjs admits it only when all 11
  # packages are present-verified for the source commit and every build asset
  # is on the Release; then dist-tags and the provenance expectations are
  # reconciled. The digest-asset upload is the separate finalize-assets job.
  finalize:
    name: Finalize published release
    needs: [release-context, source-ci, admit-darwin]
    if: ${{ needs.release-context.outputs.is_finalize == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # control checkout + `gh release view` in the gate
      id-token: write # npm OIDC for dist-tag add/rm
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # No registry-url (see the publish job): OIDC only, no token slot.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          # setup-node v5 otherwise caches the packageManager (pnpm) by default and
          # fails because this job never installs pnpm.
          package-manager-cache: false

      - name: Install and assert pinned npm
        shell: bash
        run: |
          npm install -g npm@12.2.1
          NPM_VERSION="$(npm --version)"
          if [[ "$NPM_VERSION" != "12.2.1" ]]; then
            echo "::error::expected npm 12.2.1 (OIDC for dist-tag), got ${NPM_VERSION}"
            exit 1
          fi

      - name: Download admitted Darwin inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-admission
          path: ${{ runner.temp }}/darwin-admission

      # Read-only gate; also writes the per-package observed provenance
      # expectations of the already-published packages.
      - name: Finalization gate (all packages present-verified, build assets complete)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.release-context.outputs.source_commit }}
        run: |
          node scripts/release/finalize-gate.mjs --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" \
            --admission "$RUNNER_TEMP/darwin-admission/verdict.json" \
            --expectations-out "$RUNNER_TEMP/npm-provenance-expectations.tsv"

      - name: Determine dist-tag
        id: dist-tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
        run: |
          if [[ "$RELEASE_TAG" =~ -(next|beta|rc)\. ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          ALSO_LATEST="$(node scripts/release/resolve-also-latest.mjs --dist-tag "$DIST_TAG")"
          echo "ALSO_LATEST=${ALSO_LATEST}" >> "$GITHUB_ENV"
          echo "Resolved dist-tag: $DIST_TAG (from tag: $RELEASE_TAG); ALSO_LATEST='${ALSO_LATEST}'"

      - name: DRY RUN — skip finalization writes
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: echo "DRY RUN — the gate passed; no dist-tag change, no Release asset upload."

      # Prerelease dual-tag (#481), same rule as the publish job.
      - name: Advance 'latest' dist-tag (prerelease phase only)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.release-context.outputs.release_version }}
        run: |
          if [[ "${ALSO_LATEST:-}" == "1" ]]; then
            bash scripts/advance-latest-dist-tag.sh "$RELEASE_VERSION"
          else
            echo "ALSO_LATEST not set — 'latest' is not advanced."
          fi

      - name: Verify npm provenance expectations
        shell: bash
        run: |
          node scripts/verify-npm-provenance-expectations.mjs \
            --expectations "$RUNNER_TEMP/npm-provenance-expectations.tsv"

      - name: Retire stale 'next' dist-tag
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: node scripts/retire-next-dist-tag.mjs

  # Finalization's Release asset write, apart from the id-token job.
  finalize-assets:
    name: Finalize MD/WASM digest asset
    needs: [finalize, release-context]
    if: ${{ needs.release-context.outputs.is_finalize == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Release asset reconcile (never clobber)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.22.1
          # setup-node v5 otherwise caches the packageManager (pnpm) by default and
          # fails because this job never installs pnpm.
          package-manager-cache: false

      - name: Verify published @takazudo/zfb-md-wasm and upload digest asset
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-context.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-context.outputs.release_version }}
        run: |
          node scripts/verify-zfb-md-wasm-published-digests.mjs \
            --version "$RELEASE_VERSION" --manifest-from-published \
            --tag "$RELEASE_TAG" --upload

  smoke-clean-room:
    # Post-publish clean-room smoke: installs create-zfb@<dist-tag> from the
    # real registry in a temp dir (no workspace context), scaffolds a project,
    # runs `pnpm build` (which calls `zfb build`), and asserts dist/ is populated.
    #
    # This is an ALERTING GUARD, not a gate — publish has already happened.
    # Catches the #481-class (broken dist-tag pointing at a bad binary — the
    # smoke downloads and runs the just-published binary) and the #482-class
    # (missing scaffold dependencies such as @takazudo/zfb-runtime).
    # Does NOT catch the #463-class (undeclared esbuild peer-dep) because
    # esbuild reaches the build transitively via @takazudo/zfb-runtime, so a
    # clean-room pnpm install still resolves it through the dependency tree.
    #
    # The shell logic also serves drift-net's scheduled moving-channel exam.
    # This release invocation passes the version verified from the release
    # tag, including workflow_dispatch recovery and finalize runs from main.
    needs: [publish, finalize, release-context]
    # Skip on dry_run — nothing was published, so no registry smoke to run.
    if: ${{ always() && inputs.dry_run != true && (needs.publish.result == 'success' || needs.finalize.result == 'success') }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-smoke-clean-room.yml
    with:
      dist_tag: ${{ needs.publish.outputs.dist_tag || needs.finalize.outputs.dist_tag }}
      expected_version: ${{ needs.release-context.outputs.release_version }}
      runner: ubuntu-latest

  notify:
    # Alerting guard: a red build/release-assets/publish/smoke-clean-room leg
    # otherwise sits unseen in the Actions tab once the release skill's watch
    # ends. `needs` lists every upstream job with `if: always()` +
    # bash-computed FAILED_JOB — gating on a bare `if: failure()` would stay
    # silent if an earlier job fails and cascades a *skip* (not a failure)
    # into its dependents. scripts/notify-release-result.sh knows which skips
    # each mode expects (finalize vs build/publish, dry-run smoke). Same IFTTT
    # pattern as docs-deploy.yml's notify job (reuses IFTTT_PROD_NOTIFY).
    needs:
      [
        release-context,
        source-ci,
        provenance-preflight,
        admit-darwin,
        build,
        build-wasm-md,
        release-assets,
        pack,
        publish,
        md-wasm-asset,
        finalize,
        finalize-assets,
        smoke-clean-room,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      IFTTT_PROD_NOTIFY: ${{ secrets.IFTTT_PROD_NOTIFY }}
    steps:
      # Use the workflow's own immutable source, even if release-context failed.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report incomplete delivery
        shell: bash
        env:
          RELEASE_CONTEXT_RESULT: ${{ needs.release-context.result }}
          SOURCE_CI_RESULT: ${{ needs.source-ci.result }}
          PROVENANCE_PREFLIGHT_RESULT: ${{ needs.provenance-preflight.result }}
          ADMIT_DARWIN_RESULT: ${{ needs.admit-darwin.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_WASM_MD_RESULT: ${{ needs.build-wasm-md.result }}
          RELEASE_ASSETS_RESULT: ${{ needs.release-assets.result }}
          PACK_RESULT: ${{ needs.pack.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          NPM_PROCESSING: ${{ needs.publish.outputs.npm_processing }}
          NPM_PROCESSING_PACKAGES: ${{ needs.publish.outputs.npm_processing_packages }}
          MD_WASM_ASSET_RESULT: ${{ needs.md-wasm-asset.result }}
          FINALIZE_RESULT: ${{ needs.finalize.result }}
          FINALIZE_ASSETS_RESULT: ${{ needs.finalize-assets.result }}
          SMOKE_CLEAN_ROOM_RESULT: ${{ needs.smoke-clean-room.result }}
          DRY_RUN: ${{ inputs.dry_run }}
          FINALIZE_ONLY: ${{ needs.release-context.outputs.is_finalize || inputs.finalize_only }}
          RAW_TAG: ${{ needs.release-context.outputs.release_tag || github.event.release.tag_name || inputs.release_tag }}
          GITHUB_SHA_VAL: ${{ needs.release-context.outputs.checkout_sha || github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash scripts/notify-release-result.sh
