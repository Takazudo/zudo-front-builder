# release.yml
#
# Cross-compiles the zfb Rust binary for 5 platforms, packages each binary
# as a tar.gz (Unix) or zip (Windows), generates SHA-256 checksum files,
# attaches them as GitHub Release assets, and publishes all workspace npm
# packages in topological order.
#
# IMPORTANT: NPM_TOKEN must be an Automation-type token (bypasses 2FA).
# A standard user token will fail in unattended CI publish because npm
# requires 2FA for scoped publish unless the token type is "Automation".
# Create one at https://www.npmjs.com/settings/<user>/tokens with type "Automation".
#
# ── Release-channel policy (LOCKED — consumed by S4/S5/S6 installers) ──────
#
# GitHub Release "latest" (prerelease: false) is the stable channel.
# GitHub automatically excludes prerelease Releases from the "latest" query.
#
# Prerelease tagging rule:
#   Tag matching *-next.*, *-beta.*, or *-rc.* → GH Release is created with
#   prerelease: true.  Same tags get npm dist-tag "next".
#   All other v* tags → prerelease: false, npm dist-tag "latest".
#
# Installer opt-in to a prerelease:
#   ZFB_VERSION=v0.X.Y-next.N       — install that exact version
#   ZFB_VERSION=latest-prerelease   — install the latest prerelease release
#
# ── Archive / checksum contract (LOCKED — S4/S5/S6 parse these exactly) ────
#
# Archive name:  zfb-{semver}-{target-triple}.{ext}
#   {semver}        = version from packages/zfb/package.json, no leading "v"
#   {target-triple} = exact Rust target triple (e.g. aarch64-unknown-linux-gnu)
#   {ext}           = tar.gz  for Unix (darwin-*, linux-*)
#                     zip     for Windows (x86_64-pc-windows-msvc)
#
# Archive contents: exactly one file at the archive root — "zfb" (Unix) or
#   "zfb.exe" (Windows).  No nested directory.  Produced by:
#     Unix:    tar -C <bindir> -czf <archive> zfb
#     Windows: cd <bindir>; Compress-Archive zfb.exe <archive>
#
# Checksum file: {archive-name}.sha256
#   One line: "<64-hex-lowercase>  <archive-basename>"  (two spaces, GNU coreutils
#   sha256sum default).  Produced on each platform and verified by:
#     Linux/macOS: sha256sum <archive> | sed 's|.*/||'   (basename only)
#     Windows:     (Get-FileHash).Hash.ToLower() + "  " + basename
#   Installers parse the first whitespace-delimited field as the hash.

# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publish + GH Release upload steps (build + tarball + sha256 only)"
        type: boolean
        default: false
      skip_macos_x64:
        # Escape hatch for the queue-starved macos-13 runner (issue #437).
        # When true: the darwin-x64 build leg is dropped from the matrix, the
        # publish job verifies a locally-built macOS-x64 archive + .sha256 are
        # already attached to the GH Release, downloads that binary, and
        # publishes @takazudo/zfb-darwin-x64 WITHOUT --provenance (it was not
        # built inside this GHA job). See RELEASE_DAY_CHECKLIST.md.
        description: "Skip the macOS-x64 build leg; use the locally-built archive already on the GH Release"
        type: boolean
        default: false

jobs:
  # Emits the build matrix as JSON so the darwin-x64 leg can be conditionally
  # dropped (GitHub's static `matrix.exclude` cannot reference inputs). The full
  # matrix lives here as the single source of truth; jq removes the x86_64-apple-
  # darwin entry when skip_macos_x64 is set.
  prepare-matrix:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      settings: ${{ steps.set.outputs.settings }}
    steps:
      - id: set
        shell: bash
        env:
          SKIP_MACOS_X64: ${{ inputs.skip_macos_x64 }}
        run: |
          ALL='[
            {"host":"macos-latest","target":"aarch64-apple-darwin","platform":"darwin-arm64","binary":"zfb","archive_ext":"tar.gz"},
            {"host":"macos-13","target":"x86_64-apple-darwin","platform":"darwin-x64","binary":"zfb","archive_ext":"tar.gz"},
            {"host":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","platform":"linux-x64-gnu","binary":"zfb","archive_ext":"tar.gz"},
            {"host":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","platform":"linux-arm64-gnu","binary":"zfb","archive_ext":"tar.gz","use_cross":true},
            {"host":"windows-latest","target":"x86_64-pc-windows-msvc","platform":"win32-x64-msvc","binary":"zfb.exe","archive_ext":"zip"}
          ]'
          # TODO when ubuntu-22.04 GitHub Actions runner is deprecated: switch to a
          # manylinux_2_28 container or zig-cc cross-compile to maintain the GLIBC 2.35 floor.
          if [[ "$SKIP_MACOS_X64" == "true" ]]; then
            SETTINGS="$(echo "$ALL" | jq -c '[.[] | select(.target != "x86_64-apple-darwin")]')"
            echo "skip_macos_x64=true → dropping the x86_64-apple-darwin (macos-13) build leg"
          else
            SETTINGS="$(echo "$ALL" | jq -c '.')"
          fi
          echo "Resolved build matrix:"
          echo "$SETTINGS" | jq '.'
          echo "settings=$SETTINGS" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-matrix
    name: Build ${{ matrix.settings.target }}
    strategy:
      fail-fast: false
      matrix:
        # Dynamic matrix from prepare-matrix — the darwin-x64 leg is dropped when
        # skip_macos_x64 is set (issue #437). See the prepare-matrix job above.
        settings: ${{ fromJSON(needs.prepare-matrix.outputs.settings) }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # pnpm version is read from package.json's "packageManager" field
      # (pnpm@11.3.0). action-setup@v4 errors out if BOTH "version:" here
      # and "packageManager:" in package.json are set — pick one. We pick
      # package.json so the version is single-source-of-truth.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      # Install node_modules before cargo build so that build.rs (embed_framework_packages)
      # can find node_modules/.pnpm/preact@*/node_modules/preact/ etc.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          targets: ${{ matrix.settings.target }}

      # Install cross-rs for the linux-arm64 cross-compile target.
      # cross wraps `cargo build` inside a Docker container that provides the correct
      # aarch64-unknown-linux-gnu linker; the host workspace (including node_modules)
      # is mounted as a volume so build.rs can embed framework packages.
      - name: Install cross (linux-arm64 only)
        if: ${{ matrix.settings.use_cross == true }}
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: cross

      - name: Sync platform package versions (lockstep check)
        shell: bash
        run: node scripts/sync-platform-versions.mjs

      - name: Resolve version
        shell: bash
        run: |
          # Derive semver from packages/zfb/package.json (no leading "v").
          # For real tag pushes this matches the tag; for dry-run workflow_dispatch
          # on a branch it is the current dev version string.
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          echo "ZFB_SEMVER=$ZFB_SEMVER" >> "$GITHUB_ENV"
          echo "Resolved semver: $ZFB_SEMVER"

      - name: Build zfb binary (native)
        if: ${{ matrix.settings.use_cross != true }}
        shell: bash
        # ZFB_RELEASE_VERSION stamps the release version into the binary at compile time
        # via option_env! in cli.rs. Without this the binary would report 0.0.0 (Cargo.toml
        # placeholder). The variable is already in GITHUB_ENV from the "Resolve version" step.
        env:
          ZFB_RELEASE_VERSION: ${{ env.ZFB_SEMVER }}
        run: cargo build -p zfb --release --target ${{ matrix.settings.target }}

      - name: Build zfb binary (cross — linux-arm64)
        if: ${{ matrix.settings.use_cross == true }}
        shell: bash
        # ZFB_RELEASE_VERSION is passed into the cross Docker container via Cross.toml
        # [build.env] passthrough — without that entry, cross drops host env vars at the
        # container boundary.
        env:
          ZFB_RELEASE_VERSION: ${{ env.ZFB_SEMVER }}
        run: cross build -p zfb --release --target ${{ matrix.settings.target }}

      # Verify the arm64 binary runs correctly under QEMU emulation.
      # Satisfies acceptance criterion: "linux-arm64 binary runs ./zfb --version correctly
      # under QEMU verification step in workflow logs."
      - name: Set up QEMU (linux-arm64 only)
        if: ${{ matrix.settings.use_cross == true }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: QEMU smoke test — run arm64 binary
        if: ${{ matrix.settings.use_cross == true }}
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/w" -w /w \
            debian:stable-slim \
            ./target/aarch64-unknown-linux-gnu/release/zfb --version

      # Per-platform version guard (Unix — all non-Windows platforms).
      # Runs the freshly-built binary and asserts its --version output matches
      # the release semver. Catches a missed ZFB_RELEASE_VERSION injection on
      # any single platform instead of silently shipping a 0.0.0 binary.
      - name: Assert --version equals release semver (Unix)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' && matrix.settings.use_cross != true }}
        shell: bash
        run: |
          BINARY="target/${{ matrix.settings.target }}/release/zfb"
          ACTUAL=$("$BINARY" --version)
          EXPECTED="zfb $ZFB_SEMVER"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::--version mismatch on ${{ matrix.settings.platform }}: got '$ACTUAL', want '$EXPECTED'"
            exit 1
          fi

      # Per-platform version guard for linux-arm64 (QEMU): runs the arm64
      # binary inside the same QEMU-enabled container used for the smoke test.
      - name: Assert --version equals release semver (linux-arm64 QEMU)
        if: ${{ matrix.settings.use_cross == true }}
        shell: bash
        run: |
          ACTUAL=$(docker run --rm --platform linux/arm64 \
            -v "$PWD:/w" -w /w \
            debian:stable-slim \
            ./target/aarch64-unknown-linux-gnu/release/zfb --version)
          EXPECTED="zfb $ZFB_SEMVER"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::--version mismatch on linux-arm64: got '$ACTUAL', want '$EXPECTED'"
            exit 1
          fi

      # Per-platform version guard (Windows).
      - name: Assert --version equals release semver (Windows)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Binary = "target/${{ matrix.settings.target }}/release/zfb.exe"
          $Actual = & $Binary --version
          $Expected = "zfb $env:ZFB_SEMVER"
          Write-Host "Expected: $Expected"
          Write-Host "Actual:   $Actual"
          if ($Actual -ne $Expected) {
            Write-Host "::error::--version mismatch on ${{ matrix.settings.platform }}: got '$Actual', want '$Expected'"
            exit 1
          }

      - name: Enforce GLIBC 2.35 floor on the built binary
        if: ${{ contains(matrix.settings.target, 'linux-gnu') }}
        shell: bash
        run: |
          BIN="target/${{ matrix.settings.target }}/release/zfb"
          MAX_GLIBC=$(objdump -T "$BIN" \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
            | sort -V \
            | tail -1)
          echo "Highest required GLIBC symbol: $MAX_GLIBC"
          if [[ -z "$MAX_GLIBC" ]]; then
            echo "::error::No GLIBC symbols found via objdump — binary inspection failed."
            exit 1
          fi
          WORST=$(printf '%s\n%s\n' "$MAX_GLIBC" "GLIBC_2.35" | sort -V | tail -1)
          if [[ "$WORST" != "GLIBC_2.35" ]]; then
            echo "::error::Binary requires $MAX_GLIBC, exceeds the GLIBC_2.35 floor."
            exit 1
          fi

      - name: Copy binary to platform package
        shell: bash
        run: cp target/${{ matrix.settings.target }}/release/${{ matrix.settings.binary }} packages/zfb-${{ matrix.settings.platform }}/

      # ── Archive and checksum (contract-locked format) ──────────────────────
      # Archive name: zfb-{semver}-{target-triple}.{ext}
      # Archive contains exactly one file at the root (no nested directory).
      # sha256 file: one line "<64-hex>  <archive-basename>" (two spaces, GNU format).

      - name: Create archive (Unix tar.gz)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' }}
        shell: bash
        run: |
          ARCHIVE="zfb-${ZFB_SEMVER}-${{ matrix.settings.target }}.tar.gz"
          # -C ensures no nested directory leaks into the archive root
          tar -C "packages/zfb-${{ matrix.settings.platform }}" -czf "$ARCHIVE" "${{ matrix.settings.binary }}"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create archive (Windows zip)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Archive = "zfb-${env:ZFB_SEMVER}-${{ matrix.settings.target }}.zip"
          Push-Location "packages/zfb-${{ matrix.settings.platform }}"
          Compress-Archive -Path "${{ matrix.settings.binary }}" -DestinationPath "../../$Archive"
          Pop-Location
          echo "ARCHIVE=$Archive" >> $env:GITHUB_ENV

      - name: Generate sha256 checksum (Unix)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' }}
        shell: bash
        run: |
          # sha256sum outputs "<hash>  <path>"; sed strips the directory prefix so
          # the checksum file contains only the basename (S4/S5/S6 rely on this).
          sha256sum "$ARCHIVE" | sed 's|.*/||' > "${ARCHIVE}.sha256"
          echo "--- checksum file contents ---"
          cat "${ARCHIVE}.sha256"

      - name: Generate sha256 checksum (Windows)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Hash = (Get-FileHash "$env:ARCHIVE" -Algorithm SHA256).Hash.ToLower()
          $Basename = Split-Path "$env:ARCHIVE" -Leaf
          # Two spaces between hash and filename — GNU sha256sum format (S4/S5/S6 rely on this)
          "${Hash}  ${Basename}" | Out-File -FilePath "${env:ARCHIVE}.sha256" -Encoding ascii -NoNewline
          Write-Host "--- checksum file contents ---"
          Get-Content "${env:ARCHIVE}.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.settings.target }}
          path: packages/zfb-${{ matrix.settings.platform }}/${{ matrix.settings.binary }}
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archive-${{ matrix.settings.target }}
          path: |
            zfb-*-${{ matrix.settings.target }}.${{ matrix.settings.archive_ext }}
            zfb-*-${{ matrix.settings.target }}.${{ matrix.settings.archive_ext }}.sha256
          if-no-files-found: error

  release-assets:
    # Attaches all 5 archives + 5 sha256 files to the GitHub Release.
    # Runs after all platform builds complete to avoid first-vs-append GH Release
    # race conditions.  Skipped on dry_run and non-tag refs.
    name: Upload GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve version and channel
        shell: bash
        run: |
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          echo "ZFB_SEMVER=$ZFB_SEMVER" >> "$GITHUB_ENV"
          # Determine prerelease flag from the tag name.
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -next\. ]] || [[ "$TAG" =~ -beta\. ]] || [[ "$TAG" =~ -rc\. ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "Tag: $TAG | semver: $ZFB_SEMVER | prerelease: $IS_PRERELEASE"

      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: archive-*
          path: release-assets
          merge-multiple: true

      - name: List collected assets
        shell: bash
        run: ls -lh release-assets/

      - name: DRY RUN — skip GH Release upload
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo "DRY RUN — would have uploaded the following assets to GH Release:"
          ls release-assets/
          echo "Set dry_run=false on a real v* tag push to create the release."

      # Guard: a manual workflow_dispatch on a branch (not a v* tag) must not
      # accidentally create a GH Release.
      - name: Guard — tag ref required for real release upload
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "::error::GH Release upload requires a v* tag ref. Got: $GITHUB_REF."
            echo "::error::For manual smoke tests, re-run workflow_dispatch with dry_run=true."
            exit 1
          fi

      - name: Upload archives and checksums to GitHub Release
        if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: true

  publish:
    # Publishes all workspace packages once all platform binaries are built.
    # pnpm -r publish honors the dependency graph:
    #   platform packages → @takazudo/zfb → @takazudo/zfb-runtime → @takazudo/zfb-adapter-cloudflare → create-zfb
    # pnpm (not npm) is used so workspace:* peer-deps are rewritten at publish time.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # id-token: write enables npm OIDC-attested provenance via --provenance below.
      # Each published tarball carries a signed attestation linking to the GHA run + commit SHA.
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # pnpm version is read from package.json's "packageManager" field
      # (pnpm@11.3.0). action-setup@v4 errors out if BOTH "version:" here
      # and "packageManager:" in package.json are set — pick one. We pick
      # package.json so the version is single-source-of-truth.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Download all platform binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: false

      # Escape-hatch gate (issue #437): when the macOS-x64 leg was skipped, the
      # binary was built locally and uploaded to the GH Release. Verify both the
      # archive and its .sha256 are present (fail loud if not), then download and
      # extract the binary so @takazudo/zfb-darwin-x64 can be published.
      - name: Verify + fetch pre-built macOS-x64 archive from GH Release
        if: ${{ inputs.skip_macos_x64 == true && inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          ARCHIVE="zfb-${ZFB_SEMVER}-x86_64-apple-darwin.tar.gz"
          echo "Expecting pre-built asset on Release ${TAG}: ${ARCHIVE} (+ .sha256)"

          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in "$ARCHIVE" "${ARCHIVE}.sha256"; do
            if ! grep -Fxq "$f" <<<"$ASSETS"; then
              echo "::error::skip_macos_x64=true but '${f}' is not attached to GH Release ${TAG}."
              echo "::error::Run ./scripts/build-macos-x64-local.sh --upload ${TAG} on a Mac first."
              echo "Assets currently on the release:"; echo "$ASSETS"
              exit 1
            fi
          done
          echo "Both macOS-x64 assets present on the release."

          gh release download "$TAG" \
            --pattern "$ARCHIVE" --pattern "${ARCHIVE}.sha256" \
            --dir prebuilt-macos-x64 --clobber

          # Validate the archive against its published checksum before trusting
          # it — guards against a corrupted/interrupted upload or an independent
          # clobber putting a mismatched binary on the Release.
          ( cd prebuilt-macos-x64 && sha256sum -c "${ARCHIVE}.sha256" )

          tar -C prebuilt-macos-x64 -xzf "prebuilt-macos-x64/${ARCHIVE}"
          if [[ ! -f prebuilt-macos-x64/zfb ]]; then
            echo "::error::Archive ${ARCHIVE} did not contain a 'zfb' binary at its root."
            exit 1
          fi
          cp prebuilt-macos-x64/zfb packages/zfb-darwin-x64/zfb
          chmod +x packages/zfb-darwin-x64/zfb
          echo "Placed locally-built macOS-x64 binary into packages/zfb-darwin-x64/zfb"

      - name: Place CI-built binaries in platform packages
        shell: bash
        run: |
          cp artifacts/binary-aarch64-apple-darwin/zfb packages/zfb-darwin-arm64/zfb
          cp artifacts/binary-aarch64-unknown-linux-gnu/zfb packages/zfb-linux-arm64-gnu/zfb
          cp artifacts/binary-x86_64-unknown-linux-gnu/zfb packages/zfb-linux-x64-gnu/zfb
          cp artifacts/binary-x86_64-pc-windows-msvc/zfb.exe packages/zfb-win32-x64-msvc/zfb.exe
          chmod +x packages/zfb-darwin-arm64/zfb
          chmod +x packages/zfb-linux-arm64-gnu/zfb
          chmod +x packages/zfb-linux-x64-gnu/zfb

      # When NOT skipping, the macOS-x64 binary comes from the CI build artifact.
      # When skipping, it was placed by the "Verify + fetch" step above instead.
      - name: Place CI-built macOS-x64 binary
        if: ${{ inputs.skip_macos_x64 != true }}
        shell: bash
        run: |
          cp artifacts/binary-x86_64-apple-darwin/zfb packages/zfb-darwin-x64/zfb
          chmod +x packages/zfb-darwin-x64/zfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm -r build

      - name: Sync platform package versions (lockstep verification — should be no-op)
        shell: bash
        run: node scripts/sync-platform-versions.mjs

      - name: Determine dist-tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -next\. ]] || [[ "$TAG" =~ -beta\. ]] || [[ "$TAG" =~ -rc\. ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "Resolved dist-tag: $DIST_TAG (from tag: $TAG)"

      - name: DRY RUN — skip publish
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo "DRY RUN — would have published all workspace packages with tag $DIST_TAG"
          echo "Set dry_run=false to perform an actual publish."

      # Guard: a manual workflow_dispatch on a branch (not a v* tag) must not
      # accidentally publish a branch head to the registry. dry_run=true is the
      # only safe way to exercise this workflow from a branch.
      - name: Verify publish context (tag ref required)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "::error::Publish requires a v* tag ref. Got: $GITHUB_REF."
            echo "::error::For manual smoke tests, re-run workflow_dispatch with dry_run=true."
            exit 1
          fi

      # Normal path: every package published with OIDC-attested --provenance.
      - name: Publish to npm
        if: ${{ inputs.dry_run != true && inputs.skip_macos_x64 != true }}
        run: pnpm -r publish --tag "$DIST_TAG" --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Escape-hatch path (issue #437): the macOS-x64 binary was built locally,
      # outside this GHA job, so it cannot carry OIDC provenance. Publish that one
      # package WITHOUT --provenance and every other package WITH --provenance
      # (option B — mixed provenance). See RELEASE_DAY_CHECKLIST.md.
      - name: Publish to npm (mixed provenance — local macOS-x64)
        if: ${{ inputs.dry_run != true && inputs.skip_macos_x64 == true }}
        run: |
          pnpm -r --filter '@takazudo/zfb-darwin-x64' publish --tag "$DIST_TAG" --no-git-checks --access public
          pnpm -r --filter '!@takazudo/zfb-darwin-x64' publish --tag "$DIST_TAG" --no-git-checks --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
