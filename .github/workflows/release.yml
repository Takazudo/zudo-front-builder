# release.yml
#
# Cross-compiles the zfb Rust binary for 5 platforms, packages each binary
# as a tar.gz (Unix) or zip (Windows), generates SHA-256 checksum files,
# attaches them as GitHub Release assets, and publishes all workspace npm
# packages in topological order.
#
# IMPORTANT: NPM_TOKEN must be an Automation-type token (bypasses 2FA).
# A standard user token will fail in unattended CI publish because npm
# requires 2FA for scoped publish unless the token type is "Automation".
# Create one at https://www.npmjs.com/settings/<user>/tokens with type "Automation".
#
# ── Release-channel policy (LOCKED — consumed by S4/S5/S6 installers) ──────
#
# GitHub Release "latest" (prerelease: false) is the stable channel.
# GitHub automatically excludes prerelease Releases from the "latest" query.
#
# Prerelease tagging rule:
#   Tag matching *-next.*, *-beta.*, or *-rc.* → GH Release is created with
#   prerelease: true.  Same tags get npm dist-tag "next".
#   All other v* tags → prerelease: false, npm dist-tag "latest".
#
# Installer opt-in to a prerelease:
#   ZFB_VERSION=v0.X.Y-next.N       — install that exact version
#   ZFB_VERSION=latest-prerelease   — install the latest prerelease release
#
# ── Archive / checksum contract (LOCKED — S4/S5/S6 parse these exactly) ────
#
# Archive name:  zfb-{semver}-{target-triple}.{ext}
#   {semver}        = version from packages/zfb/package.json, no leading "v"
#   {target-triple} = exact Rust target triple (e.g. aarch64-unknown-linux-gnu)
#   {ext}           = tar.gz  for Unix (darwin-*, linux-*)
#                     zip     for Windows (x86_64-pc-windows-msvc)
#
# Archive contents: exactly one file at the archive root — "zfb" (Unix) or
#   "zfb.exe" (Windows).  No nested directory.  Produced by:
#     Unix:    tar -C <bindir> -czf <archive> zfb
#     Windows: cd <bindir>; Compress-Archive zfb.exe <archive>
#
# Checksum file: {archive-name}.sha256
#   One line: "<64-hex-lowercase>  <archive-basename>"  (two spaces, GNU coreutils
#   sha256sum default).  Produced on each platform and verified by:
#     Linux/macOS: sha256sum <archive> | sed 's|.*/||'   (basename only)
#     Windows:     (Get-FileHash).Hash.ToLower() + "  " + basename
#   Installers parse the first whitespace-delimited field as the hash.

# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Release

# Queue releases on the same ref; never cancel — a mid-publish run would leave
# a partial npm publish that is worse than the storage cost.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  # X9: trigger on GitHub Release publish, not on tag push.
  # `/l-make-release` creates a DRAFT Release; publishing that draft (or
  # creating a non-draft Release directly) fires this event. Draft Releases
  # do NOT fire `release: published` — only the publish action does.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publish + GH Release upload steps (build + tarball + sha256 only)"
        type: boolean
        default: false
      skip_macos_x64:
        # Manual override: forces detect-mac-local to output mac_local_present=true
        # without querying the GH Release. Use this on workflow_dispatch when you
        # have already uploaded the macOS-x64 archive + .sha256 to the Release and
        # want to skip the macos-13 build leg. Under the normal `release: published`
        # trigger, auto-detection (detect-mac-local job) handles this automatically.
        # See RELEASE_DAY_CHECKLIST.md.
        description: "Manual override: treat the macOS-x64 archive as already present (forces mac_local_present=true)"
        type: boolean
        default: false

jobs:
  # A2: detect whether a locally-built macOS-x64 archive has been pre-uploaded
  # to the GH Release. Runs before prepare-matrix so the result can gate the
  # darwin-x64 build leg. On workflow_dispatch with skip_macos_x64=true the
  # manual override short-circuits the query and outputs true directly.
  detect-mac-local:
    name: Detect pre-uploaded macOS-x64 archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mac_local_present: ${{ steps.detect.outputs.mac_local_present }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SKIP_MACOS_X64: ${{ inputs.skip_macos_x64 }}
          # For release events, prefer the event payload tag name over GITHUB_REF parsing.
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # Manual override: workflow_dispatch with skip_macos_x64=true always
          # reports present so no Release query is needed.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$SKIP_MACOS_X64" == "true" ]]; then
            echo "workflow_dispatch + skip_macos_x64=true — reporting mac_local_present=true (manual override)"
            echo "mac_local_present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Non-release events without the manual override: no Release to query.
          if [[ "$EVENT_NAME" != "release" ]]; then
            echo "Event is '${EVENT_NAME}', not 'release' — reporting mac_local_present=false"
            echo "mac_local_present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # release: published — query the GH Release for both the archive and its
          # .sha256 companion. A missing Release yields empty output (|| true guard),
          # which is treated as false.
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          ARCHIVE="zfb-${ZFB_SEMVER}-x86_64-apple-darwin.tar.gz"
          echo "Querying GH Release '${TAG}' for '${ARCHIVE}' and '${ARCHIVE}.sha256'"

          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null || echo "")

          TAR_PRESENT=false
          SHA_PRESENT=false
          if echo "$ASSETS" | grep -Fxq "$ARCHIVE"; then
            TAR_PRESENT=true
          fi
          if echo "$ASSETS" | grep -Fxq "${ARCHIVE}.sha256"; then
            SHA_PRESENT=true
          fi

          if [[ "$TAR_PRESENT" == "true" && "$SHA_PRESENT" == "true" ]]; then
            echo "Both macOS-x64 assets found on the Release — reporting mac_local_present=true"
            echo "mac_local_present=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAR_PRESENT" == "true" && "$SHA_PRESENT" == "false" ]]; then
            echo "::warning::macOS-x64 archive '${ARCHIVE}' is present but '${ARCHIVE}.sha256' is missing. Treating as not present (mac_local_present=false). Upload both files to the GH Release to use the fast-Mac path."
            echo "mac_local_present=false" >> "$GITHUB_OUTPUT"
          else
            echo "macOS-x64 archive not found on the Release — reporting mac_local_present=false"
            echo "mac_local_present=false" >> "$GITHUB_OUTPUT"
          fi

  # Emits the build matrix as JSON so the darwin-x64 leg can be conditionally
  # dropped (GitHub's static `matrix.exclude` cannot reference inputs or job
  # outputs). The full matrix lives here as the single source of truth; jq
  # removes the x86_64-apple-darwin entry when mac_local_present is true.
  prepare-matrix:
    name: Prepare build matrix
    needs: detect-mac-local
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      settings: ${{ steps.set.outputs.settings }}
    steps:
      - id: set
        shell: bash
        env:
          MAC_LOCAL_PRESENT: ${{ needs.detect-mac-local.outputs.mac_local_present }}
        run: |
          ALL='[
            {"host":"macos-latest","target":"aarch64-apple-darwin","platform":"darwin-arm64","binary":"zfb","archive_ext":"tar.gz"},
            {"host":"macos-13","target":"x86_64-apple-darwin","platform":"darwin-x64","binary":"zfb","archive_ext":"tar.gz"},
            {"host":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","platform":"linux-x64-gnu","binary":"zfb","archive_ext":"tar.gz"},
            {"host":"ubuntu-latest","target":"aarch64-unknown-linux-gnu","platform":"linux-arm64-gnu","binary":"zfb","archive_ext":"tar.gz","use_cross":true},
            {"host":"windows-latest","target":"x86_64-pc-windows-msvc","platform":"win32-x64-msvc","binary":"zfb.exe","archive_ext":"zip"}
          ]'
          # TODO when ubuntu-22.04 GitHub Actions runner is deprecated: switch to a
          # manylinux_2_28 container or zig-cc cross-compile to maintain the GLIBC 2.35 floor.
          if [[ "$MAC_LOCAL_PRESENT" == "true" ]]; then
            SETTINGS="$(echo "$ALL" | jq -c '[.[] | select(.target != "x86_64-apple-darwin")]')"
            echo "mac_local_present=true → dropping the x86_64-apple-darwin (macos-13) build leg"
          else
            SETTINGS="$(echo "$ALL" | jq -c '.')"
          fi
          echo "Resolved build matrix:"
          echo "$SETTINGS" | jq '.'
          echo "settings=$SETTINGS" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-matrix
    name: Build ${{ matrix.settings.target }}
    strategy:
      fail-fast: false
      matrix:
        # Dynamic matrix from prepare-matrix — the darwin-x64 leg is dropped when
        # mac_local_present=true (detect-mac-local job). See the prepare-matrix job above.
        settings: ${{ fromJSON(needs.prepare-matrix.outputs.settings) }}
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # pnpm version is read from package.json's "packageManager" field
      # (pnpm@11.3.0). action-setup@v4 errors out if BOTH "version:" here
      # and "packageManager:" in package.json are set — pick one. We pick
      # package.json so the version is single-source-of-truth.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "pnpm"

      # Install node_modules before cargo build so that build.rs (embed_framework_packages)
      # can find node_modules/.pnpm/preact@*/node_modules/preact/ etc.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          targets: ${{ matrix.settings.target }}

      # Install cross-rs for the linux-arm64 cross-compile target.
      # cross wraps `cargo build` inside a Docker container that provides the correct
      # aarch64-unknown-linux-gnu linker; the host workspace (including node_modules)
      # is mounted as a volume so build.rs can embed framework packages.
      - name: Install cross (linux-arm64 only)
        if: ${{ matrix.settings.use_cross == true }}
        uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: cross@0.2.5

      - name: Sync platform package versions (lockstep check)
        shell: bash
        run: node scripts/sync-platform-versions.mjs

      - name: Resolve version
        shell: bash
        run: |
          # Derive semver from packages/zfb/package.json (no leading "v").
          # For real tag pushes this matches the tag; for dry-run workflow_dispatch
          # on a branch it is the current dev version string.
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          echo "ZFB_SEMVER=$ZFB_SEMVER" >> "$GITHUB_ENV"
          echo "Resolved semver: $ZFB_SEMVER"

      - name: Build zfb binary (native)
        if: ${{ matrix.settings.use_cross != true }}
        shell: bash
        # ZFB_RELEASE_VERSION stamps the release version into the binary at compile time
        # via option_env! in cli.rs. Without this the binary would report 0.0.0 (Cargo.toml
        # placeholder). The variable is already in GITHUB_ENV from the "Resolve version" step.
        env:
          ZFB_RELEASE_VERSION: ${{ env.ZFB_SEMVER }}
        run: cargo build -p zfb --release --target ${{ matrix.settings.target }}

      - name: Build zfb binary (cross — linux-arm64)
        if: ${{ matrix.settings.use_cross == true }}
        shell: bash
        # ZFB_RELEASE_VERSION is passed into the cross Docker container via Cross.toml
        # [build.env] passthrough — without that entry, cross drops host env vars at the
        # container boundary.
        env:
          ZFB_RELEASE_VERSION: ${{ env.ZFB_SEMVER }}
        run: cross build -p zfb --release --target ${{ matrix.settings.target }}

      # Verify the arm64 binary runs correctly under QEMU emulation.
      # Satisfies acceptance criterion: "linux-arm64 binary runs ./zfb --version correctly
      # under QEMU verification step in workflow logs."
      - name: Set up QEMU (linux-arm64 only)
        if: ${{ matrix.settings.use_cross == true }}
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64

      - name: QEMU smoke test — run arm64 binary
        if: ${{ matrix.settings.use_cross == true }}
        shell: bash
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/w" -w /w \
            debian:stable-slim \
            ./target/aarch64-unknown-linux-gnu/release/zfb --version

      # Per-platform version guard (Unix — all non-Windows platforms).
      # Runs the freshly-built binary and asserts its --version output matches
      # the release semver. Catches a missed ZFB_RELEASE_VERSION injection on
      # any single platform instead of silently shipping a 0.0.0 binary.
      - name: Assert --version equals release semver (Unix)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' && matrix.settings.use_cross != true }}
        shell: bash
        run: |
          BINARY="target/${{ matrix.settings.target }}/release/zfb"
          ACTUAL=$("$BINARY" --version)
          EXPECTED="zfb $ZFB_SEMVER"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::--version mismatch on ${{ matrix.settings.platform }}: got '$ACTUAL', want '$EXPECTED'"
            exit 1
          fi

      # Per-platform version guard for linux-arm64 (QEMU): runs the arm64
      # binary inside the same QEMU-enabled container used for the smoke test.
      - name: Assert --version equals release semver (linux-arm64 QEMU)
        if: ${{ matrix.settings.use_cross == true }}
        shell: bash
        run: |
          ACTUAL=$(docker run --rm --platform linux/arm64 \
            -v "$PWD:/w" -w /w \
            debian:stable-slim \
            ./target/aarch64-unknown-linux-gnu/release/zfb --version)
          EXPECTED="zfb $ZFB_SEMVER"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::--version mismatch on linux-arm64: got '$ACTUAL', want '$EXPECTED'"
            exit 1
          fi

      # Per-platform version guard (Windows).
      - name: Assert --version equals release semver (Windows)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Binary = "target/${{ matrix.settings.target }}/release/zfb.exe"
          $Actual = & $Binary --version
          $Expected = "zfb $env:ZFB_SEMVER"
          Write-Host "Expected: $Expected"
          Write-Host "Actual:   $Actual"
          if ($Actual -ne $Expected) {
            Write-Host "::error::--version mismatch on ${{ matrix.settings.platform }}: got '$Actual', want '$Expected'"
            exit 1
          }

      - name: Enforce GLIBC 2.35 floor on the built binary
        if: ${{ contains(matrix.settings.target, 'linux-gnu') }}
        shell: bash
        run: |
          BIN="target/${{ matrix.settings.target }}/release/zfb"
          MAX_GLIBC=$(objdump -T "$BIN" \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
            | sort -V \
            | tail -1)
          echo "Highest required GLIBC symbol: $MAX_GLIBC"
          if [[ -z "$MAX_GLIBC" ]]; then
            echo "::error::No GLIBC symbols found via objdump — binary inspection failed."
            exit 1
          fi
          WORST=$(printf '%s\n%s\n' "$MAX_GLIBC" "GLIBC_2.35" | sort -V | tail -1)
          if [[ "$WORST" != "GLIBC_2.35" ]]; then
            echo "::error::Binary requires $MAX_GLIBC, exceeds the GLIBC_2.35 floor."
            exit 1
          fi

      - name: Copy binary to platform package
        shell: bash
        run: cp target/${{ matrix.settings.target }}/release/${{ matrix.settings.binary }} packages/zfb-${{ matrix.settings.platform }}/

      # ── Archive and checksum (contract-locked format) ──────────────────────
      # Archive name: zfb-{semver}-{target-triple}.{ext}
      # Archive contains exactly one file at the root (no nested directory).
      # sha256 file: one line "<64-hex>  <archive-basename>" (two spaces, GNU format).

      - name: Create archive (Unix tar.gz)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' }}
        shell: bash
        run: |
          ARCHIVE="zfb-${ZFB_SEMVER}-${{ matrix.settings.target }}.tar.gz"
          # -C ensures no nested directory leaks into the archive root
          tar -C "packages/zfb-${{ matrix.settings.platform }}" -czf "$ARCHIVE" "${{ matrix.settings.binary }}"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create archive (Windows zip)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Archive = "zfb-${env:ZFB_SEMVER}-${{ matrix.settings.target }}.zip"
          Push-Location "packages/zfb-${{ matrix.settings.platform }}"
          Compress-Archive -Path "${{ matrix.settings.binary }}" -DestinationPath "../../$Archive"
          Pop-Location
          echo "ARCHIVE=$Archive" >> $env:GITHUB_ENV

      - name: Generate sha256 checksum (Unix)
        if: ${{ matrix.settings.archive_ext == 'tar.gz' }}
        shell: bash
        run: |
          # sha256sum outputs "<hash>  <path>"; sed strips the directory prefix so
          # the checksum file contains only the basename (S4/S5/S6 rely on this).
          sha256sum "$ARCHIVE" | sed 's|.*/||' > "${ARCHIVE}.sha256"
          echo "--- checksum file contents ---"
          cat "${ARCHIVE}.sha256"

      - name: Generate sha256 checksum (Windows)
        if: ${{ matrix.settings.archive_ext == 'zip' }}
        shell: pwsh
        run: |
          $Hash = (Get-FileHash "$env:ARCHIVE" -Algorithm SHA256).Hash.ToLower()
          $Basename = Split-Path "$env:ARCHIVE" -Leaf
          # Two spaces between hash and filename — GNU sha256sum format (S4/S5/S6 rely on this)
          "${Hash}  ${Basename}" | Out-File -FilePath "${env:ARCHIVE}.sha256" -Encoding ascii -NoNewline
          Write-Host "--- checksum file contents ---"
          Get-Content "${env:ARCHIVE}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.settings.target }}
          path: packages/zfb-${{ matrix.settings.platform }}/${{ matrix.settings.binary }}
          if-no-files-found: error
          # Consumed within this run by the npm-publish job; the real binaries
          # ship as GitHub Release assets, so cap Actions storage at the 1-day floor.
          retention-days: 1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.settings.target }}
          path: |
            zfb-*-${{ matrix.settings.target }}.${{ matrix.settings.archive_ext }}
            zfb-*-${{ matrix.settings.target }}.${{ matrix.settings.archive_ext }}.sha256
          if-no-files-found: error
          # Consumed within this run by the release-assets job; the archives are
          # promoted to GitHub Release assets, so cap Actions storage at the 1-day floor.
          retention-days: 1

  release-assets:
    # Attaches all 5 archives + 5 sha256 files to the GitHub Release.
    # Runs after all platform builds complete to avoid first-vs-append GH Release
    # race conditions.  Skipped on dry_run and non-tag refs.
    name: Upload GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Resolve version and channel
        shell: bash
        run: |
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          echo "ZFB_SEMVER=$ZFB_SEMVER" >> "$GITHUB_ENV"
          # Determine prerelease flag from the tag name.
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -next\. ]] || [[ "$TAG" =~ -beta\. ]] || [[ "$TAG" =~ -rc\. ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
          echo "Tag: $TAG | semver: $ZFB_SEMVER | prerelease: $IS_PRERELEASE"

      - name: Download all archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: release-assets
          merge-multiple: true

      - name: List collected assets
        shell: bash
        run: ls -lh release-assets/

      - name: DRY RUN — skip GH Release upload
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo "DRY RUN — would have uploaded the following assets to GH Release:"
          ls release-assets/
          echo "Set dry_run=false on a real v* tag push to create the release."

      # Guard: a manual workflow_dispatch on a branch (not a v* tag) must not
      # accidentally create a GH Release.
      - name: Guard — tag ref required for real release upload
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "::error::GH Release upload requires a v* tag ref. Got: $GITHUB_REF."
            echo "::error::For manual smoke tests, re-run workflow_dispatch with dry_run=true."
            exit 1
          fi

      - name: Upload archives and checksums to GitHub Release
        if: ${{ inputs.dry_run != true && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          files: release-assets/*
          fail_on_unmatched_files: true

  publish:
    # Publishes all workspace packages once all platform binaries are built.
    # pnpm -r publish honors the dependency graph:
    #   platform packages → @takazudo/zfb → @takazudo/zfb-runtime → @takazudo/zfb-adapter-cloudflare → create-zfb
    # pnpm (not npm) is used so workspace:* peer-deps are rewritten at publish time.
    needs: [build, detect-mac-local]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # id-token: write enables npm OIDC-attested provenance via --provenance below.
      # Each published tarball carries a signed attestation linking to the GHA run + commit SHA.
      id-token: write
    outputs:
      dist_tag: ${{ steps.dist-tag.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # pnpm version is read from package.json's "packageManager" field
      # (pnpm@11.3.0). action-setup@v4 errors out if BOTH "version:" here
      # and "packageManager:" in package.json are set — pick one. We pick
      # package.json so the version is single-source-of-truth.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Download all platform binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts
          merge-multiple: false

      # Fast-Mac gate (A2): when detect-mac-local found the pre-uploaded archive,
      # download and extract the binary so @takazudo/zfb-darwin-x64 can be
      # published without running the macos-13 build leg. detect-mac-local already
      # verified both the archive and its .sha256 are present before outputting true.
      - name: Verify + fetch pre-built macOS-x64 archive from GH Release
        if: ${{ needs.detect-mac-local.outputs.mac_local_present == 'true' && inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For release events prefer the event payload tag; fall back to GITHUB_REF
          # for workflow_dispatch (skip_macos_x64=true path has no event payload tag).
          TAG="${{ github.event.release.tag_name }}"
          if [[ -z "$TAG" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          ZFB_SEMVER=$(node -p "require('./packages/zfb/package.json').version")
          ARCHIVE="zfb-${ZFB_SEMVER}-x86_64-apple-darwin.tar.gz"
          echo "Fetching pre-built macOS-x64 asset from GH Release ${TAG}: ${ARCHIVE} (+ .sha256)"

          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in "$ARCHIVE" "${ARCHIVE}.sha256"; do
            if ! grep -Fxq "$f" <<<"$ASSETS"; then
              echo "::error::mac_local_present=true but '${f}' is not attached to GH Release ${TAG}."
              echo "::error::Run ./scripts/build-macos-x64-local.sh --upload ${TAG} on a Mac first."
              echo "Assets currently on the release:"; echo "$ASSETS"
              exit 1
            fi
          done
          echo "Both macOS-x64 assets present on the release."

          gh release download "$TAG" \
            --pattern "$ARCHIVE" --pattern "${ARCHIVE}.sha256" \
            --dir prebuilt-macos-x64 --clobber

          # Validate the archive against its published checksum before trusting
          # it — guards against a corrupted/interrupted upload or an independent
          # clobber putting a mismatched binary on the Release.
          ( cd prebuilt-macos-x64 && sha256sum -c "${ARCHIVE}.sha256" )

          tar -C prebuilt-macos-x64 -xzf "prebuilt-macos-x64/${ARCHIVE}"
          if [[ ! -f prebuilt-macos-x64/zfb ]]; then
            echo "::error::Archive ${ARCHIVE} did not contain a 'zfb' binary at its root."
            exit 1
          fi
          cp prebuilt-macos-x64/zfb packages/zfb-darwin-x64/zfb
          chmod +x packages/zfb-darwin-x64/zfb
          echo "Placed locally-built macOS-x64 binary into packages/zfb-darwin-x64/zfb"

      - name: Place CI-built binaries in platform packages
        shell: bash
        run: |
          cp artifacts/binary-aarch64-apple-darwin/zfb packages/zfb-darwin-arm64/zfb
          cp artifacts/binary-aarch64-unknown-linux-gnu/zfb packages/zfb-linux-arm64-gnu/zfb
          cp artifacts/binary-x86_64-unknown-linux-gnu/zfb packages/zfb-linux-x64-gnu/zfb
          cp artifacts/binary-x86_64-pc-windows-msvc/zfb.exe packages/zfb-win32-x64-msvc/zfb.exe
          chmod +x packages/zfb-darwin-arm64/zfb
          chmod +x packages/zfb-linux-arm64-gnu/zfb
          chmod +x packages/zfb-linux-x64-gnu/zfb

      # When mac_local_present=false, the macOS-x64 binary comes from the CI build artifact.
      # When mac_local_present=true, it was placed by the "Verify + fetch" step above instead.
      - name: Place CI-built macOS-x64 binary
        if: ${{ needs.detect-mac-local.outputs.mac_local_present != 'true' }}
        shell: bash
        run: |
          cp artifacts/binary-x86_64-apple-darwin/zfb packages/zfb-darwin-x64/zfb
          chmod +x packages/zfb-darwin-x64/zfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript packages
        run: pnpm -r build

      - name: Sync platform package versions (lockstep verification — should be no-op)
        shell: bash
        run: node scripts/sync-platform-versions.mjs

      - name: Determine dist-tag
        id: dist-tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ -next\. ]] || [[ "$TAG" =~ -beta\. ]] || [[ "$TAG" =~ -rc\. ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi
          echo "DIST_TAG=$DIST_TAG" >> "$GITHUB_ENV"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved dist-tag: $DIST_TAG (from tag: $TAG)"

      # ── Prerelease dual-tag gate (fixes #481) ──────────────────────────────
      # Background: npm assigns `latest` automatically on a package's FIRST
      # publish, regardless of --tag.  Because we always publish prereleases
      # with --tag next, `latest` froze at the very first publish (next.2) and
      # never advanced — leaving documented `create zfb@latest` pointing at a
      # broken release.
      #
      # Self-disabling policy: while the registry `latest` is empty (first ever
      # publish) OR is itself a prerelease (contains "-"), we are still in the
      # prerelease phase and must advance `latest` alongside `next`.  As soon as
      # a real stable version is published as `latest` this step outputs
      # ALSO_LATEST="" and the dist-tag-add block below is skipped — a
      # prerelease can never clobber a real stable `latest` after launch.
      #
      # We use @takazudo/zfb as the signal package; lockstep guarantees that
      # create-zfb and all platform packages carry the same version.
      - name: Check if latest should also advance (prerelease dual-tag)
        shell: bash
        run: |
          if [[ "$DIST_TAG" != "next" ]]; then
            echo "DIST_TAG is '$DIST_TAG' (not 'next') — dual-tag not applicable."
            echo "ALSO_LATEST=" >> "$GITHUB_ENV"
          else
            CURRENT_LATEST=$(npm view @takazudo/zfb dist-tags.latest 2>/dev/null || echo "")
            echo "Current @takazudo/zfb dist-tags.latest: '${CURRENT_LATEST}'"
            # Empty (first publish) OR contains "-" (latest is itself a prerelease → still in prerelease phase)
            if [[ -z "$CURRENT_LATEST" || "$CURRENT_LATEST" == *-* ]]; then
              echo "ALSO_LATEST=1" >> "$GITHUB_ENV"
              echo "Dual-tag ENABLED: will also advance 'latest' after publishing with --tag next."
            else
              echo "ALSO_LATEST=" >> "$GITHUB_ENV"
              echo "Dual-tag DISABLED: latest='${CURRENT_LATEST}' is a stable release — skipping."
            fi
          fi

      - name: DRY RUN — skip publish
        if: ${{ inputs.dry_run == true }}
        shell: bash
        run: |
          echo "DRY RUN — would have published all workspace packages with tag $DIST_TAG"
          echo "Set dry_run=false to perform an actual publish."

      # Guard: a manual workflow_dispatch on a branch (not a v* tag) must not
      # accidentally publish a branch head to the registry. dry_run=true is the
      # only safe way to exercise this workflow from a branch.
      - name: Verify publish context (tag ref required)
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v ]]; then
            echo "::error::Publish requires a v* tag ref. Got: $GITHUB_REF."
            echo "::error::For manual smoke tests, re-run workflow_dispatch with dry_run=true."
            exit 1
          fi

      # ── CI gate: verify binary mode in packed tarballs ────────────────────
      # pnpm pack normalises all file modes to 0644 (issue #447 / #441).
      # npm pack preserves the source file mode. This step asserts that each
      # platform package's binary carries mode 0755 (493 decimal) in the
      # tarball BEFORE we attempt to publish, so the job fails loudly if
      # someone reverts to pnpm publish for these packages in the future.
      # Windows (win32-x64-msvc / zfb.exe) is excluded — execute bits are
      # not meaningful on Windows and npm/tar may report a different value.
      - name: Verify binary mode in platform package tarballs
        if: ${{ inputs.dry_run != true }}
        shell: bash
        run: |
          FAILED=0
          for dir in \
            packages/zfb-darwin-arm64 \
            packages/zfb-darwin-x64 \
            packages/zfb-linux-arm64-gnu \
            packages/zfb-linux-x64-gnu; do
            BIN_NAME="zfb"
            MODE=$(cd "$dir" && npm pack --dry-run --json 2>/dev/null \
              | jq -r --arg b "$BIN_NAME" '.[] | .files[] | select(.path == $b) | .mode')
            if [[ "$MODE" != "493" ]]; then
              echo "::error::${dir}: binary '${BIN_NAME}' mode is '${MODE}', expected 493 (0755). Was pnpm publish used instead of npm publish?"
              FAILED=1
            else
              echo "${dir}: binary '${BIN_NAME}' mode OK (${MODE} = 0755)"
            fi
          done
          if [[ "$FAILED" -ne 0 ]]; then
            exit 1
          fi

      # ── Publish ───────────────────────────────────────────────────────────
      # The publish loop lives in scripts/publish-npm-packages.sh (shared by both
      # the normal and mixed-provenance steps below). It is IDEMPOTENT (skips any
      # <name>@<version> already on the registry) and TOLERANT of npm's double-PUT
      # race (a lost-ACK retry that 403s "cannot publish over the previously
      # published versions"), so a partial publish can be safely re-run and a
      # transient network blip can't abort the release mid-way. See the script
      # header and the v0.1.0-next.42 incident for the full rationale.
      #
      # Platform packages (zfb-darwin-*, zfb-linux-*, zfb-win32-*) are still
      # published via `npm publish` (not pnpm): pnpm pack normalises file modes to
      # 0644, stripping the binary's 0755 exec bit; npm preserves it (#447 / #441).
      # Non-platform packages use `pnpm publish` so workspace:* deps are rewritten.
      # DIST_TAG and ALSO_LATEST are inherited from $GITHUB_ENV (set above).

      # Normal path: every package published with OIDC-attested --provenance.
      - name: Publish to npm
        if: ${{ inputs.dry_run != true && needs.detect-mac-local.outputs.mac_local_present != 'true' }}
        shell: bash
        run: bash scripts/publish-npm-packages.sh all-provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mixed-provenance path: the macOS-x64 binary was built locally (outside this
      # GHA job) so it cannot carry OIDC provenance. The `mac-local` mode publishes
      # zfb-darwin-x64 WITHOUT --provenance and every other package WITH it
      # (option B). See RELEASE_DAY_CHECKLIST.md and the script header.
      - name: Publish to npm (mixed provenance — local macOS-x64)
        if: ${{ inputs.dry_run != true && needs.detect-mac-local.outputs.mac_local_present == 'true' }}
        shell: bash
        run: bash scripts/publish-npm-packages.sh mac-local
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  smoke-clean-room:
    # Post-publish clean-room smoke: installs create-zfb@<dist-tag> from the
    # real registry in a temp dir (no workspace context), scaffolds a project,
    # runs `pnpm build` (which calls `zfb build`), and asserts dist/ is populated.
    #
    # This is an ALERTING GUARD, not a gate — publish has already happened.
    # Catches the #481-class (broken dist-tag pointing at a bad binary — the
    # smoke downloads and runs the just-published binary) and the #482-class
    # (missing scaffold dependencies such as @takazudo/zfb-runtime).
    # Does NOT catch the #463-class (undeclared esbuild peer-dep) because
    # esbuild reaches the build transitively via @takazudo/zfb-runtime, so a
    # clean-room pnpm install still resolves it through the dependency tree.
    needs: publish
    # Skip on dry_run — nothing was published, so no registry smoke to run.
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          # This job has no checkout, so action-setup has no packageManager
          # field to read — pin the version explicitly (match root package.json).
          version: 11.3.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          # No cache: pnpm — there is no lockfile in the runner cwd at setup
          # time (the smoke scaffold directory hasn't been created yet).

      - name: Wait for registry propagation and verify dist-tag resolves
        shell: bash
        env:
          DIST_TAG: ${{ needs.publish.outputs.dist_tag }}
        run: |
          # The just-published version may take a few seconds to propagate.
          # Poll until `npm view create-zfb@<dist-tag> version` resolves.
          echo "Waiting for create-zfb@${DIST_TAG} to appear on the registry..."
          max_attempts=6
          delay=10
          for attempt in $(seq 1 $max_attempts); do
            RESOLVED=$(npm view "create-zfb@${DIST_TAG}" version 2>/dev/null || echo "")
            if [[ -n "$RESOLVED" ]]; then
              echo "Registry resolved create-zfb@${DIST_TAG} -> ${RESOLVED} (attempt ${attempt})"
              break
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "::error::create-zfb@${DIST_TAG} did not appear on the registry after ${max_attempts} attempts."
              exit 1
            fi
            echo "  Not yet available (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
            sleep "$delay"
            delay=$(( delay * 2 ))
          done

          # Wait until the runner-arch platform tarball is actually fetchable.
          # npm metadata propagates faster than the ~78 MB binary tarballs; when
          # a tarball hasn't propagated yet, npm SILENTLY SKIPS the optionalDep
          # install and the `zfb` launcher fails at runtime.  `npm pack --dry-run`
          # forces npm to resolve and fetch the actual tarball (not just metadata),
          # confirming it is available before we invoke `npx create-zfb`.
          # The runner for this job is ubuntu-latest (linux x64).
          echo "Waiting for @takazudo/zfb-linux-x64-gnu@${DIST_TAG} tarball to be fetchable..."
          max_attempts=6
          delay=10
          for attempt in $(seq 1 $max_attempts); do
            if npm pack --dry-run "@takazudo/zfb-linux-x64-gnu@${DIST_TAG}" > /dev/null 2>&1; then
              echo "Registry resolved @takazudo/zfb-linux-x64-gnu@${DIST_TAG} tarball (attempt ${attempt})"
              break
            fi
            if [[ "$attempt" -eq "$max_attempts" ]]; then
              echo "::error::@takazudo/zfb-linux-x64-gnu@${DIST_TAG} tarball did not become fetchable after ${max_attempts} attempts."
              exit 1
            fi
            echo "  Not yet available (attempt ${attempt}/${max_attempts}); retrying in ${delay}s..."
            sleep "$delay"
            delay=$(( delay * 2 ))
          done

      - name: Scaffold project with create-zfb@<dist-tag>
        shell: bash
        env:
          DIST_TAG: ${{ needs.publish.outputs.dist_tag }}
        run: |
          # Work in a temp dir completely outside the checked-out workspace to
          # avoid pnpm picking up the monorepo's pnpm-workspace.yaml.
          SMOKE_DIR=$(mktemp -d)
          echo "SMOKE_DIR=$SMOKE_DIR" >> "$GITHUB_ENV"
          echo "Scaffolding into $SMOKE_DIR ..."
          cd "$SMOKE_DIR"
          # Belt-and-suspenders: retry the scaffold up to 3 times with backoff in
          # case of a momentary registry blip after the tarball-propagation wait.
          # `create-zfb <name>` is the non-interactive form (positional arg, no prompts).
          # --yes suppresses any interactive npm/npx prompts.
          scaffold_delay=15
          for scaffold_attempt in 1 2 3; do
            if npx --yes "create-zfb@${DIST_TAG}" smoke-site; then
              break
            fi
            if [[ "$scaffold_attempt" -eq 3 ]]; then
              echo "::error::npx create-zfb@${DIST_TAG} failed after 3 attempts."
              exit 1
            fi
            echo "  Scaffold attempt ${scaffold_attempt}/3 failed; retrying in ${scaffold_delay}s..."
            sleep "$scaffold_delay"
            scaffold_delay=$(( scaffold_delay * 2 ))
          done
          echo "Scaffold complete. Contents of $SMOKE_DIR/smoke-site:"
          ls -la "$SMOKE_DIR/smoke-site"

      - name: Install scaffolded project dependencies
        shell: bash
        run: |
          cd "$SMOKE_DIR/smoke-site"
          pnpm install

      - name: Build scaffolded project
        shell: bash
        run: |
          cd "$SMOKE_DIR/smoke-site"
          pnpm build

      - name: Assert dist/ is populated
        shell: bash
        run: |
          # find -type f is more robust than `ls -A` (handles dotfile-only outputs).
          DIST_FILE=$(find "$SMOKE_DIR/smoke-site/dist" -type f | head -1)
          if [[ -z "$DIST_FILE" ]]; then
            echo "::error::smoke-clean-room: dist/ is empty after zfb build — scaffold or build is broken."
            exit 1
          fi
          FILE_COUNT=$(find "$SMOKE_DIR/smoke-site/dist" -type f | wc -l)
          echo "dist/ OK: ${FILE_COUNT} file(s) found. First: $DIST_FILE"

  notify:
    # Alerting guard: a red build/release-assets/publish/smoke-clean-room leg
    # otherwise sits unseen in the Actions tab once the release skill's watch
    # ends. `needs` lists every upstream job (not just build/publish/
    # smoke-clean-room) with `if: always()` + bash-computed FAILED_JOB —
    # gating on a bare `if: failure()` over only 3 jobs would stay silent if
    # an earlier job (e.g. detect-mac-local) fails and cascades a *skip*
    # (not a failure) into its dependents. Same IFTTT pattern as
    # docs-deploy.yml's notify job (status-computed, reuses IFTTT_PROD_NOTIFY).
    needs: [detect-mac-local, prepare-matrix, build, release-assets, publish, smoke-clean-room]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IFTTT_PROD_NOTIFY: ${{ secrets.IFTTT_PROD_NOTIFY }}
    steps:
      - name: Notify via IFTTT on failure
        if: env.IFTTT_PROD_NOTIFY != ''
        env:
          DETECT_MAC_LOCAL_RESULT: ${{ needs.detect-mac-local.result }}
          PREPARE_MATRIX_RESULT: ${{ needs.prepare-matrix.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          RELEASE_ASSETS_RESULT: ${{ needs.release-assets.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          SMOKE_CLEAN_ROOM_RESULT: ${{ needs.smoke-clean-room.result }}
          RAW_TAG: ${{ github.event.release.tag_name }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          FAILED_JOB=""
          if [ "$DETECT_MAC_LOCAL_RESULT" = "failure" ]; then
            FAILED_JOB="detect-mac-local"
          elif [ "$PREPARE_MATRIX_RESULT" = "failure" ]; then
            FAILED_JOB="prepare-matrix"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            FAILED_JOB="build"
          elif [ "$RELEASE_ASSETS_RESULT" = "failure" ]; then
            FAILED_JOB="release-assets"
          elif [ "$PUBLISH_RESULT" = "failure" ]; then
            FAILED_JOB="publish"
          elif [ "$SMOKE_CLEAN_ROOM_RESULT" = "failure" ]; then
            FAILED_JOB="smoke-clean-room"
          fi

          if [ -z "$FAILED_JOB" ]; then
            echo "No failed job among detect-mac-local/prepare-matrix/build/release-assets/publish/smoke-clean-room — skipping notification."
            exit 0
          fi

          SHORT_SHA=$(echo "$GITHUB_SHA_VAL" | cut -c1-7)
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          TAG_LABEL="${RAW_TAG:-$SHORT_SHA}"

          curl -sSf --max-time 10 -X POST "$IFTTT_PROD_NOTIFY" \
            -H 'Content-Type: application/json' \
            -d "{
              \"value1\": \"Release failed (${FAILED_JOB})\",
              \"value2\": \"${TAG_LABEL}\",
              \"value3\": \"${RUN_URL}\"
            }" || echo "::warning::IFTTT notification failed"
