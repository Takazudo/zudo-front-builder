name: Temporary linked snapshot verification

on:
  pull_request:
    branches: [base/sweep-261007-2-linked-package-tick-suppression]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: v2-zfb
          shared-key: workspace-all-targets
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all --check
      - name: Assert linked-package token identity and snapshot classification
        run: |
          set -o pipefail
          cargo test -p zfb-build --test zudo_react_token_linked_packages -- --nocapture --test-threads=1 2>&1 | tee snapshot-test.log
      - name: Scoped zfb-build clippy
        run: |
          set -o pipefail
          cargo clippy -p zfb-build --tests -- -D warnings 2>&1 | tee snapshot-clippy.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        if: always()
        with:
          name: linked-snapshot-verification
          path: |
            snapshot-test.log
            snapshot-clippy.log
          if-no-files-found: warn
          retention-days: 1
