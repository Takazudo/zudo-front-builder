name: Temporary collection deletion diagnosis
on:
  pull_request:
    branches: ["base/bug-sweep-261006-release-followups-dev-deletion"]
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/collection-deletion-diagnosis.yml"
      - ".github/collection-diagnostic-probe/**"
permissions:
  contents: read
concurrency:
  group: collection-deletion-diagnosis
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
      - name: Save the diagnostic harness before pinned source checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/collection-harness"
          cp -R .github/collection-diagnostic-probe/. "$RUNNER_TEMP/collection-harness/"
          git rev-parse HEAD > "$RUNNER_TEMP/collection-harness/probe-sha.txt"
          git checkout --detach 09c3c0e812f95ee271f8f9a14c6c8723bef105c9
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.0
      - uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a
        with:
          tool: nextest@0.9.138
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: v2-zfb
          shared-key: collection-deletion-diagnostic
          save-if: "false"
      - run: pnpm install --frozen-lockfile
      - name: Check disposable runner disk headroom
        shell: bash
        run: |
          set -euo pipefail
          available="$(df --output=avail -B1 / | awk 'NR == 2 { print $1 }')"
          df -h /
          test "$available" -ge 10000000000
      - name: Capture source and harness provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/collection-diagnosis
          cp -R "$RUNNER_TEMP/collection-harness" target/collection-diagnosis/harness
          git rev-parse HEAD > target/collection-diagnosis/source-sha.txt
          git status --porcelain > target/collection-diagnosis/source-status.txt
          test ! -s target/collection-diagnosis/source-status.txt
          sha256sum Cargo.lock crates/zfb/tests/dev_content_aggregate_cold_boot_e2e.rs > target/collection-diagnosis/source-inputs.sha256
          rustc --version --verbose > target/collection-diagnosis/rust.txt
          node --version > target/collection-diagnosis/node.txt
          pnpm --version > target/collection-diagnosis/pnpm.txt
          cargo nextest --version > target/collection-diagnosis/nextest.txt
      - name: Build exact-source CLI and require the staged esbuild binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p zfb
          test -x crates/zfb/binaries/esbuild/esbuild
          test "$(crates/zfb/binaries/esbuild/esbuild --version)" = "0.25.12"
      - name: Execute unmodified reproduction and independent controls
        shell: bash
        run: |
          set -euo pipefail
          rm -f target/nextest/ci/junit.xml
          set +e
          ZFB_DELETION_DIAGNOSTIC=1 cargo nextest run --locked --profile ci -p zfb --test dev_content_aggregate_cold_boot_e2e -E 'test(/^cold_lazy_deleted_entry_/)' --no-fail-fast --retries 0 --failure-output immediate-final --success-output immediate 2>&1 | tee target/collection-diagnosis/baseline.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > target/collection-diagnosis/baseline.status
          if test -f target/nextest/ci/junit.xml; then cp target/nextest/ci/junit.xml target/collection-diagnosis/baseline.junit.xml; fi
          sha256sum target/debug/zfb > target/collection-diagnosis/baseline-compiler.sha256
      - name: Apply retained logging-only patch and rerun every case
        shell: bash
        run: |
          set -euo pipefail
          git apply "$RUNNER_TEMP/collection-harness/instrumentation.patch"
          git diff --check
          git diff --binary > target/collection-diagnosis/applied-instrumentation.patch
          sha256sum target/collection-diagnosis/applied-instrumentation.patch > target/collection-diagnosis/instrumentation.sha256
          rm -f target/nextest/ci/junit.xml
          set +e
          ZFB_DELETION_DIAGNOSTIC=1 cargo nextest run --locked --profile ci -p zfb --test dev_content_aggregate_cold_boot_e2e -E 'test(/^cold_lazy_deleted_entry_/)' --no-fail-fast --retries 0 --failure-output immediate-final --success-output immediate 2>&1 | tee target/collection-diagnosis/instrumented.log
          result=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$result" > target/collection-diagnosis/instrumented.status
          if test -f target/nextest/ci/junit.xml; then cp target/nextest/ci/junit.xml target/collection-diagnosis/instrumented.junit.xml; fi
          sha256sum target/debug/zfb > target/collection-diagnosis/instrumented-compiler.sha256
      - name: Verify both runs executed all three independent cases
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
            "cold_lazy_deleted_entry_detail_first_title_and_body",
            "cold_lazy_deleted_entry_index_before_delete_control",
            "cold_lazy_deleted_entry_title_only_control",
          }
          for phase in ("baseline", "instrumented"):
            root = ET.parse(Path("target/collection-diagnosis") / (phase + ".junit.xml")).getroot()
            cases = root.findall(".//testcase")
            assert len(cases) == 3, (phase, len(cases))
            assert {case.attrib["name"] for case in cases} == expected
            assert not any(case.find("skipped") is not None for case in cases), phase
            print(phase, [(case.attrib["name"], "FAIL" if case.find("failure") is not None or case.find("error") is not None else "PASS") for case in cases])
          PYCODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: collection-deletion-diagnosis
          path: target/collection-diagnosis/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the actual test verdict
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat target/collection-diagnosis/baseline.status)" = 0
          test "$(cat target/collection-diagnosis/instrumented.status)" = 0
