name: Temporary linked package confirmation

on:
  pull_request:
    branches: [base/sweep-261007-2-linked-package-tick-suppression]

permissions:
  contents: read

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable (2026-03-27)
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@6c1f7cf125e42770ff087ea443901b487cc5471a # v2.79.5
        with:
          tool: nextest@0.9.138
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          prefix-key: v2-zfb
          shared-key: workspace-all-targets
      - run: pnpm install --frozen-lockfile
      - run: scripts/check-exam-ignore-parity.sh
      - name: No-V8 test compile
        run: |
          set -o pipefail
          cargo check --no-default-features -p zfb --tests 2>&1 | tee confirm-no-v8.log
      - name: Linked package token identity
        run: |
          set -o pipefail
          cargo test -p zfb-build --test zudo_react_token_linked_packages 2>&1 | tee confirm-token.log
      - name: Scoped clippy
        run: |
          set -o pipefail
          cargo clippy -p zfb-build -p zfb --tests -- -D warnings 2>&1 | tee confirm-clippy.log
      - name: Whole sibling watcher e2e binary
        run: |
          set -o pipefail
          cargo nextest run -p zfb --test dev_sibling_watch_1678_e2e --run-ignored all --profile ci 2>&1 | tee confirm-watch.log
      - name: Build reproducibility e2e binary
        run: |
          set -o pipefail
          cargo nextest run -p zfb --test build_reproducibility_e2e --run-ignored all --profile ci 2>&1 | tee confirm-repro.log
      - run: cargo build -p zfb
      - run: pnpm exec playwright install --with-deps chromium
      - name: Linked package token probe
        run: |
          set -o pipefail
          node scripts/linked-package-token-probe.mjs 2>&1 | tee confirm-probe.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        if: always()
        with:
          name: linked-confirm-verification
          path: |
            confirm-no-v8.log
            confirm-token.log
            confirm-clippy.log
            confirm-watch.log
            confirm-repro.log
            confirm-probe.log
          if-no-files-found: warn
          retention-days: 2
