# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: PR Preview (Cloudflare Workers)

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-pr-preview.yml"

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist-pr-${{ github.event.pull_request.number }}
          path: docs/dist/
          retention-days: 1
          include-hidden-files: true

  deploy-preview:
    name: Upload preview version to Cloudflare Workers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # No pnpm in this job (only `node`/`npx wrangler`). setup-node@v5
          # auto-detects pnpm-lock.yaml for caching and fails with "Unable to
          # locate pnpm" since pnpm/action-setup never ran here. Disable it.
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist-pr-${{ github.event.pull_request.number }}
          path: docs/dist/
      - name: Write .assetsignore (exclude worker JS from static-asset serving)
        # Fallback until docs' @takazudo/zfb-adapter-cloudflare pin is bumped to the
        # release where the adapter emits .assetsignore itself (epic #1309) — delete
        # this step after that bump.
        run: |
          [ -f docs/dist/.assetsignore ] || printf '%s\n' '_worker.js' '_zfb_inner.mjs' > docs/dist/.assetsignore
      - name: Upload preview version
        id: preview
        # Tolerant by design: `versions upload --preview-alias` requires the
        # `zfb-docs` worker to already exist (created by the first production
        # deploy on merge to main) and the workers.dev subdomain to be enabled.
        # Before that, the upload legitimately fails — treat it as a graceful
        # no-op (the comment step posts a "pending" note) rather than reddening
        # the PR check.
        continue-on-error: true
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          WRANGLER_VERSION=$(node -p "require('./docs/package.json').devDependencies.wrangler")
          PREVIEW_ALIAS="pr-${PR_NUMBER}"
          set +e
          UPLOAD_OUTPUT=$(cd docs && npx wrangler@"$WRANGLER_VERSION" versions upload \
            --preview-alias "$PREVIEW_ALIAS" 2>&1)
          STATUS=$?
          set -e
          echo "$UPLOAD_OUTPUT"
          PREVIEW_URL=$(echo "$UPLOAD_OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev[^ ]*' | head -1)
          if [ "$STATUS" -eq 0 ] && [ -n "$PREVIEW_URL" ]; then
            echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Preview upload unavailable (worker not yet created, or workers.dev subdomain disabled). Status=$STATUS"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upsert sticky PR preview comment
        # NOTE: bumped to v8.0.0 (Node 24) as part of the Node-20 deprecation
        # migration. `github-token` passed explicitly because the implicit
        # detection failed with 401 Bad credentials on SHA-pinned action runs.
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          PREVIEW_OK: ${{ steps.preview.outputs.ok }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- cf-workers-preview-pr -->';
            const previewUrl = process.env.PREVIEW_URL;
            const ok = process.env.PREVIEW_OK === 'true';
            const prNumber = Number(process.env.PR_NUMBER);
            const commitSha = process.env.COMMIT_SHA;
            const shortSha = commitSha.slice(0, 7);
            const body = ok
              ? `${marker}\n### Cloudflare Workers preview\n\n- Preview URL: ${previewUrl}\n- Commit: \`${shortSha}\`\n`
              : `${marker}\n### Cloudflare Workers preview\n\n⏳ Preview not available yet — it activates once the \`zfb-docs\` worker exists (after the first production deploy) and the workers.dev subdomain is enabled.\n- Commit: \`${shortSha}\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
