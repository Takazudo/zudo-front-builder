# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: Production Deploy (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs-deploy.yml"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs build
      # Deploy must not ship HTML that fails validation (issue #1336) — gate
      # the artifact upload (and therefore the deploy job that consumes it)
      # behind the same two checks required on the PR-side docs build.
      - run: pnpm --filter docs check
      - run: pnpm --filter docs check:html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: docs/dist/
          retention-days: 1
          include-hidden-files: true

  build-history:
    name: Build Doc History
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate doc history
        # @takazudo/zudo-doc-history-server is a consumed dependency (not a
        # workspace package here), so invoke its bin via pnpm exec from docs/
        # so node_modules/.bin resolves correctly.
        run: cd docs && pnpm exec doc-history-generate --content-dir src/content/docs --locale ja:src/content/docs-ja --out-dir ../doc-history-out
      - name: Archive doc history output
        run: tar -cf "$RUNNER_TEMP/doc-history.tar" -C doc-history-out .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-history
          path: ${{ runner.temp }}/doc-history.tar
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [build, build-history]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # This job runs only `node`/`npx wrangler` (no pnpm). setup-node@v5
          # auto-enables package-manager-cache and detects pnpm-lock.yaml, then
          # fails with "Unable to locate pnpm" because pnpm/action-setup never ran
          # in this job. Disable the cache — pnpm is not needed here.
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: docs/dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: doc-history
          path: ${{ runner.temp }}
      - name: Extract doc history output
        continue-on-error: true
        run: mkdir -p doc-history-out && tar -xf "$RUNNER_TEMP/doc-history.tar" -C doc-history-out
      - name: Prepare deploy directory
        # The .assetsignore line below is a fallback until docs' @takazudo/zfb-adapter-cloudflare
        # pin is bumped to the release where the adapter emits .assetsignore itself
        # (epic #1309) — drop that line (keep the doc-history copy) after the bump.
        run: |
          if [ -d doc-history-out ] && [ "$(ls -A doc-history-out 2>/dev/null)" ]; then mkdir -p docs/dist/doc-history && cp -r doc-history-out/. docs/dist/doc-history/; fi
          [ -f docs/dist/.assetsignore ] || printf '%s\n' '_worker.js' '_zfb_inner.mjs' > docs/dist/.assetsignore
      - name: Deploy worker
        run: |
          WRANGLER_VERSION=$(node -p "require('./docs/package.json').devDependencies.wrangler")
          cd docs && npx wrangler@"$WRANGLER_VERSION" deploy
      - name: Enable workers.dev subdomain (idempotent)
        continue-on-error: true
        run: |
          RESPONSE=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/zfb-docs/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"enabled":true}')
          echo "$RESPONSE"
          # code 10056 = already configured — treat as success
          CODE=$(echo "$RESPONSE" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log((j.errors||[]).map(e=>e.code).join(','))")
          if [ -n "$CODE" ] && [ "$CODE" != "10056" ]; then
            echo "Unexpected error code(s): $CODE" >&2
            exit 1
          fi
      - name: Attach custom domain (idempotent)
        continue-on-error: true
        run: |
          RESPONSE=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"hostname":"zfb.takazudomodular.com","service":"zfb-docs","environment":"production","zone_name":"takazudomodular.com"}')
          echo "$RESPONSE"
          # 100116 = custom domain already attached; 100122 = zone already has this route
          CODE=$(echo "$RESPONSE" | node -e "const d=require('fs').readFileSync('/dev/stdin','utf8');const j=JSON.parse(d);console.log((j.errors||[]).map(e=>e.code).join(','))")
          if [ -n "$CODE" ] && [ "$CODE" != "100116" ] && [ "$CODE" != "100122" ]; then
            echo "Unexpected error code(s): $CODE" >&2
            exit 1
          fi

  notify:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      IFTTT_PROD_NOTIFY: ${{ secrets.IFTTT_PROD_NOTIFY }}
    steps:
      - name: Notify via IFTTT
        if: env.IFTTT_PROD_NOTIFY != ''
        env:
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          GITHUB_SHA_VAL: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS="succeeded"
          elif [ "$BUILD_RESULT" = "failure" ]; then
            STATUS="failed (build)"
          elif [ "$DEPLOY_RESULT" = "failure" ]; then
            STATUS="failed (deploy)"
          else
            STATUS="cancelled"
          fi

          COMMIT_MSG=$(echo "$RAW_COMMIT_MSG" | head -1 | sed 's/"/\\"/g')
          SHORT_SHA=$(echo "$GITHUB_SHA_VAL" | cut -c1-7)
          RUN_URL="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

          curl -sSf --max-time 10 -X POST "$IFTTT_PROD_NOTIFY" \
            -H 'Content-Type: application/json' \
            -d "{
              \"value1\": \"Cloudflare Workers deploy ${STATUS}\",
              \"value2\": \"${SHORT_SHA} ${COMMIT_MSG}\",
              \"value3\": \"${RUN_URL}\"
            }" || echo "::warning::IFTTT notification failed"
