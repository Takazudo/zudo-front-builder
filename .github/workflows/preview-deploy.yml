name: Preview Deploy

on:
  push:
    branches:
      - preview
      - "expreview/**"

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter docs build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/
          retention-days: 1

  deploy-preview:
    name: Deploy named preview to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/

      - name: Compute Cloudflare branch name
        id: branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SAFE_BRANCH=$(printf '%s' "$REF_NAME" | tr '/' '-')
          echo "name=${SAFE_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Stage deploy root under base path
        run: |
          mkdir -p deploy-root/pj/zudo-front-builder
          if [ -f docs/dist/_redirects ]; then
            mv docs/dist/_redirects deploy-root/_redirects
          fi
          cp -a docs/dist/. deploy-root/pj/zudo-front-builder/

      - name: Deploy to Cloudflare Pages (named preview)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3..."
            if DEPLOY_OUTPUT=$(pnpm dlx wrangler@4.85.0 pages deploy deploy-root \
              --project-name=zudo-front-builder \
              --branch="${CF_BRANCH}" \
              --commit-dirty=true 2>&1); then
              echo "$DEPLOY_OUTPUT"
              echo "Deploy succeeded on attempt $attempt"
              DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-z0-9-]+\.zudo-front-builder\.pages\.dev' | head -1)
              if [ -z "$DEPLOY_URL" ]; then
                DEPLOY_URL="https://${CF_BRANCH}.zudo-front-builder.pages.dev"
              fi
              echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$DEPLOY_OUTPUT"
            if [ "$attempt" -lt 3 ]; then
              echo "Deploy failed, retrying in 150 seconds..."
              sleep 150
            fi
          done
          echo "Deploy failed after 3 attempts"
          exit 1

      - name: Upsert commit comment with preview URL
        uses: actions/github-script@v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          CF_BRANCH: ${{ steps.branch.outputs.name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        with:
          script: |
            const marker = '<!-- cf-preview-branch -->';
            const deployUrl = process.env.DEPLOY_URL;
            const cfBranch = process.env.CF_BRANCH;
            const refName = process.env.REF_NAME;
            const commitSha = process.env.COMMIT_SHA;
            const shortSha = commitSha.slice(0, 7);
            const body = `${marker}\n### Cloudflare Pages named preview\n\n- Branch: \`${refName}\` (CF: \`${cfBranch}\`)\n- Preview URL: ${deployUrl}\n- Commit: \`${shortSha}\`\n`;

            const { data: comments } = await github.rest.repos.listCommentsForCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commitSha,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.repos.updateCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: commitSha,
                body,
              });
            }
