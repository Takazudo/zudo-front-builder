# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: PR Checks

on:
  pull_request:
    branches:
      - main
      - "base/**"
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

# The docs build (+ docs/check + docs/check:html) previously lived here as
# an unconditional job, rebuilding the docs site on every PR including
# pure-Rust changes. It now lives in the path-filtered docs-checks.yml
# workflow (issue #1336) so it only runs when docs-affecting files change.
# `pnpm audit (prod)` below stays here, unfiltered — it is a required
# status check on every PR per #1333's branch ruleset, and moving it behind
# a path filter would hang non-docs PRs forever.
jobs:
  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    # 15 min: the shared retry script's 4-attempt/3-delay backoff (30s + 2m +
    # 5m = 7.5 min) alone exceeds the previous 5-min budget — see
    # scripts/pnpm-audit-with-retry.sh's header comment (issue #2074).
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production deps)
        run: bash scripts/pnpm-audit-with-retry.sh
