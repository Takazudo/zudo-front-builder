name: PR Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter docs build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/
          retention-days: 1

  deploy-preview:
    name: Deploy PR preview to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: docs/dist/

      - name: Deploy to Cloudflare Pages (PR preview)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3..."
            if DEPLOY_OUTPUT=$(pnpm dlx wrangler@4 pages deploy docs/dist \
              --project-name=zudo-front-builder \
              --branch="pr-${PR_NUMBER}" \
              --commit-dirty=true 2>&1); then
              echo "$DEPLOY_OUTPUT"
              echo "Deploy succeeded on attempt $attempt"
              DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-z0-9-]+\.zudo-front-builder\.pages\.dev' | head -1)
              if [ -z "$DEPLOY_URL" ]; then
                DEPLOY_URL="https://pr-${PR_NUMBER}.zudo-front-builder.pages.dev"
              fi
              echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$DEPLOY_OUTPUT"
            if [ "$attempt" -lt 3 ]; then
              echo "Deploy failed, retrying in 150 seconds..."
              sleep 150
            fi
          done
          echo "Deploy failed after 3 attempts"
          exit 1

      - name: Upsert PR preview comment
        uses: actions/github-script@v8
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cf-preview-pr -->';
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = Number(process.env.PR_NUMBER);
            const commitSha = process.env.COMMIT_SHA;
            const shortSha = commitSha.slice(0, 7);
            const body = `${marker}\n### Cloudflare Pages preview\n\n- Preview URL: ${deployUrl}\n- Commit: \`${shortSha}\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
