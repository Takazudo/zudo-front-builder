# pin-update: every `uses: <action>@<sha>` line is pinned to an immutable 40-char
# commit SHA per OpenSSF best practice. The trailing `# vX.Y.Z` comment names the
# release for human readability. To bump: resolve the new tag's SHA via
# `gh api repos/<org>/<repo>/git/refs/tags/<tag> --jq .object.sha` and replace
# both the SHA and the version comment.

name: PR Checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter docs build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-dist
          path: docs/dist/
          retention-days: 1

  audit:
    name: pnpm audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production deps)
        run: |
          for attempt in 1 2; do
            if pnpm audit --prod --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "audit failed, retrying in 30s..."
              sleep 30
            fi
          done
          exit 1

  deploy-preview:
    name: Deploy PR preview to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-dist
          path: docs/dist/

      - name: Stage deploy root under base path
        run: |
          mkdir -p deploy-root/pj/zudo-front-builder
          if [ -f docs/dist/_redirects ]; then
            mv docs/dist/_redirects deploy-root/_redirects
          fi
          cp -a docs/dist/. deploy-root/pj/zudo-front-builder/

      - name: Deploy to Cloudflare Pages (PR preview)
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt/3..."
            if DEPLOY_OUTPUT=$(pnpm dlx wrangler@4.85.0 pages deploy deploy-root \
              --project-name=zudo-front-builder \
              --branch="pr-${PR_NUMBER}" \
              --commit-dirty=true 2>&1); then
              echo "$DEPLOY_OUTPUT"
              echo "Deploy succeeded on attempt $attempt"
              DEPLOY_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[a-z0-9-]+\.zudo-front-builder\.pages\.dev' | head -1)
              if [ -z "$DEPLOY_URL" ]; then
                DEPLOY_URL="https://pr-${PR_NUMBER}.zudo-front-builder.pages.dev"
              fi
              echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "$DEPLOY_OUTPUT"
            if [ "$attempt" -lt 3 ]; then
              echo "Deploy failed, retrying in 150 seconds..."
              sleep 150
            fi
          done
          echo "Deploy failed after 3 attempts"
          exit 1

      - name: Upsert PR preview comment
        # NOTE: pinned to v7.1.0 — v8.0.0 (Node 24 + octokit-core 5.0.1) returned
        # 401 Bad credentials on github.rest.issues.listComments even with
        # pull-requests:write granted on the workflow. v7 (Node 20) is battle-
        # tested in this exact comment-upsert pattern. Re-evaluate when v9+
        # ships with stable token handling.
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cf-preview-pr -->';
            const deployUrl = process.env.DEPLOY_URL;
            const prNumber = Number(process.env.PR_NUMBER);
            const commitSha = process.env.COMMIT_SHA;
            const shortSha = commitSha.slice(0, 7);
            const body = `${marker}\n### Cloudflare Pages preview\n\n- Preview URL: ${deployUrl}\n- Commit: \`${shortSha}\`\n`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
