<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Alignment roots in CSS Grid</title>
    <link rel="stylesheet" href="../../dist/w-alignment/wind.css" />
  </head>
  <body>
    <div id="justify-items-grid" class="grid one-cell justify-items-center">
      <div id="justify-items-marker" class="marker"></div>
    </div>
    <div id="justify-self-start-grid" class="grid one-cell">
      <div id="justify-self-start" class="marker justify-self-start"></div>
    </div>
    <div id="justify-self-end-grid" class="grid one-cell">
      <div id="justify-self-end" class="marker justify-self-end"></div>
    </div>
    <div id="justify-self-center-grid" class="grid one-cell">
      <div id="justify-self-center" class="marker justify-self-center"></div>
    </div>
    <div id="justify-self-stretch-grid" class="grid one-cell">
      <div id="justify-self-stretch" class="marker auto-width justify-self-stretch"></div>
    </div>
    <div id="place-items-grid" class="grid one-cell place-items-center">
      <div id="place-items-marker" class="marker"></div>
    </div>
    <div id="place-self-grid" class="grid one-cell">
      <div id="place-self-end" class="marker place-self-end"></div>
    </div>
    <div id="place-content-grid" class="grid content-grid place-content-between">
      <div id="content-first" class="content-marker"></div>
      <div id="content-second" class="content-marker"></div>
      <div id="content-third" class="content-marker"></div>
      <div id="content-fourth" class="content-marker"></div>
    </div>
  </body>
</html>
