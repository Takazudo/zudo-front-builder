<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>W-A09 bounded utility additions and cursor keywords</title>
    <link rel="stylesheet" href="../../dist/w-a09/wind.css" />
    <style>
      :where(#wrap) {
        width: 4ch;
      }

      :where(#leading, #offset) {
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <p id="wrap" class="wrap-anywhere">averyveryverylongunbrokenword</p>
    <a id="decoration" href="#" class="underline decoration-panel hover:decoration-[#ff0000]">
      Decorated link
    </a>
    <p id="leading" class="leading-none">Line height one</p>
    <div id="visibility" class="invisible md:visible">Shown from md</div>
    <button id="cursor" class="cursor-col-resize focus:cursor-row-resize">Resize handle</button>
    <div id="cursor-help" class="cursor-help">Help cursor</div>
    <div id="cursor-none" class="cursor-none">No cursor</div>
    <div id="cursor-progress" class="cursor-progress">Progress cursor</div>
    <div id="cursor-crosshair" class="cursor-crosshair">Crosshair cursor</div>
    <div id="cursor-cell" class="cursor-cell">Cell cursor</div>
    <div id="cursor-copy" class="cursor-copy">Copy cursor</div>
    <div id="cursor-alias" class="cursor-alias">Alias cursor</div>
    <div id="cursor-no-drop" class="cursor-no-drop">No drop cursor</div>
    <div id="cursor-context-menu" class="cursor-context-menu">Context menu cursor</div>
    <div id="cursor-vertical-text" class="cursor-vertical-text">Vertical text cursor</div>
    <div id="cursor-all-scroll" class="cursor-all-scroll">All scroll cursor</div>
    <div id="cursor-zoom-in" class="cursor-zoom-in">Zoom in cursor</div>
    <div id="cursor-zoom-out" class="cursor-zoom-out">Zoom out cursor</div>
    <a id="offset" href="#" class="underline underline-offset-4 hover:underline-offset-[6px]">
      Offset link
    </a>
  </body>
</html>
