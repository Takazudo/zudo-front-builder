<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="zfb-view-transitions-enabled" content="" />
    <meta name="zfb-view-transitions-fallback" content="animate" />
    <title>Island A</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
      }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: #fff;
        border-bottom: 1px solid #ccc;
        z-index: 10;
      }
      main {
        padding: 4rem 1rem 1rem;
      }
    </style>
    <!--
      Import map: maps @takazudo/zfb/runtime to island-real.js, a REAL
      (non-stub) mount/unmount module — unlike every other fixture page, which
      maps this specifier to the no-op island-stubs.js. This page and
      island-b.html are the one pair exercising the actual island lifecycle so
      island-persist.chromium.spec.mjs can prove the data-zfb-transition-persist
      contract (#1389) against genuine mount/unmount side effects.
    -->
    <script type="importmap">
      {
        "imports": {
          "@takazudo/zfb/runtime": "/island-real.js"
        }
      }
    </script>
  </head>
  <body>
    <nav>
      <a href="/island-a.html" id="to-island-a">Island A</a>
      <a href="/island-b.html" id="to-island-b">Island B</a>
    </nav>
    <main>
      <h1>Island A</h1>
      <div data-counter-island data-zfb-transition-persist="counter" id="counter-persist">
        <span data-counter-value id="persist-value">0</span>
        <button data-counter-inc id="persist-inc" type="button">+1 persist</button>
      </div>
      <div data-counter-island id="counter-plain">
        <span data-counter-value id="plain-value">0</span>
        <button data-counter-inc id="plain-inc" type="button">+1 plain</button>
      </div>
    </main>
    <!--
      A real zfb site bootstraps islands via a server-emitted
      mountIslands(manifest) call; this standalone fixture has no build step,
      so the inline script below mounts the initial markers directly.
      Post-swap re-mounts are triggered by the router itself via
      mountNewIslands() (router.ts) — NOT by this script running again: its
      textContent must stay byte-identical to island-b.html's inline script
      (and to index.html/page-a.html/page-b.html's shared bootstrap script),
      or the router's runScripts() (swap-functions.ts's detectScriptExecuted,
      keyed on inline-script textContent) would treat the incoming page's copy
      as "new" and re-run init()/mountNewIslands() a second time per swap.
    -->
    <script type="module">
      import { init } from "/dist/client-router/router.js";
      import { init as prefetchInit } from "/dist/client-router/prefetch.js";
      import { mountNewIslands } from "/island-real.js";
      init();
      prefetchInit();
      mountNewIslands();
    </script>
  </body>
</html>
