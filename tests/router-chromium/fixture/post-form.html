<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Required by ClientRouter: enables SPA mode + real View Transitions on this page. -->
    <meta name="zfb-view-transitions-enabled" content="" />
    <meta name="zfb-view-transitions-fallback" content="animate" />
    <title>Post Form</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
      }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: #fff;
        border-bottom: 1px solid #ccc;
        z-index: 10;
      }
      main {
        padding: 4rem 1rem 1rem;
      }
    </style>
    <!-- Import map: see index.html's header comment for the full rationale. -->
    <script type="importmap">
      {
        "imports": {
          "@takazudo/zfb/runtime": "/island-stubs.js"
        }
      }
    </script>
  </head>
  <body>
    <nav>
      <a href="/index.html" id="to-home">Home</a>
    </nav>
    <main>
      <h1>Post Form</h1>
      <!--
        A POST form for history-rejection.chromium.spec.mjs: a rejected URL
        write after the POST response must abort without replaying the request.
      -->
      <form id="post-form" action="/search-results.html" method="post">
        <input type="text" name="note" value="once" />
        <button type="submit" id="post-submit">Send</button>
      </form>
    </main>
    <script type="module">
      import { init } from "/dist/client-router/router.js";
      init();
    </script>
  </body>
</html>
