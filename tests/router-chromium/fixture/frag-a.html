<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="zfb-view-transitions-enabled" content="" />
    <meta name="zfb-view-transitions-fallback" content="animate" />
    <title>Fragment A</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
      }
      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        gap: 1rem;
        padding: 0.75rem 1rem;
        background: #fff;
        border-bottom: 1px solid #ccc;
        z-index: 10;
      }
      main {
        padding: 4rem 1rem 1rem;
      }
      .spacer {
        height: 2000px;
      }
      .tail {
        height: 4000px;
      }
      #frag-target {
        scroll-margin-top: 96px;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "@takazudo/zfb/runtime": "/island-stubs.js"
        }
      }
    </script>
  </head>
  <body>
    <nav>
      <a href="/frag-a.html" id="to-frag-a">Fragment A</a>
      <a href="/frag-b.html" id="to-frag-b">Fragment B</a>
    </nav>
    <main>
      <h1>Fragment A</h1>
      <p id="a-only">This is fragment page A.</p>
      <!--
        Two same-document links to the same fragment (#4165). The plain one is
        intercepted by the client router, which writes a router-managed entry.
        data-zfb-reload makes the router leave the click alone, so the browser
        performs the fragment navigation itself and creates a stateless
        (history.state === null) entry, as any hash link the router does not
        handle, or a location.hash write, does.
      -->
      <a href="#frag-target" id="router-frag-link">Jump (router)</a>
      <a href="#frag-target" id="native-frag-link" data-zfb-reload>Jump (browser)</a>
      <div class="spacer"></div>
      <h2 id="frag-target">Fragment target</h2>
      <div class="tail"></div>
    </main>
    <script type="module">
      import { init } from "/dist/client-router/router.js";
      import { init as prefetchInit } from "/dist/client-router/prefetch.js";
      init();
      prefetchInit();
    </script>
  </body>
</html>
