# health.yml fixture for tests/unit/check-exam-ignore-parity.sh (issue #2072).

name: health-fixture

on:
  pull_request:

jobs:
  health:
    steps:
      - name: Run fixture beta integration suite
        run: cargo test -p fixture-pkg --test beta_integration -- --ignored

      # Quoted: a bare `mod_a::mod_b:: -- --ignored` plain scalar trips YAML's
      # colon-space mapping-indicator rule, same as the real health.yml's
      # `commands::build::` step.
      - name: Run fixture lib module suite
        run: "cargo test -p fixture-pkg --lib mod_a::mod_b:: -- --ignored"

      # Decoy: this step's *name* mentions "delta", but its `run:` line
      # actually scopes the SAME beta_integration binary again — a loose
      # name-similarity grep against step names would wrongly call
      # delta_integration's uncovered_test "covered". A real scope parser
      # must not be fooled by this.
      - name: Run fixture delta integration suite (decoy — scope does not match)
        run: cargo test -p fixture-pkg --test beta_integration -- --ignored

      # Workspace-resolved nextest shape: an exact package/binary conjunction
      # plus exact test predicates inside a package-scoped group.
      - name: Run fixture ignored tests via workspace nextest
        run: |
          cargo nextest run --workspace --profile ci --run-ignored ignored-only -E '
            (package(fixture-pkg) & binary(=epsilon_integration))
              | package(fixture-pkg) & (
                  test(=covered_by_nextest_exact_test)
                    | test(=mod_a::mod_b::tests::nextest_exact_lib_test)
                )
              | (package(decoy-pkg) & binary(=delta_integration))
              | (package(decoy-pkg) & test(=uncovered_test))
          '
