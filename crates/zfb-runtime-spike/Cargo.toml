[package]
name = "zfb-runtime-spike"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "Spike crate for evaluating JS runtimes behind a RenderHost trait. ADR-001 inputs."
publish = false

# Feature flags isolate heavy V8 compile costs. Default builds the lightweight
# rquickjs host so contributors get a working spike in seconds rather than the
# 20+ minute first-build of a V8-backed candidate.
[features]
default = ["quickjs"]
quickjs = ["dep:rquickjs"]
deno = ["dep:deno_core", "dep:tokio"]
ssr-rs = ["dep:ssr_rs"]
all-hosts = ["quickjs", "deno", "ssr-rs"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Lightweight non-V8 control runtime. Ships as default-on so the bench works
# out of the box. ~20 second cold compile on a modern laptop.
rquickjs = { version = "0.9", features = ["loader", "parallel"], optional = true }

# V8 via Deno's reusable core. First build is 15-30 minutes because it pulls
# in a multi-hundred-MB V8 source bundle. Gated behind the `deno` feature so
# CI / contributors only pay this cost when explicitly evaluating it.
deno_core = { version = "0.319", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }

# Purpose-built thin V8 wrapper for Preact/React SSR. Same V8 build cost as
# deno_core (they share the underlying rusty_v8). Gated behind `ssr-rs`.
ssr_rs = { version = "0.7", optional = true }

[[bin]]
name = "zfb-spike-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "zfb-spike-gen-fixtures"
path = "src/bin/gen_fixtures.rs"

[[bin]]
name = "zfb-spike-smoke"
path = "src/bin/smoke.rs"
required-features = ["quickjs"]
