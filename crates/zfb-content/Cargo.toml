[package]
name = "zfb-content"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb content engine: markdown/MDX pipeline, frontmatter, syntect, content collections"

[lib]

[features]
default = ["syntect-onig"]
# Syntect regex backend selection (zfb#1573). Exactly one backend must be
# enabled: `syntect-onig` (oniguruma, C — the historical native backend) or
# `syntect-fancy` (pure Rust — the only backend that compiles for
# wasm32-unknown-unknown; wasm consumers depend on this crate with
# `default-features = false, features = ["syntect-fancy"]`). If cargo
# feature unification enables BOTH, syntect gives regex-onig precedence
# (syntect-5.3.0 src/parsing/regex.rs:191), so a unified native workspace
# build stays byte-identical to onig-only. With NEITHER backend enabled,
# syntect itself fails to compile (cryptic unresolved `regex_impl` errors in
# the syntect crate — cargo stops there, before this crate's units) — every
# consumer must select exactly one backend, directly or via zfb-render's
# forwarding features (zfb#1576). Keep the zfb-render dev-dep below on
# `default-features = false`: the tests only need its SWC parse helper, and
# inheriting zfb-render's defaults would pull `embed_v8` (`deno_core`/V8)
# into this otherwise lightweight test graph.
syntect-onig = ["syntect/regex-onig"]
syntect-fancy = ["syntect/regex-fancy"]
# Generator-only feature enabling syntect's `.sublime-syntax` YAML loader
# (`SyntaxSetBuilder::add_from_folder`, epic #1845 sub #1848). Kept OFF by
# default and OFF the unconditional workspace syntect dep (root
# Cargo.toml:17) — `yaml-load` pulls in a YAML parser that no runtime
# consumer needs; only the `generate_syntax_dump` bin below does, to build the
# custom SyntaxSet dump ahead of time and commit it.
generate-syntax-dump = ["syntect/yaml-load"]

[[bin]]
# Regenerates the custom SyntaxSet dump (issue #1848) that adds
# TypeScript/TSX + TOML grammars on top of syntect's bundled defaults, loaded
# at `src/syntect_highlight.rs` via `include_bytes!` +
# `from_uncompressed_data`. `required-features` keeps this native
# filesystem tool out of every default build, mirroring
# `zfb-md-wasm`'s `generate_parity_oracle` bin (see its Cargo.toml). Run:
# `cargo run -p zfb-content --bin generate_syntax_dump --features generate-syntax-dump`
name = "generate_syntax_dump"
path = "tests/bin/generate_syntax_dump.rs"
required-features = ["generate-syntax-dump"]

[dependencies]
zfb-md-ast = { path = "../zfb-md-ast" }
zfb-md-extras = { path = "../zfb-md-extras" }
zfb-types = { path = "../zfb-types" }
markdown = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
syntect = { workspace = true }
garde = { workspace = true }

# Glob matcher for the collection walker's include/exclude filters
# (zzmod Wave 13 + CollectionDef filters). Same crate ripgrep uses;
# one GlobSet compiles many patterns into one matcher.
globset = { workspace = true }

# Hashing for the per-module content hash that drives `mdx://` specifiers
# and the in-memory compile cache. Same crate+version pair used by
# `zfb-css::pipeline::hash_8` so the project speaks one hashing dialect.
sha2 = "0.10"
hex = "0.4"

# SWC umbrella crate, used by `tsx_frontmatter` to parse `.tsx` modules
# and walk their AST without executing them. The umbrella version is
# pinned in the workspace `Cargo.toml`; this crate only opts into the
# minimum feature set it needs (parser + AST + visit). Pulling in
# standalone `swc_ecma_*` crates here would create a parallel SWC graph
# at a different version line — the AST types from `swc_core::ecma::ast`
# would not unify with `swc_ecma_ast::*`, breaking interop with
# `zfb-render`.
swc_core = { workspace = true, features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_visit",
] }

[dev-dependencies]
# Used by tests/mdx_jsx_emit.rs to pipe emitter output through SWC and
# assert it parses as valid JS. Pure dev-only — keeps zfb-content's
# runtime dependency surface minimal.
zfb-render = { path = "../zfb-render", default-features = false }
# Used by tests/walk_order_determinism.rs to create temp directories
# for fake MDX file paths.
tempfile = { workspace = true }
