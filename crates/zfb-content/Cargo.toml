[package]
name = "zfb-content"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb content engine: markdown/MDX pipeline, frontmatter, syntect, content collections"

[lib]

[dependencies]
markdown = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
syntect = { workspace = true }
garde = { workspace = true }

# Hashing for the per-module content hash that drives `mdx://` specifiers
# and the in-memory compile cache. Same crate+version pair used by
# `zfb-css::pipeline::hash_8` so the project speaks one hashing dialect.
sha2 = "0.10"
hex = "0.4"

# SWC umbrella crate, used by `tsx_frontmatter` to parse `.tsx` modules
# and walk their AST without executing them. The umbrella version is
# pinned in the workspace `Cargo.toml`; this crate only opts into the
# minimum feature set it needs (parser + AST + visit). Pulling in
# standalone `swc_ecma_*` crates here would create a parallel SWC graph
# at a different version line — the AST types from `swc_core::ecma::ast`
# would not unify with `swc_ecma_ast::*`, breaking interop with
# `zfb-render`.
swc_core = { workspace = true, features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_visit",
] }

[dev-dependencies]
# Used by tests/mdx_jsx_emit.rs to pipe emitter output through SWC and
# assert it parses as valid JS. Pure dev-only — keeps zfb-content's
# runtime dependency surface minimal.
zfb-render = { path = "../zfb-render" }
