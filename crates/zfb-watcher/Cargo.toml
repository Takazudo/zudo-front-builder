[package]
name = "zfb-watcher"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb dev-mode filesystem watcher: wraps `notify` and emits debounced Change events on a tokio channel"

[lib]

[dependencies]
notify = "8"
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
# Shared condition-keyed watcher-live handshake (#1338). zfb-test-utils has
# NO dependency on zfb-watcher, so this dev-dep introduces no cycle.
zfb-test-utils = { path = "../zfb-test-utils" }
