[package]
name = "zfb-islands"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb islands runtime: \"use client\" AST scanner, native client bundler, hydration HTML emit"

[lib]

[features]
default = []

[dependencies]
zfb-rolldown-prototype = { path = "../zfb-rolldown-prototype", features = ["native"] }
# Stable asset-URL / on-disk-path constants shared with zfb-render
# (head injection, S1) and zfb-build (production pipeline, S4).
# zfb-types is a zero-zfb-dep leaf crate, so this introduces no
# coupling beyond the constants themselves.
zfb-types = { path = "../zfb-types" }
# Shared exact-match resolver helper used by both this islands
# bundler and the main bundler in zfb-build: exact-match
# `compilerOptions.paths` entries on a synthetic tsconfig.
zfb-plugin-resolver = { path = "../zfb-plugin-resolver" }
# Guard (b) stage-escape audit primitive (issue #1705, epic #1702):
# `IslandsBundlerConfig::stage_audit` calls
# `zfb_build::metafile_deps::audit_metafile_stage_escape_at_path` from the
# real bundle-job call sites in `src/bundle_job.rs`. `zfb-build` does
# not depend on `zfb-islands`, so this stays one-way; production
# orchestration (`zfb` wiring `zfb-build` + `zfb-islands` together) is
# unaffected.
#
# `default-features = false`: `zfb-build`'s own `default = ["direct-v8"]`
# would otherwise silently drag V8 into this crate's
# dependency surface. `metafile_deps` (the only module used here) is a
# pure/no-`cfg` module, so it compiles fine without `direct-v8` — this
# keeps zfb-islands the "light, no V8" crate the test strategy relies on
# (see CLAUDE.md's Testing section).
zfb-build = { path = "../zfb-build", default-features = false }

# Workspace-shared helpers.
anyhow = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SWC parsing only — no transforms or codegen. Subset of zfb-render's flags.
# `ecma_visit` added for issue #1387 (import.meta.glob detection needs the
# `Visit`/`VisitWith` traits, same as zfb-build's `GlobCallCollector`).
swc_core = { workspace = true, features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_transforms",
    "ecma_visit",
] }

# Hashing for the bundle asset filename suffix. Mirrors zfb-css::pipeline.
sha2 = "0.10"
hex = "0.4"

# Structured logging for diagnostics (e.g. mutex-poisoning recovery).
tracing = "0.1"
lol_html = "2.8.1"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
