[package]
name = "zfb-islands"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb islands runtime: \"use client\" AST scanner, esbuild subprocess bundler, hydration HTML emit"

# ---------------------------------------------------------------------------
# Pinned esbuild CLI version this crate is compiled against.
#
# Release engineering populates `crates/zfb/binaries/esbuild/esbuild` with
# the exact binary matching the version constant `EXPECTED_ESBUILD_VERSION`
# in `crates/zfb-toolchain-pins/src/lib.rs` (re-exported by `src/esbuild.rs`).
# At subprocess startup we run `esbuild --version` and refuse to launch if
# the reported version does not match. A SHA-256 of the binary
# (`EXPECTED_ESBUILD_SHA256`, possibly empty during development) is also
# verified when populated.
#
# To bump, follow the "External tool version pins" procedure in
# CONTRIBUTING.md at the workspace root. Quick-reference:
#   1. Edit EXPECTED_ESBUILD_VERSION in crates/zfb-toolchain-pins/src/lib.rs.
#   2. Edit EXPECTED_ESBUILD_SHA256 in src/esbuild.rs (or set it to "" to
#      keep the slot open until release engineering fills the new hash in)
#      and the SHA-256 table in crates/zfb/build.rs.
#   3. Drop the new binary under crates/zfb/binaries/esbuild/esbuild in the
#      release tarball.
# ---------------------------------------------------------------------------

[lib]

[dependencies]
# Stable asset-URL / on-disk-path constants shared with zfb-render
# (head injection, S1) and zfb-build (production pipeline, S4).
# zfb-types is a zero-zfb-dep leaf crate, so this introduces no
# coupling beyond the constants themselves.
zfb-types = { path = "../zfb-types" }
# Single source of truth for pinned external tool versions (esbuild,
# wrangler, workerd). Consumed here for EXPECTED_ESBUILD_VERSION.
zfb-toolchain-pins = { path = "../zfb-toolchain-pins" }
# Shared exact-match resolver helper used by both this islands
# bundler and the main bundler in zfb-build. Replaces the
# prefix-with-slash `--alias:<from>=<to>` flag emission with
# exact-match `compilerOptions.paths` entries on a synthetic
# tsconfig.
zfb-plugin-resolver = { path = "../zfb-plugin-resolver" }
# Guard (b) stage-escape audit primitive (issue #1705, epic #1702):
# `EsbuildSubprocessConfig::stage_audit` calls
# `zfb_build::metafile_deps::audit_metafile_stage_escape_at_path` from the
# real esbuild subprocess call sites in `src/esbuild.rs`. `zfb-build` does
# not depend on `zfb-islands`, so this stays one-way; production
# orchestration (`zfb` wiring `zfb-build` + `zfb-islands` together) is
# unaffected.
#
# `default-features = false`: `zfb-build`'s own `default = ["embed_v8"]`
# would otherwise silently drag `deno_core`/V8 into this crate's
# dependency surface. `metafile_deps` (the only module used here) is a
# pure/no-`cfg` module, so it compiles fine without `embed_v8` — this
# keeps zfb-islands the "light, no V8" crate the test strategy relies on
# (see CLAUDE.md's Testing section).
zfb-build = { path = "../zfb-build", default-features = false }

# Workspace-shared helpers.
anyhow = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# SWC parsing only — no transforms or codegen. Subset of zfb-render's flags.
# `ecma_visit` added for issue #1387 (import.meta.glob detection needs the
# `Visit`/`VisitWith` traits, same as zfb-build's `GlobCallCollector`).
swc_core = { version = "64", features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_transforms",
    "ecma_visit",
] }

# Hashing for the bundle asset filename suffix. Mirrors zfb-css::pipeline.
sha2 = "0.10"
hex = "0.4"

# Structured logging for diagnostics (e.g. mutex-poisoning recovery).
tracing = "0.1"
lol_html = "2.8.1"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
# Shared test utilities: locate_esbuild(). Replaces the duplicated
# locate_esbuild() body that previously lived in each integration test file.
zfb-test-utils = { path = "../zfb-test-utils" }
