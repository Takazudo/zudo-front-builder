[package]
name = "zfb-build"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb build orchestrator: ties watcher + dependency graph + render/css/islands pipelines together for the dev loop, with atomic dist writes"

[lib]

[dependencies]
zfb-watcher = { path = "../zfb-watcher" }
zfb-graph = { path = "../zfb-graph" }
# Read-only consumption of the MDX → JSX emitter (Wave 1 / T3 bundler).
# We reuse `compile_mdx_to_jsx_module_cached` rather than re-wrapping MDX
# compilation so the bundler speaks the same MDX dialect as `zfb-render`.
zfb-content = { path = "../zfb-content" }
# Read-only consumption of the framework adapter contract (ADR-002).
# The bundler only touches `Framework`, `make_adapter`, and the adapter's
# `hydrate_shim_*` accessors. Per ADR-005 the JS runtime is no longer
# embedded (deno_core was retired), so `zfb-render` is compile-cheap and
# carries no V8 / native-runtime cost into `zfb-build`'s dependency
# surface.
zfb-render = { path = "../zfb-render" }
# Shared stable-URL constants for the production asset graph
# (`STABLE_CSS_URL`, `STABLE_ISLANDS_URL`, …). The renderer's prod-head
# injector embeds these so the link/script tags it splices match the
# on-disk filenames the emitter adapters write. `zfb-types` is a
# zero-zfb-dep leaf crate, so this introduces no transitive cost.
zfb-types = { path = "../zfb-types" }

anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
tracing = "0.1"
# Build-time render orchestrator (T6). `blocking` keeps the renderer
# loop synchronous to match the bundler's call style; `rustls-tls`
# avoids depending on a system OpenSSL for what is in practice a
# 127.0.0.1 connection. `json` is unused today but lets future error
# bodies (e.g. miniflare's ready handshake) be consumed cheaply.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# Source-map parsing for re-projecting miniflare JS stack frames back
# to the user's TSX/MDX source. The `sourcemap` crate is the canonical
# Rust port of Mozilla's source-map library and handles `.map` files
# emitted by esbuild's `--sourcemap=linked`.
sourcemap = "9"
# Cross-process file lock for the gated end-to-end miniflare test so
# parallel worktrees don't race for the same loopback port. Only used
# in tests; pulled in via the main deps for simplicity.
fs2 = "0.4"
# Content-addressed asset hashing for the production asset pipeline
# (see `pipeline::prod::ProductionAssetPipeline`). SHA-256 truncated to
# 8 hex chars matches the existing convention used by `zfb-css` and
# `zfb-islands` so all three crates produce comparable hashes for the
# same byte stream.
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
# Route scanning for the e2e integration test: discovers pages and their
# dynamic-route templates without re-authoring the zfb-router walk.
zfb-router = { path = "../zfb-router" }
# Real CssPipeline + TailwindSubprocessEngine wiring so the prod-asset
# graph e2e test (`tests/prod_asset_graph_e2e.rs`) exercises the same
# bytes-only emitter path that `DefaultRunner::emit_prod_assets` uses
# in the `zfb` bin. The default test uses `mock_subprocess` to keep
# the happy path binary-free; the `#[ignore]`-gated test calls the
# real Tailwind v4 CLI when the binary slot is staged.
zfb-css = { path = "../zfb-css" }
