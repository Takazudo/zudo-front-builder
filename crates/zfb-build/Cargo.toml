[package]
name = "zfb-build"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb build orchestrator: ties watcher + dependency graph + render/css/islands pipelines together for the dev loop, with atomic dist writes"

[lib]

# Feature-propagation seam for the V8 gate (issue #371, sub-task 4.1a).
#
# `zfb-render` declares the inner `embed_v8` feature that pulls
# `deno_core` + `tokio`. To keep the V8-off path reachable from a
# top-level `cargo build --no-default-features -p zfb`, we have to
# (a) depend on `zfb-render` with `default-features = false` so the
# default cascade does NOT silently re-enable V8 here, and
# (b) re-expose `embed_v8` as a pass-through feature on this crate.
#
# Default is V8-on so existing workspace builds (`cargo build`,
# `cargo test`) keep their current behaviour. Consumers opting into the
# V8-off path do so explicitly via `--no-default-features` at the top
# level — see `crates/zfb/Cargo.toml` for the matching seam.
[features]
default = ["embed_v8"]
embed_v8 = ["zfb-render/embed_v8"]

[dependencies]
zfb-watcher = { path = "../zfb-watcher" }
zfb-graph = { path = "../zfb-graph" }
# Read-only consumption of the MDX → JSX emitter (Wave 1 / T3 bundler).
# We reuse `compile_mdx_to_jsx_module_cached` rather than re-wrapping MDX
# compilation so the bundler speaks the same MDX dialect as `zfb-render`.
zfb-content = { path = "../zfb-content" }
# Read-only consumption of the framework adapter contract.
# The bundler only touches `Framework`, `make_adapter`, and the adapter's
# `hydrate_shim_*` accessors. The JS runtime is no longer
# embedded (deno_core was retired), so `zfb-render` is compile-cheap and
# carries no V8 / native-runtime cost into `zfb-build`'s dependency
# surface.
#
# `default-features = false` so this crate controls V8 inclusion via the
# pass-through `embed_v8` feature above instead of silently inheriting
# `zfb-render`'s default = ["embed_v8"].
zfb-render = { path = "../zfb-render", default-features = false }
# Shared stable-URL constants for the production asset graph
# (`STABLE_CSS_URL`, `STABLE_ISLANDS_URL`, …). The renderer's prod-head
# injector embeds these so the link/script tags it splices match the
# on-disk filenames the emitter adapters write. `zfb-types` is a
# zero-zfb-dep leaf crate, so this introduces no transitive cost.
zfb-types = { path = "../zfb-types" }
zfb-toolchain-pins = { path = "../zfb-toolchain-pins" }
# Shared helper that turns plugin-registered aliases + virtual modules
# into exact-match `compilerOptions.paths` entries for the synthetic
# tsconfig. Replaces the prefix-with-slash `--alias` flag emission so
# the main bundler matches the V8 host's exact-match contract.
zfb-plugin-resolver = { path = "../zfb-plugin-resolver" }

anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
# Glob filter for the bundler's parallel collection walk. MUST match the
# zfb-content walker's filter shape byte-for-byte so the snapshot's
# `module_specifier` and the bridge map key agree on which files were
# kept (and on what slug each one got, post `idStripSuffix`).
globset = { workspace = true }
# `process` + `io-util` + `fs` add the long-lived plugin
# host subprocess with newline-delimited JSON over stdio. `process`
# brings `tokio::process::Command`, `io-util` brings `AsyncBufReadExt`
# / `AsyncWriteExt`, `fs` brings `tokio::fs::write` for staging the
# embedded `plugin-host.mjs` into a tempdir at spawn time.
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "process", "io-util", "fs"] }
tracing = "0.1"
# SWC umbrella crate — used by `expand_import_meta_glob` to parse
# `.ts/.tsx/.js/.jsx` shadow files and collect the byte-spans of
# `import.meta.glob(...)` call expressions (a Vite-only macro esbuild
# leaves untransformed). A statement-level AST walk is what lets the
# transform ignore occurrences inside strings/comments — a naive regex
# would rewrite those and silently corrupt user code. The umbrella
# version is pinned in the workspace `Cargo.toml`; this crate only opts
# into the minimum feature set (parser + AST + visit, NO codegen — we
# splice the original source rather than re-print it). The feature set
# matches `zfb-content`'s so the SWC graph unifies (a parallel
# `swc_ecma_*` graph at a different version line would not interop).
swc_core = { workspace = true, features = [
    "common",
    "ecma_ast",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_transforms",
    "ecma_visit",
] }
# Build-time render orchestrator (T6). `blocking` keeps the renderer
# loop synchronous to match the bundler's call style; `rustls-tls`
# avoids depending on a system OpenSSL for what is in practice a
# 127.0.0.1 connection. `json` is unused today but lets future error
# bodies be consumed cheaply.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# Source-map parsing for re-projecting embedded-V8 JS stack frames back
# to the user's TSX/MDX source. The `sourcemap` crate is the canonical
# Rust port of Mozilla's source-map library and handles `.map` files
# emitted by esbuild's `--sourcemap=linked`.
sourcemap = { workspace = true }
# Cross-process file lock for gated end-to-end tests so parallel
# worktrees don't race for the same loopback port. Only used
# in tests; pulled in via the main deps for simplicity.
fs2 = "0.4"
# Content-addressed asset hashing for the production asset pipeline
# (see `pipeline::prod::ProductionAssetPipeline`). SHA-256 truncated to
# 8 hex chars matches the existing convention used by `zfb-css` and
# `zfb-islands` so all three crates produce comparable hashes for the
# same byte stream.
sha2 = "0.10"
hex = "0.4"
# Bounded wait for child processes so a wedged pnpm or esbuild subprocess
# cannot hang the build indefinitely. Zero transitive deps; cross-platform.
wait-timeout = "0.2"
# `file://` URL construction for staged plugin bundles (plugin_bundler.rs).
# Matches `zfb-config-loader`'s `resolve_plugin_path_to_file_url`, which
# uses the same crate/version for the identical job — a hand-rolled
# `format!("file://{}", ...)` would not percent-encode a staged path
# containing spaces or other URL-unsafe characters.
url = "2"
# Issue #228 / #229: shared HTML link rewriter that the production
# build pass and the dev server both call so dev-mode and prod-mode
# render the same `<a href>` / `<form action>` URLs under a `base`
# prefix. Lives here (not in `zfb-types`) because `zfb-types` is the
# zero-dep leaf crate; lol_html is heavy enough to keep above that
# layer. Same workspace pin as the existing `lol_html` users
# (`zfb-server`, `zfb-islands`).
lol_html = "2.8.1"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
# Route scanning for the e2e integration test: discovers pages and their
# dynamic-route templates without re-authoring the zfb-router walk.
zfb-router = { path = "../zfb-router" }
# Real CssPipeline + TailwindSubprocessEngine wiring so the prod-asset
# graph e2e test (`tests/prod_asset_graph_e2e.rs`) exercises the same
# bytes-only emitter path that `DefaultRunner::emit_prod_assets` uses
# in the `zfb` bin. The default test uses `mock_subprocess` to keep
# the happy path binary-free; the `#[ignore]`-gated test calls the
# real Tailwind v4 CLI when the binary slot is staged.
zfb-css = { path = "../zfb-css" }
# Shared test utilities: locate_esbuild() and zfb_binary!(). Replaces
# the duplicated locate_esbuild() bodies that previously lived in each
# integration test file.
zfb-test-utils = { path = "../zfb-test-utils" }
# Captures `tracing` output in-test via `#[traced_test]` / `logs_contain`
# (issue #1838's dangling-symlink warning assertion). Same version already
# used by `zfb-router` for its own warning-capture test.
tracing-test = "0.2"
