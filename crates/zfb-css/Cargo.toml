[package]
name = "zfb-css"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb css pipeline: Tailwind v4 subprocess engine, CSS Modules via lightningcss, hashed global asset emission"

[lib]

[dependencies]
# Cross-crate shared constants (stable asset URLs / filenames). Keeps
# `STABLE_CSS_URL` aligned between this crate's bytes-only emitter
# adapter and the renderer / `ProductionAssetPipeline` consumer in
# `zfb-build` without string duplication.
zfb-types = { path = "../zfb-types" }

# Workspace-shared helpers.
anyhow = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }

# CSS pipeline crates (direct deps — not yet in workspace deps).
lightningcss = "1.0.0-alpha.71"
sha2 = "0.10"
hex = "0.4"

# `url()` attribution over the Tailwind `--map` inline sourcemap
# (#2311/#2315): `sourcemap` parses the Source Map v3 payload (never
# hand-roll VLQ), `base64` decodes the data-URL it arrives in.
sourcemap = { workspace = true }
base64 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Dev-only: drives the one-time zfb-hi.css color-extraction helper (an
# `#[ignore]`d test), which resolves representative scopes through the
# bundled base16-ocean themes. Not a runtime dependency of the crate.
# The workspace dep stopped pinning a regex backend (zfb#1573), so request
# regex-onig explicitly instead of relying on feature unification with the
# zfb-content dev-dep's default.
syntect = { workspace = true, features = ["regex-onig"] }
# Dev-only, confirm sub zfb#1535 (Highlight Tokens epic): reads
# `zfb_content::hi_roles::HiRole` so `tests/hi_role_parity.rs` can assert
# the classifier's role taxonomy and this crate's `default_hi_css()`
# stylesheet stay in sync, without either crate depending on the other at
# runtime. Safe as a dev-dependency-only edge: `zfb-content` does not
# depend on `zfb-css` in any capacity (dev or otherwise), so this adds no
# cycle.
zfb-content = { path = "../zfb-content" }
