[package]
name = "zfb"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zudo-front-builder — frontend build orchestrator (placeholder)."
publish = false

[[bin]]
name = "zfb"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
