[package]
name = "zfb"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zudo-front-builder — frontend build orchestrator (placeholder)."
publish = false

[[bin]]
name = "zfb"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
