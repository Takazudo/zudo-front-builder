[package]
name = "zfb"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zudo-front-builder — frontend build orchestrator (placeholder)."
publish = false

[[bin]]
name = "zfb"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
zfb-diagnostics = { path = "../zfb-diagnostics" }
zfb-toolchain-pins = { path = "../zfb-toolchain-pins" }
anyhow = { workspace = true }
# Sub 3 / #108: dyn-compat async trait used by the plugin-host →
# zfb-server dispatcher adapter in `commands::plugins`.
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
include_dir = "0.7"
indicatif = "0.17"
# Issue #228: walk emitted HTML to prefix root-absolute `<a href>` /
# `<form action>` with the configured `base` so internal navigation
# survives sub-path deploys (mirrors how the CSS / islands asset URLs
# are already prefixed). Same crate + version that `zfb-islands` and
# `zfb-server` use, so the workspace lock stays single-version.
lol_html = "2.8.1"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "process", "sync"] }
tracing = "0.1"
# Sub 211: convert relative/absolute plugin paths in zfb.config.json
# into file:// URLs that match the resolved_module shape produced by
# the TS-config path (config-loader.mjs returns Node-style file URLs).
url = "2"
# Source-file discovery for the production asset emit path: the CSS
# pipeline takes a `Vec<PathBuf>` of project sources to feed into
# Tailwind's content scanner, and the islands scanner takes the same
# shape as DFS entry points.
walkdir = { workspace = true }
zfb-build = { path = "../zfb-build" }
zfb-content = { path = "../zfb-content" }
# Production asset emit path (S4): `DefaultRunner::emit_prod_assets`
# constructs a `CssPipeline` + `EsbuildSubprocessBundler` and feeds
# their bytes to `ProductionAssetPipeline` for hashing + HTML rewrite.
zfb-css = { path = "../zfb-css" }
zfb-graph = { path = "../zfb-graph" }
zfb-islands = { path = "../zfb-islands" }
zfb-render = { path = "../zfb-render" }
zfb-router = { path = "../zfb-router" }
zfb-server = { path = "../zfb-server" }
zfb-watcher = { path = "../zfb-watcher" }

[build-dependencies]
# Binary download and SHA-256 verification in build.rs.
# reqwest blocking + rustls-tls avoids a system OpenSSL dependency.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# SHA-256 for binary verification (same version used by zfb-build).
sha2 = "0.10"
hex = "0.4"
# Gzip + tar extraction for the esbuild npm package (.tgz).
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
