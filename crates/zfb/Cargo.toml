[package]
name = "zfb"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zudo-front-builder — frontend build orchestrator (placeholder)."
publish = false

[[bin]]
name = "zfb"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

# Feature-propagation seam for the V8 gate (issue #371, sub-task 4.1a).
#
# The `embed_v8` cargo feature toggles inclusion of the embedded V8
# isolate (via `deno_core`). Default is V8-on so existing workspace
# builds (`cargo build`, `cargo build --release`) keep producing a
# binary that can dispatch SSR pages in-process. Opt out at the top
# level with `cargo build --no-default-features -p zfb` to produce a
# meaningfully smaller binary that supports SSG-only projects.
#
# We pull `default-features = false` on every `zfb-render` and
# `zfb-build` dependency in this crate so the toggle here is the only
# place the V8 inclusion is decided — nothing in the graph
# silently re-enables it.
#
# Detection / `output` config (sub-task 4.1b, issue #373) layers ON
# TOP of this feature; that work is out of scope here.
[features]
default = ["embed_v8"]
embed_v8 = [
    "zfb-render/embed_v8",
    "zfb-build/embed_v8",
    "zfb-server/embed_v8",
    "zfb-config-loader/embed_v8",
]

[dependencies]
zfb-diagnostics = { path = "../zfb-diagnostics" }
zfb-toolchain-pins = { path = "../zfb-toolchain-pins" }
# TS-config evaluator, hoisted out of this crate (issue #1037) into a leaf
# crate so `zfb-server` can call it too without a dependency cycle. This crate
# re-exports / wraps it in `config.rs`. `default-features = false` for the V8
# gate (issue #371) — the `embed_v8` feature above propagates the toggle.
zfb-config-loader = { path = "../zfb-config-loader", default-features = false }
anyhow = { workspace = true }
# Sub 3 / #108: dyn-compat async trait used by the plugin-host →
# zfb-server dispatcher adapter in `commands::plugins`.
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
include_dir = "0.7"
indicatif = "0.17"
# Issue #228's HTML link rewriter (`<a href>` / `<form action>`
# prefix-stamp) used to live here with its own `lol_html` dep. After
# the post-merge review caught that the dev server also needs to apply
# the same rewrite to served HTML (issue #229), the pure-string pieces
# moved to `zfb_build::link_base_rewrite` so both consumers funnel
# through the same code. We no longer call `lol_html` directly from
# this crate for the link-rewrite path.
#
# Issue #990 re-introduces a direct `lol_html` usage for the read-only
# island-marker-check pass (`commands/island_marker_check.rs`).  Same
# workspace pin as the existing users (`zfb-build`, `zfb-islands`).
lol_html = "2.8.1"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "process", "sync"] }
tracing = "0.1"
# Sub 211: convert relative/absolute plugin paths in zfb.config.json
# into file:// URLs that match the resolved_module shape produced by
# the TS-config path (config-loader.mjs returns Node-style file URLs).
url = "2"
# Source-file discovery for the production asset emit path: the CSS
# pipeline takes a `Vec<PathBuf>` of project sources to feed into
# Tailwind's content scanner, and the islands scanner takes the same
# shape as DFS entry points.
walkdir = { workspace = true }
# `default-features = false` for the V8 gate (issue #371, sub-task
# 4.1a). The `embed_v8` feature defined above pass-throughs to both
# crates so V8 inclusion is decided in exactly one place.
zfb-build = { path = "../zfb-build", default-features = false }
zfb-content = { path = "../zfb-content" }
# Feature config canonical types (MarkdownFeaturesConfig, FeatureToggle,
# TocConfig, etc.) re-exported from zfb::config via this path so zfb
# avoids duplicating the schema in lock-step with zfb-md-ast.
zfb-md-ast = { path = "../zfb-md-ast" }
# Production asset emit path (S4): `DefaultRunner::emit_prod_assets`
# constructs a `CssPipeline` + `EsbuildSubprocessBundler` and feeds
# their bytes to `ProductionAssetPipeline` for hashing + HTML rewrite.
zfb-css = { path = "../zfb-css" }
zfb-graph = { path = "../zfb-graph" }
zfb-islands = { path = "../zfb-islands" }
# Shared tsconfig compilerOptions.paths / extends-chain helper used by both
# the build command (read_tsconfig_paths) and the islands scanner. Extracted
# here to avoid duplicating JSONC-stripping logic across the two call sites.
zfb-plugin-resolver = { path = "../zfb-plugin-resolver" }
# See `default-features = false` note on `zfb-build` above — same
# rationale (issue #371, sub-task 4.1a).
zfb-render = { path = "../zfb-render", default-features = false }
zfb-router = { path = "../zfb-router" }
zfb-server = { path = "../zfb-server" }
# Source-of-truth for the `base` → dev-mount-prefix normalisation (used
# by `commands/dev.rs` to decide what URL the islands `<script>` tag
# should point at — absolute-URL bases must collapse to "no prefix"
# because the dev server cannot serve assets on a different origin).
zfb-types = { path = "../zfb-types" }
zfb-watcher = { path = "../zfb-watcher" }
# SHA-256 for the Phase-B bundle-skip key (issue #940). The same version is
# already used as a build-dependency (binary verification in build.rs) and by
# zfb-graph for its ManifestDigest; adding it here avoids pulling a new crate.
sha2 = "0.10"
# IP-enumeration for the dev ready-banner (#487/#499): when the user binds to
# an unspecified address (0.0.0.0), we list non-loopback IPv4 interfaces so
# the banner shows actual reachable URLs instead of the literal `0.0.0.0`.
local-ip-address = "0.6"

[build-dependencies]
# Single source of truth for EXPECTED_ESBUILD_VERSION (and other tool pins).
# build.rs reads zfb_toolchain_pins::EXPECTED_ESBUILD_VERSION to construct
# the npm registry download URL for the pinned esbuild binary.
zfb-toolchain-pins = { path = "../zfb-toolchain-pins" }
# Streaming retry downloader used by build.rs; owns reqwest + rustls-tls
# so we no longer need a direct reqwest build-dependency here.
zfb-binfetch = { path = "../zfb-binfetch" }
# SHA-256 for binary verification (same version used by zfb-build).
sha2 = "0.10"
hex = "0.4"
# Gzip + tar extraction for the esbuild npm package (.tgz).
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
# Async client for the dev E2E harness (dev_serve_e2e.rs, #1018): HTTP
# marker polling + SSE event-stream reads against a live `zfb dev`.
# Plain-HTTP loopback only, so no TLS backend; `stream` enables
# `bytes_stream()` for the SSE reader in zfb-test-utils.
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
# `test-util` enables `start_paused` on `#[tokio::test]` for virtual-time
# backoff in the ETXTBSY retry tests (zfb#1014). Dev-only — production
# feature set (`rt-multi-thread`, `macros`, …) is unchanged.
tokio = { version = "1", features = ["test-util"] }
zfb-test-utils = { path = "../zfb-test-utils" }
# Process-group kill for build_terminates e2e (#654).
# libc is already a transitive dep (via wait-timeout); adding it here
# avoids the `setsid` wrapper binary and keeps the test self-contained.
# Unix-only; the test is #[cfg(unix)]-gated.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
