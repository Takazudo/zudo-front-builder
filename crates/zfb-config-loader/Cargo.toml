[package]
name = "zfb-config-loader"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb TS-config evaluator: bundle zfb.config.ts through the supervised native compiler worker and evaluate it (in-process V8 on default builds, node subprocess on slim builds)."
publish = false

[lib]

# Test-only embedding host for this crate's tests: a worker host whose
# executable is not the zfb CLI. Binaries of a dependency crate are never
# built or installed with zfb.
[[bin]]
name = "config-loader-test-worker"
path = "src/bin/config-loader-test-worker.rs"
test = false
doc = false

# Feature-propagation seam for the V8 gate (issue #371, sub-task 4.1a).
#
# This crate hoists the `zfb.config.ts` evaluator out of the `zfb` bin
# crate (issue #1037) so BOTH `zfb` and `zfb-server` can call it without a
# circular dependency (`zfb` depends on `zfb-server`, not the reverse).
#
# The default `direct-v8` feature pulls in the in-process V8 isolate via the matching `zfb-render` feature. With `--no-default-features` the
# evaluator falls back to the `node` subprocess path. `default-features =
# false` on `zfb-render` keeps the toggle decided in exactly one place per
# consumer (mirrors `zfb-server` / `zfb-build`).
[features]
# Default JS runtime (#4390); the deno_core host was removed in #4395.
direct-v8 = ["zfb-render/direct-v8"]

default = ["direct-v8"]

[dependencies]
# Supervised native compiler worker that bundles `zfb.config.ts` (#4632).
zfb-compiler-worker = { path = "../zfb-compiler-worker" }
# Typed request fields (`OutputLayout`, `Platform`); the engine-neutral request
# types need no `native` feature here.
zfb-rolldown-prototype = { path = "../zfb-rolldown-prototype" }
# In-process V8 config evaluator (ThreadedConfigEvaluator), behind the runtime
# features. zfb-render's default-off build selects no syntect regex backend;
# this native crate picks the default native one (zfb-build used to supply it
# through feature unification).
zfb-render = { path = "../zfb-render", default-features = false, features = ["syntect-onig"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "fs", "process", "time", "rt"] }
# Node ESM bare-specifier resolver — replaces createRequire().resolve /
# import.meta.resolve in config-loader.mjs (issue #416 / epic #414).
oxc_resolver = "11.19.1"
# Plugin path → file:// URL conversion (relative/absolute plugin entries).
url = "2"

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` enables `start_paused` on `#[tokio::test]` for virtual-time
# ETXTBSY backoff tests (moved from zfb#1014 alongside the loader).
tokio = { version = "1", features = ["macros", "fs", "process", "time", "rt", "rt-multi-thread", "test-util"] }
