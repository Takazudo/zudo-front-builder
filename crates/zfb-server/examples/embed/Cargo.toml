# Example: minimal embed-as-library host for the zfb dev server.
#
# This crate opts itself out of the workspace via an empty
# `[workspace]` table so the workspace root manifest doesn't need to
# list it as a member — the spike pattern from the original embed-API
# research (issue #346) used the same trick. Build it directly via:
#
#     cargo build --manifest-path crates/zfb-server/examples/embed/Cargo.toml
#
# Or run it:
#
#     cargo run  --manifest-path crates/zfb-server/examples/embed/Cargo.toml
[workspace]

[package]
name = "zfb-server-embed-example"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "embed"
path = "src/main.rs"

[dependencies]
zfb-server = { path = "../../" }
anyhow = "1"
axum = "0.8"
# `net` + `io-util` are required for `tokio::net::TcpStream` and
# `tokio::io::{AsyncReadExt, AsyncWriteExt}` in src/main.rs. Cargo's
# workspace feature unification often turns these on transitively via
# zfb-server, but declaring them explicitly here makes the example
# manifest a complete copy-paste recipe.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
