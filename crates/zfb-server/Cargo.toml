[package]
name = "zfb-server"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb dev server: axum + SSE live-reload + CSS hot-swap"

[lib]

[dependencies]
zfb-build = { path = "../zfb-build" }
zfb-islands = { path = "../zfb-islands" }
# Issue #229: shared `base` → mount-prefix normalisation lives in
# zfb-types (the lowest-dep leaf) so the build-time link rewriter
# (#228) and the dev server agree on the canonical form.
zfb-types = { path = "../zfb-types" }

axum = "0.8"
# Sub 3 / #108: dyn-compat async trait for the dev-middleware
# dispatcher seam between zfb-server and the plugin host owner. Used
# only inside `plugin_middleware.rs`.
async-trait = "0.1"
# Sub 3 / #108: base64-decode dev-middleware response bodies declared
# with `bodyEncoding: "base64"` (binary plugin responses).
base64 = "0.22"
mime_guess = "2"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "signal"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
lol_html = "2.8.1"

[dev-dependencies]
zfb-graph = { path = "../zfb-graph" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
tempfile = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
