[package]
name = "zfb-server"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb dev server: axum + SSE live-reload + CSS hot-swap"

[lib]

# Feature-propagation seam for the V8 gate (issue #371, sub-task 4.1a).
#
# `zfb-server` is a leaf consumer of `zfb-build` — it doesn't touch any
# V8-bearing surface itself (no `EmbeddedV8Host`, no `Backend::EmbeddedV8`),
# but cargo's workspace-wide feature unification means that if this
# crate enables `zfb-build`'s default features, the `embed_v8` cascade
# turns on for every other consumer too — defeating the V8-off path
# at the workspace level.
#
# Default features off here; the top-level `zfb` crate is the single
# place that decides V8 inclusion via its own `embed_v8` feature.
[features]
default = []
embed_v8 = ["zfb-build/embed_v8"]

[dependencies]
zfb-build = { path = "../zfb-build", default-features = false }
zfb-islands = { path = "../zfb-islands" }
# Issue #229: shared `base` → mount-prefix normalisation lives in
# zfb-types (the lowest-dep leaf) so the build-time link rewriter
# (#228) and the dev server agree on the canonical form.
zfb-types = { path = "../zfb-types" }

axum = "0.8"
# Sub 3 / #108: dyn-compat async trait for the dev-middleware
# dispatcher seam between zfb-server and the plugin host owner. Used
# only inside `plugin_middleware.rs`.
async-trait = "0.1"
# Sub 3 / #108: base64-decode dev-middleware response bodies declared
# with `bodyEncoding: "base64"` (binary plugin responses).
base64 = "0.22"
mime_guess = "2"
# `fs` (#903): request-path disk fallbacks in `routes.rs` read pages /
# public assets via `tokio::fs` so they don't block request workers.
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "net", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"
lol_html = "2.8.1"

[dev-dependencies]
zfb-graph = { path = "../zfb-graph" }
# Combined Gap 1+2 integration test (sub-task 2.3 / #369): the server
# test boots both the SSR router and the watcher side-by-side to prove
# the two features interoperate.
zfb-watcher = { path = "../zfb-watcher" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "rt-multi-thread"] }
tempfile = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }
futures-util = "0.3"
