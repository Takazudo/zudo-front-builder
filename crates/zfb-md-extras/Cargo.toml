[package]
name = "zfb-md-extras"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb markdown extras: remark/rehype plugin ports (GFM, footnotes, etc.)"

[lib]

# Integration test for github_alerts feature: enable `test-utils` so that
# `test_harness::run_fixture` is accessible from the external test binary.
[[test]]
name = "github_alerts"
required-features = ["test-utils"]

# Integration test for reading_time feature.
[[test]]
name = "reading_time"
required-features = ["test-utils"]

# Integration test for github_autolinks feature.
[[test]]
name = "github_autolinks"
required-features = ["test-utils"]

# Integration tests for code_enrichment feature.
[[test]]
name = "code_enrichment"
required-features = ["test-utils"]

# Integration test for code_tabs feature.
[[test]]
name = "code_tabs"
required-features = ["test-utils"]

# Integration test for ruby feature.
[[test]]
name = "ruby"
required-features = ["test-utils"]

# Integration test for toc_export feature.
[[test]]
name = "toc_export"
required-features = ["test-utils"]

# Integration tests for image_dimensions feature.
[[test]]
name = "image_dimensions"
required-features = ["test-utils"]

# `test-utils` gates the test_harness module so integration tests in Wave 2+
# can access run_fixture without exposing it in production builds.
# Usage: add `zfb-md-extras = { path = "...", features = ["test-utils"] }` in
# dev-dependencies of crates that run fixture-based snapshot tests.
#
# IMPORTANT: `zfb-test-utils` is listed as an optional *regular* dependency
# (not just a dev-dependency) because the `test-utils` feature may be activated
# from non-test builds of downstream crates.  Cargo does not make dev-dependencies
# available to normal (non-test) compilations, so placing it only in
# [dev-dependencies] would cause an "unresolved import" error whenever a
# downstream crate enables `features = ["test-utils"]` outside a `#[cfg(test)]`
# context.  The optional flag ensures zero production-binary cost when the
# feature is off.
[features]
test-utils = ["dep:zfb-test-utils", "dep:tempdir"]

[dependencies]
markdown = { workspace = true }
anyhow = { workspace = true }
zfb-md-ast = { path = "../zfb-md-ast" }
# Header-only image dimension probing for the image_dimensions feature (Wave 6 #579).
imagesize = { workspace = true }
# Optional: compiled when `features = ["test-utils"]` is requested by a
# downstream crate's dev-dependencies. The same packages are also listed in
# [dev-dependencies] so that this crate's own unit tests (which compile
# test_harness.rs via cfg(test)) can resolve them without activating the
# feature flag.
zfb-test-utils = { path = "../zfb-test-utils", optional = true }
tempdir = { version = "0.3", optional = true }

[dev-dependencies]
anyhow = { workspace = true }
# Keep here for cfg(test) builds of this crate's own tests (test_harness tests
# compile via cfg(test), not via the test-utils feature flag).
zfb-test-utils = { path = "../zfb-test-utils" }
tempdir = "0.3"
# Dev-dep cycle is intentional and Cargo-supported: zfb-md-extras integration
# tests need to run content through the full pipeline (which lives in
# zfb-content). The workspace already uses this pattern elsewhere (e.g.
# zfb-content has zfb-render as a dev-dep while zfb-render depends on
# zfb-content).
zfb-content = { path = "../zfb-content" }
zfb-md-ast = { path = "../zfb-md-ast" }
