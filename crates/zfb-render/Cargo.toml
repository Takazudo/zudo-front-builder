[package]
name = "zfb-render"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb render: SWC TSX→JS pipeline + JS runtime + page render orchestrator"

[lib]

[dependencies]
# Sibling crate: MDX → JSX-source emitter. The loader funnels `.mdx` and
# `mdx://` specifiers through `mdx_to_jsx_module` before handing the
# resulting JSX text to the SWC pipeline below.
zfb-content = { path = "../zfb-content" }

# SWC pipeline (TSX → JS). The umbrella version is pinned in the
# workspace `Cargo.toml`; this crate only declares its feature opt-ins.
swc_core = { workspace = true, features = [
    "common",
    "common_concurrent",
    "common_sourcemap",
    "ecma_ast",
    "ecma_codegen",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_transforms",
    "ecma_transforms_react",
    "ecma_transforms_typescript",
    "ecma_visit",
] }

# Shared helpers.
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
# Used by tests/integration_routing_rendering.rs to scan the routing
# fixtures into a `Route` table. Lives in dev-deps because zfb-render
# itself does not need to depend on zfb-router at runtime — the build
# orchestrator (`zfb-build`) is what wires the two together in
# production.
zfb-router = { path = "../zfb-router" }
