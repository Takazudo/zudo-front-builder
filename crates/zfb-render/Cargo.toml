[package]
name = "zfb-render"
version = "0.0.0"
edition = "2021"
license = "MIT"
description = "zfb render: SWC TSX→JS pipeline + JS runtime + page render orchestrator"

[lib]

# Cargo-feature-gate decision: the
# in-process V8 host is opt-in via the `embed_v8` feature, default-on
# so the typical workspace `cargo build`/`cargo test` exercises it, but
# downstream tooling that wants a deno-free build (e.g. CI image that
# only runs the SWC pipeline) can opt out with
# `--no-default-features`.
[features]
default = ["embed_v8", "syntect-onig"]
embed_v8 = [
    "dep:deno_core",
    "dep:deno_error",
    "dep:getrandom",
    "dep:reqwest",
    "dep:sha1",
    "dep:sha2",
    "dep:tokio",
]
# Syntect regex-backend forwarding (zfb#1576, epic zfb#1572). The
# `zfb-content` edge below is `default-features = false` so a wasm consumer
# of this crate (`zfb-md-wasm`) can select the pure-Rust `syntect-fancy`
# backend — otherwise this edge would re-unify `syntect-onig` (C `onig_sys`,
# which cannot compile for wasm32-unknown-unknown) into every downstream
# graph. Native behaviour is unchanged: `syntect-onig` is in `default`, and
# even when both backends unify (e.g. whole-workspace builds), syntect gives
# regex-onig precedence (see zfb-content's feature docs / zfb#1573).
syntect-onig = ["zfb-content/syntect-onig"]
syntect-fancy = ["zfb-content/syntect-fancy"]

[dependencies]
# Canonical shared types (Segment, etc.).
zfb-types = { path = "../zfb-types" }

# === In-process V8 host (feature `embed_v8`) ===
#
# Versions are PINNED and act as the `compatibilityDate` replacement.
# Bumping is a coordinated change — keep the pins below in lock-step.
#
# Selection rationale (state at the time of writing):
# - `deno_core 0.399`: the latest line that builds on the workspace's
#   stable Rust toolchain pin (`rust-toolchain.toml`). The 0.400 line
#   shipped concurrently and pulls a slightly newer V8 build; we hold
#   on 0.399 until the toolchain bump happens in lock-step.
#
# We deliberately do NOT depend on `deno_fetch` / `deno_web` /
# `deno_url` / `deno_console` here, even though the original spec
# mentions them. Reasons documented in `embedded_v8/mod.rs` "Why a
# polyfill instead of deno_fetch/deno_web" section:
# 1. Those crates ship Request/Response/URL/etc. as
#    `lazy_loaded_esm` — exposing them as globals requires a
#    bootstrap script identical to Deno's runtime, which is a
#    non-trivial dependency surface.
# 2. `deno_url` and `deno_console` were upstream-deprecated and
#    folded into `deno_web`; the spec list is historical.
# 3. The SSG path never makes outgoing network requests, so
#    `deno_fetch`'s hyper / rustls / tower / h2 stack is dead
#    weight — and it imposes a 15-30 minute first-build cost.
# 4. A pure-JS polyfill of Request/Response/Headers/URL/fetch/
#    TextEncoder/TextDecoder/atob/btoa/structuredClone/crypto.subtle
#    is ~250 lines and lives in `embedded_v8/js/web_polyfills.js`,
#    making the dep graph explicit and the host hermetic.
#
# This is reversible: the polyfill module is self-contained, and a
# future change can swap in `deno_web` / `deno_fetch` by editing
# `embedded_v8::build_extensions` and removing the polyfill from
# `embedded_v8::HOST_GLOBALS_SHIM_SRC`.
deno_core = { version = "=0.399.0", optional = true }
# `deno_error::JsErrorBox` is how an op reports a failure with an explicit
# JS error class (`TypeError` / `TimeoutError` — see
# `embedded_v8/fetch.rs`). `deno_core` uses it internally but does not
# re-export it, so it must be a direct edge. Already in `Cargo.lock` at
# this line as a transitive dep of `deno_core`; no new fetch.
deno_error = { version = "0.7", optional = true }
# OS CSPRNG for the request-time Web Crypto entropy op (issue #2017).
# `getrandom` reads the kernel generator (`getrandom(2)` / `getentropy`
# / `BCryptGenRandom`) — deliberately NOT `rand`, whose thread-local
# userspace PRNG is seeded and reproducible, which is the property
# #1751 exists to eliminate. Already in `Cargo.lock` at this line as a
# transitive dep (via `deno_core`'s graph among others); this only adds
# a direct edge, no new fetch.
getrandom = { version = "0.3", optional = true }
# SHA implementations behind `crypto.subtle.digest` (issue #2018).
# Hashing is computed by a Rust host op rather than hand-rolled JS: the
# JS host is a code path a developer's ETag / content-hash / request-id
# depends on, and a subtly wrong hand-written SHA-256 would produce
# plausible-looking digests that disagree with production Workers.
# Both crates are already in `Cargo.lock` at these lines (sha2 is a
# direct dep of eight sibling crates, sha1 arrives transitively), so
# this only adds a direct edge — no new fetch.
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
# Outbound HTTP for the request-time `fetch` transport (issue #2015).
# The workspace already builds `reqwest 0.12` with `rustls-tls`
# (zfb-build, zfb-binfetch, zfb, zfb-server, zfb-test-utils), so this
# adds no new HTTP or TLS stack — and deliberately NOT the `blocking`
# feature: the op must never park the V8 isolate thread on a socket.
# No compression feature is enabled anywhere in the workspace, which is
# what makes reqwest send no `accept-encoding` of its own and surface
# response bytes verbatim (contract divergence D6).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
# Tokio is needed for `deno_core`'s event loop. We use the `rt` +
# `macros` features only (no multi-thread runtime — the host is
# single-threaded by design, see module docstring).
# `time` is needed for the per-fetch wall-clock deadline
# (`tokio::time::timeout` in `embedded_v8/fetch.rs`).
tokio = { version = "1", features = ["rt", "macros", "sync", "time"], optional = true }

# Sibling crate: MDX → JSX-source emitter. The loader funnels `.mdx` and
# `mdx://` specifiers through `mdx_to_jsx_module` before handing the
# resulting JSX text to the SWC pipeline below.
# `default-features = false` so the syntect backend choice flows through the
# `syntect-onig`/`syntect-fancy` forwarding features above (zfb#1576).
zfb-content = { path = "../zfb-content", default-features = false, features = ["compiler"] }

# SWC pipeline (TSX → JS). The umbrella version is pinned in the
# workspace `Cargo.toml`; this crate only declares its feature opt-ins.
swc_core = { workspace = true, features = [
    "common",
    "common_concurrent",
    "common_sourcemap",
    "ecma_ast",
    "ecma_codegen",
    "ecma_parser",
    "ecma_parser_typescript",
    "ecma_transforms",
    "ecma_transforms_react",
    "ecma_transforms_typescript",
    "ecma_visit",
] }

# Shared helpers.
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Canonical URL-segment codec for `paths()` resolution (issue #1767). Already
# vendored via zfb-server's dependency graph — no new fetch.
percent-encoding = "2"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
# Async test runtime for `#[tokio::test]` on async render-host tests.
# `rt-multi-thread` is intentionally absent for the embedded V8 render host
# (which is `!Send + !Sync` and always uses a `current_thread` runtime).
# Added `rt-multi-thread` and `time` for `config_eval` tests: the
# `spawn_blocking` parallelism test (acceptance criterion) requires
# `#[tokio::test(flavor = "multi_thread")]` and `tokio::time::sleep`.
# `net` + `io-util` drive the deterministic loopback HTTP server the
# fetch-transport tests bind (guardrail 3: never the public internet).
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
# Used by tests/integration_routing_rendering.rs to scan the routing
# fixtures into a `Route` table. Lives in dev-deps because zfb-render
# itself does not need to depend on zfb-router at runtime — the build
# orchestrator (`zfb-build`) is what wires the two together in
# production.
zfb-router = { path = "../zfb-router" }
