[package]
name = "zfb-js-host"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Internal shared ZFB host services and opt-in direct-V8 prototype"

[features]
default = []
# Existing embedded-host transport, crypto and authorized module reads.
services = ["dep:serde", "dep:serde_json", "dep:thiserror", "dep:getrandom", "dep:reqwest", "dep:sha1", "dep:sha2", "dep:tokio", "dep:url", "dep:base64"]
# The internal CLI opt-in uses exactly the baseline engine.
direct-v8 = ["services", "v8-platform"]
v8-platform = ["dep:v8"]
deno-platform = ["v8-platform", "dep:deno_core"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
getrandom = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
sha1 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"], optional = true }
url = { version = "2", optional = true }
base64 = { workspace = true, optional = true }
v8 = { version = "=147.4.0", optional = true }

[dev-dependencies]
# The native loopback tests drive real TCP sockets; declare what they use
# instead of relying on reqwest enabling these tokio features transitively.
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net", "io-util"] }

[dependencies.deno_core]
version = "=0.399.0"
optional = true
