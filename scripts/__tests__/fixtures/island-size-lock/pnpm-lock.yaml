---
lockfileVersion: '9.0'

importers:

  .:
    configDependencies: {}
    packageManagerDependencies:
      pnpm:
        specifier: 12.8.2
        version: 12.8.2

packages:

  '@pnpm/exe.darwin-arm64@12.8.2':
    resolution: {integrity: sha512-env-exe-darwin-arm64==}
    cpu: [arm64]
    os: [darwin]

  pnpm@12.8.2:
    resolution: {integrity: sha512-env-pnpm==}
    engines: {node: '>=18.12'}
    hasBin: true

snapshots:

  '@pnpm/exe.darwin-arm64@12.8.2':
    optional: true

  pnpm@12.8.2:
    optionalDependencies:
      '@pnpm/exe.darwin-arm64': 12.8.2

---
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

catalogs:
  default:
    vite-plus:
      specifier: 1.0.0
      version: 1.0.0

overrides:
  hono: '>=4.12.25'
  vite@*: npm:@voidzero-dev/vite-plus-core@1.0.0

importers:

  .:
    devDependencies:
      vite-plus:
        specifier: 'catalog:'
        version: 1.0.0(typescript@6.0.3)

  docs:
    dependencies:
      lodash:
        specifier: ^4.17.21
        version: 4.17.21

  packages/zfb:
    dependencies:
      '@takazudo/zfb-slugify':
        specifier: workspace:1.0.0
        version: link:../zfb-slugify
    devDependencies:
      typescript:
        specifier: 7.0.2
        version: 7.0.2
      typescript-5.9:
        specifier: npm:typescript@5.9.3
        version: typescript@5.9.3
      vite-plus:
        specifier: 'catalog:'
        version: 1.0.0(typescript@7.0.2)
    optionalDependencies:
      '@takazudo/zfb-darwin-arm64':
        specifier: workspace:1.0.0
        version: link:../zfb-darwin-arm64

  packages/zfb-darwin-arm64: {}

  packages/zfb-runtime:
    dependencies:
      hono:
        specifier: '>=4.12.25'
        version: 4.12.25
    devDependencies:
      '@takazudo/zfb':
        specifier: workspace:*
        version: link:../zfb

  packages/zfb-slugify: {}

packages:

  '@voidzero-dev/vite-plus-core@1.0.0':
    resolution: {integrity: sha512-vite-plus-core==}
    peerDependencies:
      typescript: '*'
    peerDependenciesMeta:
      typescript:
        optional: true

  '@voidzero-dev/vite-plus-darwin-arm64@1.0.0':
    resolution: {integrity: sha512-vite-plus-darwin-arm64==}
    cpu: [arm64]
    os: [darwin]

  hono@4.12.25:
    resolution: {integrity: sha512-hono==}
    engines: {node: '>=16.9.0'}

  lodash@4.17.21:
    resolution: {integrity: sha512-lodash==}

  typescript@5.9.3:
    resolution: {integrity: sha512-typescript-5.9.3==}
    hasBin: true

  typescript@6.0.3:
    resolution: {integrity: sha512-typescript-6.0.3==}
    hasBin: true

  typescript@7.0.2:
    resolution: {integrity: sha512-typescript-7.0.2==}
    hasBin: true

  vite-plus@1.0.0:
    resolution: {integrity: sha512-vite-plus==}
    peerDependencies:
      typescript: '*'

snapshots:

  '@voidzero-dev/vite-plus-core@1.0.0(typescript@6.0.3)':
    optionalDependencies:
      typescript: 6.0.3

  '@voidzero-dev/vite-plus-core@1.0.0(typescript@7.0.2)':
    dependencies:
      vite-plus: 1.0.0(typescript@7.0.2)
    optionalDependencies:
      typescript: 7.0.2

  '@voidzero-dev/vite-plus-darwin-arm64@1.0.0':
    optional: true

  hono@4.12.25: {}

  lodash@4.17.21: {}

  typescript@5.9.3: {}

  typescript@6.0.3: {}

  typescript@7.0.2: {}

  vite-plus@1.0.0(typescript@6.0.3):
    dependencies:
      vite: '@voidzero-dev/vite-plus-core@1.0.0(typescript@6.0.3)'
    optionalDependencies:
      '@voidzero-dev/vite-plus-darwin-arm64': 1.0.0
    transitivePeerDependencies:
      - typescript

  vite-plus@1.0.0(typescript@7.0.2):
    dependencies:
      vite: '@voidzero-dev/vite-plus-core@1.0.0(typescript@7.0.2)'
    optionalDependencies:
      '@voidzero-dev/vite-plus-darwin-arm64': 1.0.0
    transitivePeerDependencies:
      - typescript
