[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
# `serde` feature: unist-shaped Serialize/Deserialize on the mdast tree —
# needed by the zfb-md-wasm `parseToAst` PROTOTYPE (zfb#1855, epic zfb#1854).
markdown = { version = "1.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = { package = "noyalib-serde-yaml", version = "=0.0.30" }
serde_json = "1"
anyhow = "1"
thiserror = "2"
# The regex backend (regex-onig vs regex-fancy) is deliberately NOT pinned
# here: zfb-content selects it via its `syntect-onig` (default) /
# `syntect-fancy` features, because onig_sys is C and cannot compile for
# wasm32-unknown-unknown (zfb#1573). When feature unification enables both
# backends, syntect gives regex-onig precedence (syntect src/parsing/regex.rs).
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "plist-load"] }
garde = { version = "0.22", features = ["derive"] }
tempfile = "3"
walkdir = "2"
# gitignore-aware directory walker used by ripgrep — honors .gitignore,
# .git/info/exclude, global git ignore, and hidden-file rules. Used in
# zfb-build's extra-dirs top-level pass to avoid materialising gitignored dirs.
ignore = "0.4"
async-trait = "0.1"
# Glob pattern matching for content-collection include/exclude filters.
# `globset` is the BurntSushi crate used by ripgrep — single GlobSet
# compiles many patterns into one matcher.
globset = "0.4"
# Header-only image-dimension probing — PNG/JPG/GIF/WebP/AVIF.
# Used by zfb-md-extras::image_dimensions (Wave 6 #579) to inject
# width/height attrs without decoding the full image payload.
imagesize = "0.14"
# Zero-unsafe, allocation-light XML DOM parser. `imagesize` is raster-only and
# cannot decode vector SVGs, so zfb-md-extras::image_dimensions parses an SVG's
# intrinsic dimensions (width/height/viewBox) straight from its markup (#1083).
roxmltree = "0.20"
# Wraps a `serde_json` deserialize with the field path that failed (e.g.
# `framework`), so `zfb.config.ts` schema errors name the offending key
# instead of only echoing the raw JSON (issue #1359). Already a transitive
# dep of `axum` at this same 0.1.x line, so pinning it here adds no new
# version to the dependency graph.
serde_path_to_error = "0.1"
# Source Map v3 parser (getsentry). Canonical decoder for both esbuild's
# `--sourcemap=linked` output (zfb-build renderer) and the Tailwind v4
# `--map` inline sourcemap that drives `url()` attribution in zfb-css
# (#2311/#2315). Do NOT hand-roll VLQ decoding anywhere — this crate is
# the one parser.
sourcemap = "9"
base64 = "0.22"

# SWC umbrella crate. Pinning the major version here is the project's
# single source of truth — both `zfb-render` (TSX→JS pipeline) and
# `zfb-content` (TSX frontmatter static extraction) opt into the
# specific feature set they need at the crate level. Adding standalone
# `swc_ecma_*` crates is FORBIDDEN: they would build a parallel SWC
# graph at a different version line and the AST types would not unify
# across crates.
swc_core = { version = "64" }

[profile.release]
# Strip debug symbols to keep release binaries small (< 25 MB per platform).
# Applied workspace-wide — member crate [profile.release] blocks are ignored
# by Cargo when a workspace root profile is present.
strip = "symbols"

# Dedicated wasm size-optimized profile (zfb#1577, zfb-md-wasm npm package).
# Opt-in via `cargo build --profile wasm-release`, so it never changes the
# default `release` profile other crates/binaries build with. `opt-level =
# "z"` + `lto = true` + `codegen-units = 1` + `panic = "abort"` are the
# standard size-minimizing combination for wasm32-unknown-unknown cdylibs
# (panic="abort" is safe here because a wasm trap is unrecoverable in-process
# either way — see crates/zfb-md-wasm/README.md's trap contract).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
