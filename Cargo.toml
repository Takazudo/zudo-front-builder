[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.dependencies]
markdown = "1.0"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
thiserror = "2"
syntect = "5"
garde = { version = "0.22", features = ["derive"] }
tempfile = "3"
walkdir = "2"
