name = "zfb-docs"
main = "./dist/_worker.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Required for docs-pr-preview.yml preview-alias routing (--preview-alias needs workers.dev enabled);
# trade-off: prod is also reachable at zfb-docs.<account>.workers.dev (duplicate content).
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = false

[[routes]]
pattern = "zfb.takazudomodular.com"
custom_domain = true
