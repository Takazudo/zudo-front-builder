<div class="wind-demo">
  <p class="wind-demo-note">Minimums keep a box from getting smaller; maximums cap it.</p>
  <div class="wind-demo-frame w-64 flex flex-row gap-2">
    <div class="wind-demo-tile min-w-0 max-w-48 w-full">min-w-0 allows this flex item to shrink; max-w-48 caps width</div>
    <div class="wind-demo-tile min-h-24">min-h-24 keeps this box at least 6rem tall</div>
    <div class="wind-demo-tile h-48 max-h-32 overflow-hidden">h-48 is capped by max-h-32</div>
    <div class="wind-demo-tile max-w-64">max-w-64 sets a maximum width</div>
  </div>
</div>
