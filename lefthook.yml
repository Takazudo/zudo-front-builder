pre-commit:
  parallel: true
  commands:
    format-ts:
      glob: "*.{js,mjs,cjs,ts,tsx,json,yml,yaml}"
      run: "pnpm exec prettier --write --no-error-on-unmatched-pattern {staged_files}"
      stage_fixed: true
    format-mdx:
      glob: "*.{md,mdx}"
      run: "pnpm dlx @takazudo/mdx-formatter --write {staged_files}"
      stage_fixed: true
